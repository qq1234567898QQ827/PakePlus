<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一宇宙速度 - 轨道模拟</title>
    <style>
        :root {
            --bg: #000010;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --text: #e0e8f0;
            --accent: #4da6ff;
            --accent2: #ff6b6b;
            --gold: #f0c060;
            --slider-track: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000010;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
            touch-action: manipulation;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 底部控制面板 */
        .control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px 28px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 380px;
            max-width: 95vw;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 80px rgba(30, 80, 180, 0.15);
            transition: all 0.3s ease;
        }

        .control-panel:hover {
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.7), 0 0 100px rgba(30, 80, 180, 0.25);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .panel-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.04em;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title .icon {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent), 0 0 25px var(--accent);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                box-shadow: 0 0 8px var(--accent), 0 0 20px var(--accent);
            }
            50% {
                box-shadow: 0 0 18px var(--accent), 0 0 40px var(--accent);
            }
        }

        .orbit-type-badge {
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.03em;
            transition: all 0.4s ease;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .badge-suborbital {
            background: rgba(255, 100, 60, 0.2);
            color: #ff8c6a;
            border-color: rgba(255, 100, 60, 0.4);
        }
        .badge-circular {
            background: rgba(80, 220, 120, 0.2);
            color: #6eeea0;
            border-color: rgba(80, 220, 120, 0.4);
        }
        .badge-elliptical {
            background: rgba(70, 160, 255, 0.2);
            color: #7ab8ff;
            border-color: rgba(70, 160, 255, 0.4);
        }
        .badge-escape {
            background: rgba(200, 120, 255, 0.2);
            color: #c89aff;
            border-color: rgba(200, 120, 255, 0.4);
        }

        /* 滑块组 */
        .slider-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .slider-label {
            font-size: 0.8rem;
            color: #b0c0d8;
            white-space: nowrap;
            letter-spacing: 0.03em;
            min-width: 50px;
        }
        .slider-value {
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            min-width: 55px;
            text-align: right;
            letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
        }

        /* 自定义滑块 */
        input[type="range"] {
            -webkit-appearance: none;
            flex: 1;
            min-width: 120px;
            height: 8px;
            border-radius: 4px;
            background: var(--slider-track);
            outline: none;
            cursor: pointer;
            position: relative;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--accent);
            cursor: grab;
            box-shadow: 0 0 20px rgba(60, 140, 255, 0.5), 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(60, 140, 255, 0.7), 0 6px 18px rgba(0, 0, 0, 0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--accent);
            cursor: grab;
            box-shadow: 0 0 20px rgba(60, 140, 255, 0.5), 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        /* 速度标记线 */
        .speed-markers {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: #8899b8;
            padding: 0 6px;
            letter-spacing: 0.02em;
            margin-top: -4px;
        }
        .speed-markers .marker {
            position: relative;
            cursor: default;
        }
        .speed-markers .marker.v1 {
            color: #6eeea0;
            font-weight: 600;
        }
        .speed-markers .marker.v2 {
            color: #c89aff;
            font-weight: 600;
        }

        /* 按钮 */
        .btn-reset {
            padding: 9px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
            color: #d0d8e8;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: all 0.3s ease;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
            box-shadow: 0 0 25px rgba(100, 160, 255, 0.3);
        }
        .btn-reset:active {
            transform: scale(0.95);
            transition: transform 0.1s ease;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .control-panel {
                min-width: auto;
                width: 94vw;
                padding: 14px 18px 10px;
                gap: 8px;
                border-radius: 16px;
                bottom: 12px;
            }
            .panel-title {
                font-size: 0.85rem;
            }
            .slider-label {
                font-size: 0.7rem;
                min-width: 38px;
            }
            .slider-value {
                font-size: 0.75rem;
                min-width: 44px;
            }
            input[type="range"] {
                min-width: 80px;
                height: 6px;
            }
            input[type="range"]::-webkit-slider-thumb {
                width: 26px;
                height: 26px;
            }
            .btn-reset {
                padding: 7px 14px;
                font-size: 0.72rem;
            }
            .speed-markers {
                font-size: 0.6rem;
            }
            .orbit-type-badge {
                font-size: 0.68rem;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>

    <canvas id="mainCanvas"></canvas>

    <!-- 控制面板 -->
    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <span class="panel-title">
                <span class="icon"></span>轨道模拟
            </span>
            <span class="orbit-type-badge badge-suborbital" id="orbitBadge">亚轨道</span>
            <button class="btn-reset" id="btnReset" title="重置模拟 [空格键]">⟳ 重置</button>
        </div>
        <div class="slider-group">
            <span class="slider-label">初速度</span>
            <input type="range" id="speedSlider" min="15" max="160" value="70" step="0.5" title="调节卫星初始速度">
            <span class="slider-value" id="speedValue">7.9 km/s</span>
        </div>
        <div class="speed-markers">
            <span>慢</span>
            <span class="marker v1" title="第一宇宙速度 ≈ 7.9 km/s">● 第一宇宙速度</span>
            <span class="marker v2" title="第二宇宙速度 ≈ 11.2 km/s">● 第二宇宙速度</span>
            <span>快</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');

            // --- DOM元素 ---
            const speedSlider = document.getElementById('speedSlider');
            const speedValueEl = document.getElementById('speedValue');
            const orbitBadge = document.getElementById('orbitBadge');
            const btnReset = document.getElementById('btnReset');

            // --- 画布尺寸 ---
            let W, H, dpr;
            let earthX, earthY, earthR;
            let surfaceGravity; // 表面重力加速度 (px/s²)
            let circularSpeed; // 第一宇宙速度 (px/s)
            let escapeSpeed; // 第二宇宙速度 (px/s)
            const INITIAL_ALTITUDE = 6; // 初始高度（地表上方像素）

            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);

                // 地球参数
                earthR = Math.min(W, H) * 0.17;
                earthR = Math.max(earthR, 60);
                earthR = Math.min(earthR, 200);
                earthX = W * 0.5;
                earthY = H * 0.44;

                // 表面重力加速度 - 使圆形轨道周期约3-3.5秒
                const targetPeriod = 3.2;
                surfaceGravity = earthR / Math.pow(targetPeriod / (2 * Math.PI), 2);
                circularSpeed = Math.sqrt(surfaceGravity * earthR * earthR / (earthR + INITIAL_ALTITUDE));
                escapeSpeed = Math.sqrt(2) * circularSpeed;

                // 更新滑块映射
                updateSliderRange();
            }

            function updateSliderRange() {
                // 滑块值映射到实际速度
                // 滑块15->160 映射到 约20%到155%的circularSpeed
                const minSpeed = circularSpeed * 0.18;
                const maxSpeed = circularSpeed * 1.55;
                const currentNorm = parseFloat(speedSlider.value);
                const currentSpeed = minSpeed + (currentNorm - 15) / (160 - 15) * (maxSpeed - minSpeed);
                updateSpeedDisplay(currentSpeed);
            }

            function sliderToSpeed(sliderVal) {
                const minSpeed = circularSpeed * 0.18;
                const maxSpeed = circularSpeed * 1.55;
                return minSpeed + (sliderVal - 15) / (160 - 15) * (maxSpeed - minSpeed);
            }

            function speedToSlider(speed) {
                const minSpeed = circularSpeed * 0.18;
                const maxSpeed = circularSpeed * 1.55;
                return 15 + (speed - minSpeed) / (maxSpeed - minSpeed) * (160 - 15);
            }

            function updateSpeedDisplay(speedPx) {
                const ratio = speedPx / circularSpeed;
                const speedKms = ratio * 7.9;
                speedValueEl.textContent = speedKms.toFixed(1) + ' km/s';

                // 更新轨道类型徽章
                const badge = orbitBadge;
                badge.classList.remove('badge-suborbital', 'badge-circular', 'badge-elliptical', 'badge-escape');
                if (ratio < 0.97) {
                    badge.textContent = '亚轨道 · 坠落';
                    badge.classList.add('badge-suborbital');
                } else if (ratio < 1.03) {
                    badge.textContent = '圆形轨道';
                    badge.classList.add('badge-circular');
                } else if (ratio < 1.38) {
                    badge.textContent = '椭圆轨道';
                    badge.classList.add('badge-elliptical');
                } else {
                    badge.textContent = '逃逸轨道';
                    badge.classList.add('badge-escape');
                }
            }

            // --- 星空背景 ---
            let stars = [];
            let nebulae = [];

            function generateStars() {
                stars = [];
                const count = Math.floor((W * H) / 280);
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.8 + 0.2,
                        brightness: Math.random(),
                        twinkleSpeed: Math.random() * 0.02 + 0.005,
                        twinkleOffset: Math.random() * Math.PI * 2,
                        hue: Math.random() < 0.15 ? 30 + Math.random() * 30 : Math.random() < 0.08 ? 200 +
                            Math.random() * 40 : 0,
                        saturation: Math.random() < 0.2 ? 0.2 : 0,
                    });
                }
                // 一些亮星
                const brightCount = Math.floor((W * H) / 8000);
                for (let i = 0; i < brightCount; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 2.5 + 1.5,
                        brightness: 0.7 + Math.random() * 0.3,
                        twinkleSpeed: Math.random() * 0.03 + 0.01,
                        twinkleOffset: Math.random() * Math.PI * 2,
                        hue: Math.random() < 0.3 ? 30 + Math.random() * 25 : 0,
                        saturation: 0,
                        isBright: true,
                    });
                }
            }

            function generateNebulae() {
                nebulae = [];
                const count = 2 + Math.floor(Math.random() * 3);
                for (let i = 0; i < count; i++) {
                    nebulae.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * W * 0.35 + W * 0.1,
                        hue: [210, 260, 340, 180, 30][Math.floor(Math.random() * 5)],
                        alpha: Math.random() * 0.025 + 0.008,
                    });
                }
            }

            function drawStarBackground(time) {
                // 深空背景
                ctx.fillStyle = '#000008';
                ctx.fillRect(0, 0, W, H);

                // 星云
                for (const neb of nebulae) {
                    const grad = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.r);
                    grad.addColorStop(0, `hsla(${neb.hue}, 50%, 30%, ${neb.alpha * 1.5})`);
                    grad.addColorStop(0.5, `hsla(${neb.hue}, 40%, 15%, ${neb.alpha})`);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.fillRect(neb.x - neb.r, neb.y - neb.r, neb.r * 2, neb.r * 2);
                }

                // 星星
                for (const star of stars) {
                    const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
                    const alpha = star.brightness * (0.55 + 0.45 * twinkle);
                    const hueStr = star.hue > 0 ? `hsl(${star.hue}, ${star.saturation * 100}%, ` : 'rgba(255,255,255,';
                    if (star.hue > 0) {
                        ctx.fillStyle = `hsla(${star.hue}, 40%, 85%, ${alpha})`;
                    } else {
                        const v = Math.floor(200 + 55 * alpha);
                        ctx.fillStyle = `rgba(${v},${v},${Math.floor(v * 0.9)},${alpha})`;
                    }
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                    ctx.fill();

                    // 亮星十字光芒
                    if (star.isBright && twinkle > 0.7) {
                        const glowAlpha = alpha * 0.5;
                        ctx.strokeStyle = `rgba(200,220,255,${glowAlpha})`;
                        ctx.lineWidth = 0.4;
                        const crossLen = star.r * 3.5;
                        ctx.beginPath();
                        ctx.moveTo(star.x - crossLen, star.y);
                        ctx.lineTo(star.x + crossLen, star.y);
                        ctx.moveTo(star.x, star.y - crossLen);
                        ctx.lineTo(star.x, star.y + crossLen);
                        ctx.stroke();
                    }
                }
            }

            // --- 地球绘制 ---
            function drawEarth(time) {
                // 大气光晕（外层）
                const glowGrad = ctx.createRadialGradient(earthX, earthY, earthR * 0.92, earthX, earthY, earthR * 1.25);
                glowGrad.addColorStop(0, 'rgba(130,180,240,0)');
                glowGrad.addColorStop(0.4, 'rgba(100,160,230,0.12)');
                glowGrad.addColorStop(0.7, 'rgba(60,120,210,0.06)');
                glowGrad.addColorStop(1, 'rgba(30,60,150,0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(earthX, earthY, earthR * 1.25, 0, Math.PI * 2);
                ctx.fill();

                // 地球主体 - 使用多层渐变模拟3D球体
                const bodyGrad = ctx.createRadialGradient(
                    earthX - earthR * 0.3, earthY - earthR * 0.35, earthR * 0.05,
                    earthX, earthY, earthR
                );
                bodyGrad.addColorStop(0, '#8ec8f0');
                bodyGrad.addColorStop(0.25, '#4a9dd4');
                bodyGrad.addColorStop(0.55, '#1a5c8a');
                bodyGrad.addColorStop(0.8, '#0a2d4a');
                bodyGrad.addColorStop(0.95, '#051520');
                bodyGrad.addColorStop(1, '#020a10');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
                ctx.fill();

                // 表面细节 - 云层/大陆斑块
                ctx.save();
                ctx.beginPath();
                ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
                ctx.clip();

                const patchCount = 18;
                const patchSeed = 42;
                for (let i = 0; i < patchCount; i++) {
                    const angle = (i / patchCount) * Math.PI * 2 + patchSeed * 0.17;
                    const dist = earthR * (0.3 + (Math.sin(i * 3.7 + patchSeed) * 0.5 + 0.5) * 0.55);
                    const px = earthX + Math.cos(angle) * dist;
                    const py = earthY + Math.sin(angle) * dist * 0.75;
                    const patchR = earthR * (0.08 + Math.random() * 0.18);
                    const patchGrad = ctx.createRadialGradient(px, py, 0, px, py, patchR);
                    const alpha = 0.06 + Math.random() * 0.1;
                    if (i % 3 === 0) {
                        patchGrad.addColorStop(0, `rgba(180,210,240,${alpha})`);
                        patchGrad.addColorStop(1, 'rgba(180,210,240,0)');
                    } else if (i % 3 === 1) {
                        patchGrad.addColorStop(0, `rgba(140,190,160,${alpha * 0.7})`);
                        patchGrad.addColorStop(1, 'rgba(140,190,160,0)');
                    } else {
                        patchGrad.addColorStop(0, `rgba(255,255,255,${alpha * 0.8})`);
                        patchGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    }
                    ctx.fillStyle = patchGrad;
                    ctx.beginPath();
                    ctx.arc(px, py, patchR, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 大气薄层（内边缘高光）
                const innerGlow = ctx.createRadialGradient(earthX, earthY, earthR * 0.88, earthX, earthY, earthR * 1.02);
                innerGlow.addColorStop(0, 'rgba(180,210,240,0)');
                innerGlow.addColorStop(0.85, 'rgba(160,200,235,0.18)');
                innerGlow.addColorStop(1, 'rgba(140,180,220,0.35)');
                ctx.fillStyle = innerGlow;
                ctx.beginPath();
                ctx.arc(earthX, earthY, earthR * 1.02, 0, Math.PI * 2);
                ctx.fill();

                // 高光点
                const highlightGrad = ctx.createRadialGradient(
                    earthX - earthR * 0.35, earthY - earthR * 0.38, earthR * 0.02,
                    earthX - earthR * 0.15, earthY - earthR * 0.2, earthR * 0.55
                );
                highlightGrad.addColorStop(0, 'rgba(255,255,255,0.3)');
                highlightGrad.addColorStop(0.6, 'rgba(200,230,255,0.06)');
                highlightGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = highlightGrad;
                ctx.beginPath();
                ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- 粒子系统 ---
            let particles = [];

            function spawnParticles(x, y, count, color, speedRange) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 0.6 + Math.random() * 1.2,
                        maxLife: 0.6 + Math.random() * 1.2,
                        color: color,
                        r: 1 + Math.random() * 2.5,
                    });
                }
            }

            function updateParticles(dt) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.life -= dt;
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    // 粒子也受地球重力影响
                    const dx = p.x - earthX;
                    const dy = p.y - earthY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 1) {
                        const gravMag = surfaceGravity * earthR * earthR / (dist * dist);
                        const nx = dx / dist;
                        const ny = dy / dist;
                        p.vx -= nx * gravMag * dt;
                        p.vy -= ny * gravMag * dt;
                    }
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                }
            }

            function drawParticles() {
                for (const p of particles) {
                    const alpha = Math.max(0, p.life / p.maxLife);
                    const r = p.r * alpha;
                    ctx.fillStyle = p.color.replace('1)', `${alpha})`).replace('rgb',
                        'rgba').replace(/rgba\((\d+),(\d+),(\d+),[\d.]+\)/, `rgba($1,$2,$3,${alpha})`);
                    if (p.color.startsWith('rgb')) {
                        ctx.fillStyle = p.color.replace('rgb', 'rgba').replace(')', `,${alpha})`);
                    }
                    ctx.shadowColor = p.color.replace('1)', `${alpha * 0.7})`).replace('rgb', 'rgba').replace(
                        /rgba\((\d+),(\d+),(\d+),[\d.]+\)/, `rgba($1,$2,$3,${alpha * 0.7})`);
                    ctx.shadowBlur = r * 2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // --- 模拟状态 ---
            let satX, satY, satVx, satVy;
            let trajectoryPoints = [];
            let simRunning = true;
            let hasCollided = false;
            let collisionTime = -10;
            let currentOrbitType = 'suborbital'; // 'suborbital' | 'circular' | 'elliptical' | 'escape'
            const MAX_TRAJECTORY_POINTS = 2000;

            function getInitialState() {
                const sliderVal = parseFloat(speedSlider.value);
                const speed = sliderToSpeed(sliderVal);
                const r = earthR + INITIAL_ALTITUDE;
                return {
                    x: earthX,
                    y: earthY - r,
                    vx: speed,
                    vy: 0,
                };
            }

            function resetSimulation() {
                const init = getInitialState();
                satX = init.x;
                satY = init.y;
                satVx = init.vx;
                satVy = init.vy;
                trajectoryPoints = [];
                simRunning = true;
                hasCollided = false;
                collisionTime = -10;
                particles = [];
                // 添加发射粒子
                spawnParticles(satX, satY, 20, 'rgb(255,200,100)', [15, 40]);
                updateOrbitTypeFromSpeed();
            }

            function updateOrbitTypeFromSpeed() {
                const speed = Math.sqrt(satVx * satVx + satVy * satVy);
                const ratio = speed / circularSpeed;
                if (ratio < 0.97) currentOrbitType = 'suborbital';
                else if (ratio < 1.03) currentOrbitType = 'circular';
                else if (ratio < 1.38) currentOrbitType = 'elliptical';
                else currentOrbitType = 'escape';
            }

            function getTrajectoryColor() {
                switch (currentOrbitType) {
                    case 'suborbital':
                        return '#ff7043';
                    case 'circular':
                        return '#4de8a0';
                    case 'elliptical':
                        return '#5da8ff';
                    case 'escape':
                        return '#b87dff';
                    default:
                        return '#ffffff';
                }
            }

            // --- 物理更新 ---
            function physicsStep(dt) {
                if (!simRunning) return;
                if (hasCollided) return;

                // 子步
                const subSteps = 6;
                const subDt = dt / subSteps;

                for (let s = 0; s < subSteps; s++) {
                    const dx = satX - earthX;
                    const dy = satY - earthY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 0.01) {
                        // 击中地球中心（极端情况）
                        hasCollided = true;
                        collisionTime = performance.now() / 1000;
                        spawnParticles(earthX, earthY, 60, 'rgb(255,120,40)', [30, 120]);
                        simRunning = false;
                        return;
                    }

                    // 重力加速度
                    const gravMag = surfaceGravity * earthR * earthR / (dist * dist);
                    const nx = dx / dist;
                    const ny = dy / dist;
                    const ax = -nx * gravMag;
                    const ay = -ny * gravMag;

                    // 半隐式欧拉
                    satVx += ax * subDt;
                    satVy += ay * subDt;
                    satX += satVx * subDt;
                    satY += satVy * subDt;

                    // 碰撞检测
                    const newDx = satX - earthX;
                    const newDy = satY - earthY;
                    const newDist = Math.sqrt(newDx * newDx + newDy * newDy);

                    if (newDist <= earthR) {
                        // 撞击地球表面
                        hasCollided = true;
                        collisionTime = performance.now() / 1000;
                        const impactX = satX;
                        const impactY = satY;
                        // 将位置推到表面
                        const angle = Math.atan2(newDy, newDx);
                        satX = earthX + Math.cos(angle) * earthR;
                        satY = earthY + Math.sin(angle) * earthR;
                        satVx = 0;
                        satVy = 0;
                        simRunning = false;
                        spawnParticles(impactX, impactY, 50, 'rgb(255,140,50)', [25, 100]);
                        spawnParticles(impactX, impactY, 30, 'rgb(255,220,150)', [10, 50]);
                        return;
                    }

                    // 逃逸检测
                    if (newDist > Math.max(W, H) * 1.8) {
                        simRunning = false;
                        hasCollided = true;
                        collisionTime = performance.now() / 1000;
                        spawnParticles(satX, satY, 30, 'rgb(180,140,255)', [20, 60]);
                        return;
                    }
                }

                // 更新轨道类型
                const currentSpeed = Math.sqrt(satVx * satVx + satVy * satVy);
                const currentDist = Math.sqrt((satX - earthX) ** 2 + (satY - earthY) ** 2);
                const localCircSpeed = Math.sqrt(surfaceGravity * earthR * earthR / currentDist);
                const ratio = currentSpeed / localCircSpeed;
                if (ratio < 0.97) currentOrbitType = 'suborbital';
                else if (ratio < 1.03 && currentDist < earthR * 1.3) currentOrbitType = 'circular';
                else if (ratio < 1.38) currentOrbitType = 'elliptical';
                else currentOrbitType = 'escape';
            }

            // --- 轨迹记录 ---
            function recordTrajectory() {
                if (!simRunning && hasCollided) return;
                if (trajectoryPoints.length === 0 ||
                    Math.hypot(satX - trajectoryPoints[trajectoryPoints.length - 1].x, satY - trajectoryPoints[
                        trajectoryPoints.length - 1].y) > 1.5) {
                    trajectoryPoints.push({ x: satX, y: satY });
                    if (trajectoryPoints.length > MAX_TRAJECTORY_POINTS) {
                        trajectoryPoints.shift();
                    }
                }
            }

            function drawTrajectory() {
                if (trajectoryPoints.length < 2) return;
                const color = getTrajectoryColor();
                const baseAlpha = 0.75;
                const totalPts = trajectoryPoints.length;

                // 使用渐变透明度绘制轨迹
                for (let i = 1; i < totalPts; i++) {
                    const alpha = baseAlpha * (0.25 + 0.75 * (i / totalPts));
                    ctx.strokeStyle = color.replace(')', `,${alpha})`).replace('rgb', 'rgba').replace('#',
                        'rgba(');
                    if (color.startsWith('#')) {
                        const r = parseInt(color.slice(1, 3), 16);
                        const g = parseInt(color.slice(3, 5), 16);
                        const b = parseInt(color.slice(5, 7), 16);
                        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
                    }
                    ctx.lineWidth = 2.2;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.shadowColor = color.startsWith('#') ?
                        `rgba(${parseInt(color.slice(1,3),16)},${parseInt(color.slice(3,5),16)},${parseInt(color.slice(5,7),16)},${alpha*0.5})` :
                        'rgba(255,255,255,0.3)';
                    ctx.shadowBlur = 3;
                    ctx.beginPath();
                    ctx.moveTo(trajectoryPoints[i - 1].x, trajectoryPoints[i - 1].y);
                    ctx.lineTo(trajectoryPoints[i].x, trajectoryPoints[i].y);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // 整体轨迹光晕
                if (totalPts > 10) {
                    ctx.strokeStyle = color.startsWith('#') ?
                        `rgba(${parseInt(color.slice(1,3),16)},${parseInt(color.slice(3,5),16)},${parseInt(color.slice(5,7),16)},0.25)` :
                        'rgba(255,255,255,0.15)';
                    ctx.lineWidth = 6;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = color.startsWith('#') ?
                        `rgba(${parseInt(color.slice(1,3),16)},${parseInt(color.slice(3,5),16)},${parseInt(color.slice(5,7),16)},0.4)` :
                        'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.moveTo(trajectoryPoints[0].x, trajectoryPoints[0].y);
                    for (let i = 1; i < totalPts; i++) {
                        ctx.lineTo(trajectoryPoints[i].x, trajectoryPoints[i].y);
                    }
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            // --- 绘制卫星 ---
            function drawSatellite(time) {
                if (hasCollided && performance.now() / 1000 - collisionTime > 2.5 && !simRunning) return;
                if (hasCollided && !simRunning && performance.now() / 1000 - collisionTime > 3.5) {
                    // 自动重置
                    resetSimulation();
                    return;
                }

                const sx = satX;
                const sy = satY;

                // 尾迹光点
                if (trajectoryPoints.length > 1 && simRunning) {
                    const recentPts = trajectoryPoints.slice(-8);
                    for (let i = 0; i < recentPts.length; i++) {
                        const alpha = (i / recentPts.length) * 0.5;
                        const r = 1.5 * (i / recentPts.length);
                        ctx.fillStyle = `rgba(255,220,180,${alpha})`;
                        ctx.beginPath();
                        ctx.arc(recentPts[i].x, recentPts[i].y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 光晕
                const glowGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 18);
                glowGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
                glowGrad.addColorStop(0.15, 'rgba(255,240,200,0.6)');
                glowGrad.addColorStop(0.4, 'rgba(255,180,100,0.2)');
                glowGrad.addColorStop(1, 'rgba(255,100,40,0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(sx, sy, 18, 0, Math.PI * 2);
                ctx.fill();

                // 核心亮点
                const coreGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 5);
                coreGrad.addColorStop(0, 'rgba(255,255,255,1)');
                coreGrad.addColorStop(0.5, 'rgba(255,250,240,0.8)');
                coreGrad.addColorStop(1, 'rgba(255,200,150,0)');
                ctx.fillStyle = coreGrad;
                ctx.beginPath();
                ctx.arc(sx, sy, 5, 0, Math.PI * 2);
                ctx.fill();

                // 十字光芒
                const flicker = 0.7 + 0.3 * Math.sin(time * 8);
                ctx.strokeStyle = `rgba(255,255,255,${0.6 * flicker})`;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                const flareLen = 10;
                ctx.moveTo(sx - flareLen, sy);
                ctx.lineTo(sx + flareLen, sy);
                ctx.moveTo(sx, sy - flareLen);
                ctx.lineTo(sx, sy + flareLen);
                ctx.stroke();
            }

            // --- 绘制参考圆 ---
            function drawReferenceCircle() {
                const r = earthR + INITIAL_ALTITUDE;
                ctx.setLineDash([6, 14]);
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(earthX, earthY, r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // --- 绘制速度向量指示 ---
            function drawVelocityIndicator() {
                if (hasCollided && !simRunning) return;
                const speed = Math.sqrt(satVx * satVx + satVy * satVy);
                if (speed < 1) return;
                const scale = 0.25;
                const len = speed * scale;
                const nx = satVx / speed;
                const ny = satVy / speed;
                const endX = satX + nx * len;
                const endY = satY + ny * len;

                ctx.strokeStyle = 'rgba(255,255,200,0.5)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 5]);
                ctx.beginPath();
                ctx.moveTo(satX, satY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                ctx.setLineDash([]);

                // 箭头
                const arrowLen = 8;
                const angle = Math.atan2(ny, nx);
                ctx.fillStyle = 'rgba(255,255,200,0.7)';
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(
                    endX - arrowLen * Math.cos(angle - 0.6),
                    endY - arrowLen * Math.sin(angle - 0.6)
                );
                ctx.lineTo(
                    endX - arrowLen * Math.cos(angle + 0.6),
                    endY - arrowLen * Math.sin(angle + 0.6)
                );
                ctx.closePath();
                ctx.fill();
            }

            // --- 动画循环 ---
            let lastTime = performance.now() / 1000;
            let timeAccum = 0;

            function animate(timestamp) {
                const currentTime = timestamp / 1000;
                let dt = currentTime - lastTime;
                lastTime = currentTime;

                // 防止大帧跳跃
                if (dt > 0.1) dt = 0.1;
                if (dt <= 0) dt = 0.016;

                timeAccum += dt;

                // 物理更新
                physicsStep(dt);
                if (simRunning && !hasCollided) {
                    recordTrajectory();
                }
                updateParticles(dt);

                // 渲染
                ctx.clearRect(0, 0, W, H);
                drawStarBackground(timeAccum);
                drawReferenceCircle();
                drawTrajectory();
                drawEarth(timeAccum);
                drawSatellite(timeAccum);
                drawVelocityIndicator();
                drawParticles();

                // 碰撞后自动重置
                if (hasCollided && !simRunning && currentTime - collisionTime > 3.5) {
                    resetSimulation();
                }

                requestAnimationFrame(animate);
            }

            // --- 事件处理 ---
            speedSlider.addEventListener('input', () => {
                const speed = sliderToSpeed(parseFloat(speedSlider.value));
                updateSpeedDisplay(speed);
                resetSimulation();
            });

            btnReset.addEventListener('click', () => {
                resetSimulation();
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    resetSimulation();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    speedSlider.value = Math.min(160, parseFloat(speedSlider.value) + 2);
                    speedSlider.dispatchEvent(new Event('input'));
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    speedSlider.value = Math.max(15, parseFloat(speedSlider.value) - 2);
                    speedSlider.dispatchEvent(new Event('input'));
                }
            });

            window.addEventListener('resize', () => {
                resizeCanvas();
                generateStars();
                generateNebulae();
                resetSimulation();
            });

            // 触摸设备双击重置
            canvas.addEventListener('dblclick', (e) => {
                resetSimulation();
            });

            // --- 初始化 ---
            function init() {
                resizeCanvas();
                generateStars();
                generateNebulae();

                // 设置滑块初始值为第一宇宙速度
                const sliderInit = speedToSlider(circularSpeed);
                speedSlider.value = Math.round(sliderInit);
                updateSpeedDisplay(circularSpeed);

                const initState = getInitialState();
                satX = initState.x;
                satY = initState.y;
                satVx = initState.vx;
                satVy = initState.vy;
                trajectoryPoints = [];
                simRunning = true;
                hasCollided = false;
                collisionTime = -10;
                particles = [];
                currentOrbitType = 'circular';
                orbitBadge.textContent = '圆形轨道';
                orbitBadge.classList.remove('badge-suborbital', 'badge-circular', 'badge-elliptical', 'badge-escape');
                orbitBadge.classList.add('badge-circular');

                lastTime = performance.now() / 1000;
                timeAccum = 0;
                requestAnimationFrame(animate);
            }

            init();

            console.log('🚀 第一宇宙速度轨道模拟已就绪');
            console.log('   🌍 地球半径:', Math.round(earthR), 'px');
            console.log('   🎯 第一宇宙速度:', circularSpeed.toFixed(1), 'px/s ≈ 7.9 km/s');
            console.log('   🚀 第二宇宙速度:', escapeSpeed.toFixed(1), 'px/s ≈ 11.2 km/s');
            console.log('   ⌨ 空格键重置 | ← → 微调速度 | 双击画布重置');
        })();
    </script>
</body>
</html>
