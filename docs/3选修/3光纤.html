<!DOCTYPE html>

    <style>
        :root {
            --bg: #0a0a1a;
            --panel-bg: #111133;
            --accent: #ff2222;
            --glass: rgba(70, 130, 200, 0.3);
            --glass-border: rgba(120, 170, 230, 0.7);
            --info-bg: rgba(15, 15, 45, 0.9);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 16px;
            max-width: 940px;
            width: 100%;
        }
        .title-section h1 {
            font-size: 1.5rem;
            color: #ff5555;
            text-shadow: 0 0 12px rgba(255,0,0,0.5);
            margin-bottom: 4px;
            text-align: center;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #8899bb;
            text-align: center;
        }
        .canvas-wrapper {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 6px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 920px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            background: #0d0d28;
        }
        .controls-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            background: var(--panel-bg);

            max-width: 920px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group label {
            color: #c0cde0;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .control-group input[type="range"] {
            -webkit-appearance: none;
            width: 140px;
            height: 6px;
            border-radius: 3px;
            background: #2a2a4a;
            outline: none;
            cursor: pointer;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ff3333;
            border: 2px solid #fff;
            box-shadow: 0 0 16px #ff3333;
            cursor: pointer;
        }
        .angle-display {
            display: inline-block;
            min-width: 44px;
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            color: #ff4444;
            background: rgba(255, 60, 60, 0.15);
            border-radius: 6px;
            padding: 2px 8px;
        }
        .preset-btn {
            padding: 5px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.04);
            color: #c0cde0;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
            font-family: inherit;
        }
        .preset-btn:hover {
            background: rgba(255, 60, 60, 0.2);
            border-color: #ff5555;
            color: #ff5555;
        }
        .preset-btn.active {
            background: rgba(255, 60, 60, 0.3);
            border-color: #ff3333;
            color: #ff3333;
            box-shadow: 0 0 14px rgba(255,0,0,0.5);
        }
        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 100%;
            max-width: 920px;
        }
        .info-card {
            background: var(--info-bg);
            border-radius: 10px;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            min-width: 75px;
            flex: 1;
        }
        .info-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff5555;
        }
        .info-label {
            font-size: 0.6rem;
            color: #8899bb;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .warning .info-val { color: #ff3333; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.55;} }
    </style>

  <style>

<body>
  <a href="javascript:void(0);" class="qilai-back-btn" onclick="saveScrollAndReturn();">← 返回主页</a>
  
  <div class="qilai-watermark">
    <div class="title">齐老师动画</div>
    QQ 3398528250<br>
    抖音 35320300542
  </div>

<div class="main-container">
    <div class="title-section">
        <h1>🔴 光纤原理 · 全内反射</h1>
        <p class="subtitle">光从玻璃砖左侧中点进入，在上表面总是发生全内反射（临界角≈41.8°）</p>
    </div>
    <div class="canvas-wrapper">
        <canvas id="mainCanvas" width="920" height="520"></canvas>
    </div>
    <div class="controls-panel">
        <div class="control-group">
            <label for="angleSlider">入射角 θ₁</label>
            <input type="range" id="angleSlider" min="0" max="85" value="35" step="0.5">
            <span class="angle-display" id="angleDisplay">35°</span>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="preset-btn" data-angle="0">0°</button>
            <button class="preset-btn" data-angle="15">15°</button>
            <button class="preset-btn active" data-angle="35">35°</button>
            <button class="preset-btn" data-angle="55">55°</button>
            <button class="preset-btn" data-angle="75">75°</button>
            <button class="preset-btn" data-angle="84">84°</button>
        </div>
    </div>
    <div class="info-row">
        <div class="info-card"><div class="info-val" id="valTheta1">35.0°</div><div class="info-label">入射角</div></div>
        <div class="info-card"><div class="info-val" id="valTheta2">22.5°</div><div class="info-label">折射角</div></div>
        <div class="info-card"><div class="info-val" id="valIncidence">67.5°</div><div class="info-label">界面入射角</div></div>
        <div class="info-card"><div class="info-val" style="color:#4ecb71;">41.8°</div><div class="info-label">临界角</div></div>
        <div class="info-card warning"><div class="info-val" id="valStatus">全内反射</div><div class="info-label">状态</div></div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        // 固定画布尺寸 (920 x 520)
        const W = 920, H = 520;
        canvas.width = W;
        canvas.height = H;

        // 物理常数
        const N_AIR = 1.0;
        const N_GLASS = 1.5;
        const CRITICAL_RAD = Math.asin(N_AIR / N_GLASS);
        const CRITICAL_DEG = CRITICAL_RAD * 180 / Math.PI;

        // 玻璃砖位置 (固定坐标)
        const glassX = 150, glassY = 160, glassW = 620, glassH = 180;
        const entryX = glassX;
        const entryY = glassY + glassH / 2;

        let theta1Deg = 35;

        // 绘制圆角矩形
        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        // 绘制箭头
        function drawArrow(x1, y1, x2, y2, color, lineWidth) {
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 1) return;
            const ux = dx / len, uy = dy / len;
            const headSize = 12;
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2 - ux * headSize * 0.5, y2 - uy * headSize * 0.5);
            ctx.stroke();
            // 箭头
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - ux * headSize + uy * headSize * 0.5, y2 - uy * headSize - ux * headSize * 0.5);
            ctx.lineTo(x2 - ux * headSize - uy * headSize * 0.5, y2 - uy * headSize + ux * headSize * 0.5);
            ctx.closePath();
            ctx.fill();
        }

        // 光线追踪计算
        function traceRay(theta1Rad) {
            const theta2Rad = Math.asin(Math.sin(theta1Rad) * N_AIR / N_GLASS);
            const cosT2 = Math.cos(theta2Rad);
            const sinT2 = Math.sin(theta2Rad);
            const maxX = glassX + glassW;
            let cx = entryX, cy = entryY;
            let dx = cosT2, dy = -sinT2; // 向上
            const segments = [];
            const reflections = [];

            // 入射光线
            const inLen = 120;
            segments.push({
                x1: cx - inLen * Math.cos(theta1Rad),
                y1: cy + inLen * Math.sin(theta1Rad),
                x2: cx, y2: cy, type: 'incident'
            });

            let bounced = false;
            for (let i = 0; i < 10; i++) {
                if (cx >= maxX - 1) break;
                let tUp = Infinity, tDown = Infinity, tRight = Infinity;
                if (dy < -1e-9) tUp = (glassY - cy) / dy;
                else if (dy > 1e-9) tDown = (glassY + glassH - cy) / dy;
                if (dx > 1e-9) tRight = (maxX - cx) / dx;
                const t = Math.min(tUp, tDown, tRight);
                if (t <= 0 || !isFinite(t)) break;
                const nx = cx + dx * t, ny = cy + dy * t;

                if (t === tRight) {
                    segments.push({ x1: cx, y1: cy, x2: nx, y2: ny, type: 'internal' });
                    // 出射
                    const outLen = 120;
                    segments.push({
                        x1: nx, y1: ny,
                        x2: nx + outLen * Math.cos(theta1Rad),
                        y2: ny + (dy > 0 ? outLen * Math.sin(theta1Rad) : -outLen * Math.sin(theta1Rad)),
                        type: 'exit'
                    });
                    reflections.push({ x: nx, y: ny, isExit: true });
                    break;
                } else if (t === tUp || t === tDown) {
                    segments.push({ x1: cx, y1: cy, x2: nx, y2: ny, type: 'internal' });
                    const incAngle = Math.PI / 2 - theta2Rad;
                    const isTotal = incAngle >= CRITICAL_RAD - 1e-10;
                    reflections.push({
                        x: nx, y: ny,
                        incAngleDeg: incAngle * 180 / Math.PI,
                        isTotal: isTotal
                    });
                    dy = -dy;
                    cx = nx;
                    cy = ny;
                    bounced = true;
                }
            }
            if (!bounced && segments.length === 1) {
                // 直接穿过
                segments.push({ x1: entryX, y1: entryY, x2: maxX, y2: entryY, type: 'internal' });
            }
            return { segments, reflections, theta2Rad, bounced };
        }

        function drawScene() {
            ctx.clearRect(0, 0, W, H);

            // 背景
            const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
            bg.addColorStop(0, '#12122c');
            bg.addColorStop(1, '#08081a');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // 玻璃砖
            ctx.fillStyle = 'rgba(80, 140, 210, 0.25)';
            ctx.strokeStyle = 'rgba(140, 190, 240, 0.7)';
            ctx.lineWidth = 2.5;
            roundRect(glassX, glassY, glassW, glassH, 10);
            ctx.fill();
            ctx.stroke();

            // 标签
            ctx.fillStyle = 'rgba(200, 220, 240, 0.7)';
            ctx.font = '14px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('玻璃 n = 1.5', glassX + glassW/2, glassY + glassH/2 + 5);

            // 空气标签
            ctx.fillStyle = 'rgba(180, 200, 220, 0.5)';
            ctx.font = '12px sans-serif';
            ctx.fillText('空气 n=1.0', glassX + glassW/2, glassY - 15);
            ctx.fillText('空气 n=1.0', glassX + glassW/2, glassY + glassH + 24);

            // 光线追踪
            const theta1Rad = theta1Deg * Math.PI / 180;
            const result = traceRay(theta1Rad);
            const { segments, reflections, theta2Rad, bounced } = result;

            // 绘制所有线段（红色）
            for (const seg of segments) {
                if (seg.type === 'incident') {
                    drawArrow(seg.x1, seg.y1, seg.x2, seg.y2, '#ff0000', 4.5);
                    // 光晕
                    ctx.strokeStyle = 'rgba(255,0,0,0.2)';
                    ctx.lineWidth = 9;
                    ctx.beginPath();
                    ctx.moveTo(seg.x1, seg.y1);
                    ctx.lineTo(seg.x2, seg.y2);
                    ctx.stroke();
                } else if (seg.type === 'internal') {
                    drawArrow(seg.x1, seg.y1, seg.x2, seg.y2, '#ff3333', 3.8);
                    ctx.strokeStyle = 'rgba(255,30,30,0.18)';
                    ctx.lineWidth = 7;
                    ctx.beginPath();
                    ctx.moveTo(seg.x1, seg.y1);
                    ctx.lineTo(seg.x2, seg.y2);
                    ctx.stroke();
                } else if (seg.type === 'exit') {
                    drawArrow(seg.x1, seg.y1, seg.x2, seg.y2, '#ff0000', 4.2);
                }
            }

            // 反射点绘制
            for (const rp of reflections) {
                if (rp.isExit) {
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(rp.x, rp.y, 5, 0, 2*Math.PI);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (rp.isTotal) {
                    // 全内反射点发光
                    const glow = ctx.createRadialGradient(rp.x, rp.y, 0, rp.x, rp.y, 16);
                    glow.addColorStop(0, 'rgba(255, 0, 0, 0.9)');
                    glow.addColorStop(0.7, 'rgba(255, 0, 0, 0.2)');
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(rp.x, rp.y, 16, 0, 2*Math.PI);
                    ctx.fill();

                    ctx.fillStyle = '#ff2222';
                    ctx.beginPath();
                    ctx.arc(rp.x, rp.y, 5.5, 0, 2*Math.PI);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2.2;
                    ctx.stroke();

                    // 法线虚线（竖直方向）—— 只保留法线，不添加任何文字
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath();
                    ctx.moveTo(rp.x, rp.y - 35);
                    ctx.lineTo(rp.x, rp.y + 35);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // 入射点
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(entryX, entryY, 4.5, 0, 2*Math.PI);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // ---- 新增：左侧面入射点的法线（水平方向） ----
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(entryX - 30, entryY);
            ctx.lineTo(entryX + 30, entryY);
            ctx.stroke();
            ctx.setLineDash([]);

            // 更新信息面板
            const theta2Deg = theta2Rad * 180 / Math.PI;
            const incDeg = 90 - theta2Deg;
            document.getElementById('valTheta1').textContent = theta1Deg.toFixed(1) + '°';
            document.getElementById('valTheta2').textContent = theta2Deg.toFixed(1) + '°';
            document.getElementById('valIncidence').textContent = bounced ? incDeg.toFixed(1) + '°' : '—';
            document.getElementById('valStatus').textContent = bounced ? '全内反射' : '折射出射';
        }

        // 滑块事件
        document.getElementById('angleSlider').addEventListener('input', function(e) {
            theta1Deg = +e.target.value;
            document.getElementById('angleDisplay').textContent = theta1Deg.toFixed(1) + '°';
            updatePresetButtons();
        });
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                theta1Deg = +this.dataset.angle;
                document.getElementById('angleSlider').value = theta1Deg;
                document.getElementById('angleDisplay').textContent = theta1Deg.toFixed(1) + '°';
                updatePresetButtons();
            });
        });
        function updatePresetButtons() {
            document.querySelectorAll('.preset-btn').forEach(b => {
                b.classList.toggle('active', Math.abs(+b.dataset.angle - theta1Deg) < 0.3);
            });
        }

        // 键盘控制
        window.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
                e.preventDefault();
                theta1Deg = Math.min(85, theta1Deg + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
                e.preventDefault();
                theta1Deg = Math.max(0, theta1Deg - 1);
            }
            document.getElementById('angleSlider').value = theta1Deg;
            document.getElementById('angleDisplay').textContent = theta1Deg.toFixed(1) + '°';
            updatePresetButtons();
        });

        function animate() {
            drawScene();
            requestAnimationFrame(animate);
        }

        // 启动
        animate();
    })();
</script>

  <script>
  // 返回主页（滚动位置已在主页点击链接时保存）
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用开发者工具快捷键
  document.addEventListener('keydown', function(e) {
    // ESC返回主页 - 保存滚动位置
    if (e.keyCode === 27) {
      saveScrollAndReturn();
      return false;
    }
    // F12
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }
    // Ctrl+S
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
  
  // 禁用选择
  document.addEventListener('selectstart', function(e) {
    // 允许输入框选择
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      return true;
    }
    e.preventDefault();
    return false;
  });
  </script>
