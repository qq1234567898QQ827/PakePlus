    <style>
        :root { --bg: #0a0c10; --card-bg: #13161d; --text: #e0e4ec; --accent: #4da6ff; }

        body {

        .title-group { display: flex; align-items: center; gap: 12px; }
        .icon-laser { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #4da6ff, #1d5fa8); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; box-shadow: 0 4px 16px rgba(77,166,255,0.4); }
        .title { font-size: 1.35rem; font-weight: 700; color: #b3d9ff; text-shadow: 0 0 16px rgba(100,160,255,0.3); }

        .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(77,166,255,0.08); border: 1px solid rgba(77,166,255,0.3); border-radius: 18px; padding: 6px 14px; font-size: 0.78rem; color: #b3d9ff; font-weight: 500; }
        .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #4da6ff; box-shadow: 0 0 8px #4da6ff; }
        .canvas-wrapper { position: relative; background: #0f1219; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; box-shadow: inset 0 0 30px rgba(0,0,0,0.5); }
        .hint-drag { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: rgba(255,255,255,0.7); pointer-events: none; background: rgba(10,12,16,0.8); padding: 4px 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); z-index: 5; transition: opacity 0.5s; }
        canvas { display: block; width: 100%; height: auto; touch-action: none; }
        .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .control-group { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px 16px; border: 1px solid rgba(255,255,255,0.08); }
        .control-label { font-size: 0.82rem; color: #a0aab8; font-weight: 500; min-width: 48px; }
        input[type="range"] { -webkit-appearance: none; width: 200px; height: 7px; border-radius: 4px; background: #2a2e38; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%; background: #1a1e28; border: 3px solid #4da6ff; cursor: pointer; box-shadow: 0 0 18px rgba(77,166,255,0.5); }
        .angle-value { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 32px; background: rgba(77,166,255,0.08); border: 1px solid rgba(77,166,255,0.4); border-radius: 8px; font-size: 0.9rem; font-weight: 700; color: #9cc9ff; }
        .quick-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .quick-btn { padding: 7px 11px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.02); cursor: pointer; font-size: 0.78rem; color: #bcc5d0; transition: 0.2s; white-space: nowrap; }
        .quick-btn.active { background: rgba(77,166,255,0.18); border-color: #4da6ff; color: #fff; font-weight: 600; box-shadow: 0 0 12px rgba(77,166,255,0.4); }
        .shape-btn { background: rgba(100,180,255,0.12); border-color: rgba(100,180,255,0.45); color: #b3d9ff; font-weight: 600; }
    </style>

<body>

<div class="container">
    <div class="header">
        <div class="title-group">
            <div class="icon-laser">⚡</div>
            <div>
                <div class="title">激光通过光学元件</div>
                <div class="subtitle" id="shapeSubtitle">入射角 -80° ~ +80° · 70°棱镜</div>
            </div>
        </div>
        <div class="badge"><span class="dot"></span> n<sub>玻璃</sub> = 1.50</div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="mainCanvas"></canvas>
        <div class="hint-drag" id="hintDrag">💡 在左侧区域上下拖拽调节入射角</div>
    </div>
    <div class="controls">
        <div class="control-group">
            <span class="control-label">入射角 i</span>
            <input type="range" id="angleSlider" min="-80" max="80" value="30" step="0.5">
            <span class="angle-value" id="angleDisplay">+30.0°</span>
        </div>
        <div class="quick-btns" id="quickBtns">
            <button class="quick-btn" data-angle="-60">-60°</button>
            <button class="quick-btn" data-angle="-45">-45°</button>
            <button class="quick-btn" data-angle="-30">-30°</button>
            <button class="quick-btn" data-angle="-15">-15°</button>
            <button class="quick-btn" data-angle="0">0°</button>
            <button class="quick-btn" data-angle="15">15°</button>
            <button class="quick-btn active" data-angle="30">30°</button>
            <button class="quick-btn" data-angle="45">45°</button>
            <button class="quick-btn" data-angle="60">60°</button>
        </div>
        <button id="toggleShapeBtn" class="quick-btn shape-btn">切换为90°棱镜</button>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const angleSlider = document.getElementById('angleSlider');
    const angleDisplay = document.getElementById('angleDisplay');
    const hintDrag = document.getElementById('hintDrag');
    const quickBtns = document.getElementById('quickBtns');
    const toggleShapeBtn = document.getElementById('toggleShapeBtn');
    const shapeSubtitle = document.getElementById('shapeSubtitle');

    const n_air = 1.0, n_glass = 1.50;
    let incidentAngleDeg = 30;
    const DESIGN_WIDTH = 900, DESIGN_HEIGHT = 540;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    // 形状配置：0=70°棱镜, 1=90°棱镜, 2=半圆柱
    const shapeNames = ['70°棱镜', '90°棱镜', '半玻璃柱'];
    let currentShape = 0;

    // 半圆柱参数
    const cylCenter = { x: 450, y: 360 };
    const cylRadius = 200;
    // 入射点：左侧弧面上，角度约220°（从圆心看，正右为0°，逆时针）
    const cylIncAngle = 220 * Math.PI / 180;
    const cylIncPoint = {
        x: cylCenter.x + cylRadius * Math.cos(cylIncAngle),
        y: cylCenter.y + cylRadius * Math.sin(cylIncAngle)
    };

    // 三棱镜参数
    const prismConfigs = [
        { apex: { x: 450, y: 100 }, leftBase: { x: 220, y: 430 }, rightBase: { x: 680, y: 430 } },
        { apex: { x: 450, y: 250 }, leftBase: { x: 270, y: 430 }, rightBase: { x: 630, y: 430 } }
    ];

    let apex, leftBase, rightBase, incidentPoint;

    function setPrismParams() {
        if (currentShape < 2) {
            const cfg = prismConfigs[currentShape];
            apex = cfg.apex; leftBase = cfg.leftBase; rightBase = cfg.rightBase;
            incidentPoint = { x: (apex.x + leftBase.x) / 2, y: (apex.y + leftBase.y) / 2 };
        } else {
            apex = null; leftBase = null; rightBase = null;
            incidentPoint = { ...cylIncPoint };
        }
    }
    setPrismParams();

    function resizeCanvas() {
        const w = canvasWrapper.clientWidth;
        const scale = w / DESIGN_WIDTH;
        canvas.style.width = w + 'px';
        canvas.style.height = (DESIGN_HEIGHT * scale) + 'px';
        canvas.width = DESIGN_WIDTH * DPR;
        canvas.height = DESIGN_HEIGHT * DPR;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(DPR, DPR);
    }
    window.addEventListener('resize', () => { resizeCanvas(); draw(); });

    const vec = (x, y) => ({ x, y });
    const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
    const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
    const mul = (v, s) => ({ x: v.x * s, y: v.y * s });
    const dot = (a, b) => a.x * b.x + a.y * b.y;
    const len = v => Math.sqrt(v.x * v.x + v.y * v.y);
    const norm = v => { const l = len(v); return l > 1e-9 ? { x: v.x / l, y: v.y / l } : { x: 0, y: 0 }; };
    const cross2D = (a, b) => a.x * b.y - a.y * b.x;

    function refract(incident, normal, eta) {
        const cosI = -dot(incident, normal);
        const sinT2 = eta * eta * (1.0 - cosI * cosI);
        if (sinT2 > 1.0) return null;
        const cosT = Math.sqrt(1.0 - sinT2);
        return norm(add(mul(incident, eta), mul(normal, (eta * cosI - cosT))));
    }

    function reflect(incident, normal) {
        return sub(incident, mul(normal, 2 * dot(incident, normal)));
    }

    function raySegIntersect(p, d, v1, v2) {
        const e = sub(v2, v1);
        const denom = cross2D(d, e);
        if (Math.abs(denom) < 1e-8) return null;
        const t = cross2D(sub(v1, p), e) / denom;
        const u = cross2D(sub(v1, p), d) / denom;
        if (t > 1e-5 && u >= -1e-6 && u <= 1.000001) {
            return { t, point: add(p, mul(d, t)), u };
        }
        return null;
    }

    // 光线与圆的交点（返回最近的t>0的交点）
    function rayCircleIntersect(p, d, O, R) {
        const f = sub(p, O);
        const a = dot(d, d);
        const b = 2 * dot(f, d);
        const c = dot(f, f) - R * R;
        const delta = b * b - 4 * a * c;
        if (delta < 0) return [];
        const sqrtD = Math.sqrt(delta);
        const t1 = (-b - sqrtD) / (2 * a);
        const t2 = (-b + sqrtD) / (2 * a);
        const results = [];
        if (t1 > 1e-5) results.push({ t: t1, point: add(p, mul(d, t1)) });
        if (t2 > 1e-5 && Math.abs(t2 - t1) > 1e-7) results.push({ t: t2, point: add(p, mul(d, t2)) });
        return results;
    }

    function computeRayPaths(incidentDeg) {
        const iRad = incidentDeg * Math.PI / 180;

        if (currentShape < 2) {
            // 三棱镜计算
            const leftEdgeDir = norm(sub(leftBase, apex));
            const nOuter = norm({ x: -leftEdgeDir.y, y: leftEdgeDir.x });
            if (nOuter.x > 0) { nOuter.x = -nOuter.x; nOuter.y = -nOuter.y; }
            const inward = mul(nOuter, -1);
            const tangent = leftEdgeDir;
            const d_in = norm(add(mul(inward, Math.cos(iRad)), mul(tangent, Math.sin(iRad))));
            const d_refr = refract(d_in, nOuter, n_air / n_glass);
            if (!d_refr) return null;

            const hitRight = raySegIntersect(incidentPoint, d_refr, apex, rightBase);
            const hitBottom = raySegIntersect(incidentPoint, d_refr, leftBase, rightBase);
            let hitOut = null, whichEdge = null;
            if (hitRight && hitBottom) {
                hitOut = hitRight.t < hitBottom.t ? hitRight : hitBottom;
                whichEdge = hitRight.t < hitBottom.t ? 'right' : 'bottom';
            } else if (hitRight) { hitOut = hitRight; whichEdge = 'right'; }
            else if (hitBottom) { hitOut = hitBottom; whichEdge = 'bottom'; }
            if (!hitOut) return null;
            const pointOut = hitOut.point;

            let nOuter2;
            if (whichEdge === 'right') {
                const rd = norm(sub(rightBase, apex));
                nOuter2 = norm({ x: rd.y, y: -rd.x });
                if (nOuter2.x < 0) nOuter2 = mul(nOuter2, -1);
            } else {
                const bd = norm(sub(rightBase, leftBase));
                nOuter2 = norm({ x: -bd.y, y: bd.x });
                if (nOuter2.y > 0) nOuter2 = mul(nOuter2, -1);
            }
            const nInner2 = mul(nOuter2, -1);
            const d_out = refract(d_refr, nInner2, n_glass / n_air);
            const d_refl = reflect(d_in, nOuter);
            const d_refl_out = reflect(d_refr, nInner2);
            return { d_in, d_refr, d_out, d_refl, d_refl_out, pointIn: incidentPoint, pointOut, nOuter, nInner2, whichEdge, isPrism: true };
        } else {
            // 半圆柱计算
            // 入射点法线（外法线，指向圆心外部即远离圆心）
            const nOuter = norm(sub(incidentPoint, cylCenter));
            // 切线方向（垂直于法线，指向下方为正角度方向）
            const tangent = norm({ x: -nOuter.y, y: nOuter.x });
            // 入射方向：inward * cos(i) + tangent * sin(i)，inward = -nOuter
            const inward = mul(nOuter, -1);
            const d_in = norm(add(mul(inward, Math.cos(iRad)), mul(tangent, Math.sin(iRad))));
            const d_refr = refract(d_in, nOuter, n_air / n_glass);
            if (!d_refr) return null;

            // 折射光与圆弧交点、与水平直径交点
            const circHits = rayCircleIntersect(incidentPoint, d_refr, cylCenter, cylRadius);
            // 水平直径：从 (cylCenter.x - cylRadius, cylCenter.y) 到 (cylCenter.x + cylRadius, cylCenter.y)
            const diamHit = raySegIntersect(incidentPoint, d_refr,
                { x: cylCenter.x - cylRadius, y: cylCenter.y },
                { x: cylCenter.x + cylRadius, y: cylCenter.y });

            let hitOut = null, whichEdge = null;
            const candidates = [];
            circHits.forEach(h => {
                if (h.point.y < cylCenter.y - 0.5) candidates.push({ ...h, edge: 'arc' });
            });
            if (diamHit) candidates.push({ ...diamHit, edge: 'diameter' });
            if (candidates.length === 0) return null;
            candidates.sort((a, b) => a.t - b.t);
            hitOut = candidates[0];
            whichEdge = hitOut.edge;
            const pointOut = hitOut.point;

            let nInner2;
            if (whichEdge === 'arc') {
                const nArcOuter = norm(sub(pointOut, cylCenter));
                nInner2 = mul(nArcOuter, -1);
            } else {
                // 水平直径：内法线指向上方（玻璃在直径上方）
                nInner2 = { x: 0, y: -1 };
            }
            const d_out = refract(d_refr, nInner2, n_glass / n_air);
            const d_refl = reflect(d_in, nOuter);
            const d_refl_out = reflect(d_refr, nInner2);
            return { d_in, d_refr, d_out, d_refl, d_refl_out, pointIn: incidentPoint, pointOut, nOuter, nInner2, whichEdge, isPrism: false };
        }
    }

    function drawGridBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, DESIGN_HEIGHT);
        grad.addColorStop(0, '#0b0e14'); grad.addColorStop(0.5, '#111620'); grad.addColorStop(1, '#0a0d12');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
        ctx.strokeStyle = 'rgba(70,110,170,0.06)'; ctx.lineWidth = 0.5;
        for (let x = 40; x < DESIGN_WIDTH; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, DESIGN_HEIGHT); ctx.stroke(); }
        for (let y = 40; y < DESIGN_HEIGHT; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(DESIGN_WIDTH, y); ctx.stroke(); }
        ctx.fillStyle = 'rgba(180,200,230,0.4)'; ctx.font = 'italic 12px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign = 'right';
        ctx.fillText('空气 n=1.00', DESIGN_WIDTH - 30, 38);
        ctx.fillText('空气 n=1.00', DESIGN_WIDTH - 30, DESIGN_HEIGHT - 20);
    }

    function drawShape() {
        ctx.save();
        ctx.shadowColor = 'rgba(70,150,240,0.45)'; ctx.shadowBlur = 40;
        ctx.fillStyle = 'rgba(60,130,210,0.16)';
        ctx.beginPath();
        if (currentShape < 2) {
            ctx.moveTo(apex.x, apex.y); ctx.lineTo(leftBase.x, leftBase.y); ctx.lineTo(rightBase.x, rightBase.y); ctx.closePath();
        } else {
            // 半圆柱：上半圆弧 + 水平直径
            ctx.arc(cylCenter.x, cylCenter.y, cylRadius, Math.PI, 0, false);
            ctx.closePath();
        }
        ctx.fill();
        ctx.restore();

        // 主体渐变
        ctx.beginPath();
        if (currentShape < 2) {
            const grad = ctx.createLinearGradient(apex.x, apex.y, (leftBase.x + rightBase.x) / 2, leftBase.y);
            grad.addColorStop(0, 'rgba(100,170,240,0.32)'); grad.addColorStop(0.5, 'rgba(70,140,220,0.22)'); grad.addColorStop(1, 'rgba(45,100,180,0.3)');
            ctx.fillStyle = grad;
            ctx.moveTo(apex.x, apex.y); ctx.lineTo(leftBase.x, leftBase.y); ctx.lineTo(rightBase.x, rightBase.y); ctx.closePath();
        } else {
            const grad = ctx.createRadialGradient(cylCenter.x, cylCenter.y - 40, cylRadius * 0.3, cylCenter.x, cylCenter.y, cylRadius);
            grad.addColorStop(0, 'rgba(120,180,240,0.35)'); grad.addColorStop(0.6, 'rgba(70,140,220,0.22)'); grad.addColorStop(1, 'rgba(40,100,180,0.32)');
            ctx.fillStyle = grad;
            ctx.arc(cylCenter.x, cylCenter.y, cylRadius, Math.PI, 0, false);
            ctx.closePath();
        }
        ctx.fill();

        // 发光边框
        ctx.shadowColor = 'rgba(100,180,255,0.6)'; ctx.shadowBlur = 16;
        ctx.strokeStyle = 'rgba(150,200,255,0.75)'; ctx.lineWidth = 2.2;
        ctx.beginPath();
        if (currentShape < 2) {
            ctx.moveTo(apex.x, apex.y); ctx.lineTo(leftBase.x, leftBase.y); ctx.lineTo(rightBase.x, rightBase.y); ctx.closePath();
        } else {
            ctx.arc(cylCenter.x, cylCenter.y, cylRadius, Math.PI, 0, false);
            ctx.moveTo(cylCenter.x - cylRadius, cylCenter.y);
            ctx.lineTo(cylCenter.x + cylRadius, cylCenter.y);
        }
        ctx.stroke();
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    }

    function drawDashedLine(x1, y1, x2, y2, color, lw) {
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash([8, 5]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
    }

    function drawRay(x1, y1, x2, y2, color, lw, glow) {
        ctx.save(); if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 14; }
        ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        if (lw >= 2.5) { ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = lw * 0.35; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
        ctx.restore();
    }

    function drawArrowhead(x, y, angle, size, color) {
        ctx.save(); ctx.fillStyle = color; ctx.translate(x, y); ctx.rotate(angle);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-size * 0.8, -size * 0.5); ctx.lineTo(-size * 0.8, size * 0.5); ctx.closePath(); ctx.fill();
        ctx.restore();
    }

    function drawAllRays(p) {
        if (!p) return;
        const { d_in, d_refr, d_out, d_refl, d_refl_out, pointIn, pointOut, nOuter, nInner2, whichEdge, isPrism } = p;

        // 1. 入射光线
        const incLen = 300;
        const incStart = sub(pointIn, mul(d_in, incLen));
        let sx = incStart.x, sy = incStart.y;
        if (sx < 5) { const t = (pointIn.x - 5) / (pointIn.x - sx); sx = 5; sy = pointIn.y - (pointIn.y - sy) * t; }
        if (sy > DESIGN_HEIGHT - 5) { const t = (DESIGN_HEIGHT - 5 - pointIn.y) / (sy - pointIn.y); sy = DESIGN_HEIGHT - 5; sx = pointIn.x - (pointIn.x - sx) * t; }
        if (sy < 5) { const t = (pointIn.y - 5) / (pointIn.y - sy); sy = 5; sx = pointIn.x - (pointIn.x - sx) * t; }
        drawRay(sx, sy, pointIn.x, pointIn.y, '#ff4d6d', 3.5, '#ff3355');
        const incMid = mul(add({ x: sx, y: sy }, pointIn), 0.5);
        drawArrowhead(incMid.x, incMid.y, Math.atan2(d_in.y, d_in.x), 13, '#ff4d6d');

        // 2. 入射点反射光
        const reflLen = 180;
        const reflEnd = add(pointIn, mul(d_refl, reflLen));
        drawRay(pointIn.x, pointIn.y, Math.max(5, reflEnd.x), Math.min(DESIGN_HEIGHT - 5, Math.max(5, reflEnd.y)),
            'rgba(255,130,130,0.5)', 1.8);
        const reflMid = mul(add(pointIn, reflEnd), 0.5);
        drawArrowhead(reflMid.x, reflMid.y, Math.atan2(d_refl.y, d_refl.x), 9, 'rgba(255,110,110,0.6)');

        // 3. 内部折射光
        drawRay(pointIn.x, pointIn.y, pointOut.x, pointOut.y, '#ff758c', 3.0, '#ff4d6d');
        const refrMid = mul(add(pointIn, pointOut), 0.5);
        drawArrowhead(refrMid.x, refrMid.y, Math.atan2(d_refr.y, d_refr.x), 11, '#ff758c');

        // 4. 出射折射光
        if (d_out) {
            const outLen = 280;
            let dir = d_out;
            let color = '#ff4d6d', glow = '#ff3355', size = 13;
            if (isPrism && whichEdge === 'bottom') {
                dir = { x: d_out.x, y: -d_out.y };
            }
            if (!isPrism && whichEdge === 'diameter') {
                // 半圆柱底面：真实折射光向下射出
                dir = d_out;
            }
            const outEnd = add(pointOut, mul(dir, outLen));
            drawRay(pointOut.x, pointOut.y,
                Math.min(DESIGN_WIDTH - 5, Math.max(5, outEnd.x)),
                Math.min(DESIGN_HEIGHT - 5, Math.max(5, outEnd.y)),
                color, 3.5, glow);
            const outMid = mul(add(pointOut, outEnd), 0.5);
            drawArrowhead(outMid.x, outMid.y, Math.atan2(dir.y, dir.x), size, color);
        }

        // 5. 出射点反射光
        if (d_refl_out) {
            const reflOutLen = 150;
            const reflOutEnd = add(pointOut, mul(d_refl_out, reflOutLen));
            drawRay(pointOut.x, pointOut.y,
                Math.min(DESIGN_WIDTH - 5, Math.max(5, reflOutEnd.x)),
                Math.min(DESIGN_HEIGHT - 5, Math.max(5, reflOutEnd.y)),
                'rgba(255,130,130,0.55)', 2.0);
            const roMid = mul(add(pointOut, reflOutEnd), 0.5);
            drawArrowhead(roMid.x, roMid.y, Math.atan2(d_refl_out.y, d_refl_out.x), 8, 'rgba(255,110,110,0.6)');
        }

        // 法线
        const ext = 50;
        drawDashedLine(pointIn.x - nOuter.x * ext, pointIn.y - nOuter.y * ext,
            pointIn.x + nOuter.x * ext * 0.6, pointIn.y + nOuter.y * ext * 0.6,
            'rgba(180,200,230,0.5)', 1.0);
        if (pointOut && nInner2) {
            drawDashedLine(pointOut.x - nInner2.x * ext, pointOut.y - nInner2.y * ext,
                pointOut.x + nInner2.x * ext * 0.6, pointOut.y + nInner2.y * ext * 0.6,
                'rgba(180,200,230,0.5)', 1.0);
        }
    }

    function drawHighlights(p) {
        if (!p) return;
        const { pointIn, pointOut } = p;
        let g = ctx.createRadialGradient(pointIn.x, pointIn.y, 0, pointIn.x, pointIn.y, 11);
        g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.4, 'rgba(255,190,160,0.7)'); g.addColorStop(1, 'rgba(255,80,60,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pointIn.x, pointIn.y, 11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(pointIn.x, pointIn.y, 3.5, 0, Math.PI * 2); ctx.fill();
        if (pointOut) {
            g = ctx.createRadialGradient(pointOut.x, pointOut.y, 0, pointOut.x, pointOut.y, 10);
            g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.4, 'rgba(255,190,160,0.6)'); g.addColorStop(1, 'rgba(255,80,60,0)');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pointOut.x, pointOut.y, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(pointOut.x, pointOut.y, 3, 0, Math.PI * 2); ctx.fill();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
        drawGridBackground();
        drawShape();
        const paths = computeRayPaths(incidentAngleDeg);
        if (paths) { drawAllRays(paths); drawHighlights(paths); }
    }

    function updateUI() {
        angleSlider.value = incidentAngleDeg;
        angleDisplay.textContent = (incidentAngleDeg >= 0 ? '+' : '') + incidentAngleDeg.toFixed(1) + '°';
        quickBtns.querySelectorAll('.quick-btn').forEach(b => {
            b.classList.toggle('active', Math.abs(parseFloat(b.dataset.angle) - incidentAngleDeg) < 0.3);
        });
        shapeSubtitle.textContent = '入射角 -80° ~ +80° · ' + shapeNames[currentShape];
        const nextShape = (currentShape + 1) % 3;
        toggleShapeBtn.textContent = '切换为' + shapeNames[nextShape];
        draw();
    }

    toggleShapeBtn.addEventListener('click', () => {
        currentShape = (currentShape + 1) % 3;
        setPrismParams();
        updateUI();
    });

    angleSlider.addEventListener('input', () => { incidentAngleDeg = parseFloat(angleSlider.value); updateUI(); });
    quickBtns.addEventListener('click', e => {
        const btn = e.target.closest('.quick-btn');
        if (!btn) return;
        incidentAngleDeg = parseFloat(btn.dataset.angle);
        updateUI();
    });

    let isDragging = false;
    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = DESIGN_WIDTH / rect.width, scaleY = DESIGN_HEIGHT / rect.height;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
    }
    function getAngleFromMouse(pos) {
        if (currentShape < 2) {
            const leftEdgeDir = norm(sub(leftBase, apex));
            const nOuter = norm({ x: -leftEdgeDir.y, y: leftEdgeDir.x });
            if (nOuter.x > 0) { nOuter.x = -nOuter.x; nOuter.y = -nOuter.y; }
            const t = leftEdgeDir;
            const toMouse = norm(sub(pos, incidentPoint));
            const dotN = dot(toMouse, nOuter), dotT = dot(toMouse, t);
            const angle = Math.atan2(dotT, dotN) * 180 / Math.PI;
            return Math.max(-80, Math.min(80, angle));
        } else {
            const nOuter = norm(sub(incidentPoint, cylCenter));
            const tangent = norm({ x: -nOuter.y, y: nOuter.x });
            const toMouse = norm(sub(pos, incidentPoint));
            const dotN = dot(toMouse, nOuter), dotT = dot(toMouse, tangent);
            const angle = Math.atan2(dotT, dotN) * 180 / Math.PI;
            return Math.max(-80, Math.min(80, angle));
        }
    }

    canvas.addEventListener('mousedown', e => {
        const pos = getCanvasPos(e);
        if (pos.x < incidentPoint.x + 80 && pos.x > 10 && pos.y > incidentPoint.y - 150 && pos.y < DESIGN_HEIGHT - 10) {
            isDragging = true; canvasWrapper.classList.add('dragging'); hintDrag.style.opacity = '0';
            incidentAngleDeg = getAngleFromMouse(pos); updateUI(); e.preventDefault();
        }
    });
    canvas.addEventListener('mousemove', e => { if (isDragging) { incidentAngleDeg = getAngleFromMouse(getCanvasPos(e)); updateUI(); } });
    window.addEventListener('mouseup', () => { isDragging = false; canvasWrapper.classList.remove('dragging'); });
    canvas.addEventListener('touchstart', e => {
        const pos = getCanvasPos(e);
        if (pos.x < incidentPoint.x + 80 && pos.x > 10 && pos.y > incidentPoint.y - 150 && pos.y < DESIGN_HEIGHT - 10) {
            isDragging = true; canvasWrapper.classList.add('dragging'); hintDrag.style.opacity = '0';
            incidentAngleDeg = getAngleFromMouse(pos); updateUI(); e.preventDefault();
        }
    }, { passive: false });
    canvas.addEventListener('touchmove', e => { if (isDragging) { incidentAngleDeg = getAngleFromMouse(getCanvasPos(e)); updateUI(); e.preventDefault(); } }, { passive: false });
    canvas.addEventListener('touchend', () => { isDragging = false; canvasWrapper.classList.remove('dragging'); });

    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' && e.target.type === 'range') return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { incidentAngleDeg = Math.min(80, incidentAngleDeg + 1); updateUI(); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { incidentAngleDeg = Math.max(-80, incidentAngleDeg - 1); updateUI(); }
    });

    setTimeout(() => { hintDrag.style.opacity = '0.8'; setTimeout(() => hintDrag.style.opacity = '0', 5000); }, 1500);

    resizeCanvas();
    updateUI();
})();
</script>

  <script>
  // 返回主页（滚动位置已在主页点击链接时保存）
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用开发者工具快捷键
  document.addEventListener('keydown', function(e) {
    // ESC返回主页 - 保存滚动位置
    if (e.keyCode === 27) {
      saveScrollAndReturn();
      return false;
    }
    // F12
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }
    // Ctrl+S
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
  
  // 禁用选择
  document.addEventListener('selectstart', function(e) {
    // 允许输入框选择
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      return true;
    }
    e.preventDefault();
    return false;
  });
  </script>
