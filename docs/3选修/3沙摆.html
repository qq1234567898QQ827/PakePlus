  <script>
(function() {
  const scene = new THREE.Scene()
  scene.fog = new THREE.Fog(0x0f172a, 28, 80)

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200)
  camera.position.set(9, 12, 18)

  const renderer = new THREE.WebGLRenderer({ antialias: true })
  renderer.setSize(window.innerWidth, window.innerHeight)
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.toneMappingExposure = 1
  document.body.appendChild(renderer.domElement)

  const bgGeo = new THREE.SphereGeometry(100, 32, 32)
  const bgMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor: { value: new THREE.Color(0x172554) },
      bottomColor: { value: new THREE.Color(0x020617) }
    },
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vPos = worldPosition.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPosition;
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      varying vec3 vPos;
      void main() {
        float h = clamp((vPos.y + 45.0) / 90.0, 0.0, 1.0);
        gl_FragColor = vec4(mix(bottomColor, topColor, h), 1.0);
      }
    `
  })
  scene.add(new THREE.Mesh(bgGeo, bgMat))

  const ambientLight = new THREE.AmbientLight(0x93c5fd, 0.35)
  scene.add(ambientLight)

  const hemiLight = new THREE.HemisphereLight(0x93c5fd, 0x111827, 0.45)
  scene.add(hemiLight)

  const dirLight = new THREE.DirectionalLight(0xffedd5, 1.05)
  dirLight.position.set(10, 18, 10)
  dirLight.castShadow = true
  dirLight.shadow.mapSize.set(2048, 2048)
  dirLight.shadow.camera.left = -18
  dirLight.shadow.camera.right = 18
  dirLight.shadow.camera.top = 18
  dirLight.shadow.camera.bottom = -18
  dirLight.shadow.camera.near = 1
  dirLight.shadow.camera.far = 55
  scene.add(dirLight)

  const warmLight = new THREE.PointLight(0xfb923c, 0.85, 38)
  warmLight.position.set(-6, 11, 6)
  scene.add(warmLight)

  const target = new THREE.Vector3(0, 4.5, -4)
  let sphericalRadius = 23
  let sphericalTheta = 0.45
  let sphericalPhi = 1.08
  let isDragging = false
  let isPanning = false
  let lastPointerX = 0
  let lastPointerY = 0

  function updateCamera() {
    const x = target.x + sphericalRadius * Math.sin(sphericalPhi) * Math.sin(sphericalTheta)
    const y = target.y + sphericalRadius * Math.cos(sphericalPhi)
    const z = target.z + sphericalRadius * Math.sin(sphericalPhi) * Math.cos(sphericalTheta)
    camera.position.set(x, y, z)
    camera.lookAt(target)
  }

  updateCamera()

  renderer.domElement.addEventListener("contextmenu", function(event) {
    event.preventDefault()
  })

  renderer.domElement.addEventListener("pointerdown", function(event) {
    lastPointerX = event.clientX
    lastPointerY = event.clientY
    if (event.button === 2) {
      isPanning = true
    } else {
      isDragging = true
    }
  })

  window.addEventListener("pointerup", function() {
    isDragging = false
    isPanning = false
  })

  window.addEventListener("pointermove", function(event) {
    const dx = event.clientX - lastPointerX
    const dy = event.clientY - lastPointerY
    lastPointerX = event.clientX
    lastPointerY = event.clientY

    if (isDragging) {
      sphericalTheta -= dx * 0.006
      sphericalPhi -= dy * 0.004
      sphericalPhi = Math.max(0.25, Math.min(Math.PI - 0.18, sphericalPhi))
      updateCamera()
    }

    if (isPanning) {
      const right = new THREE.Vector3()
      const up = new THREE.Vector3(0, 1, 0)
      camera.getWorldDirection(right)
      right.cross(up).normalize()
      target.addScaledVector(right, -dx * 0.018)
      target.y += dy * 0.018
      updateCamera()
    }
  })

  renderer.domElement.addEventListener("wheel", function(event) {
    event.preventDefault()
    sphericalRadius += event.deltaY * 0.018
    sphericalRadius = Math.max(8, Math.min(52, sphericalRadius))
    updateCamera()
  }, { passive: false })

  const metalMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.72, roughness: 0.28 })
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.55, roughness: 0.36 })
  const orangeMat = new THREE.MeshStandardMaterial({ color: 0xfb923c, metalness: 0.28, roughness: 0.42 })
  const stringMat = new THREE.MeshStandardMaterial({ color: 0xc4a484, roughness: 0.85 })
  const paperMat = new THREE.MeshStandardMaterial({ color: 0xfffbeb, roughness: 0.88, metalness: 0, side: THREE.DoubleSide })
  const beltEdgeMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.6 })
  const arrowMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.72 })
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 1 })

  const supportGroup = new THREE.Group()
  const pillarGeo = new THREE.CylinderGeometry(0.14, 0.18, 14, 16)
  const pillarLeft = new THREE.Mesh(pillarGeo, metalMat)
  pillarLeft.position.set(-4.2, 7, 0)
  pillarLeft.castShadow = true
  supportGroup.add(pillarLeft)

  const pillarRight = new THREE.Mesh(pillarGeo, metalMat)
  pillarRight.position.set(4.2, 7, 0)
  pillarRight.castShadow = true
  supportGroup.add(pillarRight)

  const barGeo = new THREE.CylinderGeometry(0.14, 0.14, 8.8, 16)
  const topBar = new THREE.Mesh(barGeo, metalMat)
  topBar.rotation.z = Math.PI / 2
  topBar.position.set(0, 14, 0)
  topBar.castShadow = true
  supportGroup.add(topBar)

  const baseGeo = new THREE.BoxGeometry(1.35, 0.32, 1.35)
  const baseLeft = new THREE.Mesh(baseGeo, darkMat)
  baseLeft.position.set(-4.2, 0.16, 0)
  baseLeft.castShadow = true
  baseLeft.receiveShadow = true
  supportGroup.add(baseLeft)

  const baseRight = new THREE.Mesh(baseGeo, darkMat)
  baseRight.position.set(4.2, 0.16, 0)
  baseRight.castShadow = true
  baseRight.receiveShadow = true
  supportGroup.add(baseRight)

  const jointGeo = new THREE.SphereGeometry(0.28, 24, 16)
  const pivotBall = new THREE.Mesh(jointGeo, orangeMat)
  pivotBall.position.set(0, 14, 0)
  pivotBall.castShadow = true
  supportGroup.add(pivotBall)

  scene.add(supportGroup)

  const pendulumGroup = new THREE.Group()
  const pivotY = 14
  const stringLength = 8
  pendulumGroup.position.set(0, pivotY, 0)

  const stringGeo = new THREE.CylinderGeometry(0.025, 0.025, stringLength, 8)
  const stringMesh = new THREE.Mesh(stringGeo, stringMat)
  stringMesh.position.y = -stringLength / 2
  stringMesh.castShadow = true
  pendulumGroup.add(stringMesh)

  const funnelGroup = new THREE.Group()
  
  // 优化：更真实的沙漏形状 - 上宽下窄的锥形
  const upperConeGeo = new THREE.ConeGeometry(0.85, 1.5, 48)
  const upperCone = new THREE.Mesh(upperConeGeo, orangeMat)
  upperCone.rotation.x = Math.PI
  upperCone.position.y = 0.75
  upperCone.castShadow = true
  upperCone.receiveShadow = true
  funnelGroup.add(upperCone)

  // 优化：下部锥形更细长，模拟真实沙漏
  const lowerConeGeo = new THREE.ConeGeometry(0.85, 1.2, 48)
  const lowerCone = new THREE.Mesh(lowerConeGeo, orangeMat)
  lowerCone.position.y = -0.6
  lowerCone.castShadow = true
  lowerCone.receiveShadow = true
  funnelGroup.add(lowerCone)

  // 优化：更精细的漏嘴设计
  const nozzleGeo = new THREE.CylinderGeometry(0.06, 0.15, 0.5, 24)
  const nozzle = new THREE.Mesh(nozzleGeo, darkMat)
  nozzle.position.y = -1.45
  nozzle.castShadow = true
  funnelGroup.add(nozzle)

  // 删除摆身上的金属环和内部沙子，使沙摆更简洁

  funnelGroup.position.y = -stringLength
  pendulumGroup.add(funnelGroup)
  scene.add(pendulumGroup)

  const tapeLength = 62
  const tapeWidth = 8
  const tapeY = 0.55

  const paperGeo = new THREE.PlaneGeometry(tapeWidth, tapeLength, 1, 1)
  const paper = new THREE.Mesh(paperGeo, paperMat)
  paper.rotation.x = -Math.PI / 2
  paper.position.set(0, tapeY, 0)
  paper.receiveShadow = true
  scene.add(paper)

  const edgeGeo = new THREE.BoxGeometry(0.08, 0.08, tapeLength)
  const edgeLeft = new THREE.Mesh(edgeGeo, beltEdgeMat)
  edgeLeft.position.set(-tapeWidth / 2 - 0.08, tapeY + 0.02, 0)
  edgeLeft.castShadow = true
  scene.add(edgeLeft)

  const edgeRight = new THREE.Mesh(edgeGeo, beltEdgeMat)
  edgeRight.position.set(tapeWidth / 2 + 0.08, tapeY + 0.02, 0)
  edgeRight.castShadow = true
  scene.add(edgeRight)

  const gridGroup = new THREE.Group()
  const crossLineMat = new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.42 })
  const centerLineMat = new THREE.LineBasicMaterial({ color: 0xfb923c, transparent: true, opacity: 0.62 })
  const sideLineMat = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.34 })
  // 新增黑色中线材质
  const blackCenterLineMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.85 })

  const centerLineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, tapeY + 0.035, -tapeLength / 2),
    new THREE.Vector3(0, tapeY + 0.035, tapeLength / 2)
  ])
  const centerLine = new THREE.Line(centerLineGeo, centerLineMat)
  scene.add(centerLine)

  // 新增：白纸中间的黑色平行线，平行于纸的长度边缘
  const blackCenterLineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, tapeY + 0.045, -tapeLength / 2),
    new THREE.Vector3(0, tapeY + 0.045, tapeLength / 2)
  ])
  const blackCenterLine = new THREE.Line(blackCenterLineGeo, blackCenterLineMat)
  scene.add(blackCenterLine)

  for (let i = 0; i < 42; i++) {
    const z = -tapeLength / 2 + i * 1.5
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-tapeWidth / 2, tapeY + 0.04, z),
      new THREE.Vector3(tapeWidth / 2, tapeY + 0.04, z)
    ])
    const line = new THREE.Line(lineGeo, crossLineMat)
    line.userData.baseZ = z
    gridGroup.add(line)
  }

  for (let x = -3; x <= 3; x += 1.5) {
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x, tapeY + 0.033, -tapeLength / 2),
      new THREE.Vector3(x, tapeY + 0.033, tapeLength / 2)
    ])
    const line = new THREE.Line(lineGeo, sideLineMat)
    scene.add(line)
  }

  scene.add(gridGroup)

  const arrowGroup = new THREE.Group()
  function makeArrow(z) {
    const shape = new THREE.Shape()
    shape.moveTo(0, 0.55)
    shape.lineTo(0.55, 0)
    shape.lineTo(0.2, 0)
    shape.lineTo(0.2, -0.55)
    shape.lineTo(-0.2, -0.55)
    shape.lineTo(-0.2, 0)
    shape.lineTo(-0.55, 0)
    shape.lineTo(0, 0.55)
    const geo = new THREE.ShapeGeometry(shape)
    const mesh = new THREE.Mesh(geo, arrowMat)
    mesh.rotation.x = -Math.PI / 2
    mesh.rotation.z = Math.PI
    mesh.position.set(3.15, tapeY + 0.07, z)
    mesh.userData.baseZ = z
    return mesh
  }

  for (let i = 0; i < 11; i++) {
    const z = -tapeLength / 2 + 3 + i * 6
    arrowGroup.add(makeArrow(z))
  }

  scene.add(arrowGroup)

  const rollerGeo = new THREE.CylinderGeometry(0.52, 0.52, tapeWidth + 1.2, 32)
  const rollerFront = new THREE.Mesh(rollerGeo, darkMat)
  rollerFront.rotation.z = Math.PI / 2
  rollerFront.position.set(0, 0.25, tapeLength / 2 + 0.75)
  rollerFront.castShadow = true
  scene.add(rollerFront)

  const rollerBack = new THREE.Mesh(rollerGeo, darkMat)
  rollerBack.rotation.z = Math.PI / 2
  rollerBack.position.set(0, 0.25, -tapeLength / 2 - 0.75)
  rollerBack.castShadow = true
  scene.add(rollerBack)

  const groundGeo = new THREE.PlaneGeometry(90, 90)
  const ground = new THREE.Mesh(groundGeo, groundMat)
  ground.rotation.x = -Math.PI / 2
  ground.position.y = -0.02
  ground.receiveShadow = true
  scene.add(ground)

  const maxLanded = 22000
  const maxFalling = 1800
  const maxTrace = maxLanded
  const landedPositions = new Float32Array(maxLanded * 3)
  const landedColors = new Float32Array(maxLanded * 3)
  const landedSizes = new Float32Array(maxLanded)
  const fallingPositions = new Float32Array(maxFalling * 3)
  const fallingColors = new Float32Array(maxFalling * 3)
  const fallingSizes = new Float32Array(maxFalling)
  const tracePositions = new Float32Array(maxTrace * 3)
  const traceColors = new Float32Array(maxTrace * 3)
  const traceSizes = new Float32Array(maxTrace)

  const landedGeo = new THREE.BufferGeometry()
  landedGeo.setAttribute("position", new THREE.BufferAttribute(landedPositions, 3))
  landedGeo.setAttribute("color", new THREE.BufferAttribute(landedColors, 3))
  landedGeo.setAttribute("size", new THREE.BufferAttribute(landedSizes, 1))

  const fallingGeo = new THREE.BufferGeometry()
  fallingGeo.setAttribute("position", new THREE.BufferAttribute(fallingPositions, 3))
  fallingGeo.setAttribute("color", new THREE.BufferAttribute(fallingColors, 3))
  fallingGeo.setAttribute("size", new THREE.BufferAttribute(fallingSizes, 1))

  const traceGeo = new THREE.BufferGeometry()
  traceGeo.setAttribute("position", new THREE.BufferAttribute(tracePositions, 3))
  traceGeo.setAttribute("color", new THREE.BufferAttribute(traceColors, 3))
  traceGeo.setAttribute("size", new THREE.BufferAttribute(traceSizes, 1))

  const particleMat = new THREE.ShaderMaterial({
    uniforms: {
      pixelRatio: { value: renderer.getPixelRatio() }
    },
    vertexShader: `
      attribute float size;
      varying vec3 vColor;
      uniform float pixelRatio;
      void main() {
        vColor = color;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * pixelRatio * (210.0 / -mvPosition.z);
        gl_PointSize = clamp(gl_PointSize, 1.0, 18.0);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float alpha = 1.0 - smoothstep(0.32, 0.5, d);
        gl_FragColor = vec4(vColor, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    vertexColors: true
  })

  const traceMat = new THREE.ShaderMaterial({
    uniforms: {
      pixelRatio: { value: renderer.getPixelRatio() }
    },
    vertexShader: `
      attribute float size;
      varying vec3 vColor;
      uniform float pixelRatio;
      void main() {
        vColor = color;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * pixelRatio * (260.0 / -mvPosition.z);
        gl_PointSize = clamp(gl_PointSize, 3.0, 38.0);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float core = 1.0 - smoothstep(0.10, 0.42, d);
        float edge = 1.0 - smoothstep(0.34, 0.5, d);
        float alpha = 0.92 * max(core, edge * 0.55);
        gl_FragColor = vec4(vColor, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    vertexColors: true
  })

  const tracePoints = new THREE.Points(traceGeo, traceMat)
  tracePoints.renderOrder = 10
  const landedPoints = new THREE.Points(landedGeo, particleMat)
  landedPoints.renderOrder = 11
  const fallingPoints = new THREE.Points(fallingGeo, particleMat)
  scene.add(tracePoints)
  scene.add(landedPoints)
  scene.add(fallingPoints)

  const sandPalette = [
    new THREE.Color(0xf59e0b),
    new THREE.Color(0xfbbf24),
    new THREE.Color(0xd97706),
    new THREE.Color(0xfacc15),
    new THREE.Color(0xca8a04),
    new THREE.Color(0xfdba74)
  ]

  const fallingParticles = []
  const landedParticles = []
  let landedWriteIndex = 0
  let landedTotal = 0
  let amplitude = 3.0
  let period = 2.0
  let tapeSpeed = 2.0
  let sandDensity = 35
  let simTime = 0
  let tapeOffset = 0
  let sandAccumulator = 0
  let isPaused = false

  const ampSlider = document.getElementById("amplitude")
  const perSlider = document.getElementById("period")
  const spdSlider = document.getElementById("tapeSpeed")
  const densitySelect = document.getElementById("sandDensity")
  const btnPause = document.getElementById("btnPause")
  const btnReset = document.getElementById("btnReset")
  const ampVal = document.getElementById("ampVal")
  const perVal = document.getElementById("perVal")
  const spdVal = document.getElementById("spdVal")

  ampSlider.addEventListener("input", function() {
    amplitude = parseFloat(this.value)
    ampVal.textContent = amplitude.toFixed(1)
  })

  perSlider.addEventListener("input", function() {
    period = parseFloat(this.value)
    perVal.textContent = period.toFixed(1) + "s"
  })

  spdSlider.addEventListener("input", function() {
    tapeSpeed = parseFloat(this.value)
    spdVal.textContent = tapeSpeed.toFixed(1)
  })

  densitySelect.addEventListener("change", function() {
    sandDensity = parseInt(this.value, 10)
  })

  btnPause.addEventListener("click", function() {
    isPaused = !isPaused
    btnPause.textContent = isPaused ? "继续" : "暂停"
    if (isPaused) {
      btnPause.className = "flex-1 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 py-2.5 text-sm font-bold tracking-wider text-white shadow-lg shadow-emerald-950/40 transition hover:-translate-y-0.5 hover:from-emerald-300 hover:to-emerald-500"
    } else {
      btnPause.className = "flex-1 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 py-2.5 text-sm font-bold tracking-wider text-white shadow-lg shadow-orange-950/40 transition hover:-translate-y-0.5 hover:from-orange-300 hover:to-orange-500"
    }
  })

  btnReset.addEventListener("click", function() {
    simTime = 0
    tapeOffset = 0
    sandAccumulator = 0
    landedWriteIndex = 0
    landedTotal = 0
    fallingParticles.length = 0
    landedParticles.length = 0

    for (let i = 0; i < maxLanded * 3; i++) {
      landedPositions[i] = 0
      landedColors[i] = 0
    }

    for (let i = 0; i < maxLanded; i++) {
      landedSizes[i] = 0
    }

    for (let i = 0; i < maxFalling * 3; i++) {
      fallingPositions[i] = 0
      fallingColors[i] = 0
    }

    for (let i = 0; i < maxFalling; i++) {
      fallingSizes[i] = 0
    }

    for (let i = 0; i < maxTrace * 3; i++) {
      tracePositions[i] = 0
      traceColors[i] = 0
    }

    for (let i = 0; i < maxTrace; i++) {
      traceSizes[i] = 0
    }

    landedGeo.attributes.position.needsUpdate = true
    landedGeo.attributes.color.needsUpdate = true
    landedGeo.attributes.size.needsUpdate = true
    fallingGeo.attributes.position.needsUpdate = true
    fallingGeo.attributes.color.needsUpdate = true
    fallingGeo.attributes.size.needsUpdate = true
    traceGeo.attributes.position.needsUpdate = true
    traceGeo.attributes.color.needsUpdate = true
    traceGeo.attributes.size.needsUpdate = true
  })

  function randomSandColor() {
    return sandPalette[Math.floor(Math.random() * sandPalette.length)]
  }

  function spawnFallingParticle(x, y, z) {
    if (fallingParticles.length > maxFalling - 4) {
      fallingParticles.splice(0, 1)
    }

    const color = randomSandColor()
    // 优化：更真实的沙粒生成 - 从漏嘴位置开始，带有微小初速度
    const particle = {
      x: x + (Math.random() - 0.5) * 0.08,
      y: y - 1.45,  // 从漏嘴位置开始
      z: z + (Math.random() - 0.5) * 0.08,
      vx: (Math.random() - 0.5) * 0.02,  // 更小的水平初速度
      vy: -0.15 - Math.random() * 0.2,   // 更自然的初速度
      vz: (Math.random() - 0.5) * 0.02,
      color: color,
      size: 0.06 + Math.random() * 0.05  // 更细腻的沙粒大小
    }

    fallingParticles.push(particle)
  }

  function addLandedParticle(worldX, worldY, worldZ, color, size) {
    const idx = landedWriteIndex
    const localZ = worldZ + tapeOffset
    const particle = {
      idx: idx,
      x: worldX,
      y: worldY,
      localZ: localZ,
      size: size,
      traceSize: Math.max(size * 5.2, 0.46)
    }

    landedParticles[idx] = particle
    landedPositions[idx * 3] = worldX
    landedPositions[idx * 3 + 1] = worldY
    landedPositions[idx * 3 + 2] = worldZ
    landedColors[idx * 3] = color.r
    landedColors[idx * 3 + 1] = color.g
    landedColors[idx * 3 + 2] = color.b
    landedSizes[idx] = size

    tracePositions[idx * 3] = worldX
    tracePositions[idx * 3 + 1] = tapeY + 0.061
    tracePositions[idx * 3 + 2] = worldZ
    traceColors[idx * 3] = 0.42 + Math.random() * 0.10
    traceColors[idx * 3 + 1] = 0.22 + Math.random() * 0.08
    traceColors[idx * 3 + 2] = 0.04 + Math.random() * 0.04
    traceSizes[idx] = particle.traceSize

    landedWriteIndex = (landedWriteIndex + 1) % maxLanded
    landedTotal = Math.min(landedTotal + 1, maxLanded)
  }

  function updateMovingPaperMarkers() {
    const spacing = 1.5
    const arrowSpacing = 6
    const lineRange = tapeLength
    const lineOffset = tapeOffset % spacing
    const arrowOffset = tapeOffset % arrowSpacing

    gridGroup.children.forEach(function(line) {
      let z = line.userData.baseZ - lineOffset
      if (z < -lineRange / 2) {
        z += lineRange + spacing
      }
      line.position.z = z - line.userData.baseZ
    })

    arrowGroup.children.forEach(function(arrow) {
      let z = arrow.userData.baseZ - arrowOffset
      if (z < -tapeLength / 2) {
        z += tapeLength + arrowSpacing
      }
      arrow.position.z = z
    })

    rollerFront.rotation.x -= tapeSpeed * 0.055
    rollerBack.rotation.x -= tapeSpeed * 0.055
  }

  function updateFallingParticles(dt) {
    for (let i = fallingParticles.length - 1; i >= 0; i--) {
      const p = fallingParticles[i]
      p.vy -= 17.5 * dt
      p.x += p.vx * dt
      p.y += p.vy * dt
      p.z += p.vz * dt

      if (p.y <= tapeY + 0.05) {
        addLandedParticle(
          p.x,
          tapeY + 0.07 + Math.random() * 0.035,
          p.z,
          p.color,
          p.size
        )
        fallingParticles.splice(i, 1)
      }
    }

    for (let i = 0; i < maxFalling; i++) {
      if (i < fallingParticles.length) {
        const p = fallingParticles[i]
        fallingPositions[i * 3] = p.x
        fallingPositions[i * 3 + 1] = p.y
        fallingPositions[i * 3 + 2] = p.z
        fallingColors[i * 3] = p.color.r
        fallingColors[i * 3 + 1] = p.color.g
        fallingColors[i * 3 + 2] = p.color.b
        fallingSizes[i] = p.size
      } else {
        fallingSizes[i] = 0
      }
    }

    fallingGeo.attributes.position.needsUpdate = true
    fallingGeo.attributes.color.needsUpdate = true
    fallingGeo.attributes.size.needsUpdate = true
  }

  function updateLandedParticles() {
    for (let i = 0; i < maxLanded; i++) {
      const p = landedParticles[i]
      if (p) {
        const worldZ = p.localZ - tapeOffset
        landedPositions[p.idx * 3] = p.x
        landedPositions[p.idx * 3 + 1] = p.y
        landedPositions[p.idx * 3 + 2] = worldZ
        tracePositions[p.idx * 3] = p.x
        tracePositions[p.idx * 3 + 1] = tapeY + 0.061
        tracePositions[p.idx * 3 + 2] = worldZ

        if (worldZ < -tapeLength / 2 - 7 || worldZ > tapeLength / 2 + 7) {
          landedSizes[p.idx] = 0
          traceSizes[p.idx] = 0
        } else {
          landedSizes[p.idx] = p.size
          traceSizes[p.idx] = p.traceSize
        }
      }
    }

    landedGeo.attributes.position.needsUpdate = true
    landedGeo.attributes.color.needsUpdate = true
    landedGeo.attributes.size.needsUpdate = true
    traceGeo.attributes.position.needsUpdate = true
    traceGeo.attributes.color.needsUpdate = true
    traceGeo.attributes.size.needsUpdate = true
  }

  const clock = new THREE.Clock()

  function animate() {
    requestAnimationFrame(animate)

    const dt = Math.min(clock.getDelta(), 0.04)

    if (!isPaused) {
      simTime += dt
      tapeOffset += tapeSpeed * dt

      const omega = 2 * Math.PI / period
      const bobX = amplitude * Math.sin(omega * simTime)
      const angle = Math.asin(Math.max(-0.95, Math.min(0.95, bobX / stringLength)))
      const bobY = pivotY - stringLength * Math.cos(angle)

      pendulumGroup.rotation.z = angle

      sandAccumulator += sandDensity * dt
      while (sandAccumulator >= 1) {
        sandAccumulator -= 1
        spawnFallingParticle(bobX, bobY, 0)
      }

      updateFallingParticles(dt)
      updateLandedParticles()
      updateMovingPaperMarkers()
    }

    renderer.render(scene, camera)
  }

  window.addEventListener("resize", function() {
    camera.aspect = window.innerWidth / window.innerHeight
    camera.updateProjectionMatrix()
    renderer.setSize(window.innerWidth, window.innerHeight)
    particleMat.uniforms.pixelRatio.value = renderer.getPixelRatio()
    traceMat.uniforms.pixelRatio.value = renderer.getPixelRatio()
    updateCamera()
  })

  animate()
})()
</script>
 
  <script>
  // 返回主页（滚动位置已在主页点击链接时保存）
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用开发者工具快捷键
  document.addEventListener('keydown', function(e) {
    // ESC返回主页 - 保存滚动位置
    if (e.keyCode === 27) {
      saveScrollAndReturn();
      return false;
    }
    // F12
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }
    // Ctrl+S
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
  
  // 禁用选择
  document.addEventListener('selectstart', function(e) {
    // 允许输入框选择
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      return true;
    }
    e.preventDefault();
    return false;
  });
  </script>
