        }
        .btn-mass.active {
            background: #5dade2;

            color: #fff;
            box-shadow: 0 0 12px rgba(93, 173, 226, 0.5);

        .btn-reset {
            background: #2d3f52;
            color: #c0d0e0;

        }
        .btn-reset:hover {
            background: #3a5068;
            border-color: #5b738c;
            transform: translateY(-2px);
        }
        .info-panel {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 0.85em;
            color: #b8cad8;
            background: rgba(30, 44, 58, 0.7);
            border-radius: 12px;
            padding: 10px 20px;
        }
        .info-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-cm {
            background: #e74c3c;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.6);
        }
        .dot-cart {
            background: #5dade2;
        }
        .legend {
            font-size: 0.78em;
            color: #8aa0b8;
            text-align: center;
            line-height: 1.5;
        }
        .hidden-control {
            display: none !important;
        }

    <div class="container">
        <div class="header">
            <h1>🔨 水平方向动量守恒</h1>
            <p class="subtitle" id="modelDescription">小孩站在小车左侧 · 锤子向左伸出</p>
        </div>
        <div class="canvas-wrapper">
            <canvas id="mainCanvas" width="900" height="500"></canvas>
        </div>
        <div class="controls" id="controlsArea">
            <button class="btn btn-release" id="btnRelease">🚀 释放锤子</button>
            <button class="btn btn-ideal" id="btnIdeal">🧪 理想化模型</button>
            <button class="btn btn-mass hidden-control" id="btnMass11">⚖️ 质量比 1:1</button>
            <button class="btn btn-mass hidden-control" id="btnMass12">⚖️ 质量比 1:2</button>
            <button class="btn btn-reset" id="btnReset">🔄 重置</button>
        </div>
        <div class="info-panel">
            <span><span class="info-dot dot-cm"></span> 系统质心：<strong>水平位置不变</strong></span>
            <span><span class="info-dot dot-cart"></span> 小车</span>
            <span>总动量 ≈ <strong>0</strong></span>
            <span id="massDisplay"></span>
        </div>
        <p class="legend" id="legendText">💡 光滑地面 · 人站左侧 · 锤子初始水平向左 · <strong>质心水平位置始终不变</strong></p>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const btnRelease = document.getElementById('btnRelease');
            const btnIdeal = document.getElementById('btnIdeal');
            const btnMass11 = document.getElementById('btnMass11');
            const btnMass12 = document.getElementById('btnMass12');
            const btnReset = document.getElementById('btnReset');
            const modelDesc = document.getElementById('modelDescription');
            const legendText = document.getElementById('legendText');
            const massDisplay = document.getElementById('massDisplay');

            let currentModel = 'hammer';
            let idealMassRatio = 1 / 4.8;

            let M_total, m_obj, L_total, g, e_restitution, damping, initAngleDeg;
            let cartWidth, cartHeight, wheelRadius, groundY, cartTopY;
            let personOffsetX, shoulderBodyOffsetX, shoulderY_rel;
            let poleHeight, pivotOffsetX;
            let bodyHeight = 34;
            const personRaiseY = 40;

            function setModelParams(model) {
                g = 720;
                groundY = 435;
                cartWidth = 220;
                cartHeight = 42;
                wheelRadius = 18;
                cartTopY = groundY - cartHeight;
                if (model === 'hammer') {
                    M_total = 100;
                    m_obj = 18;
                    L_total = 28 + 58;
                    initAngleDeg = -90;
                    e_restitution = 0.42;
                    damping = 0.16;
                    personOffsetX = -78;
                    shoulderBodyOffsetX = -16;
                    shoulderY_rel = cartTopY - bodyHeight + 10 - personRaiseY;
                    modelDesc.textContent = '小孩站在小车左侧 · 锤子向左伸出';
                    legendText.innerHTML = '💡 光滑地面 · 人站左侧 · 锤子初始水平向左 · <strong>质心水平位置始终不变</strong>';
                    btnRelease.textContent = '🚀 释放锤子';
                    massDisplay.textContent = '';
                } else {
                    if (idealMassRatio === 1.0) { M_total = 80; m_obj = 80; } 
                    else if (idealMassRatio === 0.5) { M_total = 120; m_obj = 60; } 
                    else { M_total = 120; m_obj = 25; }
                    L_total = 90;
                    initAngleDeg = 90;
                    e_restitution = 0;
                    damping = 0.002;
                    poleHeight = 70;
                    pivotOffsetX = 0;
                    modelDesc.textContent = '理想化模型：小车-单摆 · 机械能守恒';
                    legendText.innerHTML = '💡 光滑地面 · 红色小车 · 竖杆悬挂蓝色小球 · <strong>水平动量守恒 + 机械能守恒</strong>';
                    btnRelease.textContent = '🚀 释放小球';
                    const ratio = (m_obj / M_total).toFixed(2);
                    massDisplay.textContent = `小球:车 = 1 : ${(1/(m_obj/M_total)).toFixed(1)}`;
                }
            }

            function getShoulderWorldX() { return x_cart + personOffsetX + shoulderBodyOffsetX; }
            function getShoulderWorldY() { return shoulderY_rel; }
            function getPivotWorldX() { return x_cart + pivotOffsetX; }
            function getPivotWorldY() { return cartTopY - poleHeight; }

            let theta, omega, x_cart, v_cart;
            let isReleased = false;
            let simTime = 0;
            let collisionFlash = 0;
            let collisionCooldown = 0;
            let trailPoints = [];
            let cm_x_initial;

            function resetState() {
                setModelParams(currentModel);
                theta = initAngleDeg * Math.PI / 180;
                omega = 0;
                x_cart = canvas.width / 2;
                v_cart = 0;
                isReleased = false;
                simTime = 0;
                collisionFlash = 0;
                collisionCooldown = 0;
                trailPoints = [];
                const objX = currentModel === 'hammer' ?
                    (getShoulderWorldX() + L_total * Math.sin(theta)) :
                    (getPivotWorldX() + L_total * Math.sin(theta));
                cm_x_initial = (M_total * x_cart + m_obj * objX) / (M_total + m_obj);
                btnRelease.disabled = false;
                updateMassButtons();
            }

            function getObjectWorldPos() {
                if (currentModel === 'hammer') {
                    const sx = getShoulderWorldX();
                    const sy = getShoulderWorldY();
                    return { x: sx + L_total * Math.sin(theta), y: sy + L_total * Math.cos(theta), pivotX: sx, pivotY: sy };
                } else {
                    const px = getPivotWorldX();
                    const py = getPivotWorldY();
                    return { x: px + L_total * Math.sin(theta), y: py + L_total * Math.cos(theta), pivotX: px, pivotY: py };
                }
            }

            function handleCollision() {
                if (currentModel !== 'hammer' || collisionCooldown > 0) return;
                const hp = getObjectWorldPos();
                const hammerX = hp.x;
                const hammerY = hp.y;
                const carLeft = x_cart - cartWidth / 2;
                const carRight = x_cart + cartWidth / 2;
                const carTop = cartTopY;
                const hammerVy = -L_total * Math.sin(theta) * omega;
                if (hammerX > carLeft + 4 && hammerX < carRight - 4 && hammerY >= carTop - 1 && hammerVy > 0.2) {
                    omega = -e_restitution * omega;
                    v_cart = -m_obj * L_total * Math.cos(theta) * omega / (M_total + m_obj);
                    collisionFlash = 0.3;
                    collisionCooldown = 0.12;
                }
                if (hammerY >= groundY - 6 && hammerVy > 0 && collisionCooldown <= 0) {
                    omega = -e_restitution * 0.55 * omega;
                    v_cart = -m_obj * L_total * Math.cos(theta) * omega / (M_total + m_obj);
                    collisionFlash = Math.max(collisionFlash, 0.18);
                    collisionCooldown = 0.1;
                }
            }

            function physicsStep(dt) {
                if (!isReleased) return;
                if (collisionCooldown > 0) collisionCooldown = Math.max(0, collisionCooldown - dt);
                const sinT = Math.sin(theta);
                const cosT = Math.cos(theta);
                const M_eff = M_total + m_obj * sinT * sinT;
                const alpha_num = -(g / L_total) * sinT * (M_total + m_obj) - m_obj * sinT * cosT * omega * omega;
                const alpha = alpha_num / Math.max(M_eff, 0.001) - damping * omega;
                omega += alpha * dt;
                theta += omega * dt;
                theta = Math.max(-Math.PI * 0.49, Math.min(Math.PI * 0.49, theta));
                v_cart = -m_obj * L_total * cosT * omega / (M_total + m_obj);
                x_cart += v_cart * dt;
                if (currentModel === 'hammer') handleCollision();
                if (collisionFlash > 0) collisionFlash = Math.max(0, collisionFlash - dt);
                if (simTime > 0.02) {
                    const op = getObjectWorldPos();
                    if (trailPoints.length === 0 || Math.hypot(op.x - trailPoints[trailPoints.length - 1].x, op.y - trailPoints[trailPoints.length - 1].y) > 3.0) {
                        trailPoints.push({ x: op.x, y: op.y, age: 0 });
                    }
                }
                for (let i = trailPoints.length - 1; i >= 0; i--) {
                    trailPoints[i].age += dt;
                    if (trailPoints[i].age > 1.4) trailPoints.splice(i, 1);
                }
                if (trailPoints.length > 140) trailPoints.splice(0, trailPoints.length - 140);
                simTime += dt;
            }

            function drawGround() {
                const grad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
                grad.addColorStop(0, '#8a9db0');
                grad.addColorStop(1, '#5a6f85');
                ctx.fillStyle = grad;
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
                ctx.strokeStyle = '#5a7088';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(canvas.width, groundY);
                ctx.stroke();
            }

            function drawCart(color1 = '#7eb5d6', color2 = '#5d8aa8', color3 = '#4a6f8a') {
                const cx = x_cart, cy = cartTopY, cw = cartWidth, ch = cartHeight;
                ctx.save();
                const grad = ctx.createLinearGradient(cx, cy, cx, cy + ch);
                grad.addColorStop(0, color1);
                grad.addColorStop(0.5, color2);
                grad.addColorStop(1, color3);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(cx - cw / 2, cy, cw, ch, 6);
                ctx.fill();
                if (collisionFlash > 0 && currentModel === 'hammer') {
                    ctx.fillStyle = `rgba(255,220,100,${(collisionFlash / 0.3) * 0.7})`;
                    ctx.fillRect(cx - cw / 2 + 8, cy - 5, cw - 16, 12);
                }
                [cx - cw / 3, cx + cw / 3].forEach(wx => {
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.beginPath();
                    ctx.arc(wx + 2, groundY + 2, wheelRadius, 0, Math.PI * 2);
                    ctx.fill();
                    const wg = ctx.createRadialGradient(wx - 2, groundY - 2, wheelRadius * 0.1, wx, groundY, wheelRadius);
                    wg.addColorStop(0, '#6a6a6a');
                    wg.addColorStop(0.7, '#404040');
                    wg.addColorStop(1, '#1a1a1a');
                    ctx.fillStyle = wg;
                    ctx.beginPath();
                    ctx.arc(wx, groundY, wheelRadius, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }

            function drawFineLightningHair(cx, topY) {
                ctx.save();
                const draw = (x, y, h, w) => {
                    ctx.lineWidth = w;
                    ctx.strokeStyle = '#2a1a0a';
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 4, y - h * 0.35);
                    ctx.lineTo(x + 3.5, y - h * 0.6);
                    ctx.lineTo(x - 2, y - h * 0.82);
                    ctx.lineTo(x + 2.5, y - h);
                    ctx.stroke();
                    ctx.strokeStyle = '#4a2a10';
                    ctx.lineWidth = w * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 4, y - h * 0.35);
                    ctx.lineTo(x + 3.5, y - h * 0.6);
                    ctx.lineTo(x - 2, y - h * 0.82);
                    ctx.lineTo(x + 2.5, y - h);
                    ctx.stroke();
                };
                draw(cx, topY - 2, 14, 1.8);
                draw(cx - 9, topY + 1, 10, 1.5);
                draw(cx + 9, topY + 1, 10, 1.5);
                ctx.restore();
            }

            function drawAnimeFace(cx, headCY) {
                ctx.save();
                const eyeY = headCY - 2, eyeSpacing = 7;
                for (let side = -1; side <= 1; side += 2) {
                    const ex = cx + side * eyeSpacing;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.ellipse(ex, eyeY, 5.5, 6.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#3a2218';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(ex + 0.5, eyeY - 0.5, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(ex + 2, eyeY - 2.5, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex - 1.5, eyeY + 1.5, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.strokeStyle = '#2a1a0a';
                ctx.lineWidth = 1.8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(cx - eyeSpacing - 4, eyeY - 7);
                ctx.quadraticCurveTo(cx - eyeSpacing, eyeY - 9, cx - eyeSpacing + 5, eyeY - 7);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + eyeSpacing + 4, eyeY - 7);
                ctx.quadraticCurveTo(cx + eyeSpacing, eyeY - 9, cx + eyeSpacing - 5, eyeY - 7);
                ctx.stroke();
                ctx.strokeStyle = '#d4a080';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(cx, eyeY + 5);
                ctx.quadraticCurveTo(cx + 2, eyeY + 9, cx, eyeY + 10);
                ctx.stroke();
                ctx.fillStyle = '#e8b89d';
                ctx.beginPath();
                ctx.arc(cx, eyeY + 9.5, 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#c4816a';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, eyeY + 13, 7, 0.15 * Math.PI, 0.85 * Math.PI);
                ctx.stroke();
                ctx.fillStyle = '#e8a090';
                ctx.beginPath();
                ctx.arc(cx, eyeY + 13.5, 4, 0.1 * Math.PI, 0.9 * Math.PI);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,180,160,0.3)';
                ctx.beginPath();
                ctx.ellipse(cx - 10, eyeY + 5, 4, 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 10, eyeY + 5, 4, 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawHammerModel() {
                const bodyCX = x_cart + personOffsetX;
                const bodyTopY = cartTopY - bodyHeight - personRaiseY;
                const headRadius = 18;
                const headCY = bodyTopY - headRadius + 4;
                const leftLegTop = cartTopY - 22 - personRaiseY;
                const rightLegTop = cartTopY - 14 - personRaiseY;

                ctx.save();
                // 腿部
                ctx.fillStyle = '#3d5a80';
                ctx.fillRect(bodyCX - 9, leftLegTop, 9, cartTopY - leftLegTop);
                ctx.fillRect(bodyCX + 4, rightLegTop, 9, cartTopY - rightLegTop);
                // 鞋子
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(bodyCX - 12, cartTopY - 3, 13, 8);
                ctx.fillRect(bodyCX + 1, cartTopY - 3, 13, 8);
                // 背心
                const bGrad = ctx.createLinearGradient(bodyCX, bodyTopY, bodyCX, cartTopY);
                bGrad.addColorStop(0, '#f15b4c');
                bGrad.addColorStop(1, '#c0392b');
                ctx.fillStyle = bGrad;
                ctx.beginPath();
                ctx.roundRect(bodyCX - 15, bodyTopY, 30, bodyHeight, 8);
                ctx.fill();
                ctx.fillStyle = '#fde8e5';
                ctx.beginPath();
                ctx.arc(bodyCX, bodyTopY + 7, 8, 0, Math.PI * 2);
                ctx.fill();
                // 头部
                ctx.fillStyle = '#fde4c8';
                ctx.beginPath();
                ctx.arc(bodyCX, headCY, headRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#e8c9a0';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                drawFineLightningHair(bodyCX, headCY - headRadius);
                drawAnimeFace(bodyCX, headCY);

                // 左臂（持锤手臂）
                const shoulderX = getShoulderWorldX();
                const shoulderY = getShoulderWorldY();
                ctx.strokeStyle = '#e8b89d';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(bodyCX - 15 + 2, shoulderY);
                ctx.lineTo(shoulderX, shoulderY);
                ctx.stroke();
                ctx.strokeStyle = '#fde4c8';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(bodyCX - 15 + 1, shoulderY);
                ctx.lineTo(shoulderX, shoulderY);
                ctx.stroke();

                // 右臂（自然下垂，长度减少10像素）
                const rightShoulderX = bodyCX + 14;
                const rightShoulderY = shoulderY;
                const rightArmLength = 22;  // 原32，减小10
                const rightElbowY = rightShoulderY + rightArmLength;
                ctx.strokeStyle = '#e8b89d';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(rightShoulderX, rightShoulderY);
                ctx.lineTo(rightShoulderX, rightElbowY);
                ctx.stroke();
                ctx.strokeStyle = '#fde4c8';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(rightShoulderX, rightShoulderY);
                ctx.lineTo(rightShoulderX, rightElbowY);
                ctx.stroke();
                // 右手
                ctx.fillStyle = '#fde4c8';
                ctx.beginPath();
                ctx.arc(rightShoulderX, rightElbowY + 4, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#d4b896';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();

                // 锤子部分
                const hp = getObjectWorldPos();
                const { pivotX: sx, pivotY: sy, x: hx, y: hy } = hp;
                const dx = hx - sx, dy = hy - sy;
                const len = Math.hypot(dx, dy);
                const ux = len > 0 ? dx / len : 0, uy = len > 0 ? dy / len : 1;
                const fex = sx + ux * 28, fey = sy + uy * 28;
                ctx.save();
                ctx.strokeStyle = '#e8b89d';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(fex, fey);
                ctx.stroke();
                ctx.strokeStyle = '#b87333';
                ctx.lineWidth = 7;
                ctx.beginPath();
                ctx.moveTo(fex, fey);
                ctx.lineTo(hx, hy);
                ctx.stroke();
                const headSize = 24;
                const px = -uy, py = ux;
                ctx.fillStyle = '#5a5a5a';
                ctx.beginPath();
                ctx.moveTo(hx + px * headSize * 0.6, hy + py * headSize * 0.6);
                ctx.lineTo(hx - px * headSize * 0.6, hy - py * headSize * 0.6);
                ctx.lineTo(hx - px * headSize * 0.6 + ux * headSize * 0.8, hy - py * headSize * 0.6 + uy * headSize * 0.8);
                ctx.lineTo(hx + px * headSize * 0.6 + ux * headSize * 0.8, hy + py * headSize * 0.6 + uy * headSize * 0.8);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            function drawIdealPoleAndBall() {
                const px = getPivotWorldX();
                const py = getPivotWorldY();
                ctx.save();
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(px, cartTopY);
                ctx.lineTo(px, py);
                ctx.stroke();
                const op = getObjectWorldPos();
                ctx.strokeStyle = '#5dade2';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(op.x, op.y);
                ctx.stroke();
                ctx.setLineDash([]);
                const ballGrad = ctx.createRadialGradient(op.x - 3, op.y - 3, 2, op.x, op.y, 15);
                ballGrad.addColorStop(0, '#8ec8f2');
                ballGrad.addColorStop(0.5, '#3498db');
                ballGrad.addColorStop(1, '#1a5276');
                ctx.fillStyle = ballGrad;
                ctx.shadowColor = 'rgba(52,152,219,0.5)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(op.x, op.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = '#2e86c1';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            function drawTrail() {
                if (trailPoints.length < 2) return;
                ctx.save();
                const isIdeal = currentModel === 'ideal';
                for (let i = 1; i < trailPoints.length; i++) {
                    const alpha = Math.max(0, 1 - trailPoints[i].age / 1.4) * 0.55;
                    if (isIdeal) {
                        ctx.strokeStyle = `rgba(52,152,219,${alpha})`;
                        ctx.lineWidth = 2.0;
                        ctx.setLineDash([6, 8]);
                    } else {
                        ctx.strokeStyle = `rgba(255,180,60,${alpha})`;
                        ctx.lineWidth = 2.4;
                        ctx.setLineDash([]);
                    }
                    ctx.beginPath();
                    ctx.moveTo(trailPoints[i - 1].x, trailPoints[i - 1].y);
                    ctx.lineTo(trailPoints[i].x, trailPoints[i].y);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
                ctx.restore();
            }

            function drawCenterOfMass() {
                const op = getObjectWorldPos();
                const cm_x = (M_total * x_cart + m_obj * op.x) / (M_total + m_obj);
                const cm_y = groundY - 62;
                ctx.strokeStyle = 'rgba(231,76,60,0.7)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 7]);
                ctx.beginPath();
                ctx.moveTo(cm_x, groundY - 3);
                ctx.lineTo(cm_x, cm_y);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.moveTo(cm_x, cm_y - 10);
                ctx.lineTo(cm_x + 10, cm_y);
                ctx.lineTo(cm_x, cm_y + 10);
                ctx.lineTo(cm_x - 10, cm_y);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('质心(不变)', cm_x, cm_y - 20);
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const bg = ctx.createLinearGradient(0, 0, 0, groundY);
                bg.addColorStop(0, '#e8eef5');
                bg.addColorStop(1, '#cdd7e2');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, canvas.width, groundY);
                drawGround();
                if (currentModel === 'hammer') {
                    drawTrail();
                    drawCart();
                    drawHammerModel();
                } else {
                    drawCart('#e74c3c', '#c0392b', '#a93226');
                    drawTrail();
                    drawIdealPoleAndBall();
                }
                drawCenterOfMass();
            }

            function updateMassButtons() {
                if (currentModel === 'ideal') {
                    btnMass11.classList.remove('hidden-control');
                    btnMass12.classList.remove('hidden-control');
                    btnMass11.classList.toggle('active', idealMassRatio === 1.0);
                    btnMass12.classList.toggle('active', idealMassRatio === 0.5);
                } else {
                    btnMass11.classList.add('hidden-control');
                    btnMass12.classList.add('hidden-control');
                }
            }

            let lastTime = null;
            const fixedDt = 1 / 360;
            function animate(timestamp) {
                if (lastTime === null) lastTime = timestamp;
                let elapsed = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                if (elapsed > 0.1) elapsed = 0.1;
                if (elapsed <= 0) elapsed = fixedDt;
                let remaining = elapsed;
                while (remaining > 0) {
                    physicsStep(Math.min(remaining, fixedDt));
                    remaining -= fixedDt;
                }
                render();
                requestAnimationFrame(animate);
            }

            function releaseAction() {
                if (!isReleased) {
                    isReleased = true;
                    simTime = 0;
                    trailPoints = [];
                    collisionCooldown = 0;
                    btnRelease.disabled = true;
                    if (Math.abs(omega) < 0.001) omega = 0.45;
                }
            }

            btnRelease.addEventListener('click', releaseAction);
            btnReset.addEventListener('click', () => { resetState(); lastTime = null; });
            btnIdeal.addEventListener('click', () => {
                currentModel = currentModel === 'hammer' ? 'ideal' : 'hammer';
                btnIdeal.textContent = currentModel === 'ideal' ? '🔨 锤子模型' : '🧪 理想化模型';
                resetState();
                lastTime = null;
            });
            btnMass11.addEventListener('click', () => { if (currentModel === 'ideal') { idealMassRatio = 1.0; resetState(); lastTime = null; } });
            btnMass12.addEventListener('click', () => { if (currentModel === 'ideal') { idealMassRatio = 0.5; resetState(); lastTime = null; } });
            document.addEventListener('keydown', e => {
                if (e.code === 'Space' && !isReleased) { e.preventDefault(); releaseAction(); }
                if (e.code === 'Escape') { e.preventDefault(); btnReset.click(); }
            });
            canvas.addEventListener('click', () => { if (!isReleased) releaseAction(); });

            setModelParams('hammer');
            resetState();
            btnIdeal.textContent = '🧪 理想化模型';
            updateMassButtons();
            requestAnimationFrame(animate);
        })();
    </script>

  <script>
  // 返回主页（滚动位置已在主页点击链接时保存）
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用开发者工具快捷键
  document.addEventListener('keydown', function(e) {
    // ESC返回主页 - 保存滚动位置
    if (e.keyCode === 27) {
      saveScrollAndReturn();
      return false;
    }
    // F12
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }
    // Ctrl+S
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
  
  // 禁用选择
  document.addEventListener('selectstart', function(e) {
    // 允许输入框选择
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      return true;
    }
    e.preventDefault();
    return false;
  });
  </script>
