<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中物理 · 三星系统动画（居中布局）</title>
    <style>
        :root {
            --bg: #0b1a2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #060f1d;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            padding: 10px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1400px;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            background: #0b1a2e;
            border-radius: 20px;
            box-shadow:
                0 0 80px rgba(20, 60, 120, 0.45),
                0 10px 45px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            overflow: hidden;
            aspect-ratio: 1500 / 650;
            min-height: 500px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
        .legend-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px 32px;
            color: #b0c8e8;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
        }
        .legend-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .legend-dot.red {
            background: #ff5e5e;
            box-shadow: 0 0 12px #ff5e5e;
        }
        .legend-dot.yellow {
            background: #ffb833;
            box-shadow: 0 0 12px #ffb833;
        }
        .legend-dot.blue {
            background: #5da8ff;
            box-shadow: 0 0 12px #5da8ff;
        }
        .info-text {
            color: #8aacd4;
            font-size: 0.82rem;
            text-align: center;
            letter-spacing: 0.03em;
            line-height: 1.6;
            max-width: 1000px;
            opacity: 0.9;
        }
        @media (max-width: 768px) {
            .canvas-wrapper {
                border-radius: 14px;
                min-height: 300px;
                aspect-ratio: 3 / 2.2;
            }
            canvas {
                border-radius: 14px;
            }
            .legend-row {
                font-size: 0.75rem;
                gap: 8px 16px;
            }
            .info-text {
                font-size: 0.7rem;
            }
        }
    </style>

  <style>
  body {
    background-color: #1a2332 !important;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }
  
  .qilai-back-btn {
    position: fixed;
    top: 10px;
    left: 15px;
    z-index: 100000;
    padding: 8px 16px;
    background: rgba(0, 150, 200, 0.2);
    border: 1px solid rgba(100, 180, 255, 0.5);
    color: #8ab4f8;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s;
    backdrop-filter: blur(5px);
    font-family: "Microsoft YaHei", sans-serif;
  }
  
  .qilai-back-btn:hover {
    background: rgba(0, 150, 200, 0.4);
    box-shadow: 0 0 15px rgba(100, 180, 255, 0.3);
    color: #fff;
  }
  
  .qilai-watermark {
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    font-size: 12px;
    color: rgba(138, 180, 248, 0.35);
    text-align: right;
    line-height: 1.8;
    pointer-events: none;
    user-select: none;
    font-family: "Microsoft YaHei", sans-serif;
  }
  
  .qilai-watermark .title {
    font-size: 14px;
    font-weight: bold;
    color: rgba(138, 180, 248, 0.45);
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  </style>
</head>
<body>
  <a href="javascript:void(0);" class="qilai-back-btn" onclick="saveScrollAndReturn();">← 返回主页</a>
  
  <div class="qilai-watermark">
    <div class="title">齐老师动画</div>
    QQ 3398528250<br>
    抖音 35320300542
  </div>

    <div class="container">
        <div class="canvas-wrapper">
            <canvas id="mainCanvas"></canvas>
        </div>
        <div class="legend-row">
            <span><span class="legend-dot red"></span> 红星</span>
            <span><span class="legend-dot yellow"></span> 黄星</span>
            <span><span class="legend-dot blue"></span> 蓝星</span>
            <span style="margin-left:10px;">⊕ 质心 / 旋转中心</span>
        </div>
        <p class="info-text">
            <strong>左：</strong>等边三角形分布，三颗质量相等的星位于三角形顶点，绕质心同步旋转 &nbsp;|&nbsp;
            <strong>右：</strong>三点共线，中间大质量星，两侧小星等距，绕质心旋转保持共线
        </p>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');

            // --- 画布逻辑尺寸（增加高度，从500变为650）---
            const W_LOGICAL = 1500;
            const H_LOGICAL = 650;

            // --- 两个模型区域中心（居中布局，y坐标下移使模型处于画面中心）---
            const center1 = { x: 375, y: 325 };    // 模型一：等边三角形（左侧）
            const center2 = { x: 1125, y: 325 };   // 模型二：三点共线（右侧）

            // ========== 模型参数 ==========
            // 模型1：等边三角形外接圆半径
            const R_triangle = 210;
            const starRadius1 = 34;

            // 模型2：三点共线距离
            const distLine = 260;
            const starRadius2_large = 46;
            const starRadius2_small = 28;

            // --- 背景星星 ---
            const bgStars = [];
            const NUM_BG_STARS = 280;
            for (let i = 0; i < NUM_BG_STARS; i++) {
                bgStars.push({
                    x: Math.random() * W_LOGICAL,
                    y: Math.random() * H_LOGICAL,
                    r: Math.random() * 1.5 + 0.3,
                    twinklePhase: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 1.5 + 0.4,
                    baseAlpha: Math.random() * 0.5 + 0.35,
                });
            }

            // --- 视口缩放 ---
            let scale = 1;
            let offsetY = 0;

            function resizeCanvas() {
                const wrapper = canvas.parentElement;
                const rect = wrapper.getBoundingClientRect();
                const displayWidth = rect.width;
                const displayHeight = rect.height;

                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = displayWidth * dpr;
                canvas.height = displayHeight * dpr;
                canvas.style.width = displayWidth + 'px';
                canvas.style.height = displayHeight + 'px';

                scale = displayWidth / W_LOGICAL;
                offsetY = (displayHeight - H_LOGICAL * scale) / 2;
                if (offsetY < 0) offsetY = 0;
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // --- 绘制发光星体 ---
            function drawGlowStar(cx, cy, radius, colorInner, colorMid, colorOuter, glowRadius) {
                const grdOuter = ctx.createRadialGradient(cx, cy, radius * 0.6, cx, cy, glowRadius);
                grdOuter.addColorStop(0, colorMid);
                grdOuter.addColorStop(0.5, colorOuter);
                grdOuter.addColorStop(1, 'transparent');
                ctx.fillStyle = grdOuter;
                ctx.beginPath();
                ctx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
                ctx.fill();

                const grdMid = ctx.createRadialGradient(cx, cy, radius * 0.4, cx, cy, radius * 1.7);
                grdMid.addColorStop(0, colorInner);
                grdMid.addColorStop(0.55, colorMid);
                grdMid.addColorStop(1, 'transparent');
                ctx.fillStyle = grdMid;
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 1.7, 0, Math.PI * 2);
                ctx.fill();

                const grdCore = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grdCore.addColorStop(0, '#ffffff');
                grdCore.addColorStop(0.2, colorInner);
                grdCore.addColorStop(0.65, colorMid);
                grdCore.addColorStop(1, colorOuter);
                ctx.fillStyle = grdCore;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- 绘制质心标记 ---
            function drawBarycenter(cx, cy, size) {
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 2;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(cx - size, cy);
                ctx.lineTo(cx + size, cy);
                ctx.moveTo(cx, cy - size);
                ctx.lineTo(cx, cy + size);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(cx, cy, size * 0.65, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.65)';
                ctx.lineWidth = 1.4;
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.beginPath();
                ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- 虚线轨道 ---
            function drawDashedCircle(cx, cy, r, color, dashLen, gapLen, lineWidth) {
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.setLineDash([dashLen, gapLen]);
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // --- 虚线直线 ---
            function drawDashedLine(x1, y1, x2, y2, color, dashLen, gapLen, lineWidth) {
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.setLineDash([dashLen, gapLen]);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // --- 模型1：三角形边 ---
            function drawTriangleEdges(points, color) {
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([8, 10]);
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.lineTo(points[2].x, points[2].y);
                ctx.closePath();
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // --- 分隔线（单条，位于两个模型之间）---
            function drawDivider() {
                const divX = (center1.x + center2.x) / 2;
                const divColor = 'rgba(180,200,230,0.2)';
                ctx.strokeStyle = divColor;
                ctx.lineWidth = 1.2;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(divX, 45);
                ctx.lineTo(divX, H_LOGICAL - 45);
                ctx.stroke();

                const grad = ctx.createLinearGradient(divX, 0, divX, H_LOGICAL);
                grad.addColorStop(0, 'transparent');
                grad.addColorStop(0.3, 'rgba(150,190,240,0.2)');
                grad.addColorStop(0.7, 'rgba(150,190,240,0.2)');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(divX - 1.2, 0, 2.4, H_LOGICAL);
            }

            // --- 背景星星 ---
            function drawBgStars(time) {
                for (const star of bgStars) {
                    const alpha = star.baseAlpha + Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.25;
                    const a = Math.max(0.1, Math.min(0.9, alpha));
                    ctx.fillStyle = `rgba(210,225,250,${a})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // --- 主循环 ---
            let lastTime = performance.now();
            let timeAccum = 0;

            function animate(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt <= 0) dt = 0.016;
                if (dt > 0.1) dt = 0.1;
                lastTime = timestamp;
                timeAccum += dt;

                resizeCanvas();
                const displayWidth = canvas.width;
                const displayHeight = canvas.height;

                ctx.clearRect(0, 0, displayWidth, displayHeight);
                ctx.save();
                ctx.scale(scale, scale);
                ctx.translate(0, offsetY / scale);

                // 深邃浅蓝黑背景
                const bgGrad = ctx.createRadialGradient(W_LOGICAL / 2, H_LOGICAL / 2, 180, W_LOGICAL / 2, H_LOGICAL / 2, 900);
                bgGrad.addColorStop(0, '#101d38');
                bgGrad.addColorStop(0.6, '#0b172a');
                bgGrad.addColorStop(1, '#060f1f');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W_LOGICAL, H_LOGICAL);

                drawBgStars(timeAccum);
                drawDivider();

                // ========== 模型1：等边三角形（左侧）==========
                const angle1 = timeAccum * 0.68;
                const pts1 = [];
                const colors1 = [
                    { inner: '#ffffff', mid: '#ff6b6b', outer: '#c0392b', glowR: 70, r: starRadius1 },
                    { inner: '#ffffff', mid: '#ffc048', outer: '#d4880f', glowR: 70, r: starRadius1 },
                    { inner: '#ffffff', mid: '#64b5ff', outer: '#1e6dc7', glowR: 70, r: starRadius1 },
                ];

                for (let i = 0; i < 3; i++) {
                    const a = angle1 + (i * Math.PI * 2) / 3;
                    pts1.push({
                        x: center1.x + R_triangle * Math.cos(a),
                        y: center1.y + R_triangle * Math.sin(a)
                    });
                }

                drawTriangleEdges(pts1, 'rgba(200,210,230,0.35)');
                drawDashedCircle(center1.x, center1.y, R_triangle, 'rgba(180,200,225,0.3)', 10, 12, 1.4);

                for (let i = 0; i < 3; i++) {
                    const c = colors1[i];
                    drawGlowStar(pts1[i].x, pts1[i].y, c.r, c.inner, c.mid, c.outer, c.glowR);
                }
                drawBarycenter(center1.x, center1.y, 12);

                // ========== 模型2：三点共线（右侧）==========
                const angle2 = timeAccum * 0.78;
                const dxLine = Math.cos(angle2);
                const dyLine = Math.sin(angle2);

                const red2X = center2.x;
                const red2Y = center2.y;
                const yellow2X = center2.x + dxLine * distLine;
                const yellow2Y = center2.y + dyLine * distLine;
                const blue2X = center2.x - dxLine * distLine;
                const blue2Y = center2.y - dyLine * distLine;

                const extDist = distLine + 26;
                drawDashedLine(
                    center2.x - dxLine * extDist, center2.y - dyLine * extDist,
                    center2.x + dxLine * extDist, center2.y + dyLine * extDist,
                    'rgba(200,210,230,0.42)', 7, 9, 1.6
                );
                drawDashedCircle(center2.x, center2.y, distLine, 'rgba(180,200,225,0.28)', 10, 12, 1.4);

                drawGlowStar(yellow2X, yellow2Y, starRadius2_small, '#ffffff', '#ffc850', '#c7801a', 52);
                drawGlowStar(blue2X, blue2Y, starRadius2_small, '#ffffff', '#6dbfff', '#1a5faa', 52);
                drawGlowStar(red2X, red2Y, starRadius2_large, '#ffffff', '#ff5252', '#a01515', 80);

                drawBarycenter(center2.x, center2.y, 12);

                // 两个区域微光边框
                const borderAlpha = 0.12;
                [
                    { cx: center1.x, cy: center1.y, r: 280 },
                    { cx: center2.x, cy: center2.y, r: 280 },
                ].forEach(b => {
                    const bGrad = ctx.createRadialGradient(b.cx, b.cy, b.r * 0.8, b.cx, b.cy, b.r);
                    bGrad.addColorStop(0, 'transparent');
                    bGrad.addColorStop(1, `rgba(140,180,220,${borderAlpha})`);
                    ctx.fillStyle = bGrad;
                    ctx.beginPath();
                    ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            // 暂停/恢复
            let paused = false;
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    paused = !paused;
                    if (!paused) {
                        lastTime = performance.now();
                        requestAnimationFrame(animate);
                    }
                }
            });
            canvas.addEventListener('click', () => {
                paused = !paused;
                if (!paused) {
                    lastTime = performance.now();
                    requestAnimationFrame(animate);
                }
            });
        })();
    </script>

  <script>
  // 返回主页（滚动位置已在主页点击链接时保存）
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用开发者工具快捷键
  document.addEventListener('keydown', function(e) {
    // ESC返回主页 - 保存滚动位置
    if (e.keyCode === 27) {
      saveScrollAndReturn();
      return false;
    }
    // F12
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }
    // Ctrl+S
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
  
  // 禁用选择
  document.addEventListener('selectstart', function(e) {
    // 允许输入框选择
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      return true;
    }
    e.preventDefault();
    return false;
  });
  </script>
</body>
