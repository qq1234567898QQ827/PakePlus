    <style>
        :root {
            --bg: #0a0a14;
            --panel-bg: rgba(14, 14, 30, 0.85);
            --text: #c8d6e5;
            --red: #ff5252;
            --blue: #4da6ff;
            --yellow: #ffb833;
            --circle: #9b7ec4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(ellipse at center, #0d0d24 0%, #050510 60%, #020208 100%);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .main-container {
            display: flex;
            gap: 20px;
            align-items: stretch;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .canvas-wrapper {
            position: relative;
            background: rgba(8, 10, 28, 0.7);
            border-radius: 20px;
            border: 1px solid rgba(100, 140, 220, 0.25);
            box-shadow: 0 0 40px rgba(30, 60, 140, 0.2), 0 0 80px rgba(20, 40, 100, 0.1), inset 0 0 60px rgba(10, 20, 50, 0.3);
            overflow: hidden;
            flex: 1 1 680px;
            min-width: 340px;
            max-width: 820px;
            aspect-ratio: 800 / 550;
            cursor: default;
        }
        .canvas-wrapper.dragging {
            cursor: grabbing;
        }
        .canvas-wrapper.near-node {
            cursor: grab;
        }
        .canvas-wrapper.near-node.dragging {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }

        .control-panel {
            background: var(--panel-bg);
            border-radius: 20px;
            border: 1px solid rgba(100, 140, 220, 0.3);
            box-shadow: 0 0 30px rgba(30, 60, 140, 0.15), 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 24px 22px;
            flex: 0 0 260px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 240px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .panel-title {
            font-size: 1.15em;
            font-weight: 700;
            color: #fff;
            text-align: center;
            letter-spacing: 0.05em;
            text-shadow: 0 0 20px rgba(140, 180, 255, 0.5);
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(120, 160, 220, 0.25);
        }

        .param-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .param-label {
            font-size: 0.85em;
            color: #a0b8d8;
            letter-spacing: 0.03em;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .param-value {
            color: #fff;
            font-weight: 700;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 14px;
            letter-spacing: 0.02em;
        }

        .slider-container {
            position: relative;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 10px;
            background: linear-gradient(90deg, #2a3a60, #4a80d0);
            outline: none;
            cursor: pointer;
            transition: background 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe8b0, #e0a030);
            border: 2px solid rgba(255, 200, 80, 0.7);
            cursor: pointer;
            box-shadow: 0 0 18px rgba(255, 180, 40, 0.55), 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            box-shadow: 0 0 28px rgba(255, 180, 40, 0.8), 0 6px 16px rgba(0, 0, 0, 0.5);
            transform: scale(1.05);
        }
        input[type="range"]::-webkit-slider-thumb:active {
            box-shadow: 0 0 35px rgba(255, 200, 60, 1), 0 2px 8px rgba(0, 0, 0, 0.6);
            transform: scale(1.08);
        }

        .force-display {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .force-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }
        .force-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 10px currentColor;
        }
        .force-dot.red {
            background: #ff5252;
            box-shadow: 0 0 14px #ff5252;
        }
        .force-dot.blue {
            background: #4da6ff;
            box-shadow: 0 0 14px #4da6ff;
        }
        .force-dot.yellow {
            background: #ffb833;
            box-shadow: 0 0 14px #ffb833;
        }
        .force-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .force-name {
            font-size: 0.8em;
            color: #bcc8dd;
            letter-spacing: 0.03em;
        }
        .force-value {
            font-size: 1.05em;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.02em;
        }

        .extra-info {
            font-size: 0.75em;
            color: #8899bb;
            text-align: center;
            letter-spacing: 0.03em;
            line-height: 1.6;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .extra-info span {
            color: #c8b0f0;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                align-items: center;
                gap: 14px;
                padding: 10px;
            }
            .canvas-wrapper {
                flex: 1 1 auto;
                width: 100%;
                max-width: 100%;
                aspect-ratio: 4/3;
                min-width: auto;
            }
            .control-panel {
                flex: 0 0 auto;
                width: 100%;
                max-width: 420px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 12px;
                padding: 16px;
                justify-content: center;
            }
            .panel-title {
                width: 100%;
                font-size: 1em;
            }
            .param-group {
                flex: 1 1 120px;
                min-width: 100px;
            }
            .force-display {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                width: 100%;
                justify-content: center;
            }
            .force-item {
                flex: 1 1 80px;
                min-width: 70px;
                padding: 6px 8px;
            }
            .extra-info {
                width: 100%;
            }
        }
    </style>

<body>

  <div class="qilai-watermark">

    QQ 3398528250<br>

    <div class="main-container">
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="mainCanvas"></canvas>
        </div>

        <div class="control-panel" id="controlPanel">
            <div class="panel-title">🔮 辅助圆模型 · 动态平衡</div>

            <div class="param-group">
                <div class="param-label">
                    <span>📐 拉力 T 与竖直方向夹角 θ</span>
                    <span class="param-value" id="angleDisplay">60°</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="angleSlider" min="1" max="179" value="60" step="0.5">
                </div>
            </div>

            <div class="force-display">
                <div class="force-item">
                    <div class="force-dot red"></div>
                    <div class="force-info">
                        <span class="force-name">重力 G（竖直向下·恒力）</span>
                        <span class="force-value" id="gravityVal">10.00 N</span>
                    </div>
                </div>
                <div class="force-item">
                    <div class="force-dot blue"></div>
                    <div class="force-info">
                        <span class="force-name">力 F（大小方向均可变）</span>
                        <span class="force-value" id="forceFVal">5.77 N</span>
                    </div>
                </div>
                <div class="force-item">
                    <div class="force-dot yellow"></div>
                    <div class="force-info">
                        <span class="force-name">拉力 T（斜向左上方）</span>
                        <span class="force-value" id="tensionVal">20.00 N</span>
                    </div>
                </div>
            </div>

            <div class="extra-info">
                ⭕ 外接圆固定 · 以T为直径<br>
                📍 圆心O · 半径R不变<br>
                💡 G为恒力 · 另两力夹角恒定
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('canvasWrapper');
            const angleSlider = document.getElementById('angleSlider');
            const angleDisplay = document.getElementById('angleDisplay');
            const gravityValEl = document.getElementById('gravityVal');
            const forceFValEl = document.getElementById('forceFVal');
            const tensionValEl = document.getElementById('tensionVal');

            // --- 固定几何参数 ---
            const W = 800;
            const H = 550;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);

            // 物理量
            const G_N = 10;                // 重力大小 N
            const G_LEN = 150;             // 画布上重力长度 px

            // 固定外接圆：圆心O和半径R
            const O = { x: 400, y: 275 };
            const R = 150;
            const halfChord = G_LEN / 2;
            const dCenter = Math.sqrt(R * R - halfChord * halfChord);
            const P0 = { x: O.x - dCenter, y: O.y - halfChord };
            const P1 = { x: O.x - dCenter, y: O.y + halfChord };

            // --- 状态变量 ---
            let thetaDeg = 60;
            let thetaRad = thetaDeg * Math.PI / 180;

            // --- 由theta计算P2及力的大小 ---
            function computeFromTheta(thetaRad) {
                const sinT = Math.sin(thetaRad);
                const cosT = Math.cos(thetaRad);
                const A = { x: P0.x - O.x, y: P0.y - O.y };
                const Adotd = A.x * sinT + A.y * cosT;
                const L = -2 * Adotd;
                const P2 = {
                    x: P0.x + L * sinT,
                    y: P0.y + L * cosT
                };
                const fLen = Math.hypot(P2.x - P1.x, P2.y - P1.y);
                const tLen = L;
                return { P2, fLen, tLen };
            }

            function getTriangle() {
                const { P2, fLen, tLen } = computeFromTheta(thetaRad);
                return { P0, P1, P2, O, fLen, tLen, gLen: G_LEN, radius: R };
            }

            // --- 由P2反推theta (用于拖动) ---
            function computeThetaFromP2(P2) {
                const dx = P0.x - P2.x;
                const dy = P0.y - P2.y;
                let beta = Math.atan2(dy, dx);
                let theta = -Math.PI / 2 - beta;
                if (theta < 0) theta += 2 * Math.PI;
                if (theta > Math.PI) theta = 2 * Math.PI - theta;
                return Math.max(1, Math.min(179, theta * 180 / Math.PI));
            }

            // --- Canvas尺寸适配 ---
            function resizeCanvas() {
                const rect = wrapper.getBoundingClientRect();
                const displayWidth = rect.width;
                const displayHeight = rect.height || (displayWidth * H / W);
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = displayWidth + 'px';
                canvas.style.height = displayHeight + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // --- 星空背景元素 ---
            class Star {
                constructor() { this.reset(true); }
                reset(init = false) {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.baseR = Math.random() < 0.08 ? (Math.random() * 2.2 + 1.5) :
                        (Math.random() < 0.3 ? Math.random() * 1.3 + 0.6 : Math.random() * 0.9 + 0.25);
                    this.r = this.baseR;
                    this.bright = Math.random() * 0.55 + 0.45;
                    this.spd = Math.random() * 0.025 + 0.008;
                    this.offset = Math.random() * Math.PI * 2;
                    this.hue = Math.random() < 0.6 ? (Math.random() * 30 + 210) :
                        (Math.random() < 0.5 ? Math.random() * 25 + 30 : Math.random() * 360);
                    this.sat = Math.random() * 25 + 5;
                    this.light = 70 + Math.random() * 30;
                }
                update(frame) {
                    const t = Math.sin(frame * this.spd + this.offset);
                    this.r = this.baseR * (0.6 + 0.4 * (0.5 + 0.5 * t));
                    this.bright = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(frame * this.spd * 1.3 + this.offset + 1.5));
                }
                draw(ctx) {
                    const a = this.bright;
                    if (this.r < 0.15) return;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue},${this.sat}%,${this.light}%,${a})`;
                    ctx.fill();
                    if (this.r > 1.3) {
                        const g = ctx.createRadialGradient(this.x, this.y, this.r * 0.2, this.x, this.y, this.r * 2.5);
                        g.addColorStop(0, `hsla(${this.hue},${this.sat}%,${this.light}%,${a * 0.7})`);
                        g.addColorStop(1, 'transparent');
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.r * 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = g;
                        ctx.fill();
                    }
                }
            }
            const stars = Array.from({ length: 220 }, () => new Star());
            const orbs = Array.from({ length: 6 }, () => ({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.25,
                radius: Math.random() * 28 + 14,
                alpha: Math.random() * 0.12 + 0.04,
                hue: Math.random() < 0.5 ? 210 + Math.random() * 30 : 240 + Math.random() * 25,
            }));

            // --- 绘图工具函数 ---
            function drawArrow(from, to, color, lw = 3.5) {
                const dx = to.x - from.x,
                    dy = to.y - from.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len < 0.5) return;
                const ux = dx / len,
                    uy = dy / len;
                const aLen = Math.min(16, len * 0.28);
                const aW = aLen * 0.55;
                const bx = to.x - ux * aLen * 0.7;
                const by = to.y - uy * aLen * 0.7;
                ctx.save();
                ctx.shadowColor = color;
                ctx.shadowBlur = 14;
                ctx.strokeStyle = color;
                ctx.lineWidth = lw;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(from.x, from.y);
                ctx.lineTo(bx, by);
                ctx.stroke();
                ctx.shadowBlur = 8;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(to.x, to.y);
                ctx.lineTo(bx - uy * aW, by + ux * aW);
                ctx.lineTo(bx + uy * aW, by - ux * aW);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            function drawNode(x, y, r = 6, col = '#fff', glow = '#fff', pulse = false) {
                ctx.save();
                if (pulse) {
                    const grad = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.8);
                    grad.addColorStop(0, glow);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(x, y, r * 2.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowColor = glow;
                ctx.shadowBlur = 14;
                ctx.fillStyle = col;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 6;
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            }

            function drawDashedLine(a, b, color, dash = 6, gap = 4, lw = 1.2) {
                const dx = b.x - a.x,
                    dy = b.y - a.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len < 0.5) return;
                const ux = dx / len,
                    uy = dy / len;
                ctx.strokeStyle = color;
                ctx.lineWidth = lw;
                ctx.lineCap = 'round';
                ctx.setLineDash([dash, gap]);
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function drawDashedCircle(cx, cy, r, color, dash = 8, gap = 5, lw = 1.6) {
                ctx.strokeStyle = color;
                ctx.lineWidth = lw;
                ctx.setLineDash([dash, gap]);
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function drawGrid() {
                ctx.strokeStyle = 'rgba(60,100,170,0.07)';
                ctx.lineWidth = 0.6;
                for (let x = 50; x < W; x += 50) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, H);
                    ctx.stroke();
                }
                for (let y = 50; y < H; y += 50) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }
                ctx.strokeStyle = 'rgba(60,100,170,0.04)';
                ctx.lineWidth = 0.4;
                for (let x = -H; x < W + H; x += 90) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x + H, H);
                    ctx.stroke();
                }
            }

            // --- 主绘制 ---
            function draw(frame) {
                ctx.clearRect(0, 0, W, H);
                const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.35, 50, W * 0.5, H * 0.5, W * 0.9);
                bgGrad.addColorStop(0, 'rgba(18,22,50,0.5)');
                bgGrad.addColorStop(0.5, 'rgba(8,10,26,0.7)');
                bgGrad.addColorStop(1, 'rgba(3,4,14,0.95)');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);
                drawGrid();

                for (const orb of orbs) {
                    orb.x += orb.vx;
                    orb.y += orb.vy;
                    if (orb.x < -60) orb.x = W + 60;
                    if (orb.x > W + 60) orb.x = -60;
                    if (orb.y < -60) orb.y = H + 60;
                    if (orb.y > H + 60) orb.y = -60;
                    const g = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius);
                    g.addColorStop(0, `hsla(${orb.hue},60%,65%,${orb.alpha})`);
                    g.addColorStop(1, 'transparent');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (const s of stars) {
                    s.update(frame);
                    s.draw(ctx);
                }

                const tri = getTriangle();
                const { P0, P1, P2, O, radius } = tri;

                // 外接圆光晕与填充
                const circleFill = ctx.createRadialGradient(O.x, O.y, radius * 0.35, O.x, O.y, radius);
                circleFill.addColorStop(0, 'rgba(150,130,200,0.04)');
                circleFill.addColorStop(1, 'rgba(100,120,180,0.01)');
                ctx.fillStyle = circleFill;
                ctx.beginPath();
                ctx.arc(O.x, O.y, radius, 0, Math.PI * 2);
                ctx.fill();

                drawDashedCircle(O.x, O.y, radius, 'rgba(170,150,210,0.55)', 7, 5, 1.8);

                const outerGlow = ctx.createRadialGradient(O.x, O.y, radius * 0.9, O.x, O.y, radius * 1.15);
                outerGlow.addColorStop(0, 'transparent');
                outerGlow.addColorStop(1, 'rgba(160,140,210,0.12)');
                ctx.fillStyle = outerGlow;
                ctx.beginPath();
                ctx.arc(O.x, O.y, radius * 1.15, 0, Math.PI * 2);
                ctx.fill();

                // 圆心与半径虚线
                drawDashedLine(O, P0, 'rgba(200,180,230,0.35)', 4, 5, 1.0);
                drawDashedLine(O, P1, 'rgba(200,180,230,0.35)', 4, 5, 1.0);
                drawDashedLine(O, P2, 'rgba(200,180,230,0.35)', 4, 5, 1.0);

                // 竖直参考虚线
                drawDashedLine(P0, { x: P0.x, y: P0.y - 60 }, 'rgba(180,200,230,0.3)', 4, 5, 1.0);

                // 三角形边 (轻量)
                ctx.fillStyle = 'rgba(180,200,240,0.03)';
                ctx.beginPath();
                ctx.moveTo(P0.x, P0.y);
                ctx.lineTo(P1.x, P1.y);
                ctx.lineTo(P2.x, P2.y);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(P0.x, P0.y);
                ctx.lineTo(P1.x, P1.y);
                ctx.lineTo(P2.x, P2.y);
                ctx.closePath();
                ctx.stroke();

                // 力矢量
                drawArrow(P0, P1, '#ff5252', 4.0);
                drawArrow(P1, P2, '#4da6ff', 4.0);
                drawArrow(P2, P0, '#ffb833', 4.0);

                // 仅保留圆心O的节点（三角形顶点圆点已删除）
                drawNode(O.x, O.y, 7, '#fffef0', '#e8d0ff', true);

                // 标签
                ctx.font = 'bold 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                const gMidX = (P0.x + P1.x) / 2 + 28;
                const gMidY = (P0.y + P1.y) / 2;
                ctx.fillStyle = '#ff7070';
                ctx.fillText('G', gMidX, gMidY + 5);
                ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillStyle = 'rgba(255,100,100,0.45)';
                ctx.fillText('(重力↓)', gMidX, gMidY + 19);
                ctx.font = 'bold 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';

                const fMidX = (P1.x + P2.x) / 2;
                const fMidY = (P1.y + P2.y) / 2 + 20;
                ctx.fillStyle = '#6dbfff';
                ctx.fillText('F', fMidX, fMidY + 5);
                ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillStyle = 'rgba(100,180,255,0.45)';
                ctx.fillText('(可变方向)', fMidX, fMidY + 19);
                ctx.font = 'bold 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';

                const tMidX = (P2.x + P0.x) / 2 - 30;
                const tMidY = (P2.y + P0.y) / 2;
                ctx.fillStyle = '#ffcc55';
                ctx.fillText('T', tMidX, tMidY + 5);
                ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillStyle = 'rgba(255,190,60,0.45)';
                ctx.fillText('(拉力↖)', tMidX, tMidY + 19);

                ctx.fillStyle = '#e8d0ff';
                ctx.font = 'bold 14px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillText('O', O.x + 18, O.y - 10);

                // --- 红色说明文字（画布下方） ---
                ctx.fillStyle = '#ff5252';
                ctx.font = 'bold 16px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('适用于：一个力为恒力，另外两个力夹角保持不变，动态平衡', W / 2, H - 10);
            }

            // --- UI更新 ---
            function updateUI() {
                const fN = (G_N / G_LEN) * getTriangle().fLen;
                const tN = (G_N / G_LEN) * getTriangle().tLen;
                angleDisplay.textContent = thetaDeg.toFixed(1) + '°';
                gravityValEl.textContent = G_N.toFixed(2) + ' N（固定）';
                forceFValEl.textContent = fN.toFixed(2) + ' N';
                tensionValEl.textContent = tN.toFixed(2) + ' N';
                angleSlider.value = thetaDeg;
            }

            function setTheta(deg) {
                thetaDeg = Math.max(1, Math.min(179, deg));
                thetaRad = thetaDeg * Math.PI / 180;
                updateUI();
            }

            // --- 滑块事件 ---
            angleSlider.addEventListener('input', () => {
                setTheta(parseFloat(angleSlider.value));
            });

            // --- 拖拽交互 (在圆上移动P2) ---
            let isDragging = false;

            function getCanvasPos(e) {
                const rect = canvas.getBoundingClientRect();
                const sx = W / rect.width;
                const sy = H / rect.height;
                return {
                    x: (e.clientX - rect.left) * sx,
                    y: (e.clientY - rect.top) * sy,
                };
            }

            function nearP2(pos, threshold = 26) {
                const { P2 } = getTriangle();
                return Math.hypot(pos.x - P2.x, pos.y - P2.y) < threshold;
            }

            canvas.addEventListener('mousedown', (e) => {
                const pos = getCanvasPos(e);
                if (nearP2(pos)) {
                    isDragging = true;
                    wrapper.classList.add('dragging', 'near-node');
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                const pos = getCanvasPos(e);
                if (isDragging) {
                    const dx = pos.x - O.x;
                    const dy = pos.y - O.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const newP2 = {
                        x: O.x + dx * R / dist,
                        y: O.y + dy * R / dist
                    };
                    const newTheta = computeThetaFromP2(newP2);
                    setTheta(newTheta);
                } else {
                    if (nearP2(pos)) {
                        wrapper.classList.add('near-node');
                    } else {
                        wrapper.classList.remove('near-node');
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    wrapper.classList.remove('dragging', 'near-node');
                }
            });

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    const pos = getCanvasPos(e.touches[0]);
                    if (nearP2(pos)) {
                        isDragging = true;
                        wrapper.classList.add('dragging', 'near-node');
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    const pos = getCanvasPos(e.touches[0]);
                    const dx = pos.x - O.x;
                    const dy = pos.y - O.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const newP2 = {
                        x: O.x + dx * R / dist,
                        y: O.y + dy * R / dist
                    };
                    const newTheta = computeThetaFromP2(newP2);
                    setTheta(newTheta);
                    e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    wrapper.classList.remove('dragging', 'near-node');
                }
            });

            // --- 动画循环 ---
            let frameCount = 0;
            function animate() {
                frameCount++;
                draw(frameCount);
                requestAnimationFrame(animate);
            }

            // --- 启动 ---
            setTheta(60);
            updateUI();
            resizeCanvas();
            animate();

            console.log('🔮 辅助圆模型已启动 - 角度范围1°~179°，顶点圆点已隐藏');
        })();
    </script>

  <script>
  // 返回主页（滚动位置已在主页点击链接时保存）
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用开发者工具快捷键
  document.addEventListener('keydown', function(e) {
    // ESC返回主页 - 保存滚动位置
    if (e.keyCode === 27) {
      saveScrollAndReturn();
      return false;
    }
    // F12
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }
    // Ctrl+S
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
  
  // 禁用选择
  document.addEventListener('selectstart', function(e) {
    // 允许输入框选择
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      return true;
    }
    e.preventDefault();
    return false;
  });
  </script>
