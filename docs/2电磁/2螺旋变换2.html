<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>通电螺线管磁感线变化动画</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #0a0a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
    }

    canvas {
        border: 1px solid #4466aa;
        box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
    }

    #pauseBtn {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 8px 16px;
        background: linear-gradient(135deg, #2244aa, #113388);
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(0, 150, 255, 0.3);
        transition: all 0.3s;
    }

    #pauseBtn:hover {
        background: linear-gradient(135deg, #3355bb, #2244aa);
        box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
    }

    #progressSlider {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 200px;
        opacity: 0.8;
        transition: opacity 0.3s;
    }

    #progressSlider:hover {
        opacity: 1;
    }

    #progressSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #6699ff;
        cursor: pointer;
        box-shadow: 0 0 5px rgba(100, 150, 255, 0.5);
    }

    #progressSlider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #6699ff;
        cursor: pointer;
        border: none;
        box-shadow: 0 0 5px rgba(100, 150, 255, 0.5);
    }

    #progressSlider::-webkit-slider-runnable-track {
        height: 4px;
        background: rgba(100, 150, 255, 0.3);
        border-radius: 2px;
    }

    #progressSlider::-moz-range-track {
        height: 4px;
        background: rgba(100, 150, 255, 0.3);
        border-radius: 2px;
    }
</style>

  <style>
  body {
    background-color: #1a2332 !important;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }
  
  .qilai-back-btn {
    position: fixed;
    top: 10px;
    left: 15px;
    z-index: 100000;
    padding: 8px 16px;
    background: rgba(0, 150, 200, 0.2);
    border: 1px solid rgba(100, 180, 255, 0.5);
    color: #8ab4f8;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s;
    backdrop-filter: blur(5px);
    font-family: "Microsoft YaHei", sans-serif;
  }
  
  .qilai-back-btn:hover {
    background: rgba(0, 150, 200, 0.4);
    box-shadow: 0 0 15px rgba(100, 180, 255, 0.3);
    color: #fff;
  }
  
  .qilai-watermark {
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    font-size: 12px;
    color: rgba(138, 180, 248, 0.35);
    text-align: right;
    line-height: 1.8;
    pointer-events: none;
    user-select: none;
    font-family: "Microsoft YaHei", sans-serif;
  }
  
  .qilai-watermark .title {
    font-size: 14px;
    font-weight: bold;
    color: rgba(138, 180, 248, 0.45);
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  </style>
</head>
<body>
  <a href="javascript:void(0);" class="qilai-back-btn" onclick="saveScrollAndReturn();">← 返回主页</a>
  
  <div class="qilai-watermark">
    <div class="title">齐老师动画</div>
    QQ 3398528250<br>
    抖音 35320300542
  </div>

    <button id="pauseBtn">暂停</button>
    <input type="range" id="progressSlider" min="0" max="1" step="0.01" value="0">
    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const pauseBtn = document.getElementById('pauseBtn');
        const progressSlider = document.getElementById('progressSlider');

        const COIL_RADIUS = 65;
        const MAX_TURNS = 8;
        const TURN_SPACING = 22;

        const LINE_B_VALUES = [20, 45];
        const LINE_ALPHAS = Array.from({ length: 6 }, (_, i) => i * Math.PI / 3);

        const COLORS = [
            '#ff2222',
            '#ff8822',
            '#ffdd22',
            '#22dd22',
            '#2288ff',
            '#2222ff',
            '#8822ff'
        ];

        let turnsProgress = 0;
        let isPaused = false;

        let rotateX = 0.25;
        let rotateY = 0.4;
        let zoom = 1.2;

        let isDragging = false;
        let lastMouseX, lastMouseY;

        const stars = Array.from({ length: 200 }, () => ({
            x: Math.random() * 800,
            y: Math.random() * 600,
            s: Math.random() * 2 + 0.5,
            a: Math.random() * 0.4 + 0.3
        }));

        function rotatePoint(x, y, z) {
            const cy = Math.cos(rotateY), sy = Math.sin(rotateY);
            const x1 = x * cy - z * sy;
            const z1 = x * sy + z * cy;
            const y1 = y;

            const cx = Math.cos(rotateX), sx = Math.sin(rotateX);
            const y2 = y1 * cx - z1 * sx;
            const z2 = y1 * sx + z1 * cx;

            return [x1, y2, z2];
        }

        function project(x, y, z) {
            const f = 520;
            const dz = z - 500;
            const s = (f / -dz) * zoom;
            return [x * s + 400, y * s + 300];
        }

        canvas.onmousedown = e => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        };

        canvas.onmousemove = e => {
            if (!isDragging) return;
            rotateY += (e.clientX - lastMouseX) * 0.01;
            rotateX += (e.clientY - lastMouseY) * 0.01;
            rotateX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotateX));
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        };

        canvas.onmouseup = canvas.onmouseleave = () => {
            isDragging = false;
        };

        canvas.onwheel = e => {
            e.preventDefault();
            zoom = Math.max(0.5, Math.min(3, zoom - e.deltaY * 0.001));
        };

        progressSlider.oninput = e => {
            turnsProgress = parseFloat(e.target.value);
        };

        pauseBtn.onclick = () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '继续' : '暂停';
        };

        function getRainbowColor(t) {
            const index = Math.floor(t * COLORS.length) % COLORS.length;
            const nextIndex = (index + 1) % COLORS.length;
            const local = (t * COLORS.length) % 1;

            const c1 = hexToRgb(COLORS[index]);
            const c2 = hexToRgb(COLORS[nextIndex]);

            const r = Math.round(c1.r + (c2.r - c1.r) * local);
            const g = Math.round(c1.g + (c2.g - c1.g) * local);
            const b = Math.round(c1.b + (c2.b - c1.b) * local);

            return `rgb(${r}, ${g}, ${b})`;
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function drawCoil() {
            const nowTurn = 1 + turnsProgress * (MAX_TURNS - 1);
            const coilLength = (nowTurn - 1) * TURN_SPACING;
            const totalAngle = 2 * Math.PI * nowTurn;

            const segments = Math.max(100, Math.floor(totalAngle / 0.05));

            for (let i = 0; i < segments; i++) {
                const t1 = (i / segments) * totalAngle;
                const t2 = ((i + 1) / segments) * totalAngle;

                const p1 = getCoilPoint(t1, nowTurn, coilLength);
                const p2 = getCoilPoint(t2, nowTurn, coilLength);

                const [rx1, ry1, rz1] = rotatePoint(...p1);
                const [px1, py1] = project(rx1, ry1, rz1);

                const [rx2, ry2, rz2] = rotatePoint(...p2);
                const [px2, py2] = project(rx2, ry2, rz2);

                const color = getRainbowColor(i / segments);

                ctx.strokeStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
                ctx.lineWidth = 4.5;

                ctx.beginPath();
                ctx.moveTo(px1, py1);
                ctx.lineTo(px2, py2);
                ctx.stroke();
            }

            ctx.shadowBlur = 0;
        }

        function getCoilPoint(t, nowTurn, coilLength) {
            const x = COIL_RADIUS * Math.cos(t);
            const y = COIL_RADIUS * Math.sin(t);
            const z = -coilLength / 2 + (t / (2 * Math.PI * nowTurn)) * coilLength;
            return [x, y, z];
        }

        function drawMagneticFieldLines() {
            const nowTurn = 1 + turnsProgress * (MAX_TURNS - 1);
            const coilLength = (nowTurn - 1) * TURN_SPACING;

            ctx.strokeStyle = '#ff2244';
            ctx.lineWidth = 1.8;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff4466';

            LINE_B_VALUES.forEach(b => {
                const a = b + coilLength / 2;

                LINE_ALPHAS.forEach(alpha => {
                    ctx.beginPath();

                    for (let t = 0; t <= 2 * Math.PI + 0.1; t += 0.08) {
                        const r = COIL_RADIUS + b * Math.sin(t);
                        const x3d = r * Math.cos(alpha);
                        const y3d = r * Math.sin(alpha);
                        const z3d = a * Math.cos(t);

                        const [rx, ry, rz] = rotatePoint(x3d, y3d, z3d);
                        const [px, py] = project(rx, ry, rz);

                        t === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                    }

                    ctx.stroke();
                });
            });

            ctx.shadowBlur = 0;
        }

        function animate() {
            if (!isPaused && turnsProgress < 1) {
                turnsProgress += 0.003;
                if (turnsProgress > 1) turnsProgress = 1;
                progressSlider.value = turnsProgress;
            }

            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, 800, 600);

            stars.forEach(st => {
                ctx.fillStyle = `rgba(255,255,255,${st.a})`;
                ctx.beginPath();
                ctx.arc(st.x, st.y, st.s, 0, Math.PI * 2);
                ctx.fill();
            });

            drawCoil();
            drawMagneticFieldLines();

            ctx.fillStyle = '#aaddff';
            ctx.font = '16px "Microsoft YaHei", Arial';
            ctx.textAlign = 'center';
            ctx.fillText('电流方向：A → B', canvas.width / 2, canvas.height - 20);
            ctx.textAlign = 'left';

            requestAnimationFrame(animate);
        }

        animate();
    </script>

  <script>
  // 返回主页（滚动位置已在主页点击链接时保存）
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用开发者工具快捷键
  document.addEventListener('keydown', function(e) {
    // ESC返回主页 - 保存滚动位置
    if (e.keyCode === 27) {
      saveScrollAndReturn();
      return false;
    }
    // F12
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }
    // Ctrl+S
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
  
  // 禁用选择
  document.addEventListener('selectstart', function(e) {
    // 允许输入框选择
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      return true;
    }
    e.preventDefault();
    return false;
  });
  </script>
</body>
</html>
