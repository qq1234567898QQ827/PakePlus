
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>通电导线磁场动画</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #4466aa;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
        }
        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #aaddff;
            font-size: 14px;
            line-height: 1.6;
            text-align: right;
            text-shadow: 0 0 5px rgba(0, 100, 200, 0.5);
        }
        #pauseBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #2244aa, #113388);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.3);
            transition: all 0.3s;
        }
        #pauseBtn:hover {
            background: linear-gradient(135deg, #3355bb, #2244aa);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
        }
        #progressSlider {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 200px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        #progressSlider:hover {
            opacity: 1;
        }
        #progressSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6699ff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(100, 150, 255, 0.5);
        }
        #progressSlider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6699ff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 5px rgba(100, 150, 255, 0.5);
        }
        #progressSlider::-webkit-slider-runnable-track {
            height: 4px;
            background: rgba(100, 150, 255, 0.3);
            border-radius: 2px;
        }
        #progressSlider::-moz-range-track {
            height: 4px;
            background: rgba(100, 150, 255, 0.3);
            border-radius: 2px;
        }
    </style>

  <style>
  body {
    background-color: #1a2332 !important;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }
  
  .qilai-back-btn {
    position: fixed;
    top: 10px;
    left: 15px;
    z-index: 100000;
    padding: 8px 16px;
    background: rgba(0, 150, 200, 0.2);
    border: 1px solid rgba(100, 180, 255, 0.5);
    color: #8ab4f8;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s;
    backdrop-filter: blur(5px);
    font-family: "Microsoft YaHei", sans-serif;
  }
  
  .qilai-back-btn:hover {
    background: rgba(0, 150, 200, 0.4);
    box-shadow: 0 0 15px rgba(100, 180, 255, 0.3);
    color: #fff;
  }
  
  .qilai-watermark {
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 99998;
    font-size: 12px;
    color: rgba(138, 180, 248, 0.35);
    text-align: right;
    line-height: 1.8;
    pointer-events: none;
    user-select: none;
    font-family: "Microsoft YaHei", sans-serif;
  }
  
  .qilai-watermark .title {
    font-size: 14px;
    font-weight: bold;
    color: rgba(138, 180, 248, 0.45);
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  </style>
</head>
<body>
  <a href="javascript:void(0);" class="qilai-back-btn" onclick="saveScrollAndReturn();">← 返回主页</a>
  
  <div class="qilai-watermark">
    <div class="title">齐老师动画</div>
    QQ 3398528250<br>
    抖音 35320300542
  </div>

    <button id="pauseBtn">暂停</button>
    <input type="range" id="progressSlider" min="0" max="1" step="0.01" value="0">
    <div class="info">
        通电导线磁场演示<br>
        直导线 → 环形电流 过渡动画<br>
        红色：磁感线<br>
        拖动鼠标可旋转视角<br>
        滚动鼠标滚轮可放大缩小<br>
        拖动滑块可手动调节动画进度
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const pauseBtn = document.getElementById('pauseBtn');

        // 物理参数
        const wireLength = 400; // 导线总长度
        const loopRadius = wireLength / (2 * Math.PI); // 环形状态的半径
        const segments = 100; // 导线分段数
        let transition = 0; // 过渡参数，0=直导线，1=环形电流
        let transitionDir = 1; // 过渡方向，1=向环形过渡，-1=向直导线过渡
        let isPaused = false; // 暂停状态
        let currentOffset = 0; // 电流流动偏移量

        // 视角控制参数
        let rotateX = 0; // 绕X轴旋转角度
        let rotateY = 0; // 绕Y轴旋转角度
        let zoom = 1; // 缩放系数
        let isDragging = false;
        let lastMouseX, lastMouseY;
        
        // 预先生成星空星星
        const stars = [];
        for(let i=0; i<200; i++) {
            stars.push({
                x: Math.random() * 800,
                y: Math.random() * 600,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.7 + 0.3
            });
        }

        // 3D向量工具函数
        function cross(a, b) {
            return [
                a[1] * b[2] - a[2] * b[1],
                a[2] * b[0] - a[0] * b[2],
                a[0] * b[1] - a[1] * b[0]
            ];
        }

        function normalize(v) {
            const len = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
            return [v[0]/len, v[1]/len, v[2]/len];
        }

        // 3D点旋转
        function rotatePoint(x, y, z) {
            // 先绕Y轴旋转
            let cosY = Math.cos(rotateY);
            let sinY = Math.sin(rotateY);
            let x1 = x * cosY - z * sinY;
            let z1 = x * sinY + z * cosY;
            let y1 = y;
            
            // 再绕X轴旋转
            let cosX = Math.cos(rotateX);
            let sinX = Math.sin(rotateX);
            let y2 = y1 * cosX - z1 * sinX;
            let z2 = y1 * sinX + z1 * cosX;
            let x2 = x1;
            
            return [x2, y2, z2];
        }

        // 3D到2D透视投影
        function project(x, y, z) {
            // 相机位置
            const camX = 0, camY = 0, camZ = 500;
            const dx = x - camX;
            const dy = y - camY;
            const dz = z - camZ;
            const focalLength = 500;
            // 修正透视投影符号，确保点在相机前方，加入缩放系数
            const scale = (focalLength / (-dz)) * zoom;
            
            return [
                dx * scale + canvas.width / 2,
                dy * scale + canvas.height / 2
            ];
        }

        // 绘制箭头
        function drawArrow(x, y, dx, dy, color, size=8) {
            const angle = Math.atan2(dy, dx);
            const arrowLen = size;
            
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 5;
            ctx.shadowColor = color;
            
            // 箭头主线
            ctx.moveTo(x, y);
            ctx.lineTo(x + arrowLen * Math.cos(angle), y + arrowLen * Math.sin(angle));
            
            // 箭头两翼
            ctx.moveTo(x + arrowLen * Math.cos(angle), y + arrowLen * Math.sin(angle));
            ctx.lineTo(
                x + arrowLen * Math.cos(angle - Math.PI/6),
                y + arrowLen * Math.sin(angle - Math.PI/6)
            );
            ctx.moveTo(x + arrowLen * Math.cos(angle), y + arrowLen * Math.sin(angle));
            ctx.lineTo(
                x + arrowLen * Math.cos(angle + Math.PI/6),
                y + arrowLen * Math.sin(angle + Math.PI/6)
            );
            
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 鼠标事件：视角控制
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if(isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                rotateY += dx * 0.01;
                rotateX += dy * 0.01;
                // 限制X轴旋转范围，避免视角翻转
                rotateX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotateX));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // 鼠标滚轮：缩放控制
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoom += e.deltaY * 0.001;
            // 限制缩放范围，避免过大或过小
            zoom = Math.max(0.5, Math.min(3, zoom));
        });

        // 进度滑块控制
        const progressSlider = document.getElementById('progressSlider');
        progressSlider.addEventListener('input', (e) => {
            // 手动更新动画进度
            transition = parseFloat(e.target.value);
        });

        // 暂停按钮事件
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '继续' : '暂停';
        });

        // 动画主循环
        function animate() {
            // 更新过渡参数（暂停时不更新）
            if(!isPaused) {
                transition += 0.005 * transitionDir;
                if (transition >= 1) {
                    transitionDir = -1;
                } else if (transition <= 0) {
                    transitionDir = 1;
                }
            }
            // 更新进度滑块的位置，同步当前动画进度
            progressSlider.value = transition;

            // 清屏
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制星空背景
            for(const star of stars) {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, 2 * Math.PI);
                ctx.fill();
            }

            // 绘制背景3D科技网格
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(100, 150, 255, 0.1)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            const gridXRange = 400;
            const gridYRange = 300;
            const gridZ = -200;
            // 绘制横线
            for(let y = -gridYRange; y <= gridYRange; y += gridSize) {
                let first = true;
                for(let x = -gridXRange; x <= gridXRange; x += gridSize) {
                    const [rx, ry, rz] = rotatePoint(x, y, gridZ);
                    const [px, py] = project(rx, ry, rz);
                    if(first) {
                        ctx.moveTo(px, py);
                        first = false;
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
            }
            // 绘制竖线
            for(let x = -gridXRange; x <= gridXRange; x += gridSize) {
                let first = true;
                for(let y = -gridYRange; y <= gridYRange; y += gridSize) {
                    const [rx, ry, rz] = rotatePoint(x, y, gridZ);
                    const [px, py] = project(rx, ry, rz);
                    if(first) {
                        ctx.moveTo(px, py);
                        first = false;
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
            }
            ctx.stroke();

            // 绘制网格节点，增加科技机械感
            ctx.fillStyle = 'rgba(100, 150, 255, 0.15)';
            for(let x = -gridXRange; x <= gridXRange; x += gridSize) {
                for(let y = -gridYRange; y <= gridYRange; y += gridSize) {
                    const [rx, ry, rz] = rotatePoint(x, y, gridZ);
                    const [px, py] = project(rx, ry, rz);
                    ctx.beginPath();
                    ctx.arc(px, py, 2, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }

            // 计算导线上的所有点
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const s = (i / segments) * wireLength;
                const theta = (s / wireLength) * 2 * Math.PI - Math.PI;
                
                // 线性插值：直导线 -> 环形
                const x = transition * loopRadius * Math.sin(theta) + (1 - transition) * (s - wireLength/2);
                const y = transition * loopRadius * Math.cos(theta) + (1 - transition) * 0;
                const z = 0;
                
                points.push([x, y, z]);
            }

            // 计算每个线段的切线方向
            const tangents = [];
            for (let i = 0; i < segments; i++) {
                const p1 = points[i];
                const p2 = points[i+1];
                const tx = p2[0] - p1[0];
                const ty = p2[1] - p1[1];
                const tz = p2[2] - p1[2];
                tangents.push(normalize([tx, ty, tz]));
            }

            // 绘制磁感线（每隔10个线段绘制一组，避免过多）
            for (let i = 0; i < segments; i += 15) {
                const p = points[i];
                const t = tangents[i];

                // 构建垂直于电流方向的平面基向量
                let aux;
                if (Math.abs(t[0]) < 0.9) {
                    aux = [1, 0, 0];
                } else {
                    aux = [0, 1, 0];
                }
                
                let u = normalize(cross(t, aux));
                let v = normalize(cross(t, u));

                // 绘制同心圆磁感线，仅保留2圈
                const radii = [20, 40];
                for (const r of radii) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#ff4466'; // 科技感红色磁感线
                    ctx.lineWidth = 1.5;
                    ctx.shadowBlur = 3;
                    ctx.shadowColor = '#ff4466';
                    
                    let first = true;
                    for (let phi = 0; phi <= 2 * Math.PI; phi += 0.1) {
                        // 计算圆上的3D点
                        const cx = p[0] + r * Math.cos(phi) * u[0] + r * Math.sin(phi) * v[0];
                        const cy = p[1] + r * Math.cos(phi) * u[1] + r * Math.sin(phi) * v[1];
                        const cz = p[2] + r * Math.cos(phi) * u[2] + r * Math.sin(phi) * v[2];
                        
                        // 先旋转点，再投影
                        const [rx, ry, rz] = rotatePoint(cx, cy, cz);
                        const [px, py] = project(rx, ry, rz);
                        
                        if (first) {
                            ctx.moveTo(px, py);
                            first = false;
                        } else {
                            ctx.lineTo(px, py);
                        }
                    }
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                }
            }

            // 绘制导线
            ctx.beginPath();
            let first = true;
            for (const p of points) {
                const [rx, ry, rz] = rotatePoint(p[0], p[1], p[2]);
                const [px, py] = project(rx, ry, rz);
                if (first) {
                    ctx.moveTo(px, py);
                    first = false;
                } else {
                    ctx.lineTo(px, py);
                }
            }
            
            // 银色金属光泽 + 科技感青色发光效果
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#b0b0c0');
            gradient.addColorStop(0.5, '#e8e8f0');
            gradient.addColorStop(1, '#b0b0c0');
            
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 8;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffff';
            ctx.stroke();
            ctx.shadowBlur = 0;


            requestAnimationFrame(animate);
        }

        // 启动动画
        animate();
    </script>

  <script>
  // 返回主页（滚动位置已在主页点击链接时保存）
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用开发者工具快捷键
  document.addEventListener('keydown', function(e) {
    // ESC返回主页 - 保存滚动位置
    if (e.keyCode === 27) {
      saveScrollAndReturn();
      return false;
    }
    // F12
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }
    // Ctrl+S
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
  
  // 禁用选择
  document.addEventListener('selectstart', function(e) {
    // 允许输入框选择
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      return true;
    }
    e.preventDefault();
    return false;
  });
  </script>
</body>
