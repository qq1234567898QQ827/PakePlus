    wires.push(new Wire(am,"right", rh,"topLeft"));
    wires.push(new Wire(rh,"bottomLeft", bat,"neg"));

  render();
}

// ========== 工具函数 ==========
function pointLineDist(px,py,x1,y1,x2,y2){
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  let t = len2===0 ? 0 : ((px-x1)*dx + (py-y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.sqrt((px-cx)**2 + (py-cy)**2);
}

class UnionFind{
  constructor(n){
    this.parent = new Array(n);
    for(let i=0;i<n;i++) this.parent[i] = i;
  }
  find(x){
    if(this.parent[x] !== x) this.parent[x] = this.find(this.parent[x]);
    return this.parent[x];
  }
  union(x,y){
    const rx = this.find(x), ry = this.find(y);
    if(rx !== ry) this.parent[rx] = ry;
  }
}

function gaussElimination(A, b){
  const n = A.length;
  if(n === 0) return [];
  const aug = A.map((row,i) => [...row, b[i]]);

  for(let i=0;i<n;i++){
    let maxRow = i;
    for(let k=i+1;k<n;k++){
      if(Math.abs(aug[k][i]) > Math.abs(aug[maxRow][i])) maxRow = k;
    }
    [aug[i], aug[maxRow]] = [aug[maxRow], aug[i]];

    if(Math.abs(aug[i][i]) < 1e-12) return new Array(n).fill(0);

    for(let k=i+1;k<n;k++){
      const factor = aug[k][i] / aug[i][i];
      for(let j=i;j<=n;j++){
        aug[k][j] -= factor * aug[i][j];
      }
    }
  }

  const x = new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){
    x[i] = aug[i][n];
    for(let j=i+1;j<n;j++) x[i] -= aug[i][j] * x[j];
    x[i] /= aug[i][i];
  }
  return x;
}

// ========== 核心：电路求解（导线合并节点 + 分连通分量独立求解） ==========
function solveCircuit(){
  // 1. 收集所有端子
  const terminals = [];
  const termIndex = new Map();
  elements.forEach(ele => {
    ele.terminals.forEach(t => {
      const key = ele.id + "_" + t.id;
      termIndex.set(key, terminals.length);
      terminals.push(key);
    });
  });
  const N = terminals.length;
  if(N < 2) return {current:{}, voltage:{}};

  // 2. 第一遍并查集：导线合并端子 -> 电路节点
  const ufWire = new UnionFind(N);
  wires.forEach(w => {
    const k1 = w.ele1.id + "_" + w.t1;
    const k2 = w.ele2.id + "_" + w.t2;
    const i1 = termIndex.get(k1);
    const i2 = termIndex.get(k2);
    if(i1 !== undefined && i2 !== undefined) ufWire.union(i1,i2);
  });

  // 生成电路节点列表
  const nodeRoots = new Set();
  for(let i=0;i<N;i++) nodeRoots.add(ufWire.find(i));
  const nodeList = Array.from(nodeRoots);
  const nodeId = new Map();
  nodeList.forEach((root, idx) => nodeId.set(root, idx));
  const nodeCount = nodeList.length;

  // 3. 收集所有支路（元件）
  const branches = [];
  elements.forEach(ele => {
    if(ele.type === "battery"){
      const n1 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_neg")));
      const n2 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_pos")));
      branches.push({n1, n2, R:1, Vs:ele.voltage, ele, type:"battery"});
    }
    else if(ele.type === "resistor"){
      const n1 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_a")));
      const n2 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_b")));
      branches.push({n1, n2, R:ele.resistance, Vs:0, ele, type:"resistor"});
    }
    else if(ele.type === "bulb"){
      const n1 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_a")));
      const n2 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_b")));
      const R = ele.burned ? 1e9 : ele._R;
      branches.push({n1, n2, R, Vs:0, ele, type:"bulb"});
    }
    else if(ele.type === "fixedBulb"){
      const n1 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_a")));
      const n2 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_b")));
      const R = ele.burned ? 1e9 : ele.resistance;
      branches.push({n1, n2, R, Vs:0, ele, type:"fixedBulb"});
    }
    else if(ele.type === "switch"){
      const n1 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_a")));
      const n2 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_b")));
      const R = ele.closed ? 0.001 : 1e9;
      branches.push({n1, n2, R, Vs:0, ele, type:"switch"});
    }
    else if(ele.type === "ammeter"){
      const n1 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_left")));
      const n2 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_right")));
      branches.push({n1, n2, R:0.001, Vs:0, ele, type:"ammeter"});
    }
    else if(ele.type === "voltmeter"){
      const n1 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_left")));
      const n2 = nodeId.get(ufWire.find(termIndex.get(ele.id+"_right")));
      branches.push({n1, n2, R:1e5, Vs:0, ele, type:"voltmeter"});
    }
    else if(ele.type === "rheostat"){
      const tl = nodeId.get(ufWire.find(termIndex.get(ele.id+"_topLeft")));
      const tr = nodeId.get(ufWire.find(termIndex.get(ele.id+"_topRight")));
      const bl = nodeId.get(ufWire.find(termIndex.get(ele.id+"_bottomLeft")));
      const br = nodeId.get(ufWire.find(termIndex.get(ele.id+"_bottomRight")));
      branches.push({n1:tl, n2:tr, R:0.001, Vs:0, ele, type:"rh_top"});
      branches.push({n1:bl, n2:br, R:ele.maxR, Vs:0, ele, type:"rh_bottom"});
      branches.push({n1:tl, n2:bl, R:Math.max(ele.maxR*ele.slide, 0.001), Vs:0, ele, type:"rh_left"});
      branches.push({n1:tl, n2:br, R:Math.max(ele.maxR*(1-ele.slide), 0.001), Vs:0, ele, type:"rh_right"});
    }
  });

  // 4. 第二遍并查集：支路连接电路节点 -> 连通分量
  const ufComp = new UnionFind(nodeCount);
  branches.forEach(b => {
    if(b.n1 !== undefined && b.n2 !== undefined) ufComp.union(b.n1, b.n2);
  });

  // 5. 按连通分量分组
  const compMap = new Map();
  for(let i=0;i<nodeCount;i++){
    const root = ufComp.find(i);
    if(!compMap.has(root)) compMap.set(root, []);
    compMap.get(root).push(i);
  }

  // 6. 初始化非线性灯泡
  const bulbs = elements.filter(e=>e.type==="bulb" && !e.burned);
  bulbs.forEach(b => { b._R = 5; });

  // 7. 非线性迭代求解
  for(let iter=0; iter<20; iter++){
    const nodeVoltage = new Array(nodeCount).fill(0);

    // 每个连通分量单独建立方程求解
    for(const [root, nodes] of compMap){
      const m = nodes.length;
      if(m < 2) continue;

      // 全局节点索引 -> 局部索引
      const localIdx = new Map();
      nodes.forEach((globalIdx, localIdx_) => localIdx.set(globalIdx, localIdx_));

      const size = m - 1; // 0号节点为参考地
      if(size <= 0) continue;

      const G = Array.from({length:size}, ()=>new Array(size).fill(0));
      const I = new Array(size).fill(0);

      // 装入本分量所有支路
      branches.forEach(b => {
        if(b.n1 === undefined || b.n2 === undefined) return;
        if(ufComp.find(b.n1) !== root) return;

        const l1 = localIdx.get(b.n1);
        const l2 = localIdx.get(b.n2);
        if(l1 === l2) return;

        const g = 1 / b.R;

        if(l1 !== 0){
          G[l1-1][l1-1] += g;
          if(l2 !== 0) G[l1-1][l2-1] -= g;
          if(b.Vs !== 0) I[l1-1] -= b.Vs * g;
        }
        if(l2 !== 0){
          G[l2-1][l2-1] += g;
          if(l1 !== 0) G[l2-1][l1-1] -= g;
          if(b.Vs !== 0) I[l2-1] += b.Vs * g;
        }
      });

      // 求解本分量
      const V = gaussElimination(G, I);

      // 写回全局电压
      nodes.forEach((globalIdx, localIdx_) => {
        if(localIdx_ === 0) nodeVoltage[globalIdx] = 0;
        else nodeVoltage[globalIdx] = V[localIdx_ - 1];
      });
    }

    // 取元件两端电压
    function getVoltage(ele, t1, t2){
      const i1 = termIndex.get(ele.id+"_"+t1);
      const i2 = termIndex.get(ele.id+"_"+t2);
      if(i1===undefined || i2===undefined) return 0;
      const n1 = nodeId.get(ufWire.find(i1));
      const n2 = nodeId.get(ufWire.find(i2));
      return nodeVoltage[n2] - nodeVoltage[n1];
    }

    // 更新非线性灯泡电阻
    let maxDelta = 0;
    bulbs.forEach(b => {
      const u = Math.abs(getVoltage(b, "a", "b"));
      const newR = 3 + 0.8 * u * u;
      maxDelta = Math.max(maxDelta, Math.abs(newR - b._R));
      b._R = newR;

      // 更新对应支路电阻
      const br = branches.find(x => x.ele===b && x.type==="bulb");
      if(br) br.R = newR;
    });

    // 收敛则计算最终结果
    if(maxDelta < 0.001 || iter === 19){
      const current = {}, voltage = {};

      elements.forEach(ele => {
        const k = ele.id;
        if(ele.type === "battery"){
          const v = getVoltage(ele, "neg", "pos");
          voltage[k] = v;
          current[k] = Math.max(0, (ele.voltage - v) / 1);
        }
        else if(ele.type==="resistor" || ele.type==="bulb" || ele.type==="fixedBulb"){
          const v = Math.abs(getVoltage(ele, "a", "b"));
          let R;
          if(ele.type==="resistor") R = ele.resistance;
          else if(ele.type==="bulb") R = ele.burned ? 1e9 : ele._R;
          else R = ele.burned ? 1e9 : ele.resistance;
          voltage[k] = v;
          current[k] = v / R;
        }
        else if(ele.type === "switch"){
          const v = Math.abs(getVoltage(ele, "a", "b"));
          voltage[k] = v;
          current[k] = ele.closed ? v / 0.001 : 0;
        }
        else if(ele.type === "ammeter"){
          const v = Math.abs(getVoltage(ele, "left", "right"));
          voltage[k] = v;
          current[k] = v / 0.001;
        }
        else if(ele.type === "voltmeter"){
          const v = Math.abs(getVoltage(ele, "left", "right"));
          voltage[k] = v;
          current[k] = v / 1e5;
        }
        else if(ele.type === "rheostat"){
          const v = Math.abs(getVoltage(ele, "topLeft", "bottomLeft"));
          voltage[k] = v;
          current[k] = v / Math.max(ele.maxR * ele.slide, 0.001);
        }
        else{
          current[k] = 0;
          voltage[k] = 0;
        }
      });

      // 过压烧毁判定
      elements.forEach(ele => {
        if((ele.type==="bulb" || ele.type==="fixedBulb") && !ele.burned){
          if(voltage[ele.id] > ele.ratedV * 1.5) ele.burned = true;
        }
      });

      return {current, voltage};
    }
  }
  return {current:{}, voltage:{}};
}

// ========== 元件基类 ==========
class Element{
  constructor(x,y){
    this.x = x;
    this.y = y;
    this.terminals = [];
    this.id = Math.random().toString(36).slice(2,12);
    this.type = "";
  }
  draw(){}
  hitTest(px,py){return false;}
  getTerminal(px,py){
    for(const t of this.terminals){
      const dx = px - (this.x + t.x);
      const dy = py - (this.y + t.y);
      if(Math.sqrt(dx*dx + dy*dy) < SNAP_DIST) return t;
    }
    return null;
  }
  getTerminalPos(tid){
    const t = this.terminals.find(x=>x.id === tid);
    if(!t) return {x:this.x, y:this.y};
    return {x: this.x + t.x, y: this.y + t.y};
  }
}

// ========== 各类元件定义 ==========
class Battery extends Element{
  constructor(x,y){
    super(x,y);
    this.type = "battery";
    this.voltage = 3;
    this.terminals = [
      {x:-40, y:0, id:"neg"},
      {x:40, y:0, id:"pos"}
    ];
  }
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = "#fef3c7";
    ctx.strokeStyle = "#92400e";
    ctx.lineWidth = 2;
    ctx.fillRect(-35,-20,70,40);
    ctx.strokeRect(-35,-20,70,40);
    ctx.fillStyle = "#92400e";
    ctx.fillRect(35,-8,6,16);
    ctx.fillStyle = "#1f2937";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("+", 20, 0);
    ctx.fillText("−", -20, 0);
    ctx.font = "12px Arial";
    ctx.fillStyle = "#6b7280";

    const brightness = this.burned ? 0 : Math.min(1, curr/0.3);

    ctx.save();

    // 发光效果
    if(brightness > 0.01){
      const grad = ctx.createRadialGradient(0,0,5, 0,0, 35+brightness*25);

    ctx.lineTo(-4,8);
    ctx.lineTo(0,-5);
    ctx.lineTo(4,8);

      ctx.fill();

// ========== 导线类 ==========
class Wire{
  constructor(ele1, t1, ele2, t2){
    this.ele1 = ele1;
    this.t1 = t1;
    this.ele2 = ele2;
    this.t2 = t2;
  }
  draw(){
    const p1 = this.ele1.getTerminalPos(this.t1);
    const p2 = this.ele2.getTerminalPos(this.t2);
    ctx.strokeStyle = deleteMode ? "#f87171" : "#dc2626";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
}

// ========== 拾取函数 ==========
function getWireAt(px,py){
  for(let i=wires.length-1; i>=0; i--){
    const w = wires[i];
    const p1 = w.ele1.getTerminalPos(w.t1);
    const p2 = w.ele2.getTerminalPos(w.t2);
    if(pointLineDist(px,py, p1.x,p1.y, p2.x,p2.y) < 6) return w;
  }
  return null;
}

function getElementAt(px,py){
  for(let i=elements.length-1; i>=0; i--){
    if(elements[i].hitTest(px,py)) return elements[i];
  }
  return null;
}

function getTerminalAt(px,py){
  for(const e of elements){
    const t = e.getTerminal(px,py);
    if(t) return {ele:e, terminal:t};
  }
  return null;
}

function getNearTerminal(px,py){
  let best = null;
  let minD = SNAP_DIST;
  for(const e of elements){
    for(const t of e.terminals){
      const p = e.getTerminalPos(t.id);
      const d = Math.sqrt((px-p.x)**2 + (py-p.y)**2);
      if(wiringMode && e.id === wireStart.ele.id && t.id === wireStart.terminal.id) continue;
      if(d < minD){ minD = d; best = {ele:e, terminal:t}; }
    }
  }
  return best;
}

// ========== U-I 图像 ==========
function drawUIGraph(){
  const am = elements.find(e=>e.type==="ammeter");
  const vm = elements.find(e=>e.type==="voltmeter");
  if(!am || !vm) return;

  const I = solution.current[am.id] || 0;
  const U = solution.voltage[vm.id] || 0;

  // 记录数据点
  if(I > 0.001 && U > 0.001){
    const last = uiPoints[uiPoints.length-1];
    if(!last || Math.abs(last.I-I) > 0.003 || Math.abs(last.U-U) > 0.01){
      uiPoints.push({I,U});
    }
  }

  const gx = canvas.width - 230;
  const gy = 20;
  const gw = 210, gh = 190;
  const pad = 38;

  ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.strokeStyle = "#94a3b8";
  ctx.lineWidth = 1;
  ctx.fillRect(gx,gy,gw,gh);
  ctx.strokeRect(gx,gy,gw,gh);

  ctx.fillStyle = "#1e293b";
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "center";
  ctx.fillText("伏安特性 U-I", gx+gw/2, gy+18);

  const ax = gx + pad;
  const ay = gy + gh - pad;
  const aw = gw - pad*2;
  const ah = gh - pad*2;

  ctx.strokeStyle = "#334155";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(ax, ay+5);
  ctx.lineTo(ax, ay-ah);
  ctx.moveTo(ax-5, ay);
  ctx.lineTo(ax+aw, ay);
  ctx.stroke();

  ctx.fillStyle = "#475569";
  ctx.font = "11px Arial";
  ctx.textAlign = "center";
  ctx.fillText("I / A", ax+aw/2, ay+18);
  ctx.save();
  ctx.translate(ax-24, ay-ah/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText("U / V", 0, 0);
  ctx.restore();

  const Imax = 0.6, Umax = 3;

  ctx.strokeStyle = "#e2e8f0";
  ctx.lineWidth = 1;
  for(let i=1; i<=5; i++){
    const uy = ay - (i*0.5/Umax)*ah;
    ctx.beginPath();
    ctx.moveTo(ax, uy);
    ctx.lineTo(ax+aw, uy);
    ctx.stroke();
  }

  ctx.fillStyle = "#64748b";
  ctx.font = "10px Arial";
  ctx.textAlign = "center";
  for(let i=0; i<=6; i++){
    const iv = i*0.1;
    const ix = ax + (iv/Imax)*aw;
    ctx.beginPath();
    ctx.moveTo(ix, ay);
    ctx.lineTo(ix, ay+3);
    ctx.stroke();
    if(i%2 === 0) ctx.fillText(iv.toFixed(1), ix, ay+14);
  }
  ctx.textAlign = "right";
  for(let i=0; i<=6; i++){
    const uv = i*0.5;
    const uy = ay - (uv/Umax)*ah;
    ctx.beginPath();
    ctx.moveTo(ax, uy);
    ctx.lineTo(ax-3, uy);
    ctx.stroke();
    if(i%2 === 0) ctx.fillText(uv.toFixed(1), ax-6, uy+3);
  }

  // 平滑曲线
  if(uiPoints.length >= 2){
    ctx.strokeStyle = "#2563eb";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const pts = uiPoints.slice().sort((a,b) => a.I - b.I);
    ctx.moveTo(ax + (pts[0].I/Imax)*aw, ay - (pts[0].U/Umax)*ah);
    for(let i=0; i<pts.length-1; i++){
      const xc = (ax + (pts[i].I/Imax)*aw + ax + (pts[i+1].I/Imax)*aw) / 2;
      const yc = (ay - (pts[i].U/Umax)*ah + ay - (pts[i+1].U/Umax)*ah) / 2;
      ctx.quadraticCurveTo(
        ax + (pts[i].I/Imax)*aw, ay - (pts[i].U/Umax)*ah,
        xc, yc
      );
    }
    const last = pts[pts.length-1];
    ctx.lineTo(ax + (last.I/Imax)*aw, ay - (last.U/Umax)*ah);
    ctx.stroke();
  }

  // 历史点
  uiPoints.forEach(p => {
    const px = ax + Math.min(p.I/Imax,1)*aw;
    const py = ay - Math.min(p.U/Umax,1)*ah;
    ctx.fillStyle = "#93c5fd";
    ctx.beginPath();
    ctx.arc(px, py, 2.5, 0, Math.PI*2);
    ctx.fill();
  });

  // 当前点
  const px = ax + Math.min(I/Imax,1)*aw;
  const py = ay - Math.min(U/Umax,1)*ah;
  ctx.fillStyle = "#dc2626";
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#dc2626";
  ctx.font = "bold 11px Arial";
  ctx.textAlign = "left";
  ctx.fillText("I="+I.toFixed(3)+"A", ax+5, ay-ah+5);
  ctx.fillText("U="+U.toFixed(2)+"V", ax+5, ay-ah+20);
}

// ========== 鼠标事件 ==========
function onMouseDown(e){
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if(deleteMode){
    const w = getWireAt(x,y);
    if(w){
      wires = wires.filter(item => item !== w);
      uiPoints = [];
      render();
      return;
    }
    const ele = getElementAt(x,y);
    if(ele){
      wires = wires.filter(w => w.ele1.id !== ele.id && w.ele2.id !== ele.id);
      elements = elements.filter(item => item !== ele);
      uiPoints = [];
      render();
    }
    return;
  }

  // 接线模式
  const term = getTerminalAt(x,y);
  if(term){
    if(!wiringMode){
      wiringMode = true;
      wireStart = term;
    }else{
      const near = getNearTerminal(x,y);
      if(near && near.ele.id !== wireStart.ele.id){
        const exist = wires.some(w =>
          (w.ele1.id===wireStart.ele.id && w.t1===wireStart.terminal.id && w.ele2.id===near.ele.id && w.t2===near.terminal.id) ||
          (w.ele1.id===near.ele.id && w.t1===near.terminal.id && w.ele2.id===wireStart.ele.id && w.t2===wireStart.terminal.id)
        );
        if(!exist){
          wires.push(new Wire(wireStart.ele, wireStart.terminal.id, near.ele, near.terminal.id));
          uiPoints = [];
        }
      }
      wiringMode = false;
      wireStart = null;
    }
    render();
    return;
  }

  // 滑动变阻器滑片
  const ele = getElementAt(x,y);
  if(ele && ele.type === "rheostat" && ele.hitSlider(x,y)){
    sliding = true;
    slideTarget = ele;
    ele.slide = Math.max(0, Math.min(1, (x - ele.x + 60)/120));
    uiPoints = [];
    render();
    return;
  }

  // 拖拽元件
  if(ele){
    dragging = true;
    dragTarget = ele;
    dragOffset.x = x - ele.x;
    dragOffset.y = y - ele.y;
    const idx = elements.indexOf(ele);
    elements.splice(idx, 1);
    elements.push(ele);
  }
}

function onMouseMove(e){
  const rect = canvas.getBoundingClientRect();
  mousePos.x = e.clientX - rect.left;
  mousePos.y = e.clientY - rect.top;

  if(sliding && slideTarget){
    slideTarget.slide = Math.max(0, Math.min(1, (mousePos.x - slideTarget.x + 60)/120));
  }else if(dragging && dragTarget){
    dragTarget.x = mousePos.x - dragOffset.x;
    dragTarget.y = mousePos.y - dragOffset.y;
  }
  render();
}

function onMouseUp(){
  dragging = false;
  dragTarget = null;
  sliding = false;
  slideTarget = null;
}

function onDoubleClick(e){
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const ele = getElementAt(x,y);
  if(ele && ele.type === "switch"){
    ele.toggle();
    uiPoints = [];
    render();
    return;
  }
  if(wiringMode){
    wiringMode = false;
    wireStart = null;
    render();
  }
}

// ========== 主渲染 ==========
function render(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  solution = solveCircuit();

  // 画导线
  for(const w of wires) w.draw();

  // 接线预览
  if(wiringMode && wireStart){
    const p1 = wireStart.ele.getTerminalPos(wireStart.terminal.id);
    const near = getNearTerminal(mousePos.x, mousePos.y);
    ctx.strokeStyle = "#3b82f6";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    if(near){
      const p2 = near.ele.getTerminalPos(near.terminal.id);
      ctx.lineTo(p2.x, p2.y);
    }else{
      ctx.lineTo(mousePos.x, mousePos.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    if(near){
      const p2 = near.ele.getTerminalPos(near.terminal.id);
      ctx.strokeStyle = "#10b981";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p2.x, p2.y, SNAP_DIST, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  // 画元件
  for(const e of elements) e.draw();

  // U-I 图像
  drawUIGraph();

  // 底部操作说明
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fillRect(0, canvas.height - 36, canvas.width, 36);
  ctx.fillStyle = "#334155";
  ctx.font = "13px Microsoft YaHei";
  ctx.textAlign = "center";
  ctx.fillText("操作说明：按住左键拖拽移动元件 | 双击开关切换通断 | 按住滑片左右拖动调节电阻 | 点击接线柱连接导线", canvas.width/2, canvas.height - 14);

  info.textContent = "元件: " + elements.length + " | 导线: " + wires.length;
}
</script>

  <script>
  // 返回主页（滚动位置已在主页点击链接时保存）
  function saveScrollAndReturn() {
    window.location.href = '../index.html';
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用开发者工具快捷键
  document.addEventListener('keydown', function(e) {
    // ESC返回主页 - 保存滚动位置
    if (e.keyCode === 27) {
      saveScrollAndReturn();
      return false;
    }
    // F12
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }
    // Ctrl+S
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
  
  // 禁用选择
  document.addEventListener('selectstart', function(e) {
    // 允许输入框选择
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      return true;
    }
    e.preventDefault();
    return false;
  });
  </script>
