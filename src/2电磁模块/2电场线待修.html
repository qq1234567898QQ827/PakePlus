<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两个点电荷 - 3D电场线 (精简版)</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.94);
            --text: #e6edf3;
            --text-secondary: #8b949e;
            --positive: #ff3b3b;
            --positive-glow: #ff6b6b;
            --negative: #4d7cff;
            --negative-glow: #7b9fff;
            --slider-track: #30363d;
            --border: #30363d;
            --accent: #58a6ff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            touch-action: pan-x pan-y pinch-zoom;
        }

        #canvas-container { position: fixed; inset: 0; z-index: 1; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        #hint {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            pointer-events: none;
        }

        #panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 22px 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            min-width: 260px;
            max-width: 320px;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        #panel.collapsed { transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }

        #panel-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 21;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            transition: all 0.25s ease;
            opacity: 0;
            pointer-events: none;
        }
        #panel-toggle.visible { opacity: 1; pointer-events: auto; }

        .charge-control {
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            transition: border-color 0.3s;
        }
        .charge-control:hover { border-color: rgba(255,255,255,0.12); }

        .charge-control .header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .charge-control .label { color: var(--text); font-size: 13px; display: flex; align-items: center; gap: 7px; }

        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot.positive { background: var(--positive); box-shadow: 0 0 10px var(--positive-glow); }
        .dot.negative { background: var(--negative); box-shadow: 0 0 10px var(--negative-glow); }
        .dot.neutral { background: #666; }

        .value-display { color: var(--text-secondary); font-size: 12px; font-family: monospace; }
        .value-display.positive-val { color: #ff7b7b !important; }
        .value-display.negative-val { color: #8aadff !important; }

        input[type="range"] { -webkit-appearance: none; flex: 1; height: 6px; background: var(--slider-track); outline: none; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.35); transition: all 0.2s;
        }
        #slider-q1::-webkit-slider-thumb { background: var(--positive); }
        #slider-q2::-webkit-slider-thumb { background: var(--negative); }

        .preset-btn {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .preset-btn:hover { background: rgba(255,255,255,0.1); }
    </style>
<style>

<body>

    <!-- 齐老师动画 - 顶部导航 -->
    <div class="qilaoshi-header">
        <div class="qilaoshi-title">齐老师动画</div>
    </div>
    <button class="qilaoshi-back-btn" onclick="window.location.href='../index.html'">← 返回主页</button>

    <div id="canvas-container"></div>

    <div id="panel">
        <h3 style="color:var(--text);margin-bottom:16px;">⚡ 电荷控制</h3>
        <div class="charge-control">
            <div class="header">
                <span class="label"><span class="dot positive" id="dot-q1"></span> 电荷 1</span>
                <span class="value-display" id="val-q1">+3.0</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="color:#ff7b7b;font-size:11px;">−</span>
                <input type="range" id="slider-q1" min="-5" max="5" step="0.1" value="3">
                <span style="color:#ff7b7b;font-size:11px;">+</span>
            </div>
        </div>
        <div class="charge-control">
            <div class="header">
                <span class="label"><span class="dot negative" id="dot-q2"></span> 电荷 2</span>
                <span class="value-display" id="val-q2">−2.0</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="color:#8aadff;font-size:11px;">−</span>
                <input type="range" id="slider-q2" min="-5" max="5" step="0.1" value="-2">
                <span style="color:#8aadff;font-size:11px;">+</span>
            </div>
        </div>
        <button class="preset-btn" id="dipoleBtn">电偶极子 (v1=+3, v2=-2)</button>
    </div>

    <button id="panel-toggle" title="显示/隐藏面板">⚙</button>
    <div id="hint">🖱 拖拽旋转 | 滚轮缩放 | 右键平移 | 右侧面板调节电荷</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // DOM 元素
        const container = document.getElementById('canvas-container');
        const panel = document.getElementById('panel');
        const panelToggle = document.getElementById('panel-toggle');
        const hintEl = document.getElementById('hint');
        const sliderQ1 = document.getElementById('slider-q1');
        const sliderQ2 = document.getElementById('slider-q2');
        const valQ1 = document.getElementById('val-q1');
        const valQ2 = document.getElementById('val-q2');
        const dotQ1 = document.getElementById('dot-q1');
        const dotQ2 = document.getElementById('dot-q2');
        const dipoleBtn = document.getElementById('dipoleBtn');

        // 场景初始化
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0d1117');
        scene.fog = new THREE.Fog('#0d1117', 20, 50);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.5, 60);
        camera.position.set(7, 4.5, 9);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.minDistance = 2.5;
        controls.maxDistance = 25;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.25;
        controls.update();

        // 提示隐藏逻辑
        controls.addEventListener('start', () => { hintEl.style.opacity = '0'; });
        controls.addEventListener('end', () => { setTimeout(() => { hintEl.style.opacity = '1'; }, 2000); });

        // 光照
        scene.add(new THREE.AmbientLight('#bcc8e0', 1.6));
        const sunLight = new THREE.DirectionalLight('#ffffff', 3.5);
        sunLight.position.set(10, 14, 8);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // 网格
        scene.add(new THREE.GridHelper(16, 28, '#2a3040', '#1a2030'));

        // 电荷模型
        const chargeGroup1 = new THREE.Group();
        const chargeGroup2 = new THREE.Group();
        scene.add(chargeGroup1);
        scene.add(chargeGroup2);

        const sphereMat1 = new THREE.MeshStandardMaterial({ color: '#ff2020', emissive: '#ff0000', emissiveIntensity: 0.7, roughness: 0.22 });
        const sphere1 = new THREE.Mesh(new THREE.SphereGeometry(0.32, 48, 48), sphereMat1);
        sphere1.castShadow = true; sphere1.receiveShadow = true;
        chargeGroup1.add(sphere1);
        const glowMat1 = new THREE.MeshBasicMaterial({ color: '#ff4444', transparent: true, opacity: 0.25, depthWrite: false });
        const glow1 = new THREE.Mesh(new THREE.SphereGeometry(0.46, 32, 32), glowMat1);
        chargeGroup1.add(glow1);

        const sphereMat2 = new THREE.MeshStandardMaterial({ color: '#2040ff', emissive: '#0020ff', emissiveIntensity: 0.7, roughness: 0.22 });
        const sphere2 = new THREE.Mesh(new THREE.SphereGeometry(0.32, 48, 48), sphereMat2);
        sphere2.castShadow = true; sphere2.receiveShadow = true;
        chargeGroup2.add(sphere2);
        const glowMat2 = new THREE.MeshBasicMaterial({ color: '#4466ff', transparent: true, opacity: 0.25, depthWrite: false });
        const glow2 = new THREE.Mesh(new THREE.SphereGeometry(0.46, 32, 32), glowMat2);
        chargeGroup2.add(glow2);

        const chargePos1 = new THREE.Vector3(-2.5, 0, 0);
        const chargePos2 = new THREE.Vector3(2.5, 0, 0);
        chargeGroup1.position.copy(chargePos1);
        chargeGroup2.position.copy(chargePos2);

        // 电场线和箭头容器
        const fieldLinesGroup = new THREE.Group();
        const arrowsGroup = new THREE.Group();
        scene.add(fieldLinesGroup);
        scene.add(arrowsGroup);

        // 物理参数
        const K = 1.0;
        const CHARGE_RADIUS = 0.35;
        const TERMINATION_RADIUS = 0.42;
        const STEP_SIZE = 0.06;
        const MAX_STEPS = 420;
        const MAX_DIST = 13;
        const FAR_SPHERE_RADIUS = 9.8;

        // 电场计算
        function electricField(pos, q1, q2) {
            const r1 = new THREE.Vector3().subVectors(pos, chargePos1);
            const r2 = new THREE.Vector3().subVectors(pos, chargePos2);
            const d1 = Math.max(r1.length(), 0.15);
            const d2 = Math.max(r2.length(), 0.15);
            const E = new THREE.Vector3();
            if (Math.abs(q1) > 1e-5) E.addScaledVector(r1, K * q1 / (d1 * d1 * d1));
            if (Math.abs(q2) > 1e-5) E.addScaledVector(r2, K * q2 / (d2 * d2 * d2));
            return E;
        }

        // 斐波那契球面采样
        function fibonacciSpherePoints(n, radius) {
            const pts = [];
            const phi = Math.PI * (3.0 - Math.sqrt(5.0));
            for (let i = 0; i < n; i++) {
                const y = 1.0 - (2.0 * i + 1.0) / n;
                const r = Math.sqrt(1.0 - y * y);
                const theta = phi * i;
                pts.push(new THREE.Vector3(Math.cos(theta) * r * radius, y * radius, Math.sin(theta) * r * radius));
            }
            return pts;
        }

        // 追踪一条电场线
        function traceFieldLine(startPos, q1, q2, forward, ignoreCharge = null) {
            const points = [startPos.clone()];
            let pos = startPos.clone();
            let steps = 0;
            while (steps < MAX_STEPS) {
                const E = electricField(pos, q1, q2);
                const len = E.length();
                if (len < 1e-7) break;
                const dir = E.normalize();
                if (!forward) dir.negate();
                pos.addScaledVector(dir, STEP_SIZE);
                points.push(pos.clone());
                steps++;
                const d1 = pos.distanceTo(chargePos1);
                const d2 = pos.distanceTo(chargePos2);
                if (ignoreCharge !== 1 && Math.abs(q1) > 0.05 && d1 < TERMINATION_RADIUS) break;
                if (ignoreCharge !== 2 && Math.abs(q2) > 0.05 && d2 < TERMINATION_RADIUS) break;
                if (pos.length() > MAX_DIST) break;
            }
            // 末端贴合电荷表面
            if (points.length > 1) {
                const last = points[points.length-1];
                const prev = points[points.length-2];
                let target = null;
                if (ignoreCharge !== 1 && Math.abs(q1) > 0.05 && last.distanceTo(chargePos1) < TERMINATION_RADIUS) target = chargePos1;
                if (ignoreCharge !== 2 && Math.abs(q2) > 0.05 && last.distanceTo(chargePos2) < TERMINATION_RADIUS) target = chargePos2;
                if (target) {
                    const dirTo = new THREE.Vector3().subVectors(target, prev).normalize();
                    points[points.length-1] = target.clone().addScaledVector(dirTo, -0.33);
                }
            }
            return points;
        }

        // 生成所有电场线
        function generateFieldLines(q1, q2) {
            const lines = [];
            const hasPos = q1 > 0.05 || q2 > 0.05;
            const hasNeg = q1 < -0.05 || q2 < -0.05;
            const isMixed = (q1 > 0.05 && q2 < -0.05) || (q1 < -0.05 && q2 > 0.05);
            const equalOpposite = isMixed && Math.abs(Math.abs(q1) - Math.abs(q2)) < 0.1;
            const samePositive = q1 > 0.05 && q2 > 0.05;
            const sameNegative = q1 < -0.05 && q2 < -0.05;

            const posSample = equalOpposite ? 35 : (isMixed ? 30 : 45);
            const farSample = equalOpposite ? 15 : (isMixed ? 30 : 45);
            const posColor = isMixed ? new THREE.Color('#ffd700') : new THREE.Color('#ff5555');
            const negColor = isMixed ? new THREE.Color('#ffd700') : new THREE.Color('#5588ff');

            // 同号正：左侧生成并镜像
            if (samePositive) {
                const dirs = fibonacciSpherePoints(posSample, 1.0);
                for (const dir of dirs) {
                    const start = chargePos1.clone().addScaledVector(dir, CHARGE_RADIUS);
                    const pts = traceFieldLine(start, q1, q2, true, 1);
                    if (pts.length > 2) {
                        lines.push({ points: pts, color: posColor.clone() });
                        const mirrored = pts.map(p => new THREE.Vector3(-p.x, p.y, p.z));
                        lines.push({ points: mirrored, color: posColor.clone() });
                    }
                }
            }
            // 同号负：左侧汇聚并镜像
            else if (sameNegative) {
                const farPoints = fibonacciSpherePoints(farSample, FAR_SPHERE_RADIUS);
                for (const fp of farPoints) {
                    if (fp.distanceTo(chargePos1) < CHARGE_RADIUS + 0.8) continue;
                    const pts = traceFieldLine(fp, q1, q2, true, null);
                    if (pts.length < 3) continue;
                    const last = pts[pts.length-1];
                    if (q1 < -0.05 && last.distanceTo(chargePos1) < TERMINATION_RADIUS + 0.2) {
                        lines.push({ points: pts, color: negColor.clone() });
                        const mirrored = pts.map(p => new THREE.Vector3(-p.x, p.y, p.z));
                        lines.push({ points: mirrored, color: negColor.clone() });
                    }
                }
            }
            // 混合电荷
            else {
                if (hasPos) {
                    const posCharges = [];
                    if (q1 > 0.05) posCharges.push({ pos: chargePos1, chargeId: 1 });
                    if (q2 > 0.05) posCharges.push({ pos: chargePos2, chargeId: 2 });
                    for (const pc of posCharges) {
                        const dirs = fibonacciSpherePoints(posSample, 1.0);
                        for (const dir of dirs) {
                            const start = pc.pos.clone().addScaledVector(dir, CHARGE_RADIUS);
                            const pts = traceFieldLine(start, q1, q2, true, pc.chargeId);
                            if (pts.length > 2) lines.push({ points: pts, color: posColor.clone() });
                        }
                    }
                }
                if (hasNeg) {
                    const farPoints = fibonacciSpherePoints(farSample, FAR_SPHERE_RADIUS);
                    for (const fp of farPoints) {
                        const d1 = fp.distanceTo(chargePos1);
                        const d2 = fp.distanceTo(chargePos2);
                        if (d1 < CHARGE_RADIUS + 0.8 || d2 < CHARGE_RADIUS + 0.8) continue;
                        const pts = traceFieldLine(fp, q1, q2, true, null);
                        if (pts.length < 3) continue;
                        const last = pts[pts.length-1];
                        const endNeg = (q1 < -0.05 && last.distanceTo(chargePos1) < TERMINATION_RADIUS + 0.2) ||
                                       (q2 < -0.05 && last.distanceTo(chargePos2) < TERMINATION_RADIUS + 0.2);
                        if (endNeg) lines.push({ points: pts, color: negColor.clone() });
                    }
                }
            }
            return lines;
        }

        // 清除所有电场线和箭头
        function clearFieldLines() {
            while (fieldLinesGroup.children.length > 0) {
                const child = fieldLinesGroup.children[0];
                child.geometry?.dispose();
                child.material?.dispose();
                fieldLinesGroup.remove(child);
            }
            while (arrowsGroup.children.length > 0) {
                const child = arrowsGroup.children[0];
                child.geometry?.dispose();
                child.material?.dispose();
                arrowsGroup.remove(child);
            }
        }

        // 创建箭头模型
        function createArrowMesh(color) {
            const geo = new THREE.ConeGeometry(0.08, 0.25, 6, 8);
            const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5 });
            return new THREE.Mesh(geo, mat);
        }

        // 渲染电场线及箭头
        function renderFieldLines(q1, q2) {
            clearFieldLines();
            if (Math.abs(q1) < 0.05 && Math.abs(q2) < 0.05) return;

            const allLines = generateFieldLines(q1, q2);
            const groups = {};
            for (const line of allLines) {
                const hex = line.color.getHexString();
                if (!groups[hex]) groups[hex] = { color: line.color, lines: [] };
                groups[hex].lines.push(line.points);
            }

            for (const key in groups) {
                const group = groups[key];
                const vertices = [];
                const indices = [];
                let vCount = 0;

                for (const pts of group.lines) {
                    if (pts.length < 2) continue;
                    const startIdx = vCount;
                    for (const p of pts) {
                        vertices.push(p.x, p.y, p.z);
                        vCount++;
                    }
                    for (let i = 0; i < pts.length - 1; i++) {
                        indices.push(startIdx + i, startIdx + i + 1);
                    }

                    // 每根线一个箭头 (1/3处)
                    if (pts.length >= 3) {
                        const idx = Math.floor(pts.length / 3);
                        const p1 = pts[idx];
                        const p2 = pts[Math.min(idx + 1, pts.length - 1)];
                        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
                        const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                        if (dir.length() > 0.001) {
                            const arrow = createArrowMesh(group.color);
                            arrow.position.copy(mid);
                            const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                            arrow.setRotationFromQuaternion(quat);
                            arrowsGroup.add(arrow);
                        }
                    }
                }

                if (vertices.length < 6) continue;
                const geom = new THREE.BufferGeometry();
                geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geom.setIndex(indices);
                const mat = new THREE.LineBasicMaterial({ color: group.color, linewidth: 1, transparent: true, opacity: 0.85, depthTest: true });
                fieldLinesGroup.add(new THREE.LineSegments(geom, mat));
            }
        }

        // 更新电荷外观
        function updateChargeVisuals(q1, q2) {
            const update = (group, sphereMat, glowMat, q, dot) => {
                const abs = Math.abs(q);
                if (abs < 0.05) {
                    group.visible = false;
                    dot.className = 'dot neutral';
                } else {
                    group.visible = true;
                    group.scale.setScalar(0.7 + 0.18 * Math.min(abs, 5));
                    if (q > 0) {
                        sphereMat.color.set('#ff2020'); sphereMat.emissive.set('#ff0000');
                        glowMat.color.set('#ff4444');
                        dot.className = 'dot positive';
                    } else {
                        sphereMat.color.set('#2040ff'); sphereMat.emissive.set('#0020ff');
                        glowMat.color.set('#4466ff');
                        dot.className = 'dot negative';
                    }
                }
            };
            update(chargeGroup1, sphereMat1, glowMat1, q1, dotQ1);
            update(chargeGroup2, sphereMat2, glowMat2, q2, dotQ2);
        }

        // 更新数值显示
        function updateValues(q1, q2) {
            valQ1.textContent = q1.toFixed(1);
            valQ2.textContent = q2.toFixed(1);
            valQ1.className = 'value-display' + (q1 > 0.05 ? ' positive-val' : (q1 < -0.05 ? ' negative-val' : ''));
            valQ2.className = 'value-display' + (q2 > 0.05 ? ' positive-val' : (q2 < -0.05 ? ' negative-val' : ''));
        }

        // 当前电荷量
        let currentQ1 = parseFloat(sliderQ1.value);
        let currentQ2 = parseFloat(sliderQ2.value);
        let needsUpdate = true;

        function fullUpdate() {
            updateChargeVisuals(currentQ1, currentQ2);
            updateValues(currentQ1, currentQ2);
            renderFieldLines(currentQ1, currentQ2);
            needsUpdate = false;
        }

        // 滑块事件
        sliderQ1.addEventListener('input', () => {
            currentQ1 = parseFloat(sliderQ1.value);
            updateValues(currentQ1, currentQ2);
            updateChargeVisuals(currentQ1, currentQ2);
            needsUpdate = true;
        });
        sliderQ2.addEventListener('input', () => {
            currentQ2 = parseFloat(sliderQ2.value);
            updateValues(currentQ1, currentQ2);
            updateChargeVisuals(currentQ1, currentQ2);
            needsUpdate = true;
        });

        // 电偶极子按钮
        dipoleBtn.addEventListener('click', () => {
            sliderQ1.value = 3;
            sliderQ2.value = -2;
            currentQ1 = 3;
            currentQ2 = -2;
            fullUpdate();
        });

        // 面板折叠
        let panelVisible = true;
        panelToggle.addEventListener('click', () => {
            panelVisible = !panelVisible;
            panel.classList.toggle('collapsed', !panelVisible);
            panelToggle.classList.toggle('visible', !panelVisible);
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            if (needsUpdate) fullUpdate();
            controls.update();
            const t = performance.now() * 0.001;
            glow1.scale.setScalar(1 + 0.06 * Math.sin(t * 2.5));
            glow2.scale.setScalar(1 + 0.06 * Math.sin(t * 2.5 + Math.PI));
            renderer.render(scene, camera);
        }

        // 启动
        fullUpdate();
        animate();
    </script>

    <!-- 齐老师动画 - 安全保护脚本 -->
    <script>
    (function() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // ESC键返回主页
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                window.location.href = '../index.html';
            }
        });
        
        // 禁用开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });
        
        // 检测开发者工具打开（简单检测）
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthThreshold = window.outerWidth - window.innerWidth > threshold;
            var heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // 可以选择跳转或其他操作
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    })();
    </script>
