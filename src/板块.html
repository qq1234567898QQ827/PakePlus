<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>板块模型 · 正方体物块 · 暂停功能</title>
<style>
        :root {
            --bg: #070b14;
            --panel: rgba(12, 17, 28, 0.8);
            --text: #d0def0;
            --accent: #f04a4a;
            --blue: #3b8ed4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 40% 30%, #131c2e 0%, #03050c 80%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 8px;
            overflow-y: auto;
        }

        .container {
            background: var(--panel);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 24px;
            padding: 10px 18px 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
            max-width: 980px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 2px;
        }
        .header h1 {
            font-size: 1.15rem;
            color: #eaf2ff;
            text-shadow: 0 0 15px rgba(100, 180, 255, 0.7);
            letter-spacing: 0.03em;
            line-height: 1.2;
        }
        .stage-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 14px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .stage-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #2a3548;
            transition: 0.4s;
        }
        .stage-dot.active.s1 { background: #8899aa; box-shadow: 0 0 8px #8899aa; }
        .stage-dot.active.s2 { background: #4db8ff; box-shadow: 0 0 10px #4db8ff; }
        .stage-dot.active.s3 { background: #ff4d6a; box-shadow: 0 0 10px #ff4d6a; }
        .stage-text {
            font-size: 0.7rem;
            color: #8899bb;
            margin-left: 4px;
            min-width: 60px;
            font-weight: 500;
            transition: color 0.4s;
        }
        .stage-text.s1 { color: #bcc8d4; }
        .stage-text.s2 { color: #7fc9ff; }
        .stage-text.s3 { color: #ff8c9e; }

        canvas {
            display: block;
            width: 100%;
            border-radius: 14px;
            background: #090d18;
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 140, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #sceneCanvas { height: 360px; }
        #vtCanvas { height: 220px; background: #080b15; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            padding: 0 2px;
        }
        .slider-group {
            flex: 1 1 260px;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #a0b4d0;
        }
        .slider-header .val {
            font-weight: 700;
            font-size: 1rem;
            color: #ff7b7b;
            text-shadow: 0 0 8px rgba(255, 70, 70, 0.6);
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #8899aa 0%, #8899aa 27%, #4db8ff 27%, #4db8ff 62%, #ff4d6a 62%, #ff4d6a 100%);
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(0, 180, 255, 0.3);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #f05454;
            box-shadow: 0 0 22px rgba(255, 70, 70, 0.7);
            cursor: pointer;
        }
        button {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(20, 30, 50, 0.55);
            backdrop-filter: blur(12px);
            color: #c8daf8;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: 0.25s;
            white-space: nowrap;
        }
        button:hover {
            background: rgba(35, 50, 75, 0.7);
            border-color: rgba(0, 200, 255, 0.4);
            color: #fff;
            box-shadow: 0 0 18px rgba(0, 160, 255, 0.3);
        }
        button.pause-active {
            background: #f05454;
            border-color: #f05454;
            color: #fff;
            box-shadow: 0 0 24px rgba(240, 84, 84, 0.8);
        }
        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            font-size: 0.68rem;
            color: #8899bb;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .info-row span strong { color: #ffb3b3; }

        @media (max-width: 600px) {
            .container { padding: 8px 10px 10px; gap: 6px; }
            #sceneCanvas { height: 300px; }
            #vtCanvas { height: 180px; }
            button { padding: 6px 12px; font-size: 0.7rem; }
        }
    </style>
</head>

<a class="back-btn" href="index.html">⬅️ 返回分类 (ESC)</a>
<div class="container">
<div class="header">
<h1>◈ 板块 · 摩擦 · v-t 图像</h1>
<div class="stage-indicator">
<span class="stage-dot s1 active" id="dot1"></span>
<span class="stage-dot s2" id="dot2"></span>
<span class="stage-dot s3" id="dot3"></span>
<span class="stage-text s1" id="stageLabel">静止阶段</span>
</div>
</div>
<canvas height="360" id="sceneCanvas" width="880"></canvas>
<canvas height="220" id="vtCanvas" width="880"></canvas>
<div class="controls">
<div class="slider-group">
<div class="slider-header">
<span>🔴 水平恒力 F</span>
<span class="val" id="forceVal">20.0 N</span>
</div>
<input id="forceSlider" max="45" min="0" step="0.1" type="range" value="20"/>
</div>
<button id="pauseBtn">⏸️ 暂停</button>
<button id="resetBtn">↺ 重置</button>
</div>
<div class="info-row">
<span>状态：<strong id="infoState">一起加速</strong></span>
<span>|</span>
<span>木板 a：<strong id="infoABoard">2.00</strong> m/s²</span>
<span>|</span>
<span>物块 a：<strong id="infoABlock">2.00</strong> m/s²</span>
<span>|</span>
<span>地面摩擦 f₂：<strong id="infoFGround">12.0 N</strong></span>
</div>
</div>
<script>
    (function() {
        const sceneCanvas = document.getElementById('sceneCanvas');
        const ctxScene = sceneCanvas.getContext('2d');
        const vtCanvas = document.getElementById('vtCanvas');
        const ctxVt = vtCanvas.getContext('2d');
        const forceSlider = document.getElementById('forceSlider');
        const forceValEl = document.getElementById('forceVal');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const infoState = document.getElementById('infoState');
        const infoABoard = document.getElementById('infoABoard');
        const infoABlock = document.getElementById('infoABlock');
        const infoFGround = document.getElementById('infoFGround');
        const dot1 = document.getElementById('dot1');
        const dot2 = document.getElementById('dot2');
        const dot3 = document.getElementById('dot3');
        const stageLabel = document.getElementById('stageLabel');

        // 物理参数
        const m = 1.0, M = 3.0, mu1 = 0.4, mu2 = 0.3, g = 10.0;
        const f1_max = mu1 * m * g;
        const f2_static = mu2 * (m + M) * g;
        const f2_kinetic = f2_static;
        const F_crit1 = f2_static;
        const F_crit2 = (mu1 + mu2) * (m + M) * g;

        const pixelsPerMeter = 85;
        const groundY = 290;
        const boardW = 200, boardH = 22;
        const blockW = 40, blockH = 40;
        const initBoardX = 150;
        const initBlockX = initBoardX + boardW - blockW - 5;

        let boardX = initBoardX, boardV = 0;
        let blockX = initBlockX, blockV = 0;
        let blockOnBoard = true, blockOnGround = false;
        let F = parseFloat(forceSlider.value);
        let particles = [];

        const VT_WINDOW = 12.0;
        const V_MAX = 30.0;
        let elapsedTime = 0;
        let timeHistory = [];
        let boardVHistory = [];
        let blockVHistory = [];

        let paused = false;

        class Particle {
            constructor(x, y, vx, vy, life, color, size) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.life = life; this.maxLife = life;
                this.color = color; this.size = size;
            }
            update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt; }
            get alive() { return this.life > 0; }
            draw(ctx) {
                const a = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = a;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8 * a;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnParticles(x, y, count, intensity) {
            for (let i = 0; i < count; i++) {
                const vx = (Math.random() - 0.6) * intensity * 60;
                const vy = -Math.random() * intensity * 80 - 20;
                const life = 0.2 + Math.random() * 0.6;
                const color = `hsl(${15 + Math.random() * 25}, 100%, ${55 + Math.random() * 35}%)`;
                particles.push(new Particle(x, y, vx, vy, life, color, 1.5 + Math.random() * 2.8));
            }
        }

        function getGroundFriction() {
            if (Math.abs(boardV) < 0.003 && F <= f2_static) return -F;
            const direction = boardV > 0.001 ? boardV : (F > f2_static ? 1 : -1);
            return -Math.sign(direction) * f2_kinetic;
        }

        function getBlockFriction(out) {
            if (!blockOnBoard) { out.static = false; return 0; }
            const relVel = blockV - boardV;
            if (Math.abs(relVel) < 0.005) {
                const fGround = getGroundFriction();
                const aCommon = (F + fGround) / (m + M);
                const needed = m * aCommon;
                if (Math.abs(needed) <= f1_max && Math.abs(aCommon) > 0.0001) {
                    out.static = true; return needed;
                } else if (Math.abs(needed) > f1_max) {
                    out.static = false; return Math.sign(needed) * f1_max;
                } else { out.static = true; return needed; }
            } else { out.static = false; return Math.sign(boardV - blockV) * f1_max; }
        }

        function updatePhysics(dt) {
            if (paused) return;
            const effDt = Math.min(dt, 0.05);
            if (!blockOnBoard && blockOnGround) {
                const friction = mu2 * m * g;
                if (Math.abs(blockV) < 0.02) blockV = 0;
                else blockV += (blockV > 0 ? -friction / m : friction / m) * effDt;
                blockX += blockV * pixelsPerMeter * effDt;
            }

            const fGround = getGroundFriction();
            if (Math.abs(boardV) < 0.003 && F <= f2_static) boardV = 0;
            else {
                const outBlock = { static: false };
                const fBlock = getBlockFriction(outBlock);
                boardV += ((F + fGround - fBlock) / M) * effDt;
                if (boardV < 0 && F > f2_static) boardV = 0;
            }
            boardX += boardV * pixelsPerMeter * effDt;

            if (blockOnBoard) {
                const outBlock = { static: false };
                const fBlock = getBlockFriction(outBlock);
                if (outBlock.static) blockV = boardV;
                else blockV += (fBlock / m) * effDt;
                blockX += blockV * pixelsPerMeter * effDt;
                if (blockX + blockW < boardX - 2 || blockX > boardX + boardW + 2) {
                    blockOnBoard = false; blockOnGround = true;
                    spawnParticles(blockX + blockW/2, groundY - boardH, 30, 1.8);
                }
            }

            if (blockOnBoard && Math.abs(blockV - boardV) > 0.04 && F > F_crit2) {
                if (Math.random() < 0.9) {
                    const contactY = groundY - boardH;
                    for (let i = 0; i < 3; i++) {
                        spawnParticles(blockX + Math.random() * blockW, contactY, 3, Math.abs(blockV - boardV) * 1.8);
                    }
                }
            }
            if (Math.abs(boardV) > 0.05 && Math.random() < 0.3) {
                spawnParticles(boardX + Math.random() * boardW, groundY, 2, 0.6);
            }

            for (let p of particles) p.update(effDt);
            particles = particles.filter(p => p.alive);
            if (particles.length > 120) particles = particles.slice(-100);
        }

        function getStage() {
            if (F <= F_crit1 && Math.abs(boardV) < 0.005) return 1;
            if (F <= F_crit2 && blockOnBoard && Math.abs(blockV - boardV) < 0.02) return 2;
            return 3;
        }

        function drawScene() {
            const ctx = ctxScene;
            const w = sceneCanvas.width, h = sceneCanvas.height;
            ctx.clearRect(0, 0, w, h);

            const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, '#0b1324'); skyGrad.addColorStop(0.5, '#162033'); skyGrad.addColorStop(1, '#1e2e44');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, w, groundY);

            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            for (let i = 0; i < 50; i++) {
                const sx = (i * 137 + 40) % w, sy = (i * 89 + 20) % (groundY - 20);
                ctx.beginPath(); ctx.arc(sx, sy, 0.6 + (i%3)*0.5, 0, Math.PI*2); ctx.fill();
            }

            ctx.fillStyle = '#131f2e'; ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.quadraticCurveTo(120, groundY-48, 260, groundY-22);
            ctx.quadraticCurveTo(420, groundY-45, 580, groundY-16);
            ctx.quadraticCurveTo(720, groundY-32, w, groundY-10);
            ctx.lineTo(w, groundY); ctx.closePath(); ctx.fill();

            const gGrad = ctx.createLinearGradient(0, groundY, 0, h);
            gGrad.addColorStop(0, '#2f4055'); gGrad.addColorStop(0.15, '#233445'); gGrad.addColorStop(0.5, '#16222f'); gGrad.addColorStop(1, '#0b1219');
            ctx.fillStyle = gGrad; ctx.fillRect(0, groundY, w, h - groundY);

            ctx.strokeStyle = 'rgba(100,160,220,0.12)'; ctx.lineWidth = 1;
            for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x, h); ctx.stroke(); }
            for (let y = groundY + 15; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
            ctx.strokeStyle = '#00a6ff'; ctx.lineWidth = 2; ctx.shadowColor = '#00b4ff'; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke(); ctx.shadowBlur = 0;

            const arrowX = boardX + boardW;
            const arrowY = groundY - boardH/2;
            const arrowLen = 45 + F * 2.2;
            
            ctx.strokeStyle = 'rgba(255,60,60,0.5)'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(arrowX, arrowY); ctx.lineTo(arrowX+arrowLen-16, arrowY); ctx.stroke();
            ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 4; ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.moveTo(arrowX, arrowY); ctx.lineTo(arrowX+arrowLen-14, arrowY); ctx.stroke();
            ctx.fillStyle = '#ff3b3b'; ctx.beginPath();
            ctx.moveTo(arrowX+arrowLen, arrowY);
            ctx.lineTo(arrowX+arrowLen-16, arrowY-11);
            ctx.lineTo(arrowX+arrowLen-14, arrowY);
            ctx.lineTo(arrowX+arrowLen-16, arrowY+11);
            ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px "Segoe UI","PingFang SC"'; ctx.textAlign = 'center';
            ctx.fillText('F', arrowX + arrowLen/2, arrowY - 13);
            ctx.fillStyle = '#ffcccc'; ctx.font = '9px monospace';
            ctx.fillText(`${F.toFixed(1)} N`, arrowX + arrowLen/2, arrowY + 18);

            const fg = getGroundFriction();
            if (Math.abs(fg) > 0.3 && !(F < 0.5 && Math.abs(boardV) < 0.01)) {
                const fx = boardX + boardW/2, fy = groundY + 14, len = Math.min(42, Math.abs(fg)*3 + 6);
                ctx.strokeStyle = 'rgba(255,180,80,0.6)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx+len, fy); ctx.stroke();
                ctx.fillStyle = 'rgba(255,180,80,0.8)'; ctx.beginPath();
                ctx.moveTo(fx+len, fy); ctx.lineTo(fx+len-9, fy-5); ctx.lineTo(fx+len-9, fy+5); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#ffcc88'; ctx.font = '9px monospace'; ctx.fillText('f₂', fx+len/2, fy-9);
            }

            const bx = boardX, by = groundY - boardH;
            ctx.fillStyle = 'rgba(0,180,255,0.15)'; ctx.fillRect(bx+3, by+3, boardW, boardH);
            const bGrad = ctx.createLinearGradient(0, by, 0, by+boardH);
            bGrad.addColorStop(0, '#4aa3d9'); bGrad.addColorStop(0.5, '#2e7db5'); bGrad.addColorStop(1, '#1a5680');
            ctx.fillStyle = bGrad; ctx.fillRect(bx, by, boardW, boardH);
            ctx.strokeStyle = '#7cc8ff'; ctx.lineWidth = 2; ctx.shadowColor = '#0099ff'; ctx.shadowBlur = 8;
            ctx.strokeRect(bx, by, boardW, boardH); ctx.shadowBlur = 0;

            let blkX, blkY;
            if (blockOnBoard) { blkY = groundY - boardH - blockH; blkX = blockX; }
            else { blkY = groundY - blockH; blkX = blockX; }
            const blkGrad = ctx.createLinearGradient(0, blkY, 0, blkY+blockH);
            blkGrad.addColorStop(0, '#ff6b6b'); blkGrad.addColorStop(0.5, '#e04545'); blkGrad.addColorStop(1, '#b03030');
            ctx.fillStyle = blkGrad;
            ctx.fillRect(blkX, blkY, blockW, blockH);
            ctx.strokeStyle = '#ffaaaa'; ctx.lineWidth = 2; ctx.shadowColor = '#ff4d4d'; ctx.shadowBlur = 10;
            ctx.strokeRect(blkX, blkY, blockW, blockH); ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(blkX+4, blkY+2, blockW-8, 5);

            for (let p of particles) p.draw(ctx);
        }

        function drawVT() {
            const ctx = ctxVt;
            const w = vtCanvas.width, h = vtCanvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#080b15'; ctx.fillRect(0, 0, w, h);

            const margin = { top: 22, right: 45, bottom: 35, left: 55 };
            const plotW = w - margin.left - margin.right;
            const plotH = h - margin.top - margin.bottom;

            const tMax = Math.max(VT_WINDOW, elapsedTime);
            const tMin = tMax - VT_WINDOW;
            const timeRange = VT_WINDOW;
            const vMin = 0, vMax = V_MAX, vRange = vMax - vMin;

            const tToX = (t) => margin.left + ((t - tMin) / timeRange) * plotW;
            const vToY = (v) => margin.top + plotH - ((v - vMin) / vRange) * plotH;

            ctx.strokeStyle = 'rgba(80,160,220,0.18)'; ctx.lineWidth = 1;
            const tStep = 2;
            let tStart = Math.ceil(tMin / tStep) * tStep;
            for (let t = tStart; t <= tMax; t += tStep) {
                const x = tToX(t);
                ctx.beginPath(); ctx.moveTo(x, margin.top); ctx.lineTo(x, margin.top+plotH); ctx.stroke();
            }
            const vStep = 5;
            for (let v = vStep; v <= vMax; v += vStep) {
                const y = vToY(v);
                ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(margin.left+plotW, y); ctx.stroke();
            }

            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(margin.left, margin.top); ctx.lineTo(margin.left, margin.top+plotH); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(margin.left, margin.top+plotH); ctx.lineTo(margin.left+plotW, margin.top+plotH); ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(margin.left, margin.top - 7);
            ctx.lineTo(margin.left - 6, margin.top + 5);
            ctx.lineTo(margin.left + 6, margin.top + 5);
            ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(margin.left + plotW + 7, margin.top + plotH);
            ctx.lineTo(margin.left + plotW - 5, margin.top + plotH - 6);
            ctx.lineTo(margin.left + plotW - 5, margin.top + plotH + 6);
            ctx.closePath(); ctx.fill();

            ctx.font = 'italic bold 13px "Segoe UI","PingFang SC"';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText('V', margin.left - 14, margin.top - 8);
            ctx.fillText('t', margin.left + plotW + 14, margin.top + plotH + 4);

            ctx.font = 'bold 11px "Segoe UI","PingFang SC"';
            ctx.fillText('时间 t (s)', margin.left + plotW/2, h - 6);
            ctx.save();
            ctx.translate(14, margin.top + plotH/2);
            ctx.rotate(-Math.PI/2);
            ctx.fillText('速度 v (m/s)', 0, 0);
            ctx.restore();

            const drawCurve = (history, color) => {
                if (history.length < 2) return;
                ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.shadowColor = color; ctx.shadowBlur = 6;
                ctx.beginPath();
                let started = false;
                for (let i = 0; i < history.length; i++) {
                    const t = timeHistory[i];
                    if (t < tMin - 0.01) continue;
                    const x = tToX(t), y = vToY(Math.min(history[i], vMax));
                    if (!started) { ctx.moveTo(x, y); started = true; }
                    else ctx.lineTo(x, y);
                }
                ctx.stroke(); ctx.shadowBlur = 0;
            };
            drawCurve(boardVHistory, '#4db8ff');
            drawCurve(blockVHistory, '#ff6b6b');

            ctx.fillStyle = '#4db8ff'; ctx.fillRect(margin.left + 10, margin.top + 4, 14, 4);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px "Segoe UI","PingFang SC"'; ctx.textAlign = 'left';
            ctx.fillText('木板速度', margin.left + 28, margin.top + 9);
            ctx.fillStyle = '#ff6b6b'; ctx.fillRect(margin.left + 90, margin.top + 4, 14, 4);
            ctx.fillText('物块速度', margin.left + 108, margin.top + 9);
        }

        function recordData(dt) {
            if (paused) return;
            elapsedTime += dt;
            timeHistory.push(elapsedTime);
            boardVHistory.push(boardV);
            blockVHistory.push(blockV);
            const cutTime = elapsedTime - VT_WINDOW;
            while (timeHistory.length > 0 && timeHistory[0] < cutTime - 0.05) {
                timeHistory.shift(); boardVHistory.shift(); blockVHistory.shift();
            }
            if (timeHistory.length > 700) {
                timeHistory = timeHistory.slice(-650);
                boardVHistory = boardVHistory.slice(-650);
                blockVHistory = blockVHistory.slice(-650);
            }
        }

        function updateUI() {
            const stage = getStage();
            dot1.classList.toggle('active', stage === 1);
            dot2.classList.toggle('active', stage === 2);
            dot3.classList.toggle('active', stage === 3);
            stageLabel.classList.remove('s1', 's2', 's3');
            if (stage === 1) { stageLabel.textContent = '静止阶段'; stageLabel.classList.add('s1'); infoState.textContent = '整体静止'; }
            else if (stage === 2) { stageLabel.textContent = '共加速阶段'; stageLabel.classList.add('s2'); infoState.textContent = '一起加速'; }
            else { stageLabel.textContent = blockOnBoard ? '相对滑动' : '木板抽出'; stageLabel.classList.add('s3'); infoState.textContent = blockOnBoard ? '相对滑动' : '木板抽出'; }

            let boardAccel = 0;
            if (!(Math.abs(boardV) < 0.003 && F <= f2_static)) {
                const out = { static: false };
                boardAccel = (F + getGroundFriction() - getBlockFriction(out)) / M;
            }
            infoABoard.textContent = boardAccel.toFixed(2);
            let blockAccel = 0;
            if (blockOnBoard) { const out = { static: false }; blockAccel = getBlockFriction(out) / m; }
            else if (blockOnGround && Math.abs(blockV) > 0.003) blockAccel = -(mu2 * g);
            infoABlock.textContent = blockAccel.toFixed(2);
            infoFGround.textContent = Math.abs(getGroundFriction()).toFixed(1) + ' N';
        }

        function resetSim() {
            boardX = initBoardX; boardV = 0;
            blockX = initBlockX; blockV = 0;
            blockOnBoard = true; blockOnGround = false;
            particles = [];
            elapsedTime = 0; timeHistory = []; boardVHistory = []; blockVHistory = [];
            F = parseFloat(forceSlider.value);
        }

        let lastTime = performance.now();
        function animate(ts) {
            let dt = (ts - lastTime) / 1000; if (dt <= 0) dt = 0.016; if (dt > 0.1) dt = 0.1; lastTime = ts;

            updatePhysics(dt);
            recordData(dt);
            if (!paused && (boardX > 1200 || (blockOnGround && blockX > 1200))) resetSim();

            drawScene();
            drawVT();
            updateUI();
            requestAnimationFrame(animate);
        }

        forceSlider.addEventListener('input', () => {
            F = parseFloat(forceSlider.value); forceValEl.textContent = F.toFixed(1) + ' N';
            if (!blockOnBoard && blockOnGround && Math.abs(blockV) < 0.02) resetSim();
        });

        pauseBtn.addEventListener('click', () => {
            paused = !paused;
            if (paused) {
                pauseBtn.textContent = '▶️ 播放';
                pauseBtn.classList.add('pause-active');
            } else {
                pauseBtn.textContent = '⏸️ 暂停';
                pauseBtn.classList.remove('pause-active');
            }
        });

        resetBtn.addEventListener('click', () => {
            resetSim();
            F = parseFloat(forceSlider.value);
            forceValEl.textContent = F.toFixed(1) + ' N';
            if (paused) {
                paused = false;
                pauseBtn.textContent = '⏸️ 暂停';
                pauseBtn.classList.remove('pause-active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') { e.preventDefault(); F = Math.min(45, F+1.5); forceSlider.value = F; forceValEl.textContent = F.toFixed(1)+' N'; }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); F = Math.max(0, F-1.5); forceSlider.value = F; forceValEl.textContent = F.toFixed(1)+' N'; }
            else if (e.key === 'r' || e.key === 'R') { resetSim(); F = parseFloat(forceSlider.value); forceValEl.textContent = F.toFixed(1)+' N'; }
            else if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
        });
        window.addEventListener('resize', () => { sceneCanvas.style.width = '100%'; vtCanvas.style.width = '100%'; });

        forceValEl.textContent = F.toFixed(1) + ' N';
        requestAnimationFrame(animate);
    })();
</script>
