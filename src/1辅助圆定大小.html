<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>共点力动态平衡 - 辅助圆模型</title>
<style>
        :root {
            --bg: #0a0a14;
            --panel-bg: rgba(14, 14, 30, 0.85);
            --text: #c8d6e5;
            --red: #ff5252;
            --blue: #4da6ff;
            --yellow: #ffb833;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(ellipse at center, #0d0d24 0%, #050510 60%, #020208 100%);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .main-container {
            display: flex;
            gap: 20px;
            align-items: stretch;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .canvas-wrapper {
            position: relative;
            background: rgba(8, 10, 28, 0.7);
            border-radius: 20px;
            border: 1px solid rgba(100, 140, 220, 0.25);
            box-shadow: 0 0 40px rgba(30, 60, 140, 0.2), 0 0 80px rgba(20, 40, 100, 0.1), inset 0 0 60px rgba(10, 20, 50, 0.3);
            overflow: hidden;
            flex: 1 1 680px;
            min-width: 340px;
            max-width: 820px;
            aspect-ratio: 800 / 550;
            cursor: default;
        }
        .canvas-wrapper.dragging {
            cursor: grabbing;
        }
        .canvas-wrapper.near-node {
            cursor: grab;
        }
        .canvas-wrapper.near-node.dragging {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }

        .control-panel {
            background: var(--panel-bg);
            border-radius: 20px;
            border: 1px solid rgba(100, 140, 220, 0.3);
            box-shadow: 0 0 30px rgba(30, 60, 140, 0.15), 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 24px 22px;
            flex: 0 0 260px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 240px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .panel-title {
            font-size: 1.15em;
            font-weight: 700;
            color: #fff;
            text-align: center;
            letter-spacing: 0.05em;
            text-shadow: 0 0 20px rgba(140, 180, 255, 0.5);
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(120, 160, 220, 0.25);
        }

        .param-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .param-label {
            font-size: 0.85em;
            color: #a0b8d8;
            letter-spacing: 0.03em;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .param-value {
            color: #fff;
            font-weight: 700;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 14px;
            letter-spacing: 0.02em;
        }

        .slider-container {
            position: relative;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 10px;
            background: linear-gradient(90deg, #2a3a60, #4a80d0);
            outline: none;
            cursor: pointer;
            transition: background 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe8b0, #e0a030);
            border: 2px solid rgba(255, 200, 80, 0.7);
            cursor: pointer;
            box-shadow: 0 0 18px rgba(255, 180, 40, 0.55), 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            box-shadow: 0 0 28px rgba(255, 180, 40, 0.8), 0 6px 16px rgba(0, 0, 0, 0.5);
            transform: scale(1.05);
        }
        input[type="range"]::-webkit-slider-thumb:active {
            box-shadow: 0 0 35px rgba(255, 200, 60, 1), 0 2px 8px rgba(0, 0, 0, 0.6);
            transform: scale(1.08);
        }

        .force-display {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .force-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }
        .force-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 10px currentColor;
        }
        .force-dot.red {
            background: #ff5252;
            box-shadow: 0 0 14px #ff5252;
        }
        .force-dot.blue {
            background: #4da6ff;
            box-shadow: 0 0 14px #4da6ff;
        }
        .force-dot.yellow {
            background: #ffb833;
            box-shadow: 0 0 14px #ffb833;
        }
        .force-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .force-name {
            font-size: 0.8em;
            color: #bcc8dd;
            letter-spacing: 0.03em;
        }
        .force-value {
            font-size: 1.05em;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.02em;
        }

        .extra-info {
            font-size: 0.75em;
            color: #8899bb;
            text-align: center;
            letter-spacing: 0.03em;
            line-height: 1.6;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .extra-info span {
            color: #c8b0f0;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                align-items: center;
                gap: 14px;
                padding: 10px;
            }
            .canvas-wrapper {
                flex: 1 1 auto;
                width: 100%;
                max-width: 100%;
                aspect-ratio: 4/3;
                min-width: auto;
            }
            .control-panel {
                flex: 0 0 auto;
                width: 100%;
                max-width: 420px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 12px;
                padding: 16px;
                justify-content: center;
            }
            .panel-title {
                width: 100%;
                font-size: 1em;
            }
            .param-group {
                flex: 1 1 120px;
                min-width: 100px;
            }
            .force-display {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                width: 100%;
                justify-content: center;
            }
            .force-item {
                flex: 1 1 80px;
                min-width: 70px;
                padding: 6px 8px;
            }
            .extra-info {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div id="backButton" onclick="window.location.href='index.html';" style="position: fixed; top: 20px; left: 20px; z-index: 9999; background: rgba(136, 187, 255, 0.2); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: Arial, sans-serif; font-size: 14px; border: 1px solid rgba(136, 187, 255, 0.5); transition: all 0.3s;">

</div>

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        window.location.href='index.html';
    }
});
</script>

<div class="main-container">
<div class="canvas-wrapper" id="canvasWrapper">
<canvas id="mainCanvas"></canvas>
</div>
<div class="control-panel" id="controlPanel">
<div class="panel-title">🔮 辅助圆模型 · 动态平衡</div>
<div class="param-group">
<div class="param-label">
<span>📐 T与竖直方向夹角</span>
<span class="param-value" id="angleDisplay">30.0°</span>
</div>
<div class="slider-container">
<input id="angleSlider" max="170" min="10" step="0.5" type="range" value="30"/>
</div>
</div>
<div class="force-display">
<div class="force-item">
<div class="force-dot red"></div>
<div class="force-info">
<span class="force-name">重力 G（竖直向下·固定）</span>
<span class="force-value" id="gravityVal">10.00 N</span>
</div>
</div>
<div class="force-item">
<div class="force-dot blue"></div>
<div class="force-info">
<span class="force-name">力 F（大小方向可变）</span>
<span class="force-value" id="forceFVal">6.61 N</span>
</div>
</div>
<div class="force-item">
<div class="force-dot yellow"></div>
<div class="force-info">
<span class="force-name">拉力 T（大小固定·方向可调）</span>
<span class="force-value" id="tensionVal">5.00 N</span>
</div>
</div>
</div>
<div class="extra-info">
                ⭕ 辅助圆：以P₀为圆心<br/>
                📍 |T|固定 = G/2 → 圆半径较小<br/>
                🖱️ 拖动滑块 / 在圆周上拖动
            </div>
</div>
</div>
<script>
        (function() {
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('canvasWrapper');
            const angleSlider = document.getElementById('angleSlider');
            const angleDisplay = document.getElementById('angleDisplay');
            const gravityValEl = document.getElementById('gravityVal');
            const forceFValEl = document.getElementById('forceFVal');
            const tensionValEl = document.getElementById('tensionVal');

            // ---------- 固定几何参数 ----------
            const W = 800;
            const H = 550;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);

            const G_N = 10;                 // 重力大小 (N)
            const G_LEN = 150;              // 画布上重力长度 (px)
            // G = 2T → T_N = G_N/2 = 5N, T_LEN = G_LEN/2 = 75px
            const T_LEN = 75;
            const T_N = G_N / 2;             // 5 N

            // P0: 重力起点 (辅助圆圆心，T的终点)
            const P0 = { x: 400, y: 180 };
            // P1: 重力终点 (F的起点)
            const P1 = { x: 400, y: 180 + G_LEN }; // (400, 330)

            // ---------- 状态 ----------
            // φ: T与竖直向上方向的夹角（度），范围[10°, 170°]
            let phiDeg = 30;
            let phiRad = phiDeg * Math.PI / 180;

            // ---------- 根据φ计算P2及各力长度 ----------
            function computeFromPhi(phiRad) {
                const sinPhi = Math.sin(phiRad);
                const cosPhi = Math.cos(phiRad);
                // P2 = P0 + T_LEN*(sinφ, cosφ)
                const P2 = {
                    x: P0.x + T_LEN * sinPhi,
                    y: P0.y + T_LEN * cosPhi
                };
                const fLen = Math.hypot(P2.x - P1.x, P2.y - P1.y);
                const tLen = T_LEN;          // 固定
                return { P2, fLen, tLen };
            }

            function getTriangle() {
                const { P2, fLen, tLen } = computeFromPhi(phiRad);
                return { P0, P1, P2, fLen, tLen, gLen: G_LEN, radius: T_LEN };
            }

            // ---------- 由P2位置反推φ（用于拖动）----------
            function computePhiFromP2(P2) {
                const dx = P2.x - P0.x;
                const dy = P2.y - P0.y;
                let phi = Math.atan2(dx / T_LEN, dy / T_LEN);
                let deg = phi * 180 / Math.PI;
                if (deg < 0) deg += 360;
                deg = Math.max(10, Math.min(170, deg));
                return deg;
            }

            // ---------- Canvas尺寸适配 ----------
            function resizeCanvas() {
                const rect = wrapper.getBoundingClientRect();
                const displayWidth = rect.width;
                const displayHeight = rect.height || (displayWidth * H / W);
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = displayWidth + 'px';
                canvas.style.height = displayHeight + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ---------- 星空背景 ----------
            class Star {
                constructor() { this.reset(true); }
                reset(init = false) {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.baseR = Math.random() < 0.08 ? (Math.random() * 2.2 + 1.5) :
                        (Math.random() < 0.3 ? Math.random() * 1.3 + 0.6 : Math.random() * 0.9 + 0.25);
                    this.r = this.baseR;
                    this.bright = Math.random() * 0.55 + 0.45;
                    this.spd = Math.random() * 0.025 + 0.008;
                    this.offset = Math.random() * Math.PI * 2;
                    this.hue = Math.random() < 0.6 ? (Math.random() * 30 + 210) :
                        (Math.random() < 0.5 ? Math.random() * 25 + 30 : Math.random() * 360);
                    this.sat = Math.random() * 25 + 5;
                    this.light = 70 + Math.random() * 30;
                }
                update(frame) {
                    const t = Math.sin(frame * this.spd + this.offset);
                    this.r = this.baseR * (0.6 + 0.4 * (0.5 + 0.5 * t));
                    this.bright = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(frame * this.spd * 1.3 + this.offset + 1.5));
                }
                draw(ctx) {
                    const a = this.bright;
                    if (this.r < 0.15) return;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue},${this.sat}%,${this.light}%,${a})`;
                    ctx.fill();
                    if (this.r > 1.3) {
                        const g = ctx.createRadialGradient(this.x, this.y, this.r * 0.2, this.x, this.y, this.r * 2.5);
                        g.addColorStop(0, `hsla(${this.hue},${this.sat}%,${this.light}%,${a * 0.7})`);
                        g.addColorStop(1, 'transparent');
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.r * 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = g;
                        ctx.fill();
                    }
                }
            }
            const stars = Array.from({ length: 220 }, () => new Star());
            const orbs = Array.from({ length: 6 }, () => ({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.25,
                radius: Math.random() * 28 + 14,
                alpha: Math.random() * 0.12 + 0.04,
                hue: Math.random() < 0.5 ? 210 + Math.random() * 30 : 240 + Math.random() * 25,
            }));

            // ---------- 绘图工具 ----------
            function drawArrow(from, to, color, lw = 3.5) {
                const dx = to.x - from.x,
                    dy = to.y - from.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len < 0.5) return;
                const ux = dx / len,
                    uy = dy / len;
                const aLen = Math.min(16, len * 0.28);
                const aW = aLen * 0.55;
                const bx = to.x - ux * aLen * 0.7;
                const by = to.y - uy * aLen * 0.7;
                ctx.save();
                ctx.shadowColor = color;
                ctx.shadowBlur = 14;
                ctx.strokeStyle = color;
                ctx.lineWidth = lw;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(from.x, from.y);
                ctx.lineTo(bx, by);
                ctx.stroke();
                ctx.shadowBlur = 8;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(to.x, to.y);
                ctx.lineTo(bx - uy * aW, by + ux * aW);
                ctx.lineTo(bx + uy * aW, by - ux * aW);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            function drawDashedLine(a, b, color, dash = 6, gap = 4, lw = 1.2) {
                const dx = b.x - a.x,
                    dy = b.y - a.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len < 0.5) return;
                const ux = dx / len,
                    uy = dy / len;
                ctx.strokeStyle = color;
                ctx.lineWidth = lw;
                ctx.lineCap = 'round';
                ctx.setLineDash([dash, gap]);
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function drawDashedCircle(cx, cy, r, color, dash = 8, gap = 5, lw = 1.6) {
                ctx.strokeStyle = color;
                ctx.lineWidth = lw;
                ctx.setLineDash([dash, gap]);
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function drawGrid() {
                ctx.strokeStyle = 'rgba(60,100,170,0.07)';
                ctx.lineWidth = 0.6;
                for (let x = 50; x < W; x += 50) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, H);
                    ctx.stroke();
                }
                for (let y = 50; y < H; y += 50) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }
                ctx.strokeStyle = 'rgba(60,100,170,0.04)';
                ctx.lineWidth = 0.4;
                for (let x = -H; x < W + H; x += 90) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x + H, H);
                    ctx.stroke();
                }
            }

            // ---------- 主绘制（已移除角度弧线、角度符号、三角形顶点圆点）----------
            function draw(frame) {
                ctx.clearRect(0, 0, W, H);
                const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.35, 50, W * 0.5, H * 0.5, W * 0.9);
                bgGrad.addColorStop(0, 'rgba(18,22,50,0.5)');
                bgGrad.addColorStop(0.5, 'rgba(8,10,26,0.7)');
                bgGrad.addColorStop(1, 'rgba(3,4,14,0.95)');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);
                drawGrid();

                for (const orb of orbs) {
                    orb.x += orb.vx;
                    orb.y += orb.vy;
                    if (orb.x < -60) orb.x = W + 60;
                    if (orb.x > W + 60) orb.x = -60;
                    if (orb.y < -60) orb.y = H + 60;
                    if (orb.y > H + 60) orb.y = -60;
                    const g = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius);
                    g.addColorStop(0, `hsla(${orb.hue},60%,65%,${orb.alpha})`);
                    g.addColorStop(1, 'transparent');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (const s of stars) { s.update(frame);
                    s.draw(ctx); }

                const tri = getTriangle();
                const { P2, fLen, tLen, radius } = tri;

                // ----- 辅助圆（以P0为圆心，T_LEN为半径）-----
                const circleFill = ctx.createRadialGradient(P0.x, P0.y, radius * 0.35, P0.x, P0.y, radius);
                circleFill.addColorStop(0, 'rgba(150,130,200,0.05)');
                circleFill.addColorStop(1, 'rgba(100,120,180,0.01)');
                ctx.fillStyle = circleFill;
                ctx.beginPath();
                ctx.arc(P0.x, P0.y, radius, 0, Math.PI * 2);
                ctx.fill();

                drawDashedCircle(P0.x, P0.y, radius, 'rgba(170,150,210,0.55)', 7, 5, 1.8);

                const outerGlow = ctx.createRadialGradient(P0.x, P0.y, radius * 0.9, P0.x, P0.y, radius * 1.15);
                outerGlow.addColorStop(0, 'transparent');
                outerGlow.addColorStop(1, 'rgba(160,140,210,0.12)');
                ctx.fillStyle = outerGlow;
                ctx.beginPath();
                ctx.arc(P0.x, P0.y, radius * 1.15, 0, Math.PI * 2);
                ctx.fill();

                // ----- 半径辅助虚线（P0到P2）-----
                drawDashedLine(P0, P2, 'rgba(200,180,230,0.3)', 4, 5, 0.9);

                // ----- 三角形内部与边框 -----
                ctx.fillStyle = 'rgba(180,200,240,0.03)';
                ctx.beginPath();
                ctx.moveTo(P0.x, P0.y);
                ctx.lineTo(P1.x, P1.y);
                ctx.lineTo(P2.x, P2.y);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(P0.x, P0.y);
                ctx.lineTo(P1.x, P1.y);
                ctx.lineTo(P2.x, P2.y);
                ctx.closePath();
                ctx.stroke();

                // ----- 力矢量（无顶点圆点）-----
                drawArrow(P0, P1, '#ff5252', 4.0);   // G：红色
                drawArrow(P1, P2, '#4da6ff', 4.0);   // F：蓝色
                drawArrow(P2, P0, '#ffb833', 4.0);   // T：黄色

                // ----- 仅保留圆心P0的文字标签 -----
                ctx.fillStyle = '#e8d0ff';
                ctx.font = 'bold 13px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('P₀', P0.x - 22, P0.y - 8);

                // ----- 力标签 -----
                ctx.font = 'bold 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                const gMidX = (P0.x + P1.x) / 2 + 28;
                const gMidY = (P0.y + P1.y) / 2;
                ctx.fillStyle = '#ff7070';
                ctx.fillText('G', gMidX, gMidY + 5);
                ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillStyle = 'rgba(255,100,100,0.45)';
                ctx.fillText('(重力↓·10N)', gMidX, gMidY + 19);
                ctx.font = 'bold 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';

                const fMidX = (P1.x + P2.x) / 2;
                const fMidY = (P1.y + P2.y) / 2 + 22;
                ctx.fillStyle = '#6dbfff';
                ctx.fillText('F', fMidX, fMidY + 5);
                ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillStyle = 'rgba(100,180,255,0.45)';
                ctx.fillText('(可变)', fMidX, fMidY + 19);
                ctx.font = 'bold 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';

                const tMidX = (P2.x + P0.x) / 2 - 28;
                const tMidY = (P2.y + P0.y) / 2;
                ctx.fillStyle = '#ffcc55';
                ctx.fillText('T', tMidX, tMidY + 5);
                ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillStyle = 'rgba(255,190,60,0.45)';
                ctx.fillText('(大小固定·5N)', tMidX, tMidY + 19);

                // ----- 圆上标注 -----
                ctx.fillStyle = 'rgba(170,150,210,0.5)';
                ctx.font = 'italic 11px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                const circLabelX = P0.x + radius + 24;
                const circLabelY = P0.y - 8;
                ctx.fillText('辅助圆', circLabelX, circLabelY);
                ctx.fillText('R=' + T_LEN + 'px', circLabelX, circLabelY + 16);

                // ----- 图例 -----
                ctx.fillStyle = 'rgba(200,210,230,0.5)';
                ctx.font = '11px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('辅助圆：|T|固定 → P₂轨迹为圆', 22, H - 18);
                ctx.fillText('∑F=0 ⇔ 三力首尾相连构成三角形', 22, H - 38);
            }

            // ---------- UI更新 ----------
            function updateUI() {
                const fN = (G_N / G_LEN) * getTriangle().fLen;
                const tN = T_N;
                angleDisplay.textContent = phiDeg.toFixed(1) + '°';
                gravityValEl.textContent = G_N.toFixed(2) + ' N（固定）';
                forceFValEl.textContent = fN.toFixed(2) + ' N';
                tensionValEl.textContent = tN.toFixed(2) + ' N（固定）';
                angleSlider.value = phiDeg;
            }

            function setPhi(deg) {
                phiDeg = Math.max(10, Math.min(170, deg));
                phiRad = phiDeg * Math.PI / 180;
                updateUI();
            }

            // ---------- 滑块事件 ----------
            angleSlider.addEventListener('input', () => {
                setPhi(parseFloat(angleSlider.value));
            });

            // ---------- 拖拽交互（在辅助圆上移动P2）----------
            let isDragging = false;

            function getCanvasPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * (W / rect.width),
                    y: (e.clientY - rect.top) * (H / rect.height)
                };
            }

            function isNearCircle(pos, threshold = 40) {
                const dist = Math.hypot(pos.x - P0.x, pos.y - P0.y);
                return Math.abs(dist - T_LEN) < threshold;
            }

            canvas.addEventListener('mousedown', (e) => {
                const pos = getCanvasPos(e);
                if (isNearCircle(pos)) {
                    isDragging = true;
                    wrapper.classList.add('dragging', 'near-node');
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                const pos = getCanvasPos(e);
                if (isDragging) {
                    const dx = pos.x - P0.x;
                    const dy = pos.y - P0.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const newP2 = {
                        x: P0.x + (dx / dist) * T_LEN,
                        y: P0.y + (dy / dist) * T_LEN
                    };
                    const newPhi = computePhiFromP2(newP2);
                    setPhi(newPhi);
                } else {
                    if (isNearCircle(pos)) {
                        wrapper.classList.add('near-node');
                    } else {
                        wrapper.classList.remove('near-node');
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    wrapper.classList.remove('dragging', 'near-node');
                }
            });

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    const pos = getCanvasPos(e.touches[0]);
                    if (isNearCircle(pos)) {
                        isDragging = true;
                        wrapper.classList.add('dragging', 'near-node');
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    const pos = getCanvasPos(e.touches[0]);
                    const dx = pos.x - P0.x;
                    const dy = pos.y - P0.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const newP2 = {
                        x: P0.x + (dx / dist) * T_LEN,
                        y: P0.y + (dy / dist) * T_LEN
                    };
                    const newPhi = computePhiFromP2(newP2);
                    setPhi(newPhi);
                    e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    wrapper.classList.remove('dragging', 'near-node');
                }
            });

            // ---------- 动画循环 ----------
            let frameCount = 0;

            function animate() {
                frameCount++;
                draw(frameCount);
                requestAnimationFrame(animate);
            }

            // ---------- 启动 ----------
            setPhi(30);
            updateUI();
            resizeCanvas();
            animate();

            console.log('🔮 辅助圆模型已启动 (无角度弧线/符号/顶点圆点)');
        })();
    </script>

    齐老师动画
</div>

    return false;
});
