        .controls {

        .control-group {

<body>

    <!-- 齐老师动画 - 顶部导航 -->
    <div class="qilaoshi-header">
        <div class="qilaoshi-title">齐老师动画</div>
    </div>
    <button class="qilaoshi-back-btn" onclick="window.location.href='../index.html'">← 返回主页</button>

    <div class="container">
        <div class="header">
            <div class="title-group">
                <div class="icon-laser">⚡</div>
                <div>
                    <div class="title">激光通过玻璃三棱镜</div>
                    <div class="subtitle">光的折射 · 斯涅尔定律</div>
                </div>
            </div>
            <div class="badge"><span class="dot"></span> n<sub>玻璃</sub> = 1.50</div>
        </div>
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="mainCanvas"></canvas>
            <div class="hint-drag" id="hintDrag">💡 在棱镜左侧区域拖拽可调节入射角</div>
        </div>
        <div class="controls">
            <div class="control-group">
                <span class="control-label">入射角 i</span>
                <input type="range" id="angleSlider" min="0" max="70" value="30" step="0.5">
                <span class="angle-value" id="angleDisplay">30.0°</span>
            </div>
            <div class="quick-btns" id="quickBtns">
                <button class="quick-btn" data-angle="0">0°</button>
                <button class="quick-btn" data-angle="15">15°</button>
                <button class="quick-btn active" data-angle="30">30°</button>
                <button class="quick-btn" data-angle="45">45°</button>
                <button class="quick-btn" data-angle="60">60°</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const canvasWrapper = document.getElementById('canvasWrapper');
            const angleSlider = document.getElementById('angleSlider');
            const angleDisplay = document.getElementById('angleDisplay');
            const hintDrag = document.getElementById('hintDrag');
            const quickBtns = document.getElementById('quickBtns');

            const n_air = 1.0,
                n_glass = 1.50;
            let incidentAngleDeg = 30;

            const DESIGN_WIDTH = 900,
                DESIGN_HEIGHT = 540;
            const DPR = Math.min(window.devicePixelRatio || 1, 2);

            const apex = { x: 450, y: 100 };
            const leftBase = { x: 220, y: 430 };
            const rightBase = { x: 680, y: 430 };

            const incidentPoint = {
                x: (apex.x + leftBase.x) / 2,
                y: (apex.y + leftBase.y) / 2
            };

            function resizeCanvas() {
                const w = canvasWrapper.clientWidth;
                const scale = w / DESIGN_WIDTH;
                canvas.style.width = w + 'px';
                canvas.style.height = (DESIGN_HEIGHT * scale) + 'px';
                canvas.width = DESIGN_WIDTH * DPR;
                canvas.height = DESIGN_HEIGHT * DPR;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(DPR, DPR);
            }
            window.addEventListener('resize', () => { resizeCanvas();
                draw(); });

            const vec = (x, y) => ({ x, y });
            const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
            const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
            const mul = (v, s) => ({ x: v.x * s, y: v.y * s });
            const dot = (a, b) => a.x * b.x + a.y * b.y;
            const len = v => Math.sqrt(v.x * v.x + v.y * v.y);
            const norm = v => { const l = len(v); return l > 1e-9 ? { x: v.x / l, y: v.y / l } : { x: 0, y: 0 }; };
            const cross2D = (a, b) => a.x * b.y - a.y * b.x;

            function refract(incident, normal, eta) {
                const cosI = -dot(incident, normal);
                const sinT2 = eta * eta * (1.0 - cosI * cosI);
                if (sinT2 > 1.0) return null;
                const cosT = Math.sqrt(1.0 - sinT2);
                return norm(add(mul(incident, eta), mul(normal, (eta * cosI - cosT))));
            }

            function reflect(incident, normal) {
                return sub(incident, mul(normal, 2 * dot(incident, normal)));
            }

            function raySegIntersect(p, d, v1, v2) {
                const e = sub(v2, v1);
                const denom = cross2D(d, e);
                if (Math.abs(denom) < 1e-8) return null;
                const t = cross2D(sub(v1, p), e) / denom;
                const u = cross2D(sub(v1, p), d) / denom;
                if (t > 1e-5 && u >= -1e-6 && u <= 1.000001) {
                    return { t, point: add(p, mul(d, t)) };
                }
                return null;
            }

            function computeRayPaths(incidentDeg) {
                const iRad = incidentDeg * Math.PI / 180;
                const leftEdgeDir = norm(sub(leftBase, apex));
                const nLeftOuter = norm({ x: -leftEdgeDir.y, y: leftEdgeDir.x });
                if (nLeftOuter.x > 0) { nLeftOuter.x = -nLeftOuter.x;
                    nLeftOuter.y = -nLeftOuter.y; }
                const inward = mul(nLeftOuter, -1);
                const d_in = norm(add(mul(inward, Math.cos(iRad)), mul(leftEdgeDir, -Math.sin(iRad))));
                const d_refr = refract(d_in, nLeftOuter, n_air / n_glass);
                if (!d_refr) return null;

                const hitRight = raySegIntersect(incidentPoint, d_refr, apex, rightBase);
                const hitBottom = raySegIntersect(incidentPoint, d_refr, leftBase, rightBase);
                let hitOut = null,
                    whichEdge = null;
                if (hitRight && hitBottom) {
                    hitOut = hitRight.t < hitBottom.t ? hitRight : hitBottom;
                    whichEdge = hitRight.t < hitBottom.t ? 'right' : 'bottom';
                } else if (hitRight) { hitOut = hitRight;
                    whichEdge = 'right'; } else if (hitBottom) { hitOut = hitBottom;
                    whichEdge = 'bottom'; }
                if (!hitOut) return null;
                const pointOut = hitOut.point;

                let nOuter;
                if (whichEdge === 'right') {
                    const rightDir = norm(sub(rightBase, apex));
                    nOuter = norm({ x: rightDir.y, y: -rightDir.x });
                    if (nOuter.x < 0) nOuter = mul(nOuter, -1);
                } else {
                    const bottomDir = norm(sub(rightBase, leftBase));
                    nOuter = norm({ x: -bottomDir.y, y: bottomDir.x });
                    if (nOuter.y > 0) nOuter = mul(nOuter, -1);
                }
                const nInner = mul(nOuter, -1);
                const d_out = refract(d_refr, nInner, n_glass / n_air);
                const d_refl = reflect(d_in, nLeftOuter);
                const d_refl_out = reflect(d_refr, nInner);

                return { d_in, d_refr, d_out, d_refl, d_refl_out, pointIn: incidentPoint, pointOut, nLeftOuter, nInner,
                    whichEdge };
            }

            function drawGridBackground() {
                const grad = ctx.createLinearGradient(0, 0, 0, DESIGN_HEIGHT);
                grad.addColorStop(0, '#0b0e14');
                grad.addColorStop(0.5, '#111620');
                grad.addColorStop(1, '#0a0d12');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
                ctx.strokeStyle = 'rgba(70,110,170,0.06)';
                ctx.lineWidth = 0.5;
                for (let x = 40; x < DESIGN_WIDTH; x += 40) { ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, DESIGN_HEIGHT);
                    ctx.stroke(); }
                for (let y = 40; y < DESIGN_HEIGHT; y += 40) { ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(DESIGN_WIDTH, y);
                    ctx.stroke(); }
                ctx.fillStyle = 'rgba(180,200,230,0.4)';
                ctx.font = 'italic 12px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText('空气 n=1.00', DESIGN_WIDTH - 30, 38);
                ctx.fillText('空气 n=1.00', DESIGN_WIDTH - 30, DESIGN_HEIGHT - 20);
            }

            function drawPrism() {
                ctx.save();
                ctx.shadowColor = 'rgba(70,150,240,0.45)';
                ctx.shadowBlur = 40;
                ctx.fillStyle = 'rgba(60,130,210,0.16)';
                ctx.beginPath();
                ctx.moveTo(apex.x, apex.y);
                ctx.lineTo(leftBase.x, leftBase.y);
                ctx.lineTo(rightBase.x, rightBase.y);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                const grad = ctx.createLinearGradient(apex.x, apex.y, (leftBase.x + rightBase.x) / 2, leftBase.y);
                grad.addColorStop(0, 'rgba(100,170,240,0.32)');
                grad.addColorStop(0.5, 'rgba(70,140,220,0.22)');
                grad.addColorStop(1, 'rgba(45,100,180,0.3)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(apex.x, apex.y);
                ctx.lineTo(leftBase.x, leftBase.y);
                ctx.lineTo(rightBase.x, rightBase.y);
                ctx.closePath();
                ctx.fill();

                ctx.shadowColor = 'rgba(100,180,255,0.6)';
                ctx.shadowBlur = 16;
                ctx.strokeStyle = 'rgba(150,200,255,0.75)';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(apex.x, apex.y);
                ctx.lineTo(leftBase.x, leftBase.y);
                ctx.lineTo(rightBase.x, rightBase.y);
                ctx.closePath();
                ctx.stroke();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
            }

            function drawDashedLine(x1, y1, x2, y2, color, lw) {
                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = lw;
                ctx.setLineDash([8, 5]);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }

            function drawRay(x1, y1, x2, y2, color, lw, glow) {
                ctx.save();
                if (glow) { ctx.shadowColor = glow;
                    ctx.shadowBlur = 14; }
                ctx.strokeStyle = color;
                ctx.lineWidth = lw;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                if (lw >= 2.5) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = lw * 0.35;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawArrowhead(x, y, angle, size, color) {
                ctx.save();
                ctx.fillStyle = color;
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-size * 0.8, -size * 0.5);
                ctx.lineTo(-size * 0.8, size * 0.5);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            function drawAllRays(p) {
                if (!p) return;
                const { d_in, d_refr, d_out, d_refl, d_refl_out, pointIn, pointOut, nLeftOuter, nInner, whichEdge } = p;

                // 入射光
                const incLen = 300;
                const incStart = sub(pointIn, mul(d_in, incLen));
                let sx = incStart.x,
                    sy = incStart.y;
                if (sx < 5) { const t = (pointIn.x - 5) / (pointIn.x - sx);
                    sx = 5;
                    sy = pointIn.y - (pointIn.y - sy) * t; }
                if (sy > DESIGN_HEIGHT - 5) { const t = (DESIGN_HEIGHT - 5 - pointIn.y) / (sy - pointIn.y);
                    sy = DESIGN_HEIGHT - 5;
                    sx = pointIn.x - (pointIn.x - sx) * t; }
                if (sy < 5) { const t = (pointIn.y - 5) / (pointIn.y - sy);
                    sy = 5;
                    sx = pointIn.x - (pointIn.x - sx) * t; }
                drawRay(sx, sy, pointIn.x, pointIn.y, '#ff4d6d', 3.5, '#ff3355');
                const incMid = mul(add({ x: sx, y: sy }, pointIn), 0.5);
                drawArrowhead(incMid.x, incMid.y, Math.atan2(d_in.y, d_in.x), 13, '#ff4d6d');

                // 入射点反射光
                const reflEnd = add(pointIn, mul(d_refl, 180));
                drawRay(pointIn.x, pointIn.y, Math.max(5, reflEnd.x), Math.min(DESIGN_HEIGHT - 5, Math.max(5, reflEnd.y)),
                    'rgba(255,130,130,0.4)', 1.6);
                const reflMid = mul(add(pointIn, reflEnd), 0.5);
                drawArrowhead(reflMid.x, reflMid.y, Math.atan2(d_refl.y, d_refl.x), 9, 'rgba(255,110,110,0.5)');

                // 玻璃内折射光
                drawRay(pointIn.x, pointIn.y, pointOut.x, pointOut.y, '#ff758c', 3.0, '#ff4d6d');
                const refrMid = mul(add(pointIn, pointOut), 0.5);
                drawArrowhead(refrMid.x, refrMid.y, Math.atan2(d_refr.y, d_refr.x), 11, '#ff758c');

                // 出射点反射光（在棱镜内部）
                if (d_refl_out) {
                    // 找出反射光与棱镜其他边的交点
                    let reflOutEnd = null;
                    const candidates = [];
                    if (whichEdge !== 'right') {
                        const h = raySegIntersect(pointOut, d_refl_out, apex, rightBase);
                        if (h) candidates.push({ ...h, edge: 'right' });
                    }
                    if (whichEdge !== 'bottom') {
                        const h = raySegIntersect(pointOut, d_refl_out, leftBase, rightBase);
                        if (h) candidates.push({ ...h, edge: 'bottom' });
                    }
                    if (whichEdge !== 'left') {
                        const h = raySegIntersect(pointOut, d_refl_out, apex, leftBase);
                        if (h) candidates.push({ ...h, edge: 'left' });
                    }
                    if (candidates.length > 0) {
                        candidates.sort((a, b) => a.t - b.t);
                        reflOutEnd = candidates[0].point;
                    }
                    if (!reflOutEnd) {
                        reflOutEnd = add(pointOut, mul(d_refl_out, 150));
                    }

                    const isTotalReflection = !d_out;
                    if (isTotalReflection) {
                        drawRay(pointOut.x, pointOut.y, reflOutEnd.x, reflOutEnd.y, '#ff758c', 3.0, '#ff4d6d');
                    } else {
                        drawRay(pointOut.x, pointOut.y, reflOutEnd.x, reflOutEnd.y, 'rgba(255,130,130,0.5)', 2.0);
                    }
                    const roMid = mul(add(pointOut, reflOutEnd), 0.5);
                    const roSize = isTotalReflection ? 11 : 8;
                    const roColor = isTotalReflection ? '#ff758c' : 'rgba(255,110,110,0.6)';
                    drawArrowhead(roMid.x, roMid.y, Math.atan2(d_refl_out.y, d_refl_out.x), roSize, roColor);
                }

                // 出射光
                if (d_out) {
                    const outEnd = add(pointOut, mul(d_out, 280));
                    drawRay(pointOut.x, pointOut.y,
                        Math.min(DESIGN_WIDTH - 5, Math.max(5, outEnd.x)),
                        Math.min(DESIGN_HEIGHT - 5, Math.max(5, outEnd.y)),
                        '#ff4d6d', 3.5, '#ff3355');
                    const outMid = mul(add(pointOut, outEnd), 0.5);
                    drawArrowhead(outMid.x, outMid.y, Math.atan2(d_out.y, d_out.x), 13, '#ff4d6d');
                }

                // 法线虚线
                const ext = 50;
                drawDashedLine(pointIn.x - nLeftOuter.x * ext, pointIn.y - nLeftOuter.y * ext,
                    pointIn.x + nLeftOuter.x * ext * 0.6, pointIn.y + nLeftOuter.y * ext * 0.6,
                    'rgba(180,200,230,0.5)', 1.0);
                if (pointOut && nInner) {
                    drawDashedLine(pointOut.x - nInner.x * ext, pointOut.y - nInner.y * ext,
                        pointOut.x + nInner.x * ext * 0.6, pointOut.y + nInner.y * ext * 0.6,
                        'rgba(180,200,230,0.5)', 1.0);
                }
            }

            function drawHighlights(p) {
                if (!p) return;
                const { pointIn, pointOut } = p;
                let g = ctx.createRadialGradient(pointIn.x, pointIn.y, 0, pointIn.x, pointIn.y, 11);
                g.addColorStop(0, 'rgba(255,255,255,0.95)');
                g.addColorStop(0.4, 'rgba(255,190,160,0.7)');
                g.addColorStop(1, 'rgba(255,80,60,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(pointIn.x, pointIn.y, 11, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(pointIn.x, pointIn.y, 3.5, 0, Math.PI * 2);
                ctx.fill();

                if (pointOut) {
                    g = ctx.createRadialGradient(pointOut.x, pointOut.y, 0, pointOut.x, pointOut.y, 10);
                    g.addColorStop(0, 'rgba(255,255,255,0.9)');
                    g.addColorStop(0.4, 'rgba(255,190,160,0.6)');
                    g.addColorStop(1, 'rgba(255,80,60,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(pointOut.x, pointOut.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(pointOut.x, pointOut.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function draw() {
                ctx.clearRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
                drawGridBackground();
                drawPrism();
                const paths = computeRayPaths(incidentAngleDeg);
                if (paths) {
                    drawAllRays(paths);
                    drawHighlights(paths);
                }
            }

            function updateUI() {
                angleSlider.value = incidentAngleDeg;
                angleDisplay.textContent = incidentAngleDeg.toFixed(1) + '°';
                quickBtns.querySelectorAll('.quick-btn').forEach(b => {
                    b.classList.toggle('active', Math.abs(parseFloat(b.dataset.angle) - incidentAngleDeg) < 0.3);
                });
                draw();
            }

            angleSlider.addEventListener('input', () => {
                incidentAngleDeg = parseFloat(angleSlider.value);
                updateUI();
            });
            quickBtns.addEventListener('click', e => {
                const btn = e.target.closest('.quick-btn');
                if (!btn) return;
                incidentAngleDeg = parseFloat(btn.dataset.angle);
                updateUI();
            });

            let isDragging = false;

            function getCanvasPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = DESIGN_WIDTH / rect.width,
                    scaleY = DESIGN_HEIGHT / rect.height;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
            }

            function getAngleFromMouse(pos) {
                const leftEdgeDir = norm(sub(leftBase, apex));
                const nOuter = norm({ x: -leftEdgeDir.y, y: leftEdgeDir.x });
                if (nOuter.x > 0) { nOuter.x = -nOuter.x;
                    nOuter.y = -nOuter.y; }
                const toMouse = norm(sub(pos, incidentPoint));
                const dotVal = dot(toMouse, nOuter);
                const angle = Math.acos(Math.max(-1, Math.min(1, dotVal))) * 180 / Math.PI;
                return Math.max(0, Math.min(70, angle));
            }

            canvas.addEventListener('mousedown', e => {
                const pos = getCanvasPos(e);
                if (pos.x < incidentPoint.x + 80 && pos.x > 10 && pos.y > incidentPoint.y - 100 && pos.y <
                    DESIGN_HEIGHT - 10) {
                    isDragging = true;
                    canvasWrapper.classList.add('dragging');
                    hintDrag.style.opacity = '0';
                    incidentAngleDeg = getAngleFromMouse(pos);
                    updateUI();
                    e.preventDefault();
                }
            });
            canvas.addEventListener('mousemove', e => {
                if (isDragging) {
                    incidentAngleDeg = getAngleFromMouse(getCanvasPos(e));
                    updateUI();
                }
            });
            window.addEventListener('mouseup', () => {
                if (isDragging) { isDragging = false;
                    canvasWrapper.classList.remove('dragging'); }
            });
            canvas.addEventListener('touchstart', e => {
                const pos = getCanvasPos(e);
                if (pos.x < incidentPoint.x + 80 && pos.x > 10 && pos.y > incidentPoint.y - 100 && pos.y <
                    DESIGN_HEIGHT - 10) {
                    isDragging = true;
                    canvasWrapper.classList.add('dragging');
                    hintDrag.style.opacity = '0';
                    incidentAngleDeg = getAngleFromMouse(pos);
                    updateUI();
                    e.preventDefault();
                }
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                if (isDragging) {
                    incidentAngleDeg = getAngleFromMouse(getCanvasPos(e));
                    updateUI();
                    e.preventDefault();
                }
            }, { passive: false });
            canvas.addEventListener('touchend', () => {
                if (isDragging) { isDragging = false;
                    canvasWrapper.classList.remove('dragging'); }
            });

            document.addEventListener('keydown', e => {
                if (e.target.tagName === 'INPUT' && e.target.type === 'range') return;
                if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    incidentAngleDeg = Math.min(70, incidentAngleDeg + 1);
                    updateUI();
                }
                if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    incidentAngleDeg = Math.max(0, incidentAngleDeg - 1);
                    updateUI();
                }
            });

            setTimeout(() => { hintDrag.style.opacity = '0.8';
                setTimeout(() => hintDrag.style.opacity = '0', 5000); }, 1500);

            resizeCanvas();
            updateUI();
        })();
    </script>

    <script>
    (function() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // ESC键返回主页
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                window.location.href = '../index.html';
            }
        });
        
        // 禁用开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });
        
        // 检测开发者工具打开（简单检测）
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthThreshold = window.outerWidth - window.innerWidth > threshold;
            var heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // 可以选择跳转或其他操作
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    })();
    </script>
