<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多普勒效应 - 声波动画演示</title>
    <style>
        :root {
            --bg: #0a0e17;
            --panel-bg: #111827;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #f97316;
            --accent2: #3b82f6;
            --slider-track: #1e293b;
            --slider-fill: #f97316;
            --border: #1e293b;
            --card: #1a1f2e;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #eab308;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 标题区 */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            white-space: nowrap;
        }
        .header .badge {
            display: inline-block;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .mach-display {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .mach-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.03em;
            min-width: 54px;
            text-align: center;
            transition: color 0.3s;
        }
        .mach-value.subsonic {
            color: #22c55e;
        }
        .mach-value.transonic {
            color: #eab308;
        }
        .mach-value.supersonic {
            color: #ef4444;
        }

        /* Canvas 容器 */
        .canvas-wrapper {
            position: relative;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            aspect-ratio: 16/10;
            min-height: 340px;
            cursor: default;
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .canvas-overlay {
            position: absolute;
            top: 12px;
            left: 16px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .overlay-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        .overlay-label.high-freq {
            border-left: 3px solid #f97316;
        }
        .overlay-label.low-freq {
            border-left: 3px solid #3b82f6;
        }
        .pause-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            display: none;
            z-index: 5;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }
        .canvas-wrapper.paused .pause-indicator {
            display: block;
        }

        /* 控制面板 */
        .controls {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 18px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 90px;
            flex: 1;
            max-width: 200px;
        }
        .control-group.wide {
            flex: 1.5;
            max-width: 260px;
        }
        .control-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .control-group label .icon {
            font-size: 1rem;
        }
        .control-value {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
            min-width: 38px;
            text-align: right;
            white-space: nowrap;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 7px;
            border-radius: 10px;
            background: var(--slider-track);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }
        #speedSlider {
            accent-color: var(--accent);
        }
        #speedSlider::-webkit-slider-thumb {
            border-color: var(--accent);
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            padding: 9px 16px;
            border-radius: 22px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }
        button:hover {
            background: #2a3040;
            border-color: #4a5568;
        }
        button:active {
            transform: scale(0.96);
            transition: transform 0.05s;
        }
        button.active-btn {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: 700;
        }
        button.preset-btn {
            font-size: 0.72rem;
            padding: 7px 12px;
            border-radius: 16px;
        }
        #pauseBtn {
            min-width: 70px;
            font-size: 0.85rem;
        }
        #resetBtn {
            background: transparent;
            border-color: #475569;
        }
        #autoRotateBtn {
            font-size: 0.75rem;
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .controls {
                gap: 12px;
                padding: 14px;
            }
            .control-group {
                min-width: 70px;
                flex: 1 1 40%;
                max-width: none;
            }
            .control-group.wide {
                flex: 1 1 100%;
                max-width: none;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .mach-value {
                font-size: 1.4rem;
                min-width: 42px;
            }
            .btn-row {
                width: 100%;
                justify-content: center;
            }
            button {
                padding: 7px 12px;
                font-size: 0.7rem;
            }
        }
    </style>

<body>

    <!-- 齐老师动画 - 顶部导航 -->
    <div class="qilaoshi-header">
        <div class="qilaoshi-title">齐老师动画</div>
    </div>
    <button class="qilaoshi-back-btn" onclick="window.location.href='../index.html'">← 返回主页</button>

    <div class="main-container">
        <!-- 标题 -->
        <div class="header">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <h1>🌊 多普勒效应</h1>
                <span class="badge">声波动画</span>
            </div>
            <div class="mach-display">
                马赫数 <span class="mach-value subsonic" id="machDisplay">0.70</span>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="mainCanvas"></canvas>
            <div class="canvas-overlay">
                <span class="overlay-label high-freq">🔴 高频区（波压缩）</span>
                <span class="overlay-label low-freq">🔵 低频区（波拉伸）</span>
            </div>
            <div class="pause-indicator" id="pauseIndicator">⏸</div>
        </div>

        <!-- 控制面板 -->
        <div class="controls" id="controlPanel">
            <div class="control-group wide">
                <label><span class="icon">🚀</span> 声源速度（马赫）<span class="control-value" id="speedLabel">0.70 Ma</span></label>
                <input type="range" id="speedSlider" min="0" max="200" value="70" step="1">
            </div>
            <div class="control-group">
                <label><span class="icon">🧭</span> 移动方向 <span class="control-value" id="angleLabel">0°</span></label>
                <input type="range" id="angleSlider" min="0" max="360" value="0" step="1">
            </div>
            <div class="control-group">
                <label><span class="icon">📡</span> 波频率 <span class="control-value" id="freqLabel">8 Hz</span></label>
                <input type="range" id="freqSlider" min="3" max="20" value="8" step="0.5">
            </div>
            <div class="btn-row">
                <button id="pauseBtn" title="暂停/播放动画">⏯ 暂停</button>
                <button id="resetBtn" title="重置声源位置">🔄 重置</button>
                <button id="autoRotateBtn" title="自动旋转方向">🔄 自动旋转</button>
            </div>
            <div class="btn-row" style="margin-top:4px;">
                <button class="preset-btn" data-speed="0">静止 0</button>
                <button class="preset-btn" data-speed="30">低速 0.3</button>
                <button class="preset-btn" data-speed="70">中速 0.7</button>
                <button class="preset-btn" data-speed="95">近音速 0.95</button>
                <button class="preset-btn" data-speed="130">超音速 1.3</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== DOM 元素 ====================
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('canvasWrapper');
            const pauseIndicator = document.getElementById('pauseIndicator');
            const machDisplay = document.getElementById('machDisplay');
            const speedLabel = document.getElementById('speedLabel');
            const angleLabel = document.getElementById('angleLabel');
            const freqLabel = document.getElementById('freqLabel');
            const speedSlider = document.getElementById('speedSlider');
            const angleSlider = document.getElementById('angleSlider');
            const freqSlider = document.getElementById('freqSlider');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');
            const autoRotateBtn = document.getElementById('autoRotateBtn');
            const presetBtns = document.querySelectorAll('.preset-btn');

            // ==================== 参数 ====================
            const SOUND_SPEED = 280; // 声速（像素/秒，canvas坐标）
            let sourceSpeedRatio = 0.70; // 声源速度 / 声速（马赫数）
            let sourceAngleDeg = 0; // 方向角度（度，0=右，90=下）
            let waveFreq = 8; // 波发出频率（Hz）
            let isPaused = false;
            let autoRotate = false;
            let autoRotateSpeed = 45; // 自动旋转速度（度/秒）

            // ==================== 声源状态 ====================
            let sourceX, sourceY;
            let sourceVx, sourceVy;
            const SOURCE_RADIUS = 9;

            // ==================== 波列表 ====================
            // 每个波: { cx, cy, emitTime, index }
            let waves = [];
            let waveIndexCounter = 0;
            let nextEmitTime = 0;

            // ==================== Canvas尺寸 ====================
            let canvasWidth, canvasHeight;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);

            function resizeCanvas() {
                const rect = wrapper.getBoundingClientRect();
                canvasWidth = rect.width;
                canvasHeight = rect.height;
                canvas.width = canvasWidth * dpr;
                canvas.height = canvasHeight * dpr;
                canvas.style.width = canvasWidth + 'px';
                canvas.style.height = canvasHeight + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                // 如果声源超出新边界，调整
                if (sourceX !== undefined) {
                    sourceX = Math.max(SOURCE_RADIUS, Math.min(canvasWidth - SOURCE_RADIUS, sourceX));
                    sourceY = Math.max(SOURCE_RADIUS, Math.min(canvasHeight - SOURCE_RADIUS, sourceY));
                }
            }

            // ==================== 初始化/重置 ====================
            function resetSource(clearWaves = true) {
                sourceX = canvasWidth * 0.35;
                sourceY = canvasHeight * 0.5;
                updateVelocity();
                if (clearWaves) {
                    waves = [];
                    waveIndexCounter = 0;
                    nextEmitTime = 0;
                    // 创建历史波（模拟声源已经运行了一段时间）
                    createHistoryWaves();
                }
            }

            function updateVelocity() {
                const speed = sourceSpeedRatio * SOUND_SPEED;
                const rad = sourceAngleDeg * Math.PI / 180;
                sourceVx = speed * Math.cos(rad);
                sourceVy = speed * Math.sin(rad);
            }

            function createHistoryWaves() {
                // 模拟过去2.5秒的历史
                const historyDuration = 2.5;
                const now = getCurrentTime();
                const emitInterval = 1.0 / waveFreq;
                // 计算历史中声源的位置轨迹
                // 从最早到最近
                const numHistory = Math.floor(historyDuration / emitInterval);
                for (let i = numHistory; i >= 1; i--) {
                    const emitTime = now - i * emitInterval;
                    const age = now - emitTime;
                    // 声源在emitTime时的位置
                    const hx = sourceX - sourceVx * age;
                    const hy = sourceY - sourceVy * age;
                    // 只添加在画布内或附近的波
                    if (hx > -200 && hx < canvasWidth + 200 && hy > -200 && hy < canvasHeight + 200) {
                        waves.push({
                            cx: hx,
                            cy: hy,
                            emitTime: emitTime,
                            index: waveIndexCounter++
                        });
                    }
                }
                nextEmitTime = now + emitInterval;
            }

            function getCurrentTime() {
                return performance.now() / 1000;
            }

            function fullReset() {
                resizeCanvas();
                resetSource(true);
                updateVelocity();
                // 重置nextEmitTime
                nextEmitTime = getCurrentTime() + 1.0 / waveFreq;
            }

            // ==================== 动画循环 ====================
            let lastFrameTime = getCurrentTime();
            let animFrameId;

            function animate(timestamp) {
                animFrameId = requestAnimationFrame(animate);

                const now = timestamp / 1000;
                let dt = now - lastFrameTime;
                if (dt <= 0) dt = 0.016;
                if (dt > 0.1) dt = 0.1; // 防止大帧跳跃
                lastFrameTime = now;

                if (!isPaused && dt > 0.0001) {
                    update(dt, now);
                }

                render(now);
            }

            function update(dt, now) {
                // 自动旋转
                if (autoRotate) {
                    sourceAngleDeg = (sourceAngleDeg + autoRotateSpeed * dt) % 360;
                    if (sourceAngleDeg < 0) sourceAngleDeg += 360;
                    updateVelocity();
                    // 更新滑块
                    angleSlider.value = Math.round(sourceAngleDeg);
                    angleLabel.textContent = Math.round(sourceAngleDeg) + '°';
                }

                // 移动声源
                sourceX += sourceVx * dt;
                sourceY += sourceVy * dt;

                // 边界反弹
                let bounced = false;
                if (sourceX < SOURCE_RADIUS) {
                    sourceX = SOURCE_RADIUS;
                    sourceVx = Math.abs(sourceVx);
                    bounced = true;
                } else if (sourceX > canvasWidth - SOURCE_RADIUS) {
                    sourceX = canvasWidth - SOURCE_RADIUS;
                    sourceVx = -Math.abs(sourceVx);
                    bounced = true;
                }
                if (sourceY < SOURCE_RADIUS) {
                    sourceY = SOURCE_RADIUS;
                    sourceVy = Math.abs(sourceVy);
                    bounced = true;
                } else if (sourceY > canvasHeight - SOURCE_RADIUS) {
                    sourceY = canvasHeight - SOURCE_RADIUS;
                    sourceVy = -Math.abs(sourceVy);
                    bounced = true;
                }

                // 反弹后更新速度和方向显示
                if (bounced && !autoRotate) {
                    const speed = Math.sqrt(sourceVx * sourceVx + sourceVy * sourceVy);
                    const newAngleRad = Math.atan2(sourceVy, sourceVx);
                    sourceAngleDeg = newAngleRad * 180 / Math.PI;
                    if (sourceAngleDeg < 0) sourceAngleDeg += 360;
                    // 更新速度分量以保持一致
                    sourceVx = speed * Math.cos(newAngleRad);
                    sourceVy = speed * Math.sin(newAngleRad);
                    // 更新sourceSpeedRatio
                    sourceSpeedRatio = speed / SOUND_SPEED;
                    // 更新UI
                    speedSlider.value = Math.round(sourceSpeedRatio * 100);
                    speedLabel.textContent = sourceSpeedRatio.toFixed(2) + ' Ma';
                    angleSlider.value = Math.round(sourceAngleDeg);
                    angleLabel.textContent = Math.round(sourceAngleDeg) + '°';
                    updateMachDisplay();
                }

                // 发出新波
                while (now >= nextEmitTime && waveFreq > 0.01) {
                    waves.push({
                        cx: sourceX,
                        cy: sourceY,
                        emitTime: nextEmitTime,
                        index: waveIndexCounter++
                    });
                    nextEmitTime += 1.0 / waveFreq;
                }

                // 如果波频率改变导致nextEmitTime落后太多，调整
                if (now - nextEmitTime > 2.0 / waveFreq) {
                    nextEmitTime = now + 1.0 / waveFreq;
                }

                // 移除超出画布的波
                const maxRadius = Math.sqrt(canvasWidth * canvasWidth + canvasHeight * canvasHeight) + 100;
                const maxAge = maxRadius / SOUND_SPEED;
                const cutoffTime = now - maxAge;
                waves = waves.filter(w => w.emitTime > cutoffTime);

                // 限制波的总数（安全措施）
                if (waves.length > 200) {
                    waves = waves.slice(waves.length - 150);
                }
            }

            function render(now) {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);

                // 背景网格
                drawGrid();

                // 计算声源前方和后方的参考向量（用于着色）
                const speedMag = Math.sqrt(sourceVx * sourceVx + sourceVy * sourceVy);
                const dirX = speedMag > 0.01 ? sourceVx / speedMag : Math.cos(sourceAngleDeg * Math.PI / 180);
                const dirY = speedMag > 0.01 ? sourceVy / speedMag : Math.sin(sourceAngleDeg * Math.PI / 180);

                // 绘制所有波圆
                for (const wave of waves) {
                    const age = now - wave.emitTime;
                    const radius = SOUND_SPEED * age;
                    if (radius < 0) continue;

                    // 计算波相对于当前声源位置的方向
                    const dx = wave.cx - sourceX;
                    const dy = wave.cy - sourceY;
                    const distToSource = Math.sqrt(dx * dx + dy * dy);
                    let dotProduct = 0;
                    if (distToSource > 0.5) {
                        dotProduct = (dx * dirX + dy * dirY) / distToSource;
                    }

                    // dotProduct > 0 表示波在声源前方（被压缩），< 0 在后方（被拉伸）
                    const alpha = Math.max(0.35, 0.85 - age / 4.5);
                    const hue = 30 - dotProduct * 25; // 前方暖色(≈30°橙)，后方冷色(≈5°红偏紫或-5→355)
                    const saturation = 75 + dotProduct * 15;
                    const lightness = 52 + dotProduct * 8;

                    const color = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
                    const lineWidth = 1.2 + (1.0 - Math.min(age / 3.5, 1)) * 1.3;

                    ctx.beginPath();
                    ctx.arc(wave.cx, wave.cy, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = lineWidth;
                    ctx.stroke();

                    // 对较新的波添加微弱发光
                    if (age < 1.0) {
                        ctx.beginPath();
                        ctx.arc(wave.cx, wave.cy, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha * 0.25})`;
                        ctx.lineWidth = lineWidth + 3;
                        ctx.stroke();
                    }
                }

                // 绘制声源轨迹（最近的小点）
                drawSourceTrail(now);

                // 绘制声源
                drawSource(now);

                // 绘制方向箭头
                drawDirectionArrow();

                // 绘制图例信息
                drawLegend();
            }

            function drawGrid() {
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 1;
                const spacing = 60;
                for (let x = spacing; x < canvasWidth; x += spacing) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvasHeight);
                    ctx.stroke();
                }
                for (let y = spacing; y < canvasHeight; y += spacing) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvasWidth, y);
                    ctx.stroke();
                }
            }

            function drawSourceTrail(now) {
                // 绘制声源最近位置的小点轨迹
                const trailDuration = 1.5;
                const numDots = 18;
                const dt_trail = trailDuration / numDots;
                for (let i = 1; i <= numDots; i++) {
                    const t = now - i * dt_trail;
                    const age = i * dt_trail;
                    const tx = sourceX - sourceVx * age;
                    const ty = sourceY - sourceVy * age;
                    if (tx > -20 && tx < canvasWidth + 20 && ty > -20 && ty < canvasHeight + 20) {
                        const alpha = 0.35 * (1 - i / numDots);
                        const dotRadius = 2.5 * (1 - i / numDots);
                        ctx.beginPath();
                        ctx.arc(tx, ty, dotRadius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,180,120,${alpha})`;
                        ctx.fill();
                    }
                }
            }

            function drawSource(now) {
                // 声源光晕
                const glowGrad = ctx.createRadialGradient(sourceX, sourceY, SOURCE_RADIUS * 0.4,
                    sourceX, sourceY, SOURCE_RADIUS * 2.5);
                glowGrad.addColorStop(0, 'rgba(255,200,100,0.9)');
                glowGrad.addColorStop(0.4, 'rgba(255,140,50,0.5)');
                glowGrad.addColorStop(1, 'rgba(255,80,20,0)');
                ctx.beginPath();
                ctx.arc(sourceX, sourceY, SOURCE_RADIUS * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = glowGrad;
                ctx.fill();

                // 声源主体
                const bodyGrad = ctx.createRadialGradient(sourceX - SOURCE_RADIUS * 0.25,
                    sourceY - SOURCE_RADIUS * 0.3, SOURCE_RADIUS * 0.15,
                    sourceX, sourceY, SOURCE_RADIUS);
                bodyGrad.addColorStop(0, '#fffef5');
                bodyGrad.addColorStop(0.35, '#ffcc70');
                bodyGrad.addColorStop(0.75, '#f97316');
                bodyGrad.addColorStop(1, '#c2410c');
                ctx.beginPath();
                ctx.arc(sourceX, sourceY, SOURCE_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = bodyGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 高光点
                ctx.beginPath();
                ctx.arc(sourceX - SOURCE_RADIUS * 0.28, sourceY - SOURCE_RADIUS * 0.32,
                    SOURCE_RADIUS * 0.28, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fill();
            }

            function drawDirectionArrow() {
                const speedMag = Math.sqrt(sourceVx * sourceVx + sourceVy * sourceVy);
                if (speedMag < 0.5) return;
                const arrowLen = 22 + speedMag / SOUND_SPEED * 28;
                const tipX = sourceX + (sourceVx / speedMag) * arrowLen;
                const tipY = sourceY + (sourceVy / speedMag) * arrowLen;
                const baseX = sourceX + (sourceVx / speedMag) * (SOURCE_RADIUS + 3);
                const baseY = sourceY + (sourceVy / speedMag) * (SOURCE_RADIUS + 3);

                // 箭杆
                ctx.beginPath();
                ctx.moveTo(baseX, baseY);
                ctx.lineTo(tipX, tipY);
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.stroke();

                // 箭头
                const arrowAngle = Math.atan2(sourceVy, sourceVx);
                const arrowSize = 9;
                const a1 = arrowAngle + Math.PI * 0.7;
                const a2 = arrowAngle - Math.PI * 0.7;
                ctx.beginPath();
                ctx.moveTo(tipX, tipY);
                ctx.lineTo(tipX + arrowSize * Math.cos(a1), tipY + arrowSize * Math.sin(a1));
                ctx.lineTo(tipX + arrowSize * Math.cos(a2), tipY + arrowSize * Math.sin(a2));
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fill();
            }

            function drawLegend() {
                // 底部中央的小图例
                const lx = canvasWidth / 2;
                const ly = canvasHeight - 22;
                const txt = sourceSpeedRatio < 0.01 ?
                    '声源静止 — 同心圆' :
                    sourceSpeedRatio < 0.98 ?
                    '前方波压缩（高频）  ← 声源移动方向 →  后方波拉伸（低频）' :
                    sourceSpeedRatio < 1.02 ?
                    '⚠ 音障 — 波在声源前方堆积' :
                    '💥 马赫锥 — 声源超越声波';
                ctx.font = '600 12px "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif';
                const textWidth = ctx.measureText(txt).width;
                const padding = 14;
                const bgHeight = 28;
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.beginPath();
                ctx.roundRect(lx - textWidth / 2 - padding, ly - bgHeight / 2,
                    textWidth + padding * 2, bgHeight, 14);
                ctx.fill();
                ctx.fillStyle = '#e2e8f0';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(txt, lx, ly);
                ctx.textAlign = 'start';
                ctx.textBaseline = 'alphabetic';
            }

            function updateMachDisplay() {
                const ma = sourceSpeedRatio;
                machDisplay.textContent = ma.toFixed(2);
                machDisplay.classList.remove('subsonic', 'transonic', 'supersonic');
                if (ma < 0.85) machDisplay.classList.add('subsonic');
                else if (ma < 1.05) machDisplay.classList.add('transonic');
                else machDisplay.classList.add('supersonic');
                speedLabel.textContent = ma.toFixed(2) + ' Ma';
            }

            // ==================== 事件处理 ====================
            speedSlider.addEventListener('input', () => {
                sourceSpeedRatio = parseInt(speedSlider.value) / 100;
                updateVelocity();
                updateMachDisplay();
                // 改变速度时重建历史波
                rebuildWaves();
            });

            angleSlider.addEventListener('input', () => {
                if (autoRotate) return;
                sourceAngleDeg = parseInt(angleSlider.value);
                updateVelocity();
                angleLabel.textContent = Math.round(sourceAngleDeg) + '°';
                rebuildWaves();
            });

            freqSlider.addEventListener('input', () => {
                waveFreq = parseFloat(freqSlider.value);
                freqLabel.textContent = waveFreq.toFixed(1) + ' Hz';
                rebuildWaves();
            });

            function rebuildWaves() {
                waves = [];
                waveIndexCounter = 0;
                nextEmitTime = getCurrentTime() + 1.0 / waveFreq;
                createHistoryWaves();
            }

            pauseBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                if (isPaused) {
                    pauseBtn.textContent = '▶ 播放';
                    pauseBtn.classList.add('active-btn');
                    wrapper.classList.add('paused');
                } else {
                    pauseBtn.textContent = '⏯ 暂停';
                    pauseBtn.classList.remove('active-btn');
                    wrapper.classList.remove('paused');
                    lastFrameTime = getCurrentTime();
                    // 调整nextEmitTime
                    if (nextEmitTime < getCurrentTime()) {
                        nextEmitTime = getCurrentTime() + 1.0 / waveFreq;
                    }
                }
            });

            resetBtn.addEventListener('click', () => {
                sourceSpeedRatio = 0.70;
                sourceAngleDeg = 0;
                waveFreq = 8;
                autoRotate = false;
                isPaused = false;
                speedSlider.value = 70;
                angleSlider.value = 0;
                freqSlider.value = 8;
                speedLabel.textContent = '0.70 Ma';
                angleLabel.textContent = '0°';
                freqLabel.textContent = '8.0 Hz';
                pauseBtn.textContent = '⏯ 暂停';
                pauseBtn.classList.remove('active-btn');
                wrapper.classList.remove('paused');
                autoRotateBtn.textContent = '🔄 自动旋转';
                autoRotateBtn.classList.remove('active-btn');
                updateMachDisplay();
                updateVelocity();
                fullReset();
                lastFrameTime = getCurrentTime();
            });

            autoRotateBtn.addEventListener('click', () => {
                autoRotate = !autoRotate;
                if (autoRotate) {
                    autoRotateBtn.textContent = '🔄 停止旋转';
                    autoRotateBtn.classList.add('active-btn');
                    angleSlider.disabled = true;
                } else {
                    autoRotateBtn.textContent = '🔄 自动旋转';
                    autoRotateBtn.classList.remove('active-btn');
                    angleSlider.disabled = false;
                    angleSlider.value = Math.round(sourceAngleDeg);
                    angleLabel.textContent = Math.round(sourceAngleDeg) + '°';
                }
            });

            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const speedVal = parseInt(btn.dataset.speed);
                    sourceSpeedRatio = speedVal / 100;
                    speedSlider.value = speedVal;
                    updateVelocity();
                    updateMachDisplay();
                    rebuildWaves();
                    // 高亮预设按钮
                    presetBtns.forEach(b => b.classList.remove('active-btn'));
                    btn.classList.add('active-btn');
                    setTimeout(() => btn.classList.remove('active-btn'), 600);
                });
            });

            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return; // 不拦截滑块输入
                switch (e.key.toLowerCase()) {
                    case ' ':
                        e.preventDefault();
                        pauseBtn.click();
                        break;
                    case 'r':
                        if (!e.ctrlKey && !e.metaKey) {
                            resetBtn.click();
                        }
                        break;
                    case 'a':
                        autoRotateBtn.click();
                        break;
                    case 'arrowleft':
                        if (!autoRotate) {
                            sourceAngleDeg = (sourceAngleDeg - 5 + 360) % 360;
                            angleSlider.value = Math.round(sourceAngleDeg);
                            angleLabel.textContent = Math.round(sourceAngleDeg) + '°';
                            updateVelocity();
                            rebuildWaves();
                        }
                        break;
                    case 'arrowright':
                        if (!autoRotate) {
                            sourceAngleDeg = (sourceAngleDeg + 5) % 360;
                            angleSlider.value = Math.round(sourceAngleDeg);
                            angleLabel.textContent = Math.round(sourceAngleDeg) + '°';
                            updateVelocity();
                            rebuildWaves();
                        }
                        break;
                    case 'arrowup':
                        sourceSpeedRatio = Math.min(2.0, sourceSpeedRatio + 0.05);
                        speedSlider.value = Math.round(sourceSpeedRatio * 100);
                        updateVelocity();
                        updateMachDisplay();
                        rebuildWaves();
                        break;
                    case 'arrowdown':
                        sourceSpeedRatio = Math.max(0, sourceSpeedRatio - 0.05);
                        speedSlider.value = Math.round(sourceSpeedRatio * 100);
                        updateVelocity();
                        updateMachDisplay();
                        rebuildWaves();
                        break;
                }
            });

            // Canvas点击切换暂停
            canvas.addEventListener('click', (e) => {
                // 双击切换暂停
                if (e.detail === 2) {
                    pauseBtn.click();
                }
            });

            // 窗口大小调整
            window.addEventListener('resize', () => {
                resizeCanvas();
                // 调整声源位置使其仍在画布内
                sourceX = Math.max(SOURCE_RADIUS, Math.min(canvasWidth - SOURCE_RADIUS, sourceX));
                sourceY = Math.max(SOURCE_RADIUS, Math.min(canvasHeight - SOURCE_RADIUS, sourceY));
                // 重建波
                rebuildWaves();
            });

            // 触摸设备双击
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    const now = Date.now();
                    if (now - (canvas._lastTap || 0) < 300) {
                        e.preventDefault();
                        pauseBtn.click();
                    }
                    canvas._lastTap = now;
                }
            }, { passive: false });

            // ==================== 启动 ====================
            function init() {
                resizeCanvas();
                sourceX = canvasWidth * 0.35;
                sourceY = canvasHeight * 0.5;
                updateVelocity();
                waves = [];
                waveIndexCounter = 0;
                nextEmitTime = getCurrentTime() + 1.0 / waveFreq;
                createHistoryWaves();
                updateMachDisplay();
                lastFrameTime = getCurrentTime();
                animFrameId = requestAnimationFrame(animate);
            }

            // roundRect polyfill（部分浏览器可能不支持）
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    ctx.beginPath();
                    ctx.moveTo(x + r.tl, y);
                    ctx.lineTo(x + w - r.tr, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    ctx.lineTo(x + w, y + h - r.br);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    ctx.lineTo(x + r.bl, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    ctx.lineTo(x, y + r.tl);
                    ctx.quadraticCurveTo(x, y, x + r.tl, y);
                    ctx.closePath();
                };
            }

            init();

            // ==================== 清理 ====================
            // 页面卸载时取消动画帧
            window.addEventListener('beforeunload', () => {
                if (animFrameId) cancelAnimationFrame(animFrameId);
            });

            console.log('🌊 多普勒效应动画已就绪');
            console.log('  🖱 拖拽滑块调节参数');
            console.log('  ⌨ 键盘快捷键: 空格=暂停, 方向键=调节方向/速度, A=自动旋转, R=重置');
            console.log('  👆 双击画布=暂停/播放');
        })();
    </script>

    <script>
    (function() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // ESC键返回主页
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                window.location.href = '../index.html';
            }
        });
        
        // 禁用开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });
        
        // 检测开发者工具打开（简单检测）
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthThreshold = window.outerWidth - window.innerWidth > threshold;
            var heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // 可以选择跳转或其他操作
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    })();
    </script>
