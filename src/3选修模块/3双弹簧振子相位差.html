<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>双弹簧振子 · 红蓝发光球 | 开始/重置 | 红先蓝后</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #030617, #00010a);
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', 'Roboto', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: auto;
        }
        
        /* 动态星光闪烁叠加层 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 20px 40px, #fff, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 80px 240px, #ffd, rgba(0,0,0,0)),
                              radial-gradient(3px 3px at 320px 120px, #cfe, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 550px 450px, #fff, rgba(0,0,0,0));
            background-repeat: no-repeat;
            background-size: 200px 200px, 300px 300px, 400px 400px, 250px 250px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            animation: starTwinkle 8s infinite alternate;
        }
        
        @keyframes starTwinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .card {
            position: relative;
            background: rgba(6, 12, 24, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 1.5rem 2rem 2rem 2rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 210, 255, 0.3);
            z-index: 2;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 1.5rem;
            box-shadow: 0 0 28px rgba(0, 180, 255, 0.25), 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: box-shadow 0.3s;
        }
        
        canvas:hover {
            box-shadow: 0 0 38px rgba(0, 210, 255, 0.5), 0 18px 40px rgba(0, 0, 0, 0.7);
        }

        .control-panel {
            margin-top: 1.8rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            background: rgba(8, 16, 30, 0.75);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid rgba(0, 230, 255, 0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .delay-selector {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .delay-btn {
            background: linear-gradient(135deg, #2a3a5a, #1a2a4a);
            border: 1px solid #3a86ff;
            color: #aaccff;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 1.5rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            box-shadow: 0 0 5px rgba(58, 134, 255, 0.3);
        }

        .delay-btn:hover {
            background: linear-gradient(135deg, #3a4a6a, #2a3a5a);
            box-shadow: 0 0 10px rgba(58, 134, 255, 0.5);
        }

        .delay-btn.active {
            background: linear-gradient(135deg, #3a86ff, #164a8a);
            color: white;
            box-shadow: 0 0 12px #3a86ff;
            border-color: #5a9eff;
        }

        .slider-container {
            flex: 2;
            min-width: 160px;
        }

        .phase-value {
            flex: 1;
            background: #0a1025;
            color: #ff5a6e;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            font-family: 'Orbitron', monospace;
            box-shadow: inset 0 0 8px rgba(255, 80, 100, 0.3), 0 2px 8px rgba(0,0,0,0.4);
            border: 1px solid #ff5a6e;
        }

        .button-group {
            display: flex;
            gap: 0.8rem;
        }

        button {
            background: linear-gradient(135deg, #ff3366, #b51e3a);
            border: none;
            color: white;
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        button:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #ff5577, #cc274a);
            box-shadow: 0 0 18px #ff3366;
        }

        #startBtn {
            background: linear-gradient(135deg, #3a86ff, #164a8a);
            box-shadow: 0 0 10px #3a86ff;
        }
        #startBtn:hover {
            background: linear-gradient(135deg, #5a9eff, #2a6ab0);
        }

        input {
            width: 100%;
            cursor: pointer;
            background: #2a1a20;
            height: 4px;
            border-radius: 10px;
            -webkit-appearance: none;
        }
        
        input:focus {
            outline: none;
        }
        
        input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff3366;
            box-shadow: 0 0 12px #ff3366;
            border: 1px solid #fff;
            cursor: pointer;
        }
        
        input::-webkit-slider-runnable-track {
            background: #3a1e2a;
            border-radius: 10px;
        }

        h3 {
            margin: 0 0 0.6rem 0;
            font-size: 1.35rem;
            font-weight: 600;
            background: linear-gradient(135deg, #eef5ff, #5ac8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-shadow: 0 0 8px rgba(0,180,255,0.4);
        }

        hr {
            margin: 0.3rem 0 0.2rem;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff5a6e, #ff3366, transparent);
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1rem;
            color: #8aa9cc;
            font-family: monospace;
            letter-spacing: 0.8px;
        }

        @media (max-width: 720px) {
            .card {
                padding: 1rem;
            }
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .button-group {
                justify-content: center;
            }
        }
        
        label {
            font-weight: 500;
            color: #ffa0b0;
            letter-spacing: 0.5px;
            text-shadow: 0 0 3px #ff3366;
        }
    </style>

<body>

    <!-- 齐老师动画 - 顶部导航 -->
    <div class="qilaoshi-header">
        <div class="qilaoshi-title">齐老师动画</div>
    </div>
    <button class="qilaoshi-back-btn" onclick="window.location.href='../index.html'">← 返回主页</button>

<div>
    <div class="card">
        <h3>
            ✨ 双弹簧振子 · 星尘谐振 
            <span style="font-size:0.7rem; font-weight:normal; background: none; color:#ff7b8c;">| 红先蓝后 | 开始/重置</span>
        </h3>
        <canvas id="springCanvas" width="800" height="500" style="width:100%; height:auto; max-width:800px; aspect-ratio:800/500"></canvas>

        <div class="control-panel">
            <div class="delay-selector">
                <span style="color: #aaccff; font-size: 0.85rem; font-family: 'Orbitron', monospace;">🔵 蓝球落后:</span>
                <button class="delay-btn active" data-delay="0.5">T/4</button>
                <button class="delay-btn" data-delay="1">T/2</button>
                <button class="delay-btn" data-delay="1.5">3T/4</button>
                <button class="delay-btn" data-delay="2">T</button>
            </div>
            <div class="button-group">
                <button id="startBtn">▶ 开始运动</button>
                <button id="resetBtn">🔄 重置</button>
            </div>
        </div>
        <footer>
            ⚡ 振幅 180px | 角频率 π rad/s (周期T=2.0s) | 红球先动，蓝球可选择落后T/4/T/2/3T/4/T ⚡
        </footer>
    </div>
</div>

<script>
    (function(){
        // ========== 物理参数 ==========
        const canvas = document.getElementById('springCanvas');
        const ctx = canvas.getContext('2d');

        const width = 800, height = 500;
        canvas.width = width;
        canvas.height = height;

        // 弹簧系统参数
        const fixedX = 120;           // 墙壁固定点 X
        const equilibriumX = 480;     // 平衡位置 X
        const amplitude = 180;        // 振幅 180px（原120px的1.5倍）
        const omega = Math.PI;         // 角频率 π rad/s
        const T = 2.0;                 // 周期 T = 2秒

        // 振子垂直坐标
        const y1 = 145;   // 红色球
        const y2 = 355;   // 蓝色球
        
        const anchor1 = { x: fixedX, y: y1 };
        const anchor2 = { x: fixedX, y: y2 };
        
        // 动画控制
        let isRunning = false;
        let startTime = null;
        let animationId = null;
        let blueDelayTime = 0.5;   // 蓝球延迟0.5秒启动
        
        // DOM 元素
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // -------------------- 星空背景 --------------------
        let stars = [];
        const STAR_COUNT = 180;
        
        function initStars() {
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.2 + 0.8,
                    alpha: Math.random() * 0.5 + 0.3,
                    twinkleSpeed: 0.5 + Math.random() * 1.5,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        
        function drawStarfieldBackground(now) {
            // 用于动态效果的时间
            const timeSec = (startTime && isRunning) ? (now - startTime) / 1000 : (performance.now() / 1000);
            
            const gradBase = ctx.createLinearGradient(0, 0, width*0.8, height);
            gradBase.addColorStop(0, '#020617');
            gradBase.addColorStop(0.4, '#0a1030');
            gradBase.addColorStop(0.7, '#03051a');
            gradBase.addColorStop(1, '#00010c');
            ctx.fillStyle = gradBase;
            ctx.fillRect(0, 0, width, height);
            
            // 星云
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            let nebulaX = 120 + Math.sin(timeSec * 0.2) * 20;
            let nebulaY = 80 + Math.cos(timeSec * 0.23) * 15;
            let gradNebula1 = ctx.createRadialGradient(nebulaX, nebulaY, 10, nebulaX+20, nebulaY+15, 100);
            gradNebula1.addColorStop(0, 'rgba(255, 60, 100, 0.12)');
            gradNebula1.addColorStop(1, 'rgba(30, 20, 60, 0)');
            ctx.fillStyle = gradNebula1;
            ctx.fillRect(0, 0, width, height);
            
            let nebulaX2 = width - 180 + Math.sin(timeSec * 0.17) * 25;
            let nebulaY2 = height - 100 + Math.cos(timeSec * 0.21) * 20;
            let gradNebula2 = ctx.createRadialGradient(nebulaX2, nebulaY2, 15, nebulaX2-10, nebulaY2-5, 130);
            gradNebula2.addColorStop(0, 'rgba(0, 180, 255, 0.15)');
            gradNebula2.addColorStop(1, 'rgba(0, 20, 80, 0)');
            ctx.fillStyle = gradNebula2;
            ctx.fillRect(0, 0, width, height);
            
            let gradNebula3 = ctx.createRadialGradient(width*0.5, height*0.2, 20, width*0.5+30, height*0.2+10, 160);
            gradNebula3.addColorStop(0, 'rgba(160, 80, 255, 0.08)');
            gradNebula3.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradNebula3;
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';
            ctx.restore();
            
            // 全息网格
            ctx.save();
            ctx.globalAlpha = 0.2;
            ctx.beginPath();
            ctx.strokeStyle = '#3cc7ff';
            ctx.lineWidth = 0.7;
            for (let i = 0; i < width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(width, i);
                ctx.stroke();
            }
            ctx.restore();
            
            // 星星
            for (let s of stars) {
                const twinkle = 0.4 + 0.6 * (Math.sin(timeSec * s.twinkleSpeed + s.phase) * 0.5 + 0.5);
                const finalAlpha = s.alpha * twinkle * 0.9;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 210, ${finalAlpha})`;
                ctx.fill();
                if (s.radius > 1.8 && twinkle > 0.7) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius * 1.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 200, 100, ${finalAlpha * 0.4})`;
                    ctx.fill();
                }
            }
            
            // 动态粒子
            ctx.globalAlpha = 0.5;
            for (let i = 0; i < 80; i++) {
                const px = (i * 173 + timeSec * 12) % width;
                const py = (i * 277 + timeSec * 8) % height;
                ctx.beginPath();
                ctx.arc(px, py, 0.8, 0, Math.PI*2);
                ctx.fillStyle = `rgba(150, 200, 255, ${0.2 + Math.sin(timeSec + i)*0.1})`;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // 扫描光柱
            ctx.save();
            ctx.globalAlpha = 0.08;
            for (let i = 0; i < 3; i++) {
                let offset = (timeSec * 35 + i * 200) % (width + 200) - 100;
                ctx.beginPath();
                ctx.rect(offset, 0, 45, height);
                ctx.fillStyle = '#ff3366';
                ctx.fill();
            }
            ctx.restore();
        }
        
        // 弹簧绘制
        function drawNeonSpring(fromX, fromY, toX, toY, color) {
            const dx = toX - fromX;
            const dy = toY - fromY;
            const distance = Math.hypot(dx, dy);
            if (distance < 1) return;
            
            const ux = dx / distance;
            const uy = dy / distance;
            const nx = -uy;
            const ny = ux;
            const waveLength = 19;
            const waveAmp = 6.8;
            const steps = Math.max(22, Math.min(140, Math.floor(distance / 2.4)));
            
            ctx.beginPath();
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const distAlong = t * distance;
                const phase = (distAlong / waveLength) * Math.PI * 2;
                const offsetMag = Math.sin(phase) * waveAmp;
                const lineX = fromX + ux * distAlong;
                const lineY = fromY + uy * distAlong;
                const offX = nx * offsetMag;
                const offY = ny * offsetMag;
                const x = lineX + offX;
                const y = lineY + offY;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.4;
            ctx.stroke();
            // 内层光晕
            ctx.beginPath();
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const distAlong = t * distance;
                const phase = (distAlong / waveLength) * Math.PI * 2;
                const offsetMag = Math.sin(phase) * waveAmp;
                const lineX = fromX + ux * distAlong;
                const lineY = fromY + uy * distAlong;
                const offX = nx * offsetMag;
                const offY = ny * offsetMag;
                const x = lineX + offX;
                const y = lineY + offY;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = '#ffffffaa';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.7;
            ctx.stroke();
            ctx.globalAlpha = 1;
        }
        
        // 发光球体
        function drawGlowBall(x, y, label, displacementVal, gradStart, gradEnd, glowColor, highlightColor) {
            ctx.save();
            ctx.shadowBlur = 26;
            ctx.shadowColor = glowColor;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            const grad = ctx.createRadialGradient(x - 8, y - 8, 6, x, y, 28);
            grad.addColorStop(0, gradStart);
            grad.addColorStop(0.35, gradStart);
            grad.addColorStop(0.7, gradEnd);
            grad.addColorStop(1, '#111122');
            ctx.beginPath();
            ctx.arc(x, y, 24, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(x, y, 23, 0, Math.PI * 2);
            ctx.strokeStyle = highlightColor;
            ctx.lineWidth = 1.6;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.strokeStyle = glowColor;
            ctx.lineWidth = 1.2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(x - 7, y - 8, 5.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 250, 235, 0.9)';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x - 10, y - 11, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            
            ctx.shadowBlur = 18;
            ctx.shadowColor = glowColor;
            ctx.beginPath();
            ctx.arc(x, y, 23, 0, Math.PI * 2);
            ctx.fillStyle = 'transparent';
            ctx.strokeStyle = glowColor;
            ctx.lineWidth = 1.4;
            ctx.stroke();
            
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ffffffcc';
            ctx.font = 'bold 17px "Segoe UI", "Orbitron"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(label, x - 8, y + 8);
            ctx.font = '10px monospace';
            ctx.fillStyle = '#f0fcff';
            ctx.fillText(`${displacementVal.toFixed(1)}px`, x - 26, y + 34);
            
            ctx.beginPath();
            ctx.arc(x + 12, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ccddee';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 12, y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#2a405c';
            ctx.fill();
            ctx.restore();
        }
        
        // 固定锚点
        function drawTechAnchor(x, y) {
            ctx.save();
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff5a6e';
            ctx.fillStyle = '#0f1f32';
            ctx.beginPath();
            ctx.rect(x - 14, y - 14, 28, 28);
            ctx.fill();
            ctx.fillStyle = '#1f4870';
            ctx.beginPath();
            ctx.rect(x - 8, y - 8, 16, 16);
            ctx.fill();
            ctx.fillStyle = '#ff5a6e';
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#eef';
            ctx.beginPath();
            ctx.arc(x, y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x - 2, y - 2, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.restore();
        }
        
        // 绘制端点虚线圆（与球同大小）
        function drawEndpointCircles() {
            ctx.save();
            ctx.setLineDash([4, 6]);
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.5;
            
            const ballRadius = 24;  // 与小球半径相同
            const leftX = equilibriumX - amplitude;    // 左端点
            const rightX = equilibriumX + amplitude;   // 右端点
            
            // 红球三个位置虚线圆
            ctx.strokeStyle = '#ff5a6e';
            ctx.beginPath();
            ctx.arc(equilibriumX, y1, ballRadius, 0, Math.PI * 2);  // 平衡位置
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(leftX, y1, ballRadius, 0, Math.PI * 2);         // 左端点
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(rightX, y1, ballRadius, 0, Math.PI * 2);        // 右端点
            ctx.stroke();
            
            // 蓝球三个位置虚线圆
            ctx.strokeStyle = '#3a86ff';
            ctx.beginPath();
            ctx.arc(equilibriumX, y2, ballRadius, 0, Math.PI * 2);  // 平衡位置
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(leftX, y2, ballRadius, 0, Math.PI * 2);         // 左端点
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(rightX, y2, ballRadius, 0, Math.PI * 2);        // 右端点
            ctx.stroke();
            
            ctx.restore();
        }
        
        // 辅助线 (无多余文字)
        function drawHoloReferences() {
            ctx.save();
            ctx.setLineDash([6, 8]);
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = '#ff7b8c';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#ff3366';
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(equilibriumX, y1 - 38);
            ctx.lineTo(equilibriumX, y1 + 38);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(equilibriumX, y2 - 38);
            ctx.lineTo(equilibriumX, y2 + 38);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(fixedX - 20, y1);
            ctx.lineTo(width - 40, y1);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(fixedX - 20, y2);
            ctx.lineTo(width - 40, y2);
            ctx.stroke();
            
            ctx.setLineDash([]);
            ctx.fillStyle = '#ffa0b0';
            ctx.font = '10px "Orbitron"';
            ctx.fillText('固定端', fixedX - 32, y1 + 4);
            ctx.fillText('固定端', fixedX - 32, y2 + 4);
            ctx.restore();
        }
        
        // 重置：停止运动，回到平衡位置
        function resetMotion() {
            isRunning = false;
            startTime = null;
            drawStaticFrame();
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }
        
        // 开始运动：从当前时刻开始，从平衡位置启动
        function startMotion() {
            if (isRunning) return;
            isRunning = true;
            startTime = performance.now();
            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(animate);
        }
        
        // 静态帧（静止时）
        function drawStaticFrame() {
            drawStarfieldBackground(performance.now());
            drawHoloReferences();
            drawEndpointCircles();  // 端点虚线圆
            drawNeonSpring(anchor1.x, anchor1.y, equilibriumX, y1, '#ff5f7e');
            drawNeonSpring(anchor2.x, anchor2.y, equilibriumX, y2, '#3c9eff');
            drawTechAnchor(anchor1.x, anchor1.y);
            drawTechAnchor(anchor2.x, anchor2.y);
            drawGlowBall(equilibriumX, y1, '①', 0, '#ff5a6e', '#a02030', '#ff3366', '#ffaeae');
            drawGlowBall(equilibriumX, y2, '②', 0, '#3a86ff', '#163a6b', '#00a6ff', '#aaf0ff');
            
            ctx.font = 'bold 12px "Orbitron"';
            ctx.fillStyle = '#ffbbcc';
            ctx.shadowBlur = 4;
            ctx.fillText(`◈  ω = π rad/s  |  T = 2.00 s  |  A = ${amplitude}px  ◈`, 28, 45);
            ctx.font = '10px monospace';
            ctx.fillStyle = '#ff7b8c';
            ctx.fillText('⚡ 静止状态 | 点击【开始】运动', 28, 72);
        }
        
        // 动画循环
        function animate(now) {
            if (!isRunning) {
                drawStaticFrame();
                animationId = null;
                return;
            }
            
            if (startTime === null) startTime = now;
            const elapsedSec = (now - startTime) / 1000;
            
            // 红球：立即开始，起振方向向右
            const offsetRed = amplitude * Math.sin(omega * elapsedSec);
            
            // 蓝球：延迟启动，起振方向也向右
            // elapsedSec < blueDelayTime 时，蓝球保持在平衡位置
            // elapsedSec >= blueDelayTime 时，蓝球开始运动
            const blueElapsed = Math.max(0, elapsedSec - blueDelayTime);
            const offsetBlue = amplitude * Math.sin(omega * blueElapsed);
            
            const oscRedX = equilibriumX + offsetRed;
            const oscBlueX = equilibriumX + offsetBlue;
            
            drawStarfieldBackground(now);
            drawHoloReferences();
            drawEndpointCircles();  // 端点虚线圆
            drawNeonSpring(anchor1.x, anchor1.y, oscRedX, y1, '#ff5f7e');
            drawNeonSpring(anchor2.x, anchor2.y, oscBlueX, y2, '#3c9eff');
            drawTechAnchor(anchor1.x, anchor1.y);
            drawTechAnchor(anchor2.x, anchor2.y);
            drawGlowBall(oscRedX, y1, '①', offsetRed, '#ff5a6e', '#a02030', '#ff3366', '#ffaeae');
            drawGlowBall(oscBlueX, y2, '②', offsetBlue, '#3a86ff', '#163a6b', '#00a6ff', '#aaf0ff');
            
            ctx.font = 'bold 12px "Orbitron"';
            ctx.fillStyle = '#ffbbcc';
            ctx.shadowBlur = 4;
            ctx.fillText(`◈  ω = π rad/s  |  T = 2.00 s  |  A = ${amplitude}px  ◈`, 28, 45);
            ctx.font = '10px monospace';
            ctx.fillStyle = '#ff7b8c';
            let statusText = elapsedSec < blueDelayTime 
                ? `🔴 红球运动中 | 蓝球等待启动 (${((blueDelayTime - elapsedSec)/T).toFixed(2)}T)` 
                : '🌀 双球谐振 | 红球先动，蓝球滞后';
            ctx.fillText(statusText, 28, 72);
            
            if (Math.abs(offsetRed - offsetBlue) > 12) {
                ctx.beginPath();
                ctx.moveTo(oscRedX + 18, y1);
                ctx.lineTo(oscBlueX + 18, y2);
                ctx.strokeStyle = '#ff66cc';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 5]);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(oscRedX - 18, y1);
                ctx.lineTo(oscBlueX - 18, y2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        // 延迟时间选择
        const delayBtns = document.querySelectorAll('.delay-btn');
        delayBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // 移除所有active状态
                delayBtns.forEach(b => b.classList.remove('active'));
                // 添加当前按钮active状态
                this.classList.add('active');
                // 更新延迟时间
                blueDelayTime = parseFloat(this.dataset.delay);
                // 如果正在运行，重置动画以应用新延迟
                if (isRunning) {
                    resetMotion();
                }
            });
        });
        
        // 事件绑定
        startBtn.addEventListener('click', startMotion);
        resetBtn.addEventListener('click', resetMotion);
        
        // 初始化
        initStars();
        drawStaticFrame();  // 初始静止
    })();
</script>

    <script>
    (function() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // ESC键返回主页
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                window.location.href = '../index.html';
            }
        });
        
        // 禁用开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });
        
        // 检测开发者工具打开（简单检测）
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthThreshold = window.outerWidth - window.innerWidth > threshold;
            var heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // 可以选择跳转或其他操作
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    })();
    </script>
