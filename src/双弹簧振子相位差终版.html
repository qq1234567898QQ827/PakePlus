<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>双弹簧振子 · 红蓝发光球 | 星空科技感 | 可调相位差</title>
<style>
        * {
            user-select: none;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #030617, #00010a);
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', 'Roboto', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: auto;
        }
        
        /* 动态星光闪烁的叠加层 (使用CSS动画增强星空感) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 20px 40px, #fff, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 80px 240px, #ffd, rgba(0,0,0,0)),
                              radial-gradient(3px 3px at 320px 120px, #cfe, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 550px 450px, #fff, rgba(0,0,0,0));
            background-repeat: no-repeat;
            background-size: 200px 200px, 300px 300px, 400px 400px, 250px 250px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            animation: starTwinkle 8s infinite alternate;
        }
        
        @keyframes starTwinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .card {
            position: relative;
            background: rgba(6, 12, 24, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 1.5rem 2rem 2rem 2rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 210, 255, 0.3);
            z-index: 2;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 1.5rem;
            box-shadow: 0 0 28px rgba(0, 180, 255, 0.25), 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: box-shadow 0.3s;
        }
        
        canvas:hover {
            box-shadow: 0 0 38px rgba(0, 210, 255, 0.5), 0 18px 40px rgba(0, 0, 0, 0.7);
        }

        .control-panel {
            margin-top: 1.8rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.2rem;
            background: rgba(8, 16, 30, 0.75);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.5rem;
            border-radius: 3rem;
            border: 1px solid rgba(0, 230, 255, 0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .slider-container {
            flex: 3;
            min-width: 200px;
        }

        .phase-value {
            flex: 1;
            background: #0a1025;
            color: #0ff;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 1px;
            font-family: 'Orbitron', monospace;
            box-shadow: inset 0 0 8px rgba(0, 200, 255, 0.3), 0 2px 8px rgba(0,0,0,0.4);
            border: 1px solid rgba(0, 255, 255, 0.6);
        }

        input {
            width: 100%;
            cursor: pointer;
            background: #0a1025;
            height: 4px;
            border-radius: 10px;
            -webkit-appearance: none;
        }
        
        input:focus {
            outline: none;
        }
        
        input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #0ff;
            box-shadow: 0 0 12px cyan;
            border: 1px solid #fff;
            cursor: pointer;
        }

        h3 {
            margin: 0 0 0.6rem 0;
            font-size: 1.35rem;
            font-weight: 600;
            background: linear-gradient(135deg, #eef5ff, #5ac8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-shadow: 0 0 8px rgba(0,180,255,0.4);
        }

        hr {
            margin: 0.3rem 0 0.2rem;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, #0ff, #3cc, transparent);
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1rem;
            color: #8aa9cc;
            font-family: monospace;
            letter-spacing: 0.8px;
            text-shadow: 0 0 3px #003366;
        }

        @media (max-width: 680px) {
            .card {
                padding: 1rem;
            }
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
        }
        
        label {
            font-weight: 500;
            color: #b4e4ff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 3px #0af;
        }
    </style>
</head>
<body>
<div id="backButton" onclick="window.location.href='index.html';" style="position: fixed; top: 20px; left: 20px; z-index: 9999; background: rgba(30, 60, 114, 0.8); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: Arial, sans-serif; font-size: 14px; border: 1px solid rgba(100, 150, 255, 0.5); transition: all 0.3s;">

        window.location.href='index.html';
    }
});

<!-- 返回按钮 -->
<a class="back-btn" href="index.html">⬅️ 返回分类 (ESC)</a>
<div>
<div class="card">
<h3>
            ✨ 双弹簧振子 · 星尘谐振 
            <span style="font-size:0.7rem; font-weight:normal; background: none; color:#0ff;">| 相位调制</span>
</h3>
<canvas height="500" id="springCanvas" style="width:100%; height:auto; max-width:800px; aspect-ratio:800/500" width="800"></canvas>
<div class="control-panel">
<div class="slider-container">
<label style="display: flex; justify-content: space-between; margin-bottom: 6px;">
<span>🌀 蓝色振子 相位差</span>
<span id="phaseDegLabel" style="font-family: 'Orbitron'; color:#0ff;">90°</span>
</label>
<input id="phaseSlider" max="360" min="0" step="1" type="range" value="90"/>
</div>
<div class="phase-value" id="phaseRadDisplay">
                Δφ = 0.50 π rad
            </div>
</div>
<footer>
            ⚡ 同频等幅 | 振幅 80px | ω = π rad/s (周期 2.0s) | 赤红之星 · 深蓝之核 | 深邃星空背景 ⚡
        </footer>
</div>
</div>
<script>
    (function(){
        // ========== 物理参数 ==========
        const canvas = document.getElementById('springCanvas');
        const ctx = canvas.getContext('2d');

        const width = 800, height = 500;
        canvas.width = width;
        canvas.height = height;

        // 弹簧系统参数
        const fixedX = 120;           // 墙壁固定点 X
        const equilibriumX = 480;     // 平衡位置 X
        const amplitude = 80;         // 振幅 (px)
        const omega = Math.PI;         // 角频率 π rad/s → T=2s

        // 振子垂直坐标 (上下)
        const y1 = 145;   // 上方振子 (红色)
        const y2 = 355;   // 下方振子 (蓝色)
        
        const anchor1 = { x: fixedX, y: y1 };
        const anchor2 = { x: fixedX, y: y2 };
        
        let startTime = null;
        let animationId = null;
        let phaseDiffRad = Math.PI / 2;   // 初始90度
        
        // DOM 元素
        const phaseSlider = document.getElementById('phaseSlider');
        const phaseDegLabel = document.getElementById('phaseDegLabel');
        const phaseRadDisplay = document.getElementById('phaseRadDisplay');
        
        // -------------------- 星空粒子系统 (动态闪烁星星 + 星云) --------------------
        let stars = [];
        const STAR_COUNT = 180;
        
        function initStars() {
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.2 + 0.8,
                    alpha: Math.random() * 0.5 + 0.3,
                    twinkleSpeed: 0.5 + Math.random() * 1.5,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        
        // 绘制深邃星空背景 (带有动态星星、星云、光晕)
        function drawStarfieldBackground(timestamp) {
            if (!startTime) return;
            const timeSec = (timestamp - startTime) / 1000;
            
            // 深邃太空渐变基底
            const gradBase = ctx.createLinearGradient(0, 0, width*0.8, height);
            gradBase.addColorStop(0, '#020617');
            gradBase.addColorStop(0.4, '#0a1030');
            gradBase.addColorStop(0.7, '#03051a');
            gradBase.addColorStop(1, '#00010c');
            ctx.fillStyle = gradBase;
            ctx.fillRect(0, 0, width, height);
            
            // 星云效果: 半透明彩色光晕 (科技星云)
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            // 红色星云 (左上)
            let nebulaX = 120 + Math.sin(timeSec * 0.2) * 20;
            let nebulaY = 80 + Math.cos(timeSec * 0.23) * 15;
            let gradNebula1 = ctx.createRadialGradient(nebulaX, nebulaY, 10, nebulaX+20, nebulaY+15, 100);
            gradNebula1.addColorStop(0, 'rgba(255, 60, 100, 0.12)');
            gradNebula1.addColorStop(1, 'rgba(30, 20, 60, 0)');
            ctx.fillStyle = gradNebula1;
            ctx.fillRect(0, 0, width, height);
            
            // 蓝色星云 (右下)
            let nebulaX2 = width - 180 + Math.sin(timeSec * 0.17) * 25;
            let nebulaY2 = height - 100 + Math.cos(timeSec * 0.21) * 20;
            let gradNebula2 = ctx.createRadialGradient(nebulaX2, nebulaY2, 15, nebulaX2-10, nebulaY2-5, 130);
            gradNebula2.addColorStop(0, 'rgba(0, 180, 255, 0.15)');
            gradNebula2.addColorStop(1, 'rgba(0, 20, 80, 0)');
            ctx.fillStyle = gradNebula2;
            ctx.fillRect(0, 0, width, height);
            
            // 紫色星云 (中央上方)
            let gradNebula3 = ctx.createRadialGradient(width*0.5, height*0.2, 20, width*0.5+30, height*0.2+10, 160);
            gradNebula3.addColorStop(0, 'rgba(160, 80, 255, 0.08)');
            gradNebula3.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradNebula3;
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';
            ctx.restore();
            
            // 全息网格 (科技感)
            ctx.save();
            ctx.globalAlpha = 0.2;
            ctx.beginPath();
            ctx.strokeStyle = '#3cc7ff';
            ctx.lineWidth = 0.7;
            for (let i = 0; i < width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(width, i);
                ctx.stroke();
            }
            ctx.restore();
            
            // 绘制闪烁星星 (动态alpha)
            for (let s of stars) {
                const twinkle = 0.4 + 0.6 * (Math.sin(timeSec * s.twinkleSpeed + s.phase) * 0.5 + 0.5);
                const finalAlpha = s.alpha * twinkle * 0.9;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 210, ${finalAlpha})`;
                ctx.fill();
                // 偶尔大星辉光
                if (s.radius > 1.8 && twinkle > 0.7) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius * 1.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 200, 100, ${finalAlpha * 0.4})`;
                    ctx.fill();
                }
            }
            
            // 增加远处星尘粒子群 (动态微小粒子流)
            ctx.globalAlpha = 0.5;
            for (let i = 0; i < 80; i++) {
                const px = (i * 173 + timeSec * 12) % width;
                const py = (i * 277 + timeSec * 8) % height;
                ctx.beginPath();
                ctx.arc(px, py, 0.8, 0, Math.PI*2);
                ctx.fillStyle = `rgba(150, 200, 255, ${0.2 + Math.sin(timeSec + i)*0.1})`;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // 扫描光柱 (增强科技感)
            ctx.save();
            ctx.globalAlpha = 0.08;
            for (let i = 0; i < 3; i++) {
                let offset = (timeSec * 35 + i * 200) % (width + 200) - 100;
                ctx.beginPath();
                ctx.rect(offset, 0, 45, height);
                ctx.fillStyle = '#0cf';
                ctx.fill();
            }
            ctx.restore();
        }
        
        // ========== 高科技风格弹簧 (霓虹光效，适配红蓝) ==========
        function drawNeonSpring(fromX, fromY, toX, toY, color = '#3cc7ff') {
            const dx = toX - fromX;
            const dy = toY - fromY;
            const distance = Math.hypot(dx, dy);
            if (distance < 1) return;
            
            const ux = dx / distance;
            const uy = dy / distance;
            const nx = -uy;
            const ny = ux;
            
            const waveLength = 19;      // 弹簧圈密度
            const waveAmp = 6.8;
            const steps = Math.max(22, Math.min(140, Math.floor(distance / 2.4)));
            
            ctx.beginPath();
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const distAlong = t * distance;
                const phase = (distAlong / waveLength) * Math.PI * 2;
                const offsetMag = Math.sin(phase) * waveAmp;
                const lineX = fromX + ux * distAlong;
                const lineY = fromY + uy * distAlong;
                const offX = nx * offsetMag;
                const offY = ny * offsetMag;
                const x = lineX + offX;
                const y = lineY + offY;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            
            ctx.shadowBlur = 0;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.4;
            ctx.stroke();
            // 内层光晕
            ctx.beginPath();
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const distAlong = t * distance;
                const phase = (distAlong / waveLength) * Math.PI * 2;
                const offsetMag = Math.sin(phase) * waveAmp;
                const lineX = fromX + ux * distAlong;
                const lineY = fromY + uy * distAlong;
                const offX = nx * offsetMag;
                const offY = ny * offsetMag;
                const x = lineX + offX;
                const y = lineY + offY;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = '#ffffffaa';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.7;
            ctx.stroke();
            ctx.globalAlpha = 1;
        }
        
        // ========== 高级发光球体 (红 / 蓝) 带金属质感 ==========
        function drawGlowBall(x, y, label, displacementVal, gradStart, gradEnd, glowColor, highlightColor = '#ffffff') {
            ctx.save();
            // 外发光光晕 (科技感)
            ctx.shadowBlur = 26;
            ctx.shadowColor = glowColor;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            // 主体径向渐变 (高光金属感+色彩)
            const grad = ctx.createRadialGradient(x - 8, y - 8, 6, x, y, 28);
            grad.addColorStop(0, gradStart);
            grad.addColorStop(0.35, gradStart);
            grad.addColorStop(0.7, gradEnd);
            grad.addColorStop(1, '#111122');
            ctx.beginPath();
            ctx.arc(x, y, 24, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 金属边缘光
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(x, y, 23, 0, Math.PI * 2);
            ctx.strokeStyle = highlightColor;
            ctx.lineWidth = 1.6;
            ctx.stroke();
            
            // 装饰环
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.strokeStyle = glowColor;
            ctx.lineWidth = 1.2;
            ctx.stroke();
            
            // 高光区 (镜面反射)
            ctx.beginPath();
            ctx.arc(x - 7, y - 8, 5.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 250, 235, 0.9)';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x - 10, y - 11, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            
            // 增强外围光晕
            ctx.shadowBlur = 18;
            ctx.shadowColor = glowColor;
            ctx.beginPath();
            ctx.arc(x, y, 23, 0, Math.PI * 2);
            ctx.fillStyle = 'transparent';
            ctx.strokeStyle = glowColor;
            ctx.lineWidth = 1.4;
            ctx.stroke();
            
            // 文字 (白色光晕)
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ffffffcc';
            ctx.font = 'bold 17px "Segoe UI", "Orbitron"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(label, x - 8, y + 8);
            ctx.font = '10px monospace';
            ctx.fillStyle = '#f0fcff';
            ctx.fillText(`${displacementVal.toFixed(1)}px`, x - 26, y + 34);
            
            // 装饰金属铆钉
            ctx.beginPath();
            ctx.arc(x + 12, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ccddee';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 12, y, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#2a405c';
            ctx.fill();
            ctx.restore();
        }
        
        // 绘制科技感固定锚点
        function drawTechAnchor(x, y) {
            ctx.save();
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#2ad4ff';
            ctx.fillStyle = '#0f1f32';
            ctx.beginPath();
            ctx.rect(x - 14, y - 14, 28, 28);
            ctx.fill();
            ctx.fillStyle = '#1f4870';
            ctx.beginPath();
            ctx.rect(x - 8, y - 8, 16, 16);
            ctx.fill();
            ctx.fillStyle = '#0af';
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#eef';
            ctx.beginPath();
            ctx.arc(x, y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x - 2, y - 2, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.restore();
        }
        
        // 全息辅助线
        function drawHoloReferences() {
            ctx.save();
            ctx.setLineDash([6, 8]);
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = '#1effbc';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#0ff';
            ctx.globalAlpha = 0.6;
            // 平衡位置竖线
            ctx.beginPath();
            ctx.moveTo(equilibriumX, y1 - 38);
            ctx.lineTo(equilibriumX, y1 + 38);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(equilibriumX, y2 - 38);
            ctx.lineTo(equilibriumX, y2 + 38);
            ctx.stroke();
            // 水平基线
            ctx.beginPath();
            ctx.moveTo(fixedX - 20, y1);
            ctx.lineTo(width - 40, y1);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(fixedX - 20, y2);
            ctx.lineTo(width - 40, y2);
            ctx.stroke();
            
            ctx.setLineDash([]);
            ctx.font = '10px "Orbitron"';
            ctx.fillStyle = '#2effcc';
            ctx.shadowBlur = 3;
            ctx.fillText('⚡ 平衡轴', equilibriumX + 5, y1 - 12);
            ctx.fillText('⚡ 平衡轴', equilibriumX + 5, y2 - 12);
            ctx.fillStyle = '#7fd4ff';
            ctx.fillText('固定端', fixedX - 32, y1 + 4);
            ctx.fillText('固定端', fixedX - 32, y2 + 4);
            ctx.restore();
        }
        
        // ========== 核心动画 ==========
        function animate(timestamp) {
            if (!startTime) {
                startTime = timestamp;
            }
            const elapsedSec = (timestamp - startTime) / 1000;
            // 振子1相位 (红色)
            const phase1 = omega * elapsedSec;
            const offset1 = amplitude * Math.cos(phase1);
            // 振子2相位 (蓝色) 带相位差
            const phase2 = phase1 + phaseDiffRad;
            const offset2 = amplitude * Math.cos(phase2);
            
            const osc1X = equilibriumX + offset1;
            const osc2X = equilibriumX + offset2;
            
            // 1. 绘制星空科技背景 (含星云、动态星光)
            drawStarfieldBackground(timestamp);
            
            // 2. 全息参考线
            drawHoloReferences();
            
            // 3. 绘制弹簧 (适配红蓝光效)
            drawNeonSpring(anchor1.x, anchor1.y, osc1X, y1, '#ff5f7e');
            drawNeonSpring(anchor2.x, anchor2.y, osc2X, y2, '#3c9eff');
            
            // 4. 固定锚点
            drawTechAnchor(anchor1.x, anchor1.y);
            drawTechAnchor(anchor2.x, anchor2.y);
            
            // 5. 绘制红蓝发光球
            // 红色球: 炽热红渐变
            drawGlowBall(osc1X, y1, '①', offset1, '#ff5a6e', '#a02030', '#ff3366', '#ffaeae');
            // 蓝色球: 冰蓝渐变
            drawGlowBall(osc2X, y2, '②', offset2, '#3a86ff', '#163a6b', '#00a6ff', '#aaf0ff');
            
            // 6. 动态相位差展示UI
            ctx.save();
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(equilibriumX + 22, y1 - 22, 20, 0, Math.PI * 2);
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 1.4;
            ctx.setLineDash([3, 5]);
            ctx.stroke();
            ctx.font = 'bold 11px monospace';
            ctx.fillStyle = '#c0ffff';
            ctx.shadowBlur = 4;
            ctx.fillText(`Δφ = ${(phaseDiffRad * 180 / Math.PI).toFixed(0)}°`, equilibriumX + 8, y1 - 26);
            ctx.restore();
            
            // 顶部科技信息
            ctx.font = 'bold 12px "Orbitron"';
            ctx.fillStyle = '#bbeefc';
            ctx.shadowBlur = 4;
            ctx.fillText(`◈  ω = π rad/s  |  T = 2.00 s  |  A = ${amplitude}px  ◈`, 28, 45);
            ctx.font = '10px monospace';
            ctx.fillStyle = '#0cf';
            const syncInfo = (Math.abs(phaseDiffRad % (2*Math.PI)) < 0.08 ? '✨ 同步共振 ✨' : 
                             (Math.abs(Math.abs(phaseDiffRad % (2*Math.PI)) - Math.PI) < 0.08 ? '⚡ 反相谐振 ⚡' : '🌀 星际调制区'));
            ctx.fillText(syncInfo, 28, 72);
            
            // 若位移差较大，显示连接光带
            if (Math.abs(offset1 - offset2) > 12) {
                ctx.beginPath();
                ctx.moveTo(osc1X + 18, y1);
                ctx.lineTo(osc2X + 18, y2);
                ctx.strokeStyle = '#ff66cc';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 5]);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(osc1X - 18, y1);
                ctx.lineTo(osc2X - 18, y2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        // ========== 相位差调节 ==========
        function updatePhaseFromSlider() {
            const deg = parseFloat(phaseSlider.value);
            phaseDegLabel.innerText = deg + "°";
            const rad = deg * Math.PI / 180;
            phaseDiffRad = rad;
            let piFraction = (rad / Math.PI).toFixed(2);
            if (Math.abs(rad) < 0.01) piFraction = "0";
            else if (Math.abs(rad - Math.PI) < 0.01) piFraction = "1";
            else if (Math.abs(rad - 2*Math.PI) < 0.01) piFraction = "2";
            phaseRadDisplay.innerHTML = `Δφ = ${piFraction} π rad  (${deg}°)`;
        }
        
        phaseSlider.addEventListener('input', () => {
            updatePhaseFromSlider();
        });
        
        // 初始化星星粒子
        initStars();
        phaseSlider.value = "90";
        updatePhaseFromSlider();
        
        startTime = null;
        animationId = requestAnimationFrame(animate);
        
        // 页面可见性重置时间
        function handleVisibilityChange() {
            if (document.hidden) {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    startTime = null;
                    animationId = requestAnimationFrame(animate);
                }
            }
        }
        document.addEventListener('visibilitychange', handleVisibilityChange);
        
        window.addEventListener('beforeunload', () => {
            if (animationId) cancelAnimationFrame(animationId);
        });
    })();
</script>
