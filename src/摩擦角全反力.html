<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta charset="utf-8"/>
<meta charset="utf-8"/>
<meta charset="utf-8"/>

<meta content="width=device-width, initial-scale=1.0, user-scalable=yes" name="viewport"/>
<title>匀速直线运动 · 三角形定则（无文字）</title>
<style>
        :root {
            --bg: #f5f0e8;
            --panel-bg: #ffffff;
            --text: #2c3e50;
            --accent: #8e44ad;
            --slider-track: #dce6f0;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.07);
            --border: #e8ecf1;
            --btn-bg: #f8fafc;
            --btn-hover: #eef3f8;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #e8ecf1 0%, #f0ebe3 30%, #e6eef5 60%, #f5f0e8 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            background: var(--panel-bg);
            border-radius: 24px;
            box-shadow: var(--shadow), 0 1px 3px rgba(0, 0, 0, 0.04);
            padding: 18px 22px 16px;
            max-width: 950px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f3e8ff, #e4d4fc);
            font-size: 1.3rem;
        }
        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }
        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05), 0 2px 10px rgba(0, 0, 0, 0.06);
            background: #000;
            aspect-ratio: 900 / 550;
            width: 100%;
            max-height: 70vh;
            cursor: default;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 16px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .control-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #4a5568;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .angle-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 180px;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #f0c080, #e8e8e8, #80b8f0);
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .angle-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #5b8cc9;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.15s;
        }
        .angle-slider::-webkit-slider-thumb:hover {
            border-color: #3a6fb5;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
            transform: scale(1.05);
        }
        .angle-slider::-webkit-slider-thumb:active {
            border-color: #2a5a9a;
            transform: scale(1.08);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        .angle-value {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            padding: 5px 10px;
            background: #f0f4f8;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2c3e50;
            letter-spacing: 0.03em;
        }
        .preset-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .preset-btn {
            padding: 7px 13px;
            border-radius: 20px;
            border: 1.5px solid #dde4ed;
            background: var(--btn-bg);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            color: #4a5568;
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .preset-btn:hover {
            background: var(--btn-hover);
            border-color: #c0cfe0;
            color: #2c3e50;
        }
        .preset-btn.active {
            background: #e3ecf7;
            border-color: #7aafdb;
            color: #1e4d7b;
            font-weight: 700;
        }
        .info-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 14px;
            background: #fafbfc;
            border-radius: 14px;
            border: 1px solid #eef1f5;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 500;
            color: #4a5568;
            white-space: nowrap;
        }
        .info-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .info-dot.gravity { background: #e74c3c; }
        .info-dot.normal { background: #3498db; }
        .info-dot.external { background: #27ae60; }
        .info-dot.friction { background: #e67e22; }
        .info-dot.reaction { background: #8e44ad; }
        .info-value {
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: 0.02em;
        }
        .legend-hint {
            font-size: 0.7rem;
            color: #8899aa;
            text-align: center;
            letter-spacing: 0.03em;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 12px;
        }
        .legend-hint span {
            margin: 0 2px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        @media (max-width: 700px) {
            .container { padding: 12px 10px 10px; gap: 8px; border-radius: 16px; }
            .header h1 { font-size: 1.1rem; }
            .angle-slider { width: 120px; }
            .controls { gap: 8px; }
            .preset-btn { padding: 5px 9px; font-size: 0.7rem; }
            .info-panel { gap: 6px; padding: 8px 10px; }
            .info-item { font-size: 0.7rem; }
        }
    </style>
</head>

<div class="container">
<div class="header">
<h1>
<span class="icon">⚡</span>匀速直线运动 · 三角形定则
            </h1>
<span class="badge">合力 = 0</span>
</div>
<div class="canvas-wrapper" id="canvasWrapper">
<canvas id="mainCanvas"></canvas>
</div>
<div class="legend-hint">
<span>🔴 重力 G</span>
<span>🔵 支持力 N</span>
<span>🟢 外力 F</span>
<span>🟠 摩擦力 f</span>
<span style="color:#8e44ad;">🟣 全反力 R</span>
<span style="color:#888;"> | 物块向右匀速运动</span>
</div>
<div class="controls">
<div class="control-group">
<label for="angleSlider">外力方向 θ：</label>
<input class="angle-slider" id="angleSlider" max="70" min="-50" step="0.5" type="range" value="30"/>
<span class="angle-value" id="angleDisplay">30°</span>
</div>
<div class="preset-btns" id="presetBtns">
<button class="preset-btn" data-angle="-30">−30°</button>
<button class="preset-btn" data-angle="0">0°</button>
<button class="preset-btn active" data-angle="30">30°</button>
<button class="preset-btn" data-angle="45">45°</button>
<button class="preset-btn" data-angle="60">60°</button>
</div>
</div>
<div class="info-panel" id="infoPanel">
<div class="info-item"><span class="info-dot gravity"></span> G = <span class="info-value" id="valG">19.60 N</span></div>
<div class="info-item"><span class="info-dot normal"></span> N = <span class="info-value" id="valN">—</span></div>
<div class="info-item"><span class="info-dot external"></span> F = <span class="info-value" id="valF">—</span></div>
<div class="info-item"><span class="info-dot friction"></span> f = <span class="info-value" id="valf">—</span></div>
<div class="info-item"><span class="info-dot reaction"></span> R = <span class="info-value" id="valR">—</span></div>
<div class="info-item" style="color:#6b4d8a;">摩擦角 φ = <span class="info-value" id="valPhi">21.8°</span></div>
<div class="info-item" style="margin-left:auto;color:#2e7d32;">合力 = <span class="info-value">0 N</span> ✓</div>
</div>
</div>
<script>
        (function() {
            // ---------- DOM ----------
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('canvasWrapper');
            const angleSlider = document.getElementById('angleSlider');
            const angleDisplay = document.getElementById('angleDisplay');
            const presetBtns = document.getElementById('presetBtns');
            const valG = document.getElementById('valG');
            const valN = document.getElementById('valN');
            const valF = document.getElementById('valF');
            const valf = document.getElementById('valf');
            const valR = document.getElementById('valR');
            const valPhi = document.getElementById('valPhi');

            // ---------- 物理常量 ----------
            const mu = 0.40;
            const m = 2.0;
            const g_const = 9.80;
            const G_force = m * g_const;
            const scaleForce = 6.5;

            // ---------- 画布尺寸 ----------
            const CANVAS_W = 900;
            const CANVAS_H = 550;
            const groundY = 378;
            const blockW = 82;
            const blockH = 48;
            const blockY_center = groundY - blockH / 2;

            // ---------- 状态 ----------
            let angleDeg = 30;
            let angleRad = angleDeg * Math.PI / 180;
            let externalF = 0,
                normalN = 0,
                frictionF = 0;
            let blockX = 160;
            const blockSpeed = 42;
            let lastTimestamp = null;
            let cloudOffsets = [0, 0, 0];

            // ---------- 力平衡计算 ----------
            function computeForces(thetaDeg) {
                const theta = thetaDeg * Math.PI / 180;
                const cosT = Math.cos(theta);
                const sinT = Math.sin(theta);
                const denom = cosT + mu * sinT;
                if (denom <= 0.001) return null;
                const F = (mu * G_force) / denom;
                const N = G_force - F * sinT;
                if (N < 0) return null;
                const f = mu * N;
                return { F, N, f, theta };
            }

            function updatePhysics(thetaDeg) {
                const res = computeForces(thetaDeg);
                if (!res) return false;
                externalF = res.F;
                normalN = res.N;
                frictionF = res.f;
                angleRad = res.theta;
                return true;
            }
            updatePhysics(angleDeg);

            // ---------- 绘制函数 ----------
            function drawSky() {
                const grad = ctx.createLinearGradient(0, 0, 0, groundY);
                grad.addColorStop(0, '#7ec8f8');
                grad.addColorStop(0.35, '#a8daf9');
                grad.addColorStop(0.7, '#c9e8fb');
                grad.addColorStop(1, '#dff0fc');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CANVAS_W, groundY);
            }

            function drawSun() {
                const sx = 720,
                    sy = 85;
                const glow = ctx.createRadialGradient(sx, sy, 20, sx, sy, 100);
                glow.addColorStop(0, 'rgba(255,255,220,0.9)');
                glow.addColorStop(0.3, 'rgba(255,250,210,0.5)');
                glow.addColorStop(0.6, 'rgba(255,240,180,0.12)');
                glow.addColorStop(1, 'rgba(255,220,150,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(sx, sy, 100, 0, Math.PI * 2);
                ctx.fill();
                const sunGrad = ctx.createRadialGradient(sx, sy, 8, sx, sy, 34);
                sunGrad.addColorStop(0, '#fffef5');
                sunGrad.addColorStop(0.5, '#fff9d0');
                sunGrad.addColorStop(1, '#ffe8a0');
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(sx, sy, 34, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawCloud(cx, cy, size) {
                const r = size * 0.5;
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.arc(cx + r * 1.1, cy - r * 0.15, r * 0.75, 0, Math.PI * 2);
                ctx.arc(cx + r * 1.7, cy + r * 0.1, r * 0.6, 0, Math.PI * 2);
                ctx.arc(cx - r * 0.8, cy + r * 0.2, r * 0.65, 0, Math.PI * 2);
                ctx.arc(cx + r * 0.4, cy - r * 0.35, r * 0.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.beginPath();
                ctx.arc(cx - r * 0.2, cy - r * 0.2, r * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawClouds(timestamp) {
                const clouds = [
                    { baseX: 160, y: 70, size: 42, speed: 3.5, idx: 0 },
                    { baseX: 480, y: 45, size: 52, speed: 2.8, idx: 1 },
                    { baseX: 750, y: 95, size: 36, speed: 4.0, idx: 2 }
                ];
                clouds.forEach(c => {
                    cloudOffsets[c.idx] = (cloudOffsets[c.idx] || 0) + c.speed * 0.016;
                    if (cloudOffsets[c.idx] > CANVAS_W + 200) cloudOffsets[c.idx] -= CANVAS_W + 400;
                    if (cloudOffsets[c.idx] < -200) cloudOffsets[c.idx] += CANVAS_W + 400;
                    let cx = c.baseX + cloudOffsets[c.idx];
                    while (cx > CANVAS_W + 150) cx -= CANVAS_W + 300;
                    while (cx < -150) cx += CANVAS_W + 300;
                    drawCloud(cx, c.y, c.size);
                });
            }

            function drawMountains() {
                ctx.fillStyle = '#c5dbb5';
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.quadraticCurveTo(100, groundY - 70, 200, groundY - 45);
                ctx.quadraticCurveTo(300, groundY - 90, 420, groundY - 55);
                ctx.quadraticCurveTo(520, groundY - 100, 600, groundY - 40);
                ctx.quadraticCurveTo(700, groundY - 75, 800, groundY - 50);
                ctx.quadraticCurveTo(860, groundY - 30, CANVAS_W, groundY - 20);
                ctx.lineTo(CANVAS_W, groundY);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#b5cda5';
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.quadraticCurveTo(150, groundY - 50, 280, groundY - 30);
                ctx.quadraticCurveTo(400, groundY - 65, 550, groundY - 28);
                ctx.quadraticCurveTo(650, groundY - 45, 780, groundY - 35);
                ctx.lineTo(CANVAS_W, groundY - 8);
                ctx.lineTo(CANVAS_W, groundY);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#a3be93';
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.quadraticCurveTo(80, groundY - 30, 180, groundY - 15);
                ctx.quadraticCurveTo(350, groundY - 40, 500, groundY - 18);
                ctx.quadraticCurveTo(620, groundY - 32, CANVAS_W, groundY - 10);
                ctx.lineTo(CANVAS_W, groundY);
                ctx.closePath();
                ctx.fill();
            }

            function drawTree(tx, ty, scale) {
                const trunkW = 8 * scale,
                    trunkH = 40 * scale;
                ctx.fillStyle = '#8B6914';
                ctx.fillRect(tx - trunkW / 2, ty - trunkH, trunkW, trunkH);
                ctx.fillStyle = '#7a5c10';
                ctx.fillRect(tx - trunkW / 2 + 2, ty - trunkH + 5, trunkW - 4, 3);
                const crownR = 22 * scale,
                    crownCY = ty - trunkH - crownR * 0.55;
                const crownGrad = ctx.createRadialGradient(tx - crownR * 0.2, crownCY - crownR * 0.25, crownR * 0.15, tx,
                    crownCY, crownR);
                crownGrad.addColorStop(0, '#6db84d');
                crownGrad.addColorStop(0.55, '#4a9e32');
                crownGrad.addColorStop(1, '#367a22');
                ctx.fillStyle = crownGrad;
                ctx.beginPath();
                ctx.arc(tx, crownCY, crownR, 0, Math.PI * 2);
                ctx.arc(tx + crownR * 0.5, crownCY + crownR * 0.2, crownR * 0.7, 0, Math.PI * 2);
                ctx.arc(tx - crownR * 0.45, crownCY + crownR * 0.15, crownR * 0.65, 0, Math.PI * 2);
                ctx.arc(tx + crownR * 0.1, crownCY - crownR * 0.5, crownR * 0.6, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawTrees() {
                drawTree(70, groundY, 1.0);
                drawTree(130, groundY, 0.7);
                drawTree(790, groundY, 1.05);
                drawTree(850, groundY, 0.75);
                drawTree(630, groundY, 0.85);
            }

            function drawGrassland() {
                const grassGrad = ctx.createLinearGradient(0, groundY, 0, CANVAS_H);
                grassGrad.addColorStop(0, '#7cb342');
                grassGrad.addColorStop(0.08, '#6a9f33');
                grassGrad.addColorStop(0.3, '#5c8e28');
                grassGrad.addColorStop(0.7, '#4d7a1f');
                grassGrad.addColorStop(1, '#3d6218');
                ctx.fillStyle = grassGrad;
                ctx.fillRect(0, groundY, CANVAS_W, CANVAS_H - groundY);
                ctx.strokeStyle = '#5a8a2a';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(CANVAS_W, groundY);
                ctx.stroke();
                ctx.fillStyle = '#8b9a70';
                const pebbles = [55, 102, 175, 230, 310, 365, 440, 505, 570, 640, 700, 755, 820, 870, 195, 485];
                pebbles.forEach(x => {
                    ctx.beginPath();
                    ctx.arc(x, groundY + 1, 2.5 + Math.random() * 2, 0, Math.PI, false);
                    ctx.fill();
                });
                ctx.strokeStyle = '#8fbb5a';
                ctx.lineWidth = 1;
                for (let i = 0; i < 60; i++) {
                    const gx = (i * 15.3 + 7) % CANVAS_W;
                    ctx.beginPath();
                    ctx.moveTo(gx, groundY - 2);
                    ctx.quadraticCurveTo(gx + (i % 3) - 1, groundY - 7, gx + (i % 5) - 2, groundY - 12);
                    ctx.stroke();
                }
            }

            function drawSmallFlowers() {
                const positions = [
                    [90, 15],
                    [210, 28],
                    [340, 10],
                    [500, 22],
                    [670, 14],
                    [810, 25],
                    [155, 35],
                    [720, 32]
                ];
                positions.forEach(([fx, fy]) => {
                    const py = groundY + fy;
                    ctx.strokeStyle = '#6b9e3a';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(fx, py);
                    ctx.quadraticCurveTo(fx + 2, py - 6, fx, py - 11);
                    ctx.stroke();
                    ctx.fillStyle = '#fffde7';
                    for (let a = 0; a < 5; a++) {
                        const pa = (a / 5) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.arc(fx + Math.cos(pa) * 3.5, py - 11 + Math.sin(pa) * 3.5, 3.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#ffe082';
                    ctx.beginPath();
                    ctx.arc(fx, py - 11, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            function drawBushes() {
                [
                    [280, 1.0],
                    [580, 0.8],
                    [40, 0.65],
                    [880, 0.7]
                ].forEach(([bx, s]) => {
                    ctx.fillStyle = '#5c9a3a';
                    ctx.beginPath();
                    ctx.arc(bx, groundY - 6 * s, 14 * s, 0, Math.PI * 2);
                    ctx.arc(bx + 10 * s, groundY - 4 * s, 11 * s, 0, Math.PI * 2);
                    ctx.arc(bx - 9 * s, groundY - 3 * s, 10 * s, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            function drawMetalBlock(bx, by) {
                const x = bx - blockW / 2,
                    y = by - blockH / 2;
                ctx.fillStyle = 'rgba(0,0,0,0.18)';
                ctx.beginPath();
                ctx.roundRect(x - 4, groundY + 1, blockW + 8, 10, 6);
                ctx.fill();
                const topGrad = ctx.createLinearGradient(0, y, 0, y + blockH * 0.35);
                topGrad.addColorStop(0, '#e8e8e8');
                topGrad.addColorStop(0.4, '#d5d5d5');
                topGrad.addColorStop(1, '#c8c8c8');
                ctx.fillStyle = topGrad;
                ctx.beginPath();
                ctx.roundRect(x, y, blockW, blockH, 5);
                ctx.fill();
                const faceGrad = ctx.createLinearGradient(0, y + blockH * 0.2, 0, y + blockH);
                faceGrad.addColorStop(0, '#c8c8c8');
                faceGrad.addColorStop(0.3, '#b8b8b8');
                faceGrad.addColorStop(0.55, '#a8a8a8');
                faceGrad.addColorStop(0.75, '#9a9a9a');
                faceGrad.addColorStop(1, '#8e8e8e');
                ctx.fillStyle = faceGrad;
                ctx.beginPath();
                ctx.roundRect(x, y, blockW, blockH, 5);
                ctx.fill();
                const hlGrad = ctx.createLinearGradient(0, y, 0, y + blockH * 0.28);
                hlGrad.addColorStop(0, 'rgba(255,255,255,0.55)');
                hlGrad.addColorStop(0.5, 'rgba(240,240,245,0.25)');
                hlGrad.addColorStop(1, 'rgba(200,200,210,0)');
                ctx.fillStyle = hlGrad;
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, blockW - 4, blockH * 0.28, 4);
                ctx.fill();
                ctx.strokeStyle = 'rgba(100,100,110,0.5)';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.roundRect(x, y, blockW, blockH, 5);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(180,180,190,0.3)';
                ctx.lineWidth = 0.8;
                for (let i = 1; i <= 3; i++) {
                    const ly = y + blockH * 0.35 + i * blockH * 0.14;
                    ctx.beginPath();
                    ctx.moveTo(x + 6, ly);
                    ctx.lineTo(x + blockW - 6, ly);
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(60,60,60,0.4)';
                for (let i = 0; i < 8; i++) {
                    const rx = x + 6 + i * (blockW - 12) / 7;
                    ctx.fillRect(rx - 1.5, groundY - 1.5, 3, 2.5);
                }
            }

            function drawArrow(fromX, fromY, toX, toY, color, lineWidth = 3.5, dashed = false) {
                const dx = toX - fromX,
                    dy = toY - fromY;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len < 2) return;
                const ux = dx / len,
                    uy = dy / len;
                const headLen = Math.min(18, len * 0.4);
                const headWidth = headLen * 0.55;
                const tipX = toX,
                    tipY = toY;
                const baseX = tipX - ux * headLen,
                    baseY = tipY - uy * headLen;
                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                if (dashed) ctx.setLineDash([8, 5]);
                ctx.beginPath();
                ctx.moveTo(fromX, fromY);
                ctx.lineTo(baseX, baseY);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(tipX, tipY);
                ctx.lineTo(baseX - uy * headWidth, baseY + ux * headWidth);
                ctx.lineTo(baseX + uy * headWidth, baseY - ux * headWidth);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            function drawForceArrows(bx, by) {
                const nLen = normalN * scaleForce;
                const ffLen = frictionF * scaleForce;
                drawArrow(bx, by, bx, by + G_force * scaleForce, '#e74c3c', 4.0);
                const fLen = externalF * scaleForce;
                const fx = fLen * Math.cos(angleRad);
                const fy = -fLen * Math.sin(angleRad);
                drawArrow(bx, by, bx + fx, by + fy, '#27ae60', 4.0);
                drawArrow(bx, by, bx, by - nLen, '#3498db', 4.0);
                drawArrow(bx, by, bx - ffLen, by, '#e67e22', 4.0);
                const N_tip = { x: bx, y: by - nLen };
                const f_tip = { x: bx - ffLen, y: by };
                const R_tip = { x: bx - ffLen, y: by - nLen };
                ctx.save();
                ctx.strokeStyle = 'rgba(110,110,110,0.55)';
                ctx.lineWidth = 1.8;
                ctx.setLineDash([6, 5]);
                ctx.beginPath();
                ctx.moveTo(N_tip.x, N_tip.y);
                ctx.lineTo(R_tip.x, R_tip.y);
                ctx.moveTo(f_tip.x, f_tip.y);
                ctx.lineTo(R_tip.x, R_tip.y);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
                drawArrow(bx, by, R_tip.x, R_tip.y, '#8e44ad', 4.2);
            }

            // 绘制三角形定则（不显示力的符号）
            function drawForceTriangle() {
                const triOx = 110,
                    triOy = 130;
                const G_px = 110;               // 重力对应的像素长度
                const scaleTri = G_px / G_force;
                const F_px = externalF * scaleTri;

                // 三角形顶点：A为重力末端（起点下方），B为外力末端
                const Ax = triOx,
                    Ay = triOy + G_px;           // 重力向下
                const Bx = Ax + F_px * Math.cos(angleRad);
                const By = Ay - F_px * Math.sin(angleRad);

                // 虚线外框
                ctx.save();
                ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([5, 4]);
                ctx.strokeRect(triOx - 35, triOy - 25, 170, G_px + 70);
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillRect(triOx - 35, triOy - 25, 170, G_px + 70);
                ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                ctx.stroke();

                // 三条边：重力（红）、外力（绿）、全反力（紫）
                drawArrow(triOx, triOy, Ax, Ay, '#e74c3c', 3.5);
                drawArrow(Ax, Ay, Bx, By, '#27ae60', 3.5);
                drawArrow(Bx, By, triOx, triOy, '#8e44ad', 3.5);

                // 竖直参考虚线
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(100,100,100,0.7)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.moveTo(triOx, triOy);
                ctx.lineTo(triOx, triOy - 45);
                ctx.stroke();
                ctx.setLineDash([]);

                // 摩擦角 φ 弧线 (保留)
                const phiRad = Math.atan(mu);
                ctx.beginPath();
                ctx.strokeStyle = '#8e44ad';
                ctx.lineWidth = 2.2;
                ctx.arc(triOx, triOy, 18, -Math.PI / 2, -Math.PI / 2 - phiRad, false);
                ctx.stroke();
                ctx.fillStyle = '#8e44ad';
                ctx.font = 'italic 14px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillText('φ', triOx - 20, triOy - 32);

                ctx.restore();
            }

            function drawAngleArc(bx, by) {
                const arcRadius = 38;
                const startAngle = 0;
                const endAngle = -angleRad;
                const arcCX = bx + 10,
                    arcCY = by - 8;
                ctx.strokeStyle = 'rgba(150,150,150,0.3)';
                ctx.lineWidth = 1.2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.arc(arcCX, arcCY, arcRadius, -0.35, 0.35);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = '#27ae60';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(arcCX, arcCY, arcRadius, angleRad >= 0 ? endAngle : startAngle, angleRad >= 0 ? startAngle :
                    endAngle, angleRad < 0);
                ctx.stroke();
                const labelAngle = (startAngle + endAngle) / 2;
                const labelX = arcCX + (arcRadius + 16) * Math.cos(labelAngle);
                const labelY = arcCY + (arcRadius + 16) * Math.sin(labelAngle);
                ctx.fillStyle = '#27ae60';
                ctx.font = 'bold 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('θ', labelX, labelY);
            }

            function drawVelocityArrow(bx, by) {
                const vx = bx + blockW / 2 + 8;
                const vy = by - blockH / 2 - 12;
                const vLen = 50;
                ctx.strokeStyle = '#6c3483';
                ctx.lineWidth = 2.8;
                ctx.beginPath();
                ctx.moveTo(vx, vy);
                ctx.lineTo(vx + vLen, vy);
                ctx.stroke();
                ctx.fillStyle = '#6c3483';
                ctx.beginPath();
                ctx.moveTo(vx + vLen, vy);
                ctx.lineTo(vx + vLen - 12, vy - 7);
                ctx.lineTo(vx + vLen - 12, vy + 7);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#6c3483';
                ctx.font = 'bold 13px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('v', vx + vLen / 2, vy - 14);
            }

            function drawForceLabels(bx, by) {
                const nLen = normalN * scaleForce;
                const ffLen = frictionF * scaleForce;
                const gLen = G_force * scaleForce;
                const fLen = externalF * scaleForce;
                const fx = fLen * Math.cos(angleRad);
                const fy = -fLen * Math.sin(angleRad);
                const labels = [
                    { x: bx + 16, y: by + gLen / 2, text: 'G', color: '#c0392b', offX: 18, offY: 0 },
                    { x: bx - 16, y: by - nLen / 2, text: 'N', color: '#2471a3', offX: -22, offY: 0 },
                    { x: bx + fx / 2, y: by + fy / 2, text: 'F', color: '#1e8449', offX: fx > 0 ? 16 : -16, offY: fy < 0 ? -
                            14 : 14 },
                    { x: bx - ffLen / 2, y: by + 16, text: 'f', color: '#c0651f', offX: 0, offY: 20 },
                    { x: bx - ffLen / 2, y: by - nLen / 2, text: 'R', color: '#8e44ad', offX: -18, offY: -14 }
                ];
                labels.forEach(l => {
                    ctx.fillStyle = l.color;
                    ctx.font = 'bold 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(l.text, l.x + l.offX, l.y + l.offY);
                });
            }

            function drawScene(timestamp) {
                drawSky();
                drawSun();
                drawClouds(timestamp);
                drawMountains();
                drawTrees();
                drawBushes();
                drawGrassland();
                drawSmallFlowers();
            }

            function drawPhysicsOverlay(bx, by) {
                drawMetalBlock(bx, by);
                drawForceArrows(bx, by);
                drawAngleArc(bx, by);
                drawVelocityArrow(bx, by);
                drawForceLabels(bx, by);
            }

            function updateInfoPanel() {
                valG.textContent = G_force.toFixed(2) + ' N';
                valN.textContent = normalN.toFixed(2) + ' N';
                valF.textContent = externalF.toFixed(2) + ' N';
                valf.textContent = frictionF.toFixed(2) + ' N';
                const R = Math.sqrt(normalN * normalN + frictionF * frictionF);
                valR.textContent = R.toFixed(2) + ' N';
                const phi = Math.atan2(frictionF, normalN) * 180 / Math.PI;
                valPhi.textContent = phi.toFixed(1) + '°';
                angleDisplay.textContent = angleDeg.toFixed(1) + '°';
            }

            function animate(timestamp) {
                if (lastTimestamp === null) lastTimestamp = timestamp;
                let dt = (timestamp - lastTimestamp) / 1000;
                if (dt <= 0) dt = 0.016;
                if (dt > 0.1) dt = 0.1;
                lastTimestamp = timestamp;
                blockX += blockSpeed * dt;
                if (blockX > CANVAS_W + blockW) blockX = -blockW;
                if (blockX < -blockW - 50) blockX = CANVAS_W + blockW;
                ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
                drawScene(timestamp);
                drawForceTriangle();      // 上方三角形定则（无文字标签）
                drawPhysicsOverlay(blockX, blockY_center);
                updateInfoPanel();
                requestAnimationFrame(animate);
            }

            function setAngle(newDeg) {
                const clamped = Math.max(-50, Math.min(70, newDeg));
                const success = updatePhysics(clamped);
                if (success) {
                    angleDeg = clamped;
                    angleSlider.value = clamped;
                    updatePresetButtons();
                    updateInfoPanel();
                } else {
                    angleSlider.value = angleDeg;
                }
            }

            function updatePresetButtons() {
                presetBtns.querySelectorAll('.preset-btn').forEach(btn => {
                    const btnAngle = parseFloat(btn.dataset.angle);
                    btn.classList.toggle('active', Math.abs(btnAngle - angleDeg) < 0.3);
                });
            }
            angleSlider.addEventListener('input', () => setAngle(parseFloat(angleSlider.value)));
            presetBtns.addEventListener('click', e => {
                const btn = e.target.closest('.preset-btn');
                if (!btn) return;
                setAngle(parseFloat(btn.dataset.angle));
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault();
                    setAngle(angleDeg + 2); } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e
                        .preventDefault();
                    setAngle(angleDeg - 2); } else if (e.key === 'r' || e.key === 'R') { e.preventDefault();
                    setAngle(30);
                    angleSlider.value = 30; }
            });

            function resizeCanvas() {
                const w = wrapper.clientWidth,
                    h = wrapper.clientHeight;
                const aspect = CANVAS_W / CANVAS_H;
                let dw, dh;
                if (w / h > aspect) { dh = h;
                    dw = dh * aspect; } else { dw = w;
                    dh = dw / aspect; }
                canvas.style.width = dw + 'px';
                canvas.style.height = dh + 'px';
                canvas.width = CANVAS_W;
                canvas.height = CANVAS_H;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            updateInfoPanel();
            updatePresetButtons();
            angleSlider.value = angleDeg;
            requestAnimationFrame(animate);
        })();
    </script>
