  <title>高中物理 · 碰撞实验 | 弹性 & 完全非弹性</title>
  <style>

      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0b1a;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;

      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #e0e0f0;

      user-select: none;

    }
    .container {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    header {
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #ff4d6a, #c084fc, #4da6ff);

    header .subtitle {

    .canvas-card {

    canvas {

    .canvas-hint {

    }
    .mode-selector {
      display: flex;

    .mode-btn {
      background: #1a1a38;

      cursor: pointer;

    .mode-btn small {
      font-size: 0.68rem;

    }
    .mode-btn:hover {
      border-color: #555;

    }
    .mode-btn.active {

    .mode-btn.elastic-active.active {

    .controls-grid {

    .control-group {

    .control-group h3 {

    .dot {

    .dot.red {

    .slider-row input[type="range"]::-webkit-slider-thumb {

    .slider-red::-webkit-slider-thumb {

    .data-panel {

    .btn-row {

    .btn {

<div class="container">
  <header>
    <h1>🔴 碰撞实验 ⚡ 🔵</h1>
    <p class="subtitle">—— 弹性碰撞 · 完全非弹性碰撞 | 动量守恒 ——</p>
  </header>

  <!-- 画布区 -->
  <div class="canvas-card">
    <canvas id="mainCanvas" width="820" height="380"></canvas>
    <p class="canvas-hint">💡 在球上拖动可改变速度 · 拖动到边界反弹 | 按 空格 暂停</p>
  </div>

  <!-- 碰撞类型选择 -->
  <div class="mode-selector">
    <button class="mode-btn elastic-active active" id="btnElastic">🔄 弹性碰撞<small>动能守恒</small></button>
    <button class="mode-btn" id="btnInelastic">🧲 完全非弹性碰撞<small>粘合共速</small></button>
  </div>

  <!-- 参数调节 -->
  <div class="controls-grid">
    <div class="control-group">
      <h3><span class="dot red"></span> 红球参数</h3>
      <div class="slider-row">
        <label>质量</label>
        <input type="range" class="slider-red" id="sliderMassA" min="0.5" max="50.0" step="0.5" value="5.0">
        <span class="slider-value" id="valMassA">5.0 kg</span>
      </div>
      <div class="slider-row">
        <label>初速度</label>
        <input type="range" class="slider-red" id="sliderVelA" min="-10.0" max="10.0" step="0.1" value="3.0">
        <span class="slider-value" id="valVelA">+3.0 m/s</span>
      </div>
    </div>

      <div class="slider-row">

        <input type="range" class="slider-blue" id="sliderMassB" min="0.5" max="50.0" step="0.5" value="2.0">
        <span class="slider-value" id="valMassB">2.0 kg</span>
      </div>
      <div class="slider-row">
        <label>初速度</label>
        <input type="range" class="slider-blue" id="sliderVelB" min="-10.0" max="10.0" step="0.1" value="-1.5">

<script>
  (function() {
    // ---------- DOM ----------
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    const btnElastic = document.getElementById('btnElastic');
    const btnInelastic = document.getElementById('btnInelastic');
    const btnReset = document.getElementById('btnReset');
    const btnSwap = document.getElementById('btnSwap');
    const btnPause = document.getElementById('btnPause');

    const sliderMassA = document.getElementById('sliderMassA');
    const sliderVelA = document.getElementById('sliderVelA');
    const sliderMassB = document.getElementById('sliderMassB');
    const sliderVelB = document.getElementById('sliderVelB');
    const valMassA = document.getElementById('valMassA');
    const valVelA = document.getElementById('valVelA');
    const valMassB = document.getElementById('valMassB');
    const valVelB = document.getElementById('valVelB');

    const dataTotalP = document.getElementById('dataTotalP');
    const dataTotalKE = document.getElementById('dataTotalKE');
    const dataPA = document.getElementById('dataPA');
    const dataPB = document.getElementById('dataPB');
    const dataInitKE = document.getElementById('dataInitKE');
    const dataKEItem = document.getElementById('dataKEItem');

    // ---------- 状态 ----------
    let collisionMode = 'elastic'; // 'elastic' | 'inelastic'
    let isPaused = false;
    let isStuck = false;           // 完全非弹性碰撞后粘合状态
    let stuckCommonV = 0;
    let flashAlpha = 0;
    let flashX = 0, flashY = 0;

    // 初始参数（对应滑块）
    let initMassA = 5.0;
    let initVelA = 3.0;
    let initMassB = 2.0;
    let initVelB = -1.5;
    let initialTotalKE = 0;

    // 运动小球
    let ballA = { x: 200, vx: 3.0, mass: 5.0, color: '#ff4d6a', label: '红', radius: 24 };
    let ballB = { x: 600, vx: -1.5, mass: 2.0, color: '#4da6ff', label: '蓝', radius: 20 };

    // 轨道参数
    const trackY = 200;
    const leftBound = 60;
    const rightBound = canvas.width - 60;

    // 质量映射到半径（使用平方根让大小变化更平缓，0.5kg -> 14px, 50kg -> 46px）
    function calcRadius(mass) {
      const minMass = 0.5;
      const maxMass = 50.0;
      const minR = 14;
      const maxR = 46;
      const t = Math.sqrt((mass - minMass) / (maxMass - minMass));
      return Math.round(minR + t * (maxR - minR));
    }

    // ---------- 物理计算 ----------
    function totalMomentum() {
      return ballA.mass * ballA.vx + ballB.mass * ballB.vx;
    }
    function totalKE() {
      return 0.5 * ballA.mass * ballA.vx * ballA.vx + 0.5 * ballB.mass * ballB.vx * ballB.vx;
    }

    function handleElasticCollision(a, b) {
      const m1 = a.mass, m2 = b.mass;
      const v1 = a.vx, v2 = b.vx;
      const v1f = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
      const v2f = (2 * m1 * v1 + (m2 - m1) * v2) / (m1 + m2);
      a.vx = v1f;
      b.vx = v2f;
    }

    function handleInelasticCollision(a, b) {
      const vCommon = (a.mass * a.vx + b.mass * b.vx) / (a.mass + b.mass);
      a.vx = vCommon;
      b.vx = vCommon;
      isStuck = true;
      stuckCommonV = vCommon;
    }

    function separateBalls(a, b) {
      const dx = b.x - a.x;
      const dist = Math.abs(dx);
      const minDist = a.radius + b.radius;
      if (dist < minDist) {
        const overlap = minDist - dist;
        const sep = overlap / 2 + 0.3;
        if (dx > 0) { a.x -= sep; b.x += sep; }
        else { a.x += sep; b.x -= sep; }
      }
    }

    function arrangeStuckBalls() {
      const totalDist = ballA.radius + ballB.radius;
      const totalMass = ballA.mass + ballB.mass;
      const com = (ballA.x * ballA.mass + ballB.x * ballB.mass) / totalMass;
      ballA.x = com - totalDist * (ballB.mass / totalMass);
      ballB.x = com + totalDist * (ballA.mass / totalMass);
      // 边界约束
      if (ballA.x - ballA.radius < leftBound) ballA.x = leftBound + ballA.radius;
      if (ballB.x + ballB.radius > rightBound) ballB.x = rightBound - ballB.radius;
      if (ballB.x - ballA.x < totalDist) {
        const mid = (ballA.x + ballB.x) / 2;
        ballA.x = mid - totalDist / 2;
        ballB.x = mid + totalDist / 2;
      }
    }

    function detectAndHandleCollision() {
      if (isStuck) return;
      const dx = ballB.x - ballA.x;
      const dist = Math.abs(dx);
      const contactDist = ballA.radius + ballB.radius;
      if (dist < contactDist) {
        separateBalls(ballA, ballB);
        flashX = (ballA.x + ballB.x) / 2;
        flashY = trackY;
        flashAlpha = 1.0;
        if (collisionMode === 'elastic') {
          handleElasticCollision(ballA, ballB);
        } else {
          handleInelasticCollision(ballA, ballB);
        }
      }
    }

    // ---------- 动画循环 ----------
    function update() {
      if (!isPaused) {
        // 移动
        ballA.x += ballA.vx;
        ballB.x += ballB.vx;

        // 边界反弹
        [ballA, ballB].forEach(b => {
          if (b.x - b.radius < leftBound) {
            b.x = leftBound + b.radius;
            b.vx = Math.abs(b.vx);
            if (isStuck) {
              stuckCommonV = ballA.vx = ballB.vx = Math.abs(ballA.vx);
              arrangeStuckBalls();
            }
          }
          if (b.x + b.radius > rightBound) {
            b.x = rightBound - b.radius;
            b.vx = -Math.abs(b.vx);
            if (isStuck) {
              stuckCommonV = ballA.vx = ballB.vx = -Math.abs(ballA.vx);
              arrangeStuckBalls();
            }
          }
        });

        // 粘合状态保持同步
        if (isStuck) {
          ballA.vx = stuckCommonV;
          ballB.vx = stuckCommonV;
          arrangeStuckBalls();
          // 整体边界再约束
          const leftEdge = Math.min(ballA.x - ballA.radius, ballB.x - ballB.radius);
          const rightEdge = Math.max(ballA.x + ballA.radius, ballB.x + ballB.radius);
          if (leftEdge < leftBound) {
            const shift = leftBound - leftEdge;
            ballA.x += shift; ballB.x += shift;
            stuckCommonV = Math.abs(stuckCommonV);
            ballA.vx = ballB.vx = stuckCommonV;
          }
          if (rightEdge > rightBound) {
            const shift = rightEdge - rightBound;
            ballA.x -= shift; ballB.x -= shift;
            stuckCommonV = -Math.abs(stuckCommonV);
            ballA.vx = ballB.vx = stuckCommonV;
          }
        }

        // 碰撞检测
        detectAndHandleCollision();

        // 闪光衰减
        if (flashAlpha > 0) {
          flashAlpha = Math.max(0, flashAlpha - 0.035);
        }
      }

      updateUI();
      draw();
      requestAnimationFrame(update);
    }

    function updateUI() {
      const pA = ballA.mass * ballA.vx;
      const pB = ballB.mass * ballB.vx;
      const pTotal = pA + pB;
      const keTotal = totalKE();

      dataTotalP.textContent = pTotal.toFixed(2);
      dataTotalKE.textContent = keTotal.toFixed(2);
      dataPA.textContent = pA.toFixed(2);
      dataPB.textContent = pB.toFixed(2);
      dataInitKE.textContent = initialTotalKE.toFixed(2);

      if (collisionMode === 'inelastic' && isStuck && initialTotalKE > 0.001) {
        const keLoss = initialTotalKE - keTotal;
        if (keLoss > 0.01) {
          dataKEItem.classList.add('warn');
          dataTotalKE.style.color = '#ff9d7a';
        }
      } else if (collisionMode === 'elastic' && !isStuck) {
        dataKEItem.classList.remove('warn');
        dataTotalKE.style.color = Math.abs(keTotal - initialTotalKE) < 0.02 ? '#5ce6b0' : '#ffd166';
      } else {
        dataKEItem.classList.remove('warn');
        dataTotalKE.style.color = '#ffd166';
      }
    }

    // ---------- 绘制 ----------
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 网格背景
      ctx.strokeStyle = '#14142a';
      ctx.lineWidth = 0.5;
      for (let y = 0; y < canvas.height; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }

      // 轨道
      ctx.beginPath();
      ctx.moveTo(leftBound - 10, trackY);
      ctx.lineTo(rightBound + 10, trackY);
      ctx.strokeStyle = '#1a1a3a';
      ctx.lineWidth = 4;
      ctx.setLineDash([2, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(leftBound, trackY);
      ctx.lineTo(rightBound, trackY);
      ctx.strokeStyle = '#2a2a50';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 边界标记
      [leftBound, rightBound].forEach(bx => {
        ctx.beginPath();
        ctx.moveTo(bx, trackY - 16);
        ctx.lineTo(bx, trackY + 16);
        ctx.strokeStyle = '#3a3a5a';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#667';
        ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(bx === leftBound ? '左边界' : '右边界', bx, trackY + 32);
      });

      // 碰撞闪光
      if (flashAlpha > 0.01) {
        const glowGrad = ctx.createRadialGradient(flashX, flashY, 0, flashX, flashY, 90);
        glowGrad.addColorStop(0, `rgba(255,255,220,${flashAlpha})`);
        glowGrad.addColorStop(0.3, `rgba(255,200,100,${flashAlpha * 0.7})`);
        glowGrad.addColorStop(0.7, `rgba(255,150,50,${flashAlpha * 0.25})`);
        glowGrad.addColorStop(1, 'rgba(255,100,30,0)');
        ctx.beginPath();
        ctx.arc(flashX, flashY, 90, 0, Math.PI * 2);
        ctx.fillStyle = glowGrad;
        ctx.fill();
        for (let i = 0; i < 14; i++) {
          const angle = (i / 14) * Math.PI * 2;
          const dist = 22 + flashAlpha * 50;
          const px = flashX + Math.cos(angle) * dist;
          const py = flashY + Math.sin(angle) * dist;
          ctx.beginPath();
          ctx.arc(px, py, 1.5 + flashAlpha * 5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,200,${flashAlpha * 0.9})`;
          ctx.fill();
        }
      }

      // 绘制两个球
      [ballA, ballB].forEach(b => {
        // 阴影
        ctx.beginPath();
        ctx.arc(b.x, trackY + 3, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fill();
        // 光晕
        const halo = ctx.createRadialGradient(b.x, trackY, b.radius + 12, b.x, trackY, b.radius);
        halo.addColorStop(0, b.color + '33');
        halo.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(b.x, trackY, b.radius + 12, 0, Math.PI * 2);
        ctx.fillStyle = halo;
        ctx.fill();
        // 主体
        const grad = ctx.createRadialGradient(b.x - b.radius * 0.25, trackY - b.radius * 0.35, b.radius * 0.08, b.x, trackY, b.radius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, b.color);
        grad.addColorStop(0.8, '#0a0a1a');
        grad.addColorStop(1, '#050510');
        ctx.beginPath();
        ctx.arc(b.x, trackY, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        // 高光
        ctx.beginPath();
        ctx.arc(b.x - b.radius * 0.3, trackY - b.radius * 0.35, b.radius * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fill();
        // 标签
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(b.label, b.x, trackY + 5);
        ctx.fillStyle = '#ccd';
        ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(b.mass.toFixed(1) + 'kg', b.x, trackY - b.radius - 14);
        // 速度矢量
        const arrowBaseY = trackY - b.radius - 30;
        const arrowLen = b.vx * 9;
        if (Math.abs(arrowLen) > 1.5) {
          ctx.beginPath();
          ctx.moveTo(b.x, arrowBaseY);
          ctx.lineTo(b.x + arrowLen, arrowBaseY);
          ctx.strokeStyle = b.color;
          ctx.lineWidth = 3.2;
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 10;
          ctx.stroke();
          ctx.shadowBlur = 0;
          const tipDir = Math.sign(arrowLen);
          ctx.beginPath();
          ctx.moveTo(b.x + arrowLen, arrowBaseY);
          ctx.lineTo(b.x + arrowLen - tipDir * 10, arrowBaseY - 7);
          ctx.lineTo(b.x + arrowLen - tipDir * 10, arrowBaseY + 7);
          ctx.closePath();
          ctx.fillStyle = b.color;
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.fillText(b.vx.toFixed(1) + ' m/s', b.x + arrowLen + tipDir * 22, arrowBaseY + 4);
        } else {
          ctx.fillStyle = '#889';
          ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.fillText('v≈0', b.x, arrowBaseY + 4);
        }
      });

      // 粘合指示
      if (isStuck && collisionMode === 'inelastic') {
        const midX = (ballA.x + ballB.x) / 2;
        ctx.fillStyle = '#ff9d7a';
        ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🔗 已粘合', midX, trackY - 65);
        ctx.beginPath();
        ctx.setLineDash([4, 6]);
        ctx.moveTo(ballA.x + ballA.radius, trackY - ballA.radius - 20);
        ctx.lineTo(ballB.x - ballB.radius, trackY - ballB.radius - 20);
        ctx.strokeStyle = '#ff9d7a88';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 顶部信息
      const modeText = collisionMode === 'elastic' ? '弹性碰撞 (动能守恒)' : '完全非弹性碰撞 (粘合共速)';
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`当前模式: ${modeText}  |  总动量 p = ${totalMomentum().toFixed(2)} kg·m/s`, canvas.width/2, 30);
      ctx.textAlign = 'start';
      ctx.fillStyle = '#ff4d6a';
      ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('● 红球', 15, canvas.height - 14);
      ctx.fillStyle = '#4da6ff';
      ctx.fillText('● 蓝球', 85, canvas.height - 14);
      if (isStuck) {
        ctx.fillStyle = '#ff9d7a';
        ctx.fillText('🔗 粘合中', 155, canvas.height - 14);
      }
    }

    // ---------- 拖动交互 ----------
    let dragging = null;
    let dragStartX = 0;
    let dragStartVx = 0;

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      const pos = getCanvasPos(e);
      for (const b of [ballA, ballB]) {
        if (Math.hypot(pos.x - b.x, pos.y - trackY) < b.radius + 18) {
          dragging = b;
          dragStartX = pos.x;
          dragStartVx = b.vx;
          if (isStuck) {
            isStuck = false;
            ballA.vx = stuckCommonV;
            ballB.vx = stuckCommonV;
          }
          canvas.style.cursor = 'grabbing';
          e.preventDefault();
          break;
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) {
        const pos = getCanvasPos(e);
        let hovering = false;
        for (const b of [ballA, ballB]) {
          if (Math.hypot(pos.x - b.x, pos.y - trackY) < b.radius + 18) {
            hovering = true; break;
          }
        }
        canvas.style.cursor = hovering ? 'grab' : 'default';
        return;
      }
      const pos = getCanvasPos(e);
      const dx = pos.x - dragStartX;
      dragging.vx = dragStartVx + dx * 0.04;
      dragging.vx = Math.max(-12, Math.min(12, dragging.vx));
      if (isStuck) {
        stuckCommonV = dragging.vx;
        ballA.vx = ballB.vx = stuckCommonV;
      }
      e.preventDefault();
    });

    canvas.addEventListener('pointerup', () => {
      dragging = null;
      canvas.style.cursor = 'default';
    });
    canvas.addEventListener('pointerleave', () => {
      dragging = null;
      canvas.style.cursor = 'default';
    });

    // ---------- 按钮功能 ----------
    function setMode(mode) {
      collisionMode = mode;
      btnElastic.classList.remove('active', 'elastic-active');
      btnInelastic.classList.remove('active', 'inelastic-active');
      if (mode === 'elastic') {
        btnElastic.classList.add('active', 'elastic-active');
      } else {
        btnInelastic.classList.add('active', 'inelastic-active');
      }
      resetScene();
    }
    btnElastic.addEventListener('click', () => setMode('elastic'));
    btnInelastic.addEventListener('click', () => setMode('inelastic'));

    function resetScene() {
      initMassA = parseFloat(sliderMassA.value);
      initVelA = parseFloat(sliderVelA.value);
      initMassB = parseFloat(sliderMassB.value);
      initVelB = parseFloat(sliderVelB.value);

      ballA.mass = initMassA;
      ballA.vx = initVelA;
      ballA.radius = calcRadius(initMassA);
      ballA.x = 200;
      ballB.mass = initMassB;
      ballB.vx = initVelB;
      ballB.radius = calcRadius(initMassB);
      ballB.x = 600;

      // 保证初始不重叠
      const neededDist = ballA.radius + ballB.radius + 8;
      if (ballB.x - ballA.x < neededDist) {
        ballB.x = ballA.x + neededDist;
        if (ballB.x + ballB.radius > rightBound) {
          ballB.x = rightBound - ballB.radius;
          ballA.x = ballB.x - neededDist;
          if (ballA.x - ballA.radius < leftBound) {
            ballA.x = leftBound + ballA.radius;
            ballB.x = ballA.x + neededDist;
          }
        }
      }

      isStuck = false;
      stuckCommonV = 0;
      flashAlpha = 0;
      initialTotalKE = totalKE();
      updateUI();
      dataInitKE.textContent = initialTotalKE.toFixed(2);
      dataKEItem.classList.remove('warn');
      dataTotalKE.style.color = '#ffd166';
    }

    btnReset.addEventListener('click', resetScene);
    btnSwap.addEventListener('click', () => {
      // 交换全部属性
      [ballA.x, ballB.x] = [ballB.x, ballA.x];
      [ballA.vx, ballB.vx] = [ballB.vx, ballA.vx];
      [ballA.mass, ballB.mass] = [ballB.mass, ballA.mass];
      [ballA.radius, ballB.radius] = [ballB.radius, ballA.radius];
      [ballA.color, ballB.color] = [ballB.color, ballA.color];
      [ballA.label, ballB.label] = [ballB.label, ballA.label];
      // 同步滑块
      sliderMassA.value = ballA.mass;
      sliderVelA.value = ballA.vx;
      sliderMassB.value = ballB.mass;
      sliderVelB.value = ballB.vx;
      updateSliderLabels();
      isStuck = false;
      stuckCommonV = 0;
      flashAlpha = 0;
      initialTotalKE = totalKE();
      updateUI();
      dataInitKE.textContent = initialTotalKE.toFixed(2);
    });

    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPause.textContent = isPaused ? '▶️ 播放' : '⏯️ 暂停/播放';
      btnPause.style.borderColor = isPaused ? '#ffd166' : '#2a2a50';
      btnPause.style.color = isPaused ? '#ffd166' : '#ccd';
    });

    // ---------- 滑块更新 ----------
    function updateSliderLabels() {
      valMassA.textContent = parseFloat(sliderMassA.value).toFixed(1) + ' kg';
      valVelA.textContent = (parseFloat(sliderVelA.value) >= 0 ? '+' : '') + parseFloat(sliderVelA.value).toFixed(1) + ' m/s';
      valMassB.textContent = parseFloat(sliderMassB.value).toFixed(1) + ' kg';
      valVelB.textContent = (parseFloat(sliderVelB.value) >= 0 ? '+' : '') + parseFloat(sliderVelB.value).toFixed(1) + ' m/s';
    }
    sliderMassA.addEventListener('input', () => {
      updateSliderLabels();
      ballA.mass = parseFloat(sliderMassA.value);
      ballA.radius = calcRadius(ballA.mass);
      initialTotalKE = totalKE();
      updateUI();
      dataInitKE.textContent = initialTotalKE.toFixed(2);
    });
    sliderVelA.addEventListener('input', updateSliderLabels);
    sliderMassB.addEventListener('input', () => {
      updateSliderLabels();
      ballB.mass = parseFloat(sliderMassB.value);
      ballB.radius = calcRadius(ballB.mass);
      initialTotalKE = totalKE();
      updateUI();
      dataInitKE.textContent = initialTotalKE.toFixed(2);
    });
    sliderVelB.addEventListener('input', updateSliderLabels);

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ') {
        e.preventDefault();
        btnPause.click();
      } else if (e.key.toLowerCase() === 'r') {
        resetScene();
      } else if (e.key.toLowerCase() === 'e') {
        setMode('elastic');
      } else if (e.key.toLowerCase() === 'i') {
        setMode('inelastic');
      } else if (e.key.toLowerCase() === 's') {
        btnSwap.click();
      }
    });

    // 启动
    updateSliderLabels();
    setMode('elastic');
    update();
  })();
</script>

    <script>
    (function() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // ESC键返回主页
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                window.location.href = '../index.html';
            }
        });
        
        // 禁用开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });
        
        // 检测开发者工具打开（简单检测）
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthThreshold = window.outerWidth - window.innerWidth > threshold;
            var heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // 可以选择跳转或其他操作
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    })();
    </script>
