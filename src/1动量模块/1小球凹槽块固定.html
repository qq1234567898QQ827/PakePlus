    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at center, #0a0f14 0%, #030608 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        .container {
            background: rgba(10, 18, 28, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 2.2rem;
            padding: 1.2rem 1.6rem 1.2rem;
            box-shadow: 0 30px 60px rgba(0, 160, 255, 0.15), 0 0 0 1px rgba(0, 200, 255, 0.2), inset 0 0 30px rgba(0, 180, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            max-height: 100vh;
        }
        canvas { display: block; width: 100%; height: auto; max-width: 850px; border-radius: 1.6rem; background: #0a1218; box-shadow: 0 0 30px rgba(0, 180, 240, 0.25), 0 15px 35px rgba(0,0,0,0.7), inset 0 0 50px rgba(0,200,255,0.06); }
        .control-panel { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0.8rem; color: #c8e8ff; font-size: 1.1rem; background: rgba(8,20,30,0.7); backdrop-filter: blur(16px); border-radius: 2.5rem; padding: 0.8rem 1.6rem; border: 1px solid rgba(0,180,240,0.3); box-shadow: 0 10px 30px rgba(0,120,200,0.15); }
        .buttons-wrapper { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.8rem; }
        .sliders-wrapper { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.8rem 1.5rem; }
        .slider-group { display: flex; align-items: center; gap: 0.4rem; }
        .slider-group label { font-weight: 500; color: #b0d8f0; white-space: nowrap; font-size: 1rem; }
        input[type="range"] { width: 80px; accent-color: #30a0d0; }
        input[type="range"]:disabled { opacity: 0.5; accent-color: #666; }
        button { background: #1a4058; border: none; color: #d0f0ff; font-weight: bold; padding: 0.6rem 1.5rem; border-radius: 2.5rem; letter-spacing: 0.4px; cursor: pointer; font-size: 1rem; transition: 0.25s; background: linear-gradient(180deg, #255870 0%, #0e3448 100%); box-shadow: 0 4px 16px rgba(0,150,220,0.35); border: 1px solid rgba(80,200,255,0.35); white-space: nowrap; }
        button:hover { background: linear-gradient(180deg, #307090 0%, #155068 100%); box-shadow: 0 8px 22px rgba(0,180,255,0.5); color: #fff; }
        button.active { background: linear-gradient(180deg, #d04040 0%, #a02030 100%); border-color: rgba(255,140,160,0.6); box-shadow: 0 4px 18px rgba(255,60,80,0.4); color: #fff; }
        .value-display { min-width: 3rem; text-align: right; font-weight: 600; color: #a0d8f8; font-size: 1rem; }
    </style>
<style>

    /* 调整主内容区域，给顶部标题栏留出空间 */

<body>

    <!-- 齐老师动画 - 顶部导航 -->
    <div class="qilaoshi-header">
        <div class="qilaoshi-title">齐老师动画</div>
    </div>
    <button class="qilaoshi-back-btn" onclick="window.location.href='../index.html'">← 返回主页</button>

<div class="container">
    <canvas id="physicsCanvas" width="850" height="420"></canvas>
    <div class="control-panel">
        <div class="buttons-wrapper">
            <button id="resetButton">↺ 重置</button>
            <button id="pauseButton">⏯️ 暂停</button>
            <button id="trailButton" class="active">🔴 轨迹: 开</button>
        </div>
        <div class="sliders-wrapper">
            <div class="slider-group"><label>槽质量 M</label><input type="range" id="massM" min="1.0" max="8.0" value="3.5" step="0.1"><span class="value-display" id="massMVal">3.5</span>kg</div>
            <div class="slider-group"><label>球质量 m</label><input type="range" id="massm" min="0.3" max="3.0" value="0.9" step="0.1"><span class="value-display" id="massmVal">0.9</span>kg</div>
            <div class="slider-group"><label>物块(固定)</label><input type="range" id="massBlock" min="0.2" max="2.5" value="0.5" step="0.1" disabled><span class="value-display" id="massBlockVal">0.5</span>kg</div>
            <div class="slider-group"><label>下落高度 H</label><input type="range" id="heightH" min="0.2" max="2.5" value="0.8" step="0.1"><span class="value-display" id="heightHVal">0.8</span>m</div>
        </div>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('physicsCanvas');
    const ctx = canvas.getContext('2d');
    const trailCanvas = document.createElement('canvas');
    trailCanvas.width = canvas.width;
    trailCanvas.height = canvas.height;
    const trailCtx = trailCanvas.getContext('2d');

    const massMInput = document.getElementById('massM');
    const massmInput = document.getElementById('massm');
    const massBlockInput = document.getElementById('massBlock');
    const heightHInput = document.getElementById('heightH');
    const massMVal = document.getElementById('massMVal');
    const massmVal = document.getElementById('massmVal');
    const massBlockVal = document.getElementById('massBlockVal');
    const heightHVal = document.getElementById('heightHVal');
    const resetBtn = document.getElementById('resetButton');
    const pauseBtn = document.getElementById('pauseButton');
    const trailBtn = document.getElementById('trailButton');

    let params = { M: 3.5, m: 0.9, mBlock: 0.5, H: 0.8 };
    const R = 2.0, GAP = 0.3, BLOCK_SIZE = 0.65, g = 9.8, SCALE = 60, GROUND_Y = 350, ORIGIN_X = 680, BALL_R = 0.2;
    const Reff = R - BALL_R;
    const bgParticles = [];
    for (let i = 0; i < 45; i++) bgParticles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: 0.5+Math.random()*1.5, vx: (Math.random()-0.5)*0.15, vy: -0.1-Math.random()*0.4, alpha: 0.15+Math.random()*0.4, phase: Math.random()*Math.PI*2 });

    function toCanvasX(px) { return ORIGIN_X + px*SCALE; }
    function toCanvasY(py) { return GROUND_Y - py*SCALE; }

    const State = { FALLING: 'falling', SLIDING: 'sliding', FREE_FLY: 'free_fly' };
    let simState = State.FALLING, paused = false, showTrail = true;
    let x_O = 0.0, v_O = 0.0, phi = 0.0, omega = 0.0;
    let ballX = 0.0, ballY = 0.0, ballVx = 0.0, ballVy = 0.0, v0 = 0.0;
    let freeSide = 'left', trailPoints = [];
    let grooveFree = false, P0 = 0.0;
    const x_block_fixed = R + BLOCK_SIZE/2;

    function createWoodPattern() {
        const pc = document.createElement('canvas'); pc.width=220; pc.height=110; const pctx=pc.getContext('2d');
        pctx.fillStyle='#8B5E3C'; pctx.fillRect(0,0,220,110);
        for(let i=0;i<45;i++){const y=i*3+Math.sin(i*1.8)*1.5;pctx.beginPath();pctx.moveTo(0,y);for(let x=0;x<=220;x+=12)pctx.lineTo(x,y+Math.sin(x*0.04+i*0.7)*2+Math.cos(x*0.025)*1.2);pctx.strokeStyle=i%3===0?'#6B3A2A':(i%3===1?'#9B6B4A':'#7A4A32');pctx.lineWidth=1.4;pctx.stroke();}
        for(let j=0;j<8;j++){const y=18+j*14;pctx.beginPath();pctx.moveTo(0,y);for(let x=0;x<=220;x+=10)pctx.lineTo(x,y+Math.sin(x*0.035+j)*3.5);pctx.strokeStyle='#4A2818';pctx.lineWidth=2.2;pctx.stroke();}
        for(let k=0;k<20;k++){const y=10+k*6;pctx.beginPath();pctx.moveTo(0,y);for(let x=0;x<=220;x+=18)pctx.lineTo(x,y+Math.sin(x*0.06+k)*1);pctx.strokeStyle='#A07050';pctx.lineWidth=0.7;pctx.stroke();}
        return ctx.createPattern(pc,'repeat');
    }
    const woodPattern = createWoodPattern();

    function readParams(){
        params.M=+massMInput.value; params.m=+massmInput.value; params.mBlock=+massBlockInput.value; params.H=+heightHInput.value;
        massMVal.textContent=params.M.toFixed(1); massmVal.textContent=params.m.toFixed(1); massBlockVal.textContent=params.mBlock.toFixed(1); heightHVal.textContent=params.H.toFixed(1);
    }
    function resetSim(){
        readParams(); v0=Math.sqrt(2*g*params.H); simState=State.FALLING; x_O=0;v_O=0;phi=0;omega=0;
        ballX=R-BALL_R; ballY=R+GAP+BALL_R+params.H; ballVx=0;ballVy=0; freeSide='left';
        trailPoints=[]; trailCtx.clearRect(0,0,trailCanvas.width,trailCanvas.height); grooveFree=false; P0=0;
    }

    function getBallAbsPos(){
        if(simState===State.SLIDING){
            return {x:x_O+Reff*Math.cos(phi), y:(R+GAP)-Reff*Math.sin(phi)};
        } else {
            return {x:ballX, y:ballY};
        }
    }

    function addTrailPoint(){
        const pos=getBallAbsPos();
        trailPoints.push({x:pos.x,y:pos.y});
        if(trailPoints.length>200) flushTrailToOffscreen();
    }
    function recordBoundaryPoint(x, y){
        trailPoints.push({x,y});
        if(trailPoints.length>200) flushTrailToOffscreen();
    }

    function flushTrailToOffscreen(){
        if(trailPoints.length<2) return;
        trailCtx.beginPath(); trailCtx.strokeStyle='#ff3a40'; trailCtx.lineWidth=2.2; trailCtx.lineCap='round'; trailCtx.lineJoin='round';
        const first=trailPoints[0]; trailCtx.moveTo(toCanvasX(first.x),toCanvasY(first.y));
        for(let i=1;i<trailPoints.length;i++){const pt=trailPoints[i]; trailCtx.lineTo(toCanvasX(pt.x),toCanvasY(pt.y));}
        trailCtx.stroke();
        trailPoints=[{x:trailPoints[trailPoints.length-1].x,y:trailPoints[trailPoints.length-1].y}];
    }

    function stepFalling(dt){
        ballVy-=g*dt; ballY+=ballVy*dt; ballX=R-BALL_R+x_O;
        if(ballY<=R+GAP+BALL_R){
            // 边缘接触槽口，进入滑动，球心从 (Reff, R+GAP+BALL_R) 瞬移到 (Reff, R+GAP)
            ballY=R+GAP+BALL_R; // 记录接触点
            recordBoundaryPoint(ballX, R+GAP); // 直接记录槽口高度点，无缝连接
            ballY=R+GAP;
            v0=Math.abs(ballVy); phi=0; omega=v0/Reff; x_O=0;v_O=0; grooveFree=false;P0=0;
            simState=State.SLIDING;
        }
    }

    function stepSliding(dt){
        const M=params.M, m=params.m, s=Math.sin(phi), c=Math.cos(phi);
        if(!grooveFree){
            if(phi<Math.PI/2){ const alpha=g*c/Reff; omega+=alpha*dt; phi+=omega*dt; v_O=0; x_O=0; }
            else { grooveFree=true; P0=-m*Reff*omega; }
        }
        if(grooveFree){
            const total=M+m, mu=m/total, denom=Reff*(1-mu*s*s), alpha=(g*c+mu*Reff*omega*omega*c*s)/denom;
            omega+=alpha*dt; phi+=omega*dt; v_O=(P0+m*Reff*omega*s)/total; x_O+=v_O*dt;
        }
        if(phi>=Math.PI){
            phi=Math.PI;
            ballX=x_O-R+BALL_R; ballY=R+GAP; ballVx=v_O; ballVy=Reff*omega;
            freeSide='left'; simState=State.FREE_FLY;
            recordBoundaryPoint(ballX, ballY);
        } else if(phi<=0.0){
            phi=0.0;
            ballX=x_O+R-BALL_R; ballY=R+GAP; ballVx=v_O; ballVy=-Reff*omega;
            freeSide='right'; simState=State.FREE_FLY;
            recordBoundaryPoint(ballX, ballY);
        }
    }

    function stepFreeFly(dt){
        ballVy-=g*dt; ballY+=ballVy*dt; x_O+=v_O*dt;
        ballX=(freeSide==='left')?(x_O-R+BALL_R):(x_O+R-BALL_R);
        if(ballY<=R+GAP && ballVy<0){
            ballY=R+GAP; ballX=(freeSide==='left')?(x_O-R+BALL_R):(x_O+R-BALL_R);
            const vy_abs=Math.abs(ballVy);
            if(freeSide==='left'){ phi=Math.PI; omega=-vy_abs/Reff; }
            else { phi=0.0; omega=vy_abs/Reff; }
            P0=(params.M+params.m)*v_O;
            simState=State.SLIDING;
            recordBoundaryPoint(ballX, ballY);
        }
    }

    function update(dt){
        if(paused) return;
        const maxDt=0.004; let rem=dt;
        while(rem>0){
            const s=Math.min(rem,maxDt);
            const prevState = simState;
            if(simState===State.FALLING) stepFalling(s);
            else if(simState===State.SLIDING) stepSliding(s);
            else if(simState===State.FREE_FLY) stepFreeFly(s);
            // 如果状态未发生变化，添加轨迹点；若已变化，则边界点已在切换时记录，不再重复添加
            if(simState === prevState) {
                addTrailPoint();
            }
            rem-=s;
        }
    }

    function drawBackground(elapsed){
        const grad=ctx.createRadialGradient(canvas.width/2,canvas.height/2,50,canvas.width/2,canvas.height/2,550);
        grad.addColorStop(0,'#0e2030'); grad.addColorStop(0.6,'#081218'); grad.addColorStop(1,'#020608');
        ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle='rgba(0,180,220,0.08)'; ctx.lineWidth=0.5;
        for(let x=35;x<canvas.width;x+=35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
        for(let y=35;y<canvas.height;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
        for(const p of bgParticles){
            p.y+=p.vy*0.8; p.x+=p.vx; if(p.y<-10){p.y=canvas.height+10; p.x=Math.random()*canvas.width;}
            if(p.x<-10)p.x=canvas.width+10; if(p.x>canvas.width+10)p.x=-10;
            const alpha=Math.max(0.05,p.alpha+0.07*Math.sin(elapsed*2.5+p.phase));
            ctx.fillStyle=`rgba(120,210,255,${alpha})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        }
    }

    function draw(){
        const elapsed=performance.now()/1000; drawBackground(elapsed);
        ctx.fillStyle='#1a2830'; ctx.fillRect(20,GROUND_Y,canvas.width-40,canvas.height-GROUND_Y);
        ctx.fillStyle='#2a4048'; ctx.fillRect(20,GROUND_Y,canvas.width-40,6);
        ctx.strokeStyle='#3a6068'; ctx.lineWidth=2.5; ctx.setLineDash([6,5]);
        ctx.beginPath(); ctx.moveTo(20,GROUND_Y); ctx.lineTo(canvas.width-20,GROUND_Y); ctx.stroke(); ctx.setLineDash([]);

        const cx=toCanvasX(x_O), cy=toCanvasY(R+GAP), rPx=R*SCALE;
        const woodPath=new Path2D();
        woodPath.rect(cx-rPx,cy,2*rPx,GROUND_Y-cy);
        woodPath.arc(cx,cy,rPx,0,Math.PI,false);
        ctx.save(); ctx.fillStyle=woodPattern; ctx.fill(woodPath,'evenodd'); ctx.restore();
        ctx.beginPath(); ctx.arc(cx,cy,rPx,0,Math.PI,false); ctx.strokeStyle='#4A2818'; ctx.lineWidth=5; ctx.stroke(); ctx.strokeStyle='#6B3A2A'; ctx.lineWidth=2.5; ctx.stroke();

        const blockLeft=toCanvasX(x_block_fixed-BLOCK_SIZE/2), blockTop=toCanvasY(BLOCK_SIZE), blockRight=toCanvasX(x_block_fixed+BLOCK_SIZE/2);
        ctx.save(); ctx.fillStyle=woodPattern; ctx.fillRect(blockLeft,blockTop,blockRight-blockLeft,GROUND_Y-blockTop);
        ctx.strokeStyle='#4A2818'; ctx.lineWidth=3; ctx.strokeRect(blockLeft,blockTop,blockRight-blockLeft,GROUND_Y-blockTop);
        ctx.strokeStyle='#6B3A2A'; ctx.lineWidth=1.5; ctx.strokeRect(blockLeft+2,blockTop+2,blockRight-blockLeft-4,GROUND_Y-blockTop-4); ctx.restore();

        if(showTrail){
            if(trailPoints.length>1){
                ctx.beginPath(); ctx.strokeStyle='#ff3a40'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
                const f=trailPoints[0]; ctx.moveTo(toCanvasX(f.x),toCanvasY(f.y));
                for(let i=1;i<trailPoints.length;i++){const p=trailPoints[i]; ctx.lineTo(toCanvasX(p.x),toCanvasY(p.y));}
                ctx.stroke();
            }
            ctx.drawImage(trailCanvas,0,0);
        }

        function drawMetalBall(bcx,bcy,r=12){
            const g=ctx.createRadialGradient(bcx-3,bcy-5,r*0.1,bcx,bcy,r);
            g.addColorStop(0,'#fff'); g.addColorStop(0.3,'#d0d8e0'); g.addColorStop(0.6,'#8898a8'); g.addColorStop(1,'#303840');
            ctx.beginPath(); ctx.arc(bcx,bcy,r,0,2*Math.PI); ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='#181e24'; ctx.lineWidth=2; ctx.stroke();
            ctx.beginPath(); ctx.arc(bcx-3,bcy-5,r*0.22,0,2*Math.PI); ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
        }
        const pos=getBallAbsPos(); drawMetalBall(toCanvasX(pos.x),toCanvasY(pos.y));
        ctx.font='bold 12px "PingFang SC"'; ctx.fillStyle='rgba(180,220,240,0.8)'; ctx.fillText('光滑水平地面',canvas.width-150,GROUND_Y-10);
    }

    let lastT=0;
    function loop(ts){
        if(!lastT)lastT=ts;
        let dt=(ts-lastT)/1000; if(dt>0.1)dt=0.016;
        update(dt); draw(); lastT=ts; requestAnimationFrame(loop);
    }

    function onParamChange(){readParams();resetSim();}
    massMInput.addEventListener('input',()=>massMVal.textContent=(+massMInput.value).toFixed(1));
    massmInput.addEventListener('input',()=>massmVal.textContent=(+massmInput.value).toFixed(1));
    heightHInput.addEventListener('input',()=>heightHVal.textContent=(+heightHInput.value).toFixed(1));
    massMInput.addEventListener('change',onParamChange); massmInput.addEventListener('change',onParamChange); heightHInput.addEventListener('change',onParamChange);
    resetBtn.addEventListener('click',()=>{readParams();resetSim();});
    pauseBtn.addEventListener('click',()=>{paused=!paused;});
    trailBtn.addEventListener('click',()=>{showTrail=!showTrail; trailBtn.textContent=showTrail?'🔴 轨迹: 开':'⚪ 轨迹: 关'; trailBtn.classList.toggle('active',showTrail);});

    readParams();resetSim();lastT=0;requestAnimationFrame(loop);
})();
</script>

    <script>
    (function() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // ESC键返回主页
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                window.location.href = '../index.html';
            }
        });
        
        // 禁用开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });
        
        // 检测开发者工具打开（简单检测）
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthThreshold = window.outerWidth - window.innerWidth > threshold;
            var heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // 可以选择跳转或其他操作
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    })();
    </script>
