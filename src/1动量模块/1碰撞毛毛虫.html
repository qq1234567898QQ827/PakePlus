  <script>
let canvasW, canvasH;
let sim = {};
let history = [];
let isPlaying = false;
let p5Instance;
function initParams() {
  let mA = parseFloat(document.getElementById('massA').value);
  let mB = parseFloat(document.getElementById('massB').value);
  let v0 = parseFloat(document.getElementById('v0').value);
  let springNatural = 2.8;
  let k = 8.0;
  let blockW = 0.8;
  let xA0 = 0;
  let xB0 = 6;
  return {
    mA: mA,
    mB: mB,
    v0: v0,
    k: k,
    springNatural: springNatural,
    blockW: blockW,
    xA: xA0,
    xB: xB0,
    vA: v0,
    vB: 0,
    t: 0,
    dt: 1 / 3000,
    attached: false,
    phase: "靠近",
    xA0: xA0
  };
}
function resetSim() {
  sim = initParams();
  history = [];
  recordState();
  isPlaying = false;
  document.getElementById('btn-play').textContent = '▶ 播放';
  document.getElementById('btn-play').className = 'btn btn-play flex-1';
  updateDataDisplay();
}
function recordState() {
  let gap = sim.xB - sim.xA - sim.blockW;
  let springDeform = 0;
  let springForce = 0;
  let Ep = 0;
  if (sim.attached) {
    let currentSpringLen = gap;
    springDeform = currentSpringLen - sim.springNatural;
    springForce = sim.k * springDeform;
    Ep = 0.5 * sim.k * springDeform * springDeform;
  }
  let EkA = 0.5 * sim.mA * sim.vA * sim.vA;
  let EkB = 0.5 * sim.mB * sim.vB * sim.vB;
  history.push({
    t: sim.t,
    xA: sim.xA,
    xB: sim.xB,
    vA: sim.vA,
    vB: sim.vB,
    attached: sim.attached,
    phase: sim.phase,
    gap: gap,
    springForce: springForce,
    EkA: EkA,
    EkB: EkB,
    Ep: Ep,
    totalE: EkA + EkB + Ep,
    totalP: sim.mA * sim.vA + sim.mB * sim.vB
  });
}
function physicsStep() {
  let gap = sim.xB - sim.xA - sim.blockW;
  if (!sim.attached) {
    if (gap <= sim.springNatural) {
      sim.attached = true;
      sim.phase = "压缩";
    } else {
      sim.xA += sim.vA * sim.dt;
      sim.t += sim.dt;
      return;
    }
  }
  if (sim.attached) {
    let delta = gap - sim.springNatural;
    let forceOnA = sim.k * delta;
    let forceOnB = -sim.k * delta;
    let aA = forceOnA / sim.mA;
    let aB = forceOnB / sim.mB;
    sim.vA += aA * sim.dt;
    sim.vB += aB * sim.dt;
    sim.xA += sim.vA * sim.dt;
    sim.xB += sim.vB * sim.dt;
    if (delta < -0.01) {
      sim.phase = "压缩";
    } else if (delta > 0.01) {
      sim.phase = "拉伸";
    } else {
      sim.phase = "恢复";
    }
  }
  sim.t += sim.dt;
}
function togglePlay() {
  isPlaying = !isPlaying;
  if (isPlaying) {
    document.getElementById('btn-play').textContent = '⏸ 暂停';
    document.getElementById('btn-play').className = 'btn btn-pause flex-1';
  } else {
    document.getElementById('btn-play').textContent = '▶ 播放';
    document.getElementById('btn-play').className = 'btn btn-play flex-1';
  }
}
function updateDataDisplay() {
  let idx = history.length - 1;
  if (idx < 0) return;
  let s = history[idx];
  document.getElementById('time-display').textContent = s.t.toFixed(3);
  document.getElementById('data-phase').textContent = s.phase;
  document.getElementById('data-distance').textContent = s.gap.toFixed(3);
  document.getElementById('data-momentum').textContent = s.totalP.toFixed(4);
  // 移除：删除总能量显示的更新代码
}
let sketch = function(p) {
  let cameraX = 0;
  let cameraSmoothX = 0;
  let SCALE = 80;
  let groundY;
  p.setup = function() {
    canvasW = Math.min(1200, window.innerWidth);
    canvasH = 320;
    let canvas = p.createCanvas(canvasW, canvasH);
    canvas.parent('canvas-container');
    groundY = canvasH * 0.68;
    resetSim();
  };
  p.draw = function() {
    let slowMotion = document.getElementById('slowMotion').checked;
    let showMomentum = document.getElementById('showMomentum').checked;
    if (isPlaying) {
      let stepsPerFrame = slowMotion ? 10 : 50;
      for (let i = 0; i < stepsPerFrame; i++) {
        physicsStep();
        if (history.length === 0 || sim.t - history[history.length - 1].t >= 0.001) {
          recordState();
        }
      }
      updateDataDisplay();
    }
    let state = history.length > 0 ? history[history.length - 1] : null;
    if (!state) {
      p.background(15, 23, 42);
      return;
    }
    let centerX = (state.xA + state.xB) / 2;
    cameraSmoothX += (centerX * SCALE - cameraSmoothX) * 0.08;
    p.background(15, 23, 42);
    p.push();
    p.translate(canvasW / 2 - cameraSmoothX, 0);
    drawGrid(p, state);
    p.stroke(71, 85, 105);
    p.strokeWeight(2);
    p.line(-5000, groundY, 10000, groundY);
    drawSpring(p, state);
    drawBlock(p, state.xA, sim.mA, state.vA, '#f97316', '#ea580c', 'A', showMomentum);
    drawBlock(p, state.xB, sim.mB, state.vB, '#06b6d4', '#0891b2', 'B', showMomentum);
    drawDistanceLabel(p, state);
    p.pop();
  };
  function drawGrid(p, state) {
    let originX = sim.xA0 * SCALE;
    let leftBound = cameraSmoothX - canvasW;
    let rightBound = cameraSmoothX + canvasW;
    p.textAlign(p.CENTER, p.TOP);
    p.textSize(11);
    let startM = Math.floor(leftBound / SCALE) - 1;
    let endM = Math.ceil(rightBound / SCALE) + 1;
    for (let m = startM; m <= endM; m++) {
      let px = m * SCALE;
      p.stroke(30, 41, 59, 80);
      p.strokeWeight(1);
      if (m % 5 === 0) {
        p.stroke(30, 41, 59, 150);
        p.strokeWeight(1.5);
      }
      p.line(px, 0, px, canvasH);
      if (m >= 0) {
        p.noStroke();
        p.fill(100, 116, 139);
        p.text(m, px, groundY + 8);
      }
    }
    for (let py = 0; py < canvasH; py += SCALE) {
      p.stroke(30, 41, 59, 50);
      p.strokeWeight(1);
      p.line(-5000, py, 10000, py);
    }
    let ox = originX;
    p.fill(248, 113, 113);
    p.noStroke();
    p.textSize(14);
    p.textAlign(p.CENTER, p.TOP);
    p.text('O', ox, groundY + 8);
    p.stroke(248, 113, 113);
    p.strokeWeight(2);
    p.line(ox, groundY - 10, ox, groundY + 5);
  }
  function drawSpring(p, state) {
    let bw = sim.blockW * SCALE;
    let leftX, rightX;
    if (state.attached) {
      leftX = state.xA * SCALE + bw / 2;
      rightX = state.xB * SCALE - bw / 2;
    } else {
      rightX = state.xB * SCALE - bw / 2;
      leftX = rightX - sim.springNatural * SCALE;
    }
    let y = groundY - (bw * 0.5);
    let springLen = rightX - leftX;
    if (springLen < 5) springLen = 5;
    let coils = 18;
    let naturalPx = sim.springNatural * SCALE;
    let ratio = springLen / naturalPx;
    let amplitude = 14;
    if (ratio < 1) {
      amplitude = 14 * ratio;
      if (amplitude < 4) amplitude = 4;
    } else {
      amplitude = 14 / Math.sqrt(ratio);
    }
    let r = 250, g = 204, b = 21;
    if (state.attached) {
      let delta = state.gap - sim.springNatural;
      if (delta < -0.05) { r = 239; g = 68; b = 68; }
      else if (delta > 0.05) { r = 59; g = 130; b = 246; }
    }
    p.stroke(r, g, b);
    p.strokeWeight(2.5);
    p.noFill();
    p.line(leftX, y, leftX + 8, y);
    p.line(rightX - 8, y, rightX, y);
    p.beginShape();
    let segments = coils * 4;
    let innerLeft = leftX + 8;
    let innerRight = rightX - 8;
    let innerLen = innerRight - innerLeft;
    if (innerLen < 2) innerLen = 2;
    for (let i = 0; i <= segments; i++) {
      let t = i / segments;
      let sx = innerLeft + t * innerLen;
      let sy = y + Math.sin(t * coils * Math.PI * 2) * amplitude;
      p.vertex(sx, sy);
    }
    p.endShape();
  }
  function drawBlock(p, x, mass, vel, color1, color2, label, showMom) {
    let bw = sim.blockW * SCALE;
    let bh = bw * 0.8;
    let px = x * SCALE;
    let by = groundY - bh;
    p.noStroke();
    p.fill(0, 0, 0, 40);
    p.rect(px - bw / 2 + 3, by + 3, bw, bh, 4);
    let c1 = p.color(color1);
    let c2 = p.color(color2);
    p.fill(c1);
    p.stroke(c2);
    p.strokeWeight(2);
    p.rect(px - bw / 2, by, bw, bh, 4);
    p.fill(255);
    p.noStroke();
    p.textAlign(p.CENTER, p.CENTER);
    p.textSize(18);
    p.textStyle(p.BOLD);
    p.text(label, px, by + bh / 2 - 8);
    p.textSize(10);
    p.textStyle(p.NORMAL);
    p.text(mass.toFixed(1) + ' kg', px, by + bh / 2 + 10);
    let arrowY = by - 25;
    let velScale = 18;
    let arrowLen = vel * velScale;
    p.fill(c1);
    p.noStroke();
    p.textSize(12);
    p.textAlign(p.CENTER, p.BOTTOM);
    p.textStyle(p.BOLD);
    p.text('v = ' + vel.toFixed(2) + ' m/s', px, arrowY - 8);
    p.textStyle(p.NORMAL);
    if (Math.abs(arrowLen) > 3) {
      p.stroke(c2);
      p.strokeWeight(3);
      p.line(px, arrowY, px + arrowLen, arrowY);
      let dir = arrowLen > 0 ? 1 : -1;
      p.fill(c2);
      p.noStroke();
      p.triangle(px + arrowLen, arrowY - 6, px + arrowLen, arrowY + 6, px + arrowLen + dir * 10, arrowY);
    }
    if (showMom) {
      let momY = groundY + 35;
      let mom = mass * vel;
      let momScale = 10;
      let momLen = mom * momScale;
      p.fill(168, 85, 247);
      p.noStroke();
      p.textSize(11);
      p.textAlign(p.CENTER, p.TOP);
      p.text('P = ' + mom.toFixed(2) + ' kg·m/s', px, momY + 12);
      if (Math.abs(momLen) > 3) {
        p.stroke(168, 85, 247);
        p.strokeWeight(2.5);
        p.line(px, momY, px + momLen, momY);
        let dir = momLen > 0 ? 1 : -1;
        p.fill(168, 85, 247);
        p.noStroke();
        p.triangle(px + momLen, momY - 5, px + momLen, momY + 5, px + momLen + dir * 8, momY);
      }
    }
  }
  function drawDistanceLabel(p, state) {
    let bw = sim.blockW * SCALE;
    let leftX = state.xA * SCALE + bw / 2;
    let rightX = state.xB * SCALE - bw / 2;
    let midX = (leftX + rightX) / 2;
    let y = groundY - bw * 0.8 - 70;
    p.noStroke();
    p.fill(250, 204, 21);
    p.textAlign(p.CENTER, p.CENTER);
    p.textSize(13);
    p.textStyle(p.BOLD);
    p.text('间距 L = ' + state.gap.toFixed(3) + ' m', midX, y);
    p.textStyle(p.NORMAL);
    p.stroke(250, 204, 21, 120);
    p.strokeWeight(1);
    p.line(leftX, y + 10, rightX, y + 10);
    p.line(leftX, y + 5, leftX, y + 15);
    p.line(rightX, y + 5, rightX, y + 15);
  }
  p.windowResized = function() {
    canvasW = Math.min(1200, window.innerWidth);
    p.resizeCanvas(canvasW, canvasH);
  };
};
document.getElementById('massA').addEventListener('input', function() {
  document.getElementById('massA-val').textContent = this.value;
  resetSim();
});
document.getElementById('massB').addEventListener('input', function() {
  document.getElementById('massB-val').textContent = this.value;
  resetSim();
});
document.getElementById('v0').addEventListener('input', function() {
  document.getElementById('v0-val').textContent = this.value;
  resetSim();
});
p5Instance = new p5(sketch);
 </script>

    <script>
    (function() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // ESC键返回主页
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                window.location.href = '../index.html';
            }
        });
        
        // 禁用开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });
        
        // 检测开发者工具打开（简单检测）
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthThreshold = window.outerWidth - window.innerWidth > threshold;
            var heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // 可以选择跳转或其他操作
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    })();
    </script>
