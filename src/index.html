
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>齐老师动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
            font-family: 'Arial', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 50px;
            color: #88bbff;
            text-shadow: 0 0 10px rgba(136, 187, 255, 0.5), 0 0 20px rgba(136, 187, 255, 0.3);
            font-size: 3.2em;
            text-align: center;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 35px;
            max-width: 700px;
            width: 100%;
        }
        .cat-btn {
            background: rgba(136, 187, 255, 0.15);
            border: 1px solid rgba(136, 187, 255, 0.4);
            box-shadow: 0 0 10px rgba(136, 187, 255, 0.2);
            color: white;
            padding: 45px 35px;
            border-radius: 18px;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .cat-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(136, 187, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        .cat-btn:hover::before {
            left: 100%;
        }
        .cat-btn:hover {
            background: rgba(136, 187, 255, 0.25);
            border-color: rgba(136, 187, 255, 0.8);
            box-shadow: 0 0 20px rgba(136, 187, 255, 0.5);
            transform: translateY(-5px);
        }
        .cat-btn .name {
            font-size: 1.8em;
            font-weight: bold;
            display: block;
            margin-bottom: 12px;
        }
        .cat-btn .count {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <h1>齐老师动画</h1>
    <div class="categories">
        
        <a href="mechanics.html" class="cat-btn">力学动画<span class="count">32个动画</span></a>
        
        <a href="electromagnetism.html" class="cat-btn">电学动画<span class="count">8个动画</span></a>
        
        <a href="other.html" class="cat-btn">其他动画<span class="count">18个动画</span></a>
        
    </div>
    
    
<script>
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
document.body.insertBefore(canvas, document.body.firstChild);

canvas.style.position = 'fixed';
canvas.style.top = '0';
canvas.style.left = '0';
canvas.style.width = '100%';
canvas.style.height = '100%';
canvas.style.zIndex = '-1';

let particles = [];
const particleCount = 80;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function initParticles() {
    particles = [];
    for (let i = 0; i < particleCount; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            radius: Math.random() * 1.5 + 0.5
        });
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 绘制粒子
    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(136, 187, 255, 0.8)';
        ctx.fill();
        
        // 连线
        for (let j = i + 1; j < particles.length; j++) {
            let p2 = particles[j];
            let dx = p.x - p2.x;
            let dy = p.y - p2.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 100) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(136, 187, 255, ${0.2 * (1 - dist / 100)})`;
                ctx.stroke();
            }
        }
        
        // 更新位置
        p.x += p.vx;
        p.y += p.vy;
        
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
    }
    
    requestAnimationFrame(draw);
}

window.addEventListener('resize', () => {
    resize();
    initParticles();
});

resize();
initParticles();
draw();
</script>

    
<div style="position: fixed; bottom: 10px; right: 10px; z-index: 9998; color: rgba(255, 255, 255, 0.3); font-family: Arial, sans-serif; font-size: 12px; pointer-events: none;">
    齐老师动画
</div>
<script>
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
});
</script>

</body>
</html>
