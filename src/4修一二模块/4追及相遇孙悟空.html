<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悟空追白骨精 - 追及相遇 右侧v-t小图像+倍速播放</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #050a1a, #101b38, #1d2b64, #2a3890);
            background-size: 400% 400%;
            animation: bgFlow 6.666s ease infinite;
            font-family: "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .star-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 30px 50px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 100px 120px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 200px 80px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 350px 200px, rgba(255,255,255,0.5), transparent);
            background-size: 250px 250px;
            animation: twinkle 1.666s ease-in-out infinite alternate;
            z-index: 0;
            opacity: 0.6;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }

        /* 整体左右布局 */
        .wrap {
            display: flex;
            gap: 20px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        .main-left {
            flex: 1;
        }
        .graph-right {
            width: 320px;
            flex-shrink: 0;
        }

        .run-track {
            position: relative;
            height: 280px;
            background: rgba(10, 20, 45, 0.7);
            border: 2px solid #00e5ff;
            border-radius: 20px;
            box-shadow: 0 0 30px #00e5ff, inset 0 0 40px rgba(0,229,255,0.1);
            overflow: hidden;
        }

        .run-track::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0,229,255,0.15) 1px, transparent 1px);
            background-size: 50px 100%;
            z-index: 1;
        }

        .role {
            position: absolute;
            bottom: 20px;
            z-index: 10;
        }

        .role img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .wukong {
            width: 200px;
            height: 220px;
            left: 0;
            filter: drop-shadow(0 0 12px #ff6a00);
        }

        .baigujing {
            width: 120px;
            height: 180px;
            filter: drop-shadow(0 0 12px #ff00cc);
        }

        .control-panel {
            background: rgba(8, 15, 40, 0.85);
            border: 1px solid #00e5ff;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(0,229,255,0.2);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #00e5ff, #ff00cc);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #00e5ff;
            cursor: pointer;
            box-shadow: 0 0 10px #00e5ff;
        }

        .btn {
            background: linear-gradient(45deg, #00e5ff, #ff00cc);
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0,229,255,0.4);
            transition: all 0.066s ease;
            font-size: 15px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0,229,255,0.6);
        }

        .explosion {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            z-index: 20;
            display: none;
            pointer-events: none;
        }

        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 1;
                background: radial-gradient(circle, #ff4500 0%, #ff0080 50%, #ffd700 100%);
                box-shadow: 0 0 0 0 rgba(255,69,0,0.8), 0 0 0 20px rgba(255,0,128,0.6), 0 0 0 40px rgba(255,215,0,0.4);
            }
            50% {
                transform: scale(1.5);
                opacity: 0.8;
            }
            100% {
                transform: scale(2);
                opacity: 0;
                box-shadow: 0 0 0 40px rgba(255,69,0,0), 0 0 0 80px rgba(255,0,128,0), 0 0 0 120px rgba(255,215,0,0);
            }
        }

        .explode {
            display: block;
            animation: explode 0.333s ease-out forwards;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(0); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.166s ease-in-out;
        }

        .meet-light {
            animation: meetBlink 0.166s infinite alternate;
            color: #00ff99 !important;
            font-size: 18px;
        }

        @keyframes meetBlink {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* 右侧小图像容器 */
        .graph-container {
            background: rgba8, 15, 40, 0.85;
            border: 1px solid #00e5ff;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0,229,255,0.2);
            padding: 15px;
        }
        #vtCanvas {
            width: 100%;
            height: 260px;
        }
        .speed-select{
            background:#111827;
            color:#fff;
            border:1px solid #00e5ff;
            border-radius:8px;
            padding:6px 10px;
            outline:none;
        }
    </style>

            <!-- 参数调节面板 -->
            <div class="control-panel p-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <h3 class="text-orange-400 font-bold mb-3">孙悟空 参数</h3>
                        <label class="text-white block mb-1">初速度 (m/s)：<span id="v1Val" class="text-cyan-300">10.0</span></label>
                        <input type="range" id="v1" min="0" max="50" value="10" step="0.5">

                        <label class="text-white block mb-1 mt-3">加速度 (m/s²)：<span id="a1Val" class="text-cyan-300">2.0</span></label>
                        <input type="range" id="a1" min="0" max="10" value="2" step="0.1">
                    </div>
                    <div>
                        <h3 class="text-pink-400 font-bold mb-3">白骨精 参数</h3>
                        <label class="text-white block mb-1">初速度 (m/s)：<span id="v2Val" class="text-pink-300">6.0</span></label>
                        <input type="range" id="v2" min="0" max="50" value="6" step="0.5">

                        <label class="text-white block mb-1 mt-3">加速度 (m/s²)：<span id="a2Val" class="text-pink-300">1.0</span></label>
                        <input type="range" id="a2" min="0" max="10" value="1" step="0.1">
                    </div>
                </div>

                <div class="mt-5">
                    <label class="text-white block mb-1">初始距离：<span id="disVal" class="text-green-300">350</span> m</label>
                    <input type="range" id="disInit" min="100" max="800" value="350" step="10">
                </div>

                <!-- 控制按钮与倍速 -->
                <div class="flex items-center justify-center gap-6 mt-6">
                    <div class="flex items-center gap-3">
                        <label class="text-white font-bold">播放倍速：</label>
                        <select id="speedRate" class="speed-select">
                            <option value="1.5">1.5x</option>
                            <option value="3" selected>3x 正常</option>
                            <option value="6">6x</option>
                            <option value="9">9x</option>
                            <option value="12">12x</option>
                        </select>
                    </div>
                    <button class="btn" id="startBtn">开始追逐</button>
                    <button class="btn" id="resetBtn">重置</button>
                </div>
            </div>
        </div>

        <!-- 右侧：v-t图像与数据面板 -->
        <div class="graph-right">
            <div class="graph-container">
                <h3 class="text-center text-white font-bold mb-3">v-t 图像</h3>
                <canvas id="vtCanvas" width="300" height="260"></canvas>
                <div class="text-white text-sm mt-3">
                    <p class="text-orange-400">● 孙悟空 速度曲线</p>
                    <p class="text-pink-400">● 白骨精 速度曲线</p>
                </div>
            </div>
            <!-- 数据面板 -->
            <div class="grid grid-cols-3 gap-2 mt-4">
                <div class="control-panel p-3 text-white text-sm">
                    <h3 class="text-orange-400 font-bold mb-1 text-sm">孙悟空 🐉</h3>
                    <p>位移：<span id="wkPos" class="text-cyan-300 font-medium">0.0</span> m</p>
                    <p>速度：<span id="wkVel" class="text-cyan-300 font-medium">0.0</span> m/s</p>
                </div>
                <div class="control-panel p-3 text-white text-sm">
                    <h3 class="text-pink-400 font-bold mb-1 text-sm">白骨精 💀</h3>
                    <p>位移：<span id="bgPos" class="text-pink-300 font-medium">0.0</span> m</p>
                    <p>速度：<span id="bgVel" class="text-pink-300 font-medium">0.0</span> m/s</p>
                </div>
                <div class="control-panel p-3 text-white text-sm">
                    <h3 class="text-green-400 font-bold mb-1 text-sm">运动状态 📊</h3>
                    <p>时间：<span id="timeShow" class="text-green-300 font-medium">0.0</span> s</p>
                    <p id="stateText" class="font-bold mt-1">等待开始</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM元素
        const wukong = document.getElementById('wukong');
        const baigujing = document.getElementById('baigujing');
        const explosion = document.getElementById('explosion');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const vtCanvas = document.getElementById('vtCanvas');
        const ctx = vtCanvas.getContext('2d');
        const speedRateSel = document.getElementById('speedRate');

        // 滑块
        const v1 = document.getElementById('v1'), a1 = document.getElementById('a1');
        const v2 = document.getElementById('v2'), a2 = document.getElementById('a2');
        const disInit = document.getElementById('disInit');

        // 数值显示
        const v1Val = document.getElementById('v1Val'), a1Val = document.getElementById('a1Val');
        const v2Val = document.getElementById('v2Val'), a2Val = document.getElementById('a2Val');
        const disVal = document.getElementById('disVal');

        // 数据面板
        const wkPos = document.getElementById('wkPos'), wkVel = document.getElementById('wkVel');
        const bgPos = document.getElementById('bgPos'), bgVel = document.getElementById('bgVel');
        const timeShow = document.getElementById('timeShow'), stateText = document.getElementById('stateText');

        // 动画变量
        let animationId = null;
        let isRunning = false;
        let time = 0;
        let initDistance = 350;
        let isMeet = false;
        let speedRate = 3;  // 倍速

        // v-t图像数据
        const wkData = [];
        const bgData = [];
        const maxV = 60;
        const maxT = 15;

        // 倍速切换
        speedRateSel.addEventListener('change',()=>{
            speedRate = Number(speedRateSel.value);
        });

        // 更新滑块值
        function updateSliderValues() {
            v1Val.innerText = v1.value;
            a1Val.innerText = a1.value;
            v2Val.innerText = v2.value;
            a2Val.innerText = a2.value;
            disVal.innerText = disInit.value;
            initDistance = Number(disInit.value);
            baigujing.style.left = initDistance + 'px';
        }

        // 重置
        function resetAll() {
            if (animationId) cancelAnimationFrame(animationId);
            isRunning = false;
            isMeet = false;
            time = 0;
            wkData.length = 0;
            bgData.length = 0;

            wukong.style.left = '0px';
            baigujing.style.left = initDistance + 'px';
            explosion.classList.remove('explode');
            wukong.classList.remove('shake');
            baigujing.classList.remove('shake');

            stateText.innerText = '等待开始';
            stateText.classList.remove('meet-light');

            wkPos.innerText = '0.0';
            bgPos.innerText = '0.0';
            wkVel.innerText = '0.0';
            bgVel.innerText = '0.0';
            timeShow.innerText = '0.0';

            drawVTGraph();
        }

        // 绘制缩小版v-t图像
        function drawVTGraph() {
            const w = vtCanvas.width;
            const h = vtCanvas.height;
            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(0,229,255,0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 8; i++) {
                const x = (w / 8) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            for (let i = 0; i <= 4; i++) {
                const y = (h / 4) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }

            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(40, h - 25);
            ctx.lineTo(w - 15, h - 25);
            ctx.moveTo(40, h - 25);
            ctx.lineTo(40, 15);
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.fillText('t(s)', w - 40, h - 8);
            ctx.save();
            ctx.translate(12, h/2);
            ctx.rotate(-Math.PI/2);
            ctx.fillText('v(m/s)', 0, 0);
            ctx.restore();

            if (wkData.length > 1) {
                ctx.strokeStyle = '#ff6a00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                wkData.forEach((p, i) => {
                    const x = 40 + (p.t / maxT) * (w - 55);
                    const y = h - 25 - (p.v / maxV) * (h - 40);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            }

            if (bgData.length > 1) {
                ctx.strokeStyle = '#ff00cc';
                ctx.lineWidth = 2;
                ctx.beginPath();
                bgData.forEach((p, i) => {
                    const x = 40 + (p.t / maxT) * (w - 55);
                    const y = h - 25 - (p.v / maxV) * (h - 40);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            }
        }

        // 爆炸特效
        function triggerExplosion(x, y) {
            explosion.style.left = (x - 100) + 'px';
            explosion.style.top = (y - 100) + 'px';
            explosion.classList.add('explode');
            wukong.classList.add('shake');
            baigujing.classList.add('shake');
            setTimeout(() => explosion.classList.remove('explode'), 333);
        }

        // 动画主循环（加入倍速）
        function animate() {
            if (!isRunning) return;
            const dt = 0.016 * speedRate * 3;
            time += dt;

            const v01 = Number(v1.value);
            const a1Val = Number(a1.value);
            const v02 = Number(v2.value);
            const a2Val = Number(a2.value);

            const wkX = v01 * time + 0.5 * a1Val * time * time;
            const wkV = v01 + a1Val * time;
            const bgX = initDistance + v02 * time + 0.5 * a2Val * time * time;
            const bgV = v02 + a2Val * time;

            wukong.style.left = wkX + 'px';
            baigujing.style.left = bgX + 'px';

            wkPos.innerText = wkX.toFixed(1);
            bgPos.innerText = bgX.toFixed(1);
            wkVel.innerText = wkV.toFixed(1);
            bgVel.innerText = bgV.toFixed(1);
            timeShow.innerText = time.toFixed(1);

            if (wkData.length < 500) {
                wkData.push({ t: time, v: wkV });
                bgData.push({ t: time, v: bgV });
                drawVTGraph();
            }

            if (!isMeet && wkX >= bgX - 60) {
                isMeet = true;
                stateText.innerText = '💥 追上啦！触发爆炸！';
                stateText.classList.add('meet-light');
                const meetX = (wkX + bgX) / 2;
                const meetY = 140;
                triggerExplosion(meetX, meetY);
            } else if (!isMeet) {
                stateText.innerText = '⌛ 追逐中...';
                stateText.classList.remove('meet-light');
            }

            animationId = requestAnimationFrame(animate);
        }

        // 事件监听
        v1.addEventListener('input', updateSliderValues);
        a1.addEventListener('input', updateSliderValues);
        v2.addEventListener('input', updateSliderValues);
        a2.addEventListener('input', updateSliderValues);
        disInit.addEventListener('input', updateSliderValues);

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                animate();
            }
        });

        resetBtn.addEventListener('click', resetAll);

        // 初始化
        updateSliderValues();
        drawVTGraph();
    </script>

    <!-- 齐老师动画 - 水印 -->
    <div class="qilaoshi-watermark">
        QQ 3398528250<br>
        抖音 35320300542
    </div>


    <!-- 齐老师动画 - 安全保护脚本 -->
    <script>
    (function() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // ESC键返回主页
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                window.location.href = '../index.html';
            }
        });
        
        // 禁用开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });
        
        // 检测开发者工具打开（简单检测）
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthThreshold = window.outerWidth - window.innerWidth > threshold;
            var heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // 可以选择跳转或其他操作
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    })();
    </script>
