<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抛体运动 · 自由落体对比 | y轴居中</title>
    <style>
        :root {
            --bg: #0a0a14;
            --panel-bg: rgba(20, 20, 35, 0.85);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 20px 10px;
        }
        canvas {
            display: block;
            border-radius: 18px;
            box-shadow: 0 0 80px rgba(255, 50, 50, 0.2), 0 0 160px rgba(200, 30, 30, 0.1), 0 25px 60px rgba(0,0,0,0.6);
            max-width: 95vw;
            max-height: 75vh;
            background: #0e0e1a;
        }
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 18px 22px;
            background: var(--panel-bg);
            padding: 16px 26px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ddd;
            flex-wrap: wrap;
        }
        .slider-group label {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }
        .slider-group input[type="range"] {
            -webkit-appearance: none;
            width: 130px;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #ff5a5a, #ffaaaa);
            outline: none;
            cursor: pointer;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #ff4d4d;
            box-shadow: 0 0 14px rgba(255,60,60,0.7);
            transition: 0.2s;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 22px rgba(255,80,80,0.9);
        }
        .value-display {
            display: inline-block;
            min-width: 55px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #ff9a9a;
            background: rgba(255,70,70,0.12);
            padding: 4px 10px;
            border-radius: 16px;
            letter-spacing: 0.5px;
        }
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ccc;
            font-size: 14px;
        }
        .toggle-group input[type="checkbox"] {
            accent-color: #ff4d4d;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .info-row {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            color: #aaa;
            font-size: 12px;
            justify-content: center;
        }
        .info-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ff3b3b;
            box-shadow: 0 0 10px #ff3b3b;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        .info-dot.static {
            animation: none;
            background: #ff7070;
            box-shadow: 0 0 8px #ff7070;
        }
        .info-dot.blue {
            background: #1e90ff;
            box-shadow: 0 0 14px #1e90ff;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { box-shadow: 0 0 6px #ff3b3b; }
            50% { box-shadow: 0 0 20px #ff5c5c, 0 0 36px rgba(255,60,60,0.6); }
        }
        .title-text {
            font-size: 18px;
            font-weight: 600;
            color: #ff7373;
            letter-spacing: 1px;
            text-shadow: 0 0 24px rgba(255,70,70,0.5);
        }
        @media (max-width:700px) {
            .control-panel { gap: 10px; padding: 12px 14px; }
            .slider-group input[type="range"] { width: 90px; }
            .title-text { font-size: 15px; }
        }
    </style>
<style>
    /* 齐老师动画 - 统一样式 */
    body {
        background: #1a2332 !important;
    }
    
    /* 顶部标题栏 */
    .qilaoshi-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
        background: #1a2332;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999 !important;
        border-bottom: 1px solid #2a3a50;
    }
    
    .qilaoshi-title {
        font-size: 20px;
        font-weight: 600;
        color: #8ab4f8;
        letter-spacing: 2px;

    }
    
    /* 返回按钮 */

    /* 调整主内容区域，给顶部标题栏留出空间 */

</style>
</head>
<body>

    <!-- 齐老师动画 - 顶部导航 -->
    <div class="qilaoshi-header">
        <div class="qilaoshi-title">齐老师动画</div>
    </div>
    <button class="qilaoshi-back-btn" onclick="window.location.href='../index.html'">← 返回主页</button>

<div class="container">
    <div class="title-text">抛体运动 · 自由落体对比</div>
    <canvas id="mainCanvas" width="900" height="600" aria-label="抛体运动动画"></canvas>

    <div class="control-panel">
        <div class="slider-group">
            <label for="v0Slider">🚀 初速度 v₀</label>
            <input type="range" id="v0Slider" min="60" max="280" value="150" step="1">
            <span class="value-display" id="v0Value">150 px/s</span>
        </div>
        <div class="toggle-group">
            <input type="checkbox" id="showAllCheckbox" checked>
            <label for="showAllCheckbox">显示全部方向</label>
        </div>
        <div class="slider-group" id="directionGroup" style="opacity:0.4; pointer-events:none;">
            <label for="dirSlider">🎯 方向编号</label>
            <input type="range" id="dirSlider" min="1" max="48" value="1" step="1" disabled>
            <span class="value-display" id="dirValue">1</span>
        </div>
        <div class="info-row">
            <span class="info-dot"></span> <span>斜上抛</span>
            <span class="info-dot blue"></span> <span>自由落体</span>
            <span class="info-dot static"></span> <span>轨迹线</span>
        </div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        const W = canvas.width;
        const H = canvas.height;
        const g = 200;
        let v0 = 150;

        // y轴居中，无x轴
        const originScreenX = W / 2;
        const originScreenY = 510;
        const y0_phys = 240;
        const launchScreenX = originScreenX;
        const launchScreenY = originScreenY - y0_phys;

        function physToScreen(px, py) {
            return { sx: originScreenX + px, sy: originScreenY - py };
        }

        const numDirections = 48;
        const directions = Array.from({length: numDirections}, (_, i) => (i / numDirections) * 2 * Math.PI);

        function createBalls() {
            return directions.map((theta, index) => {
                const sinT = Math.sin(theta);
                const cosT = Math.cos(theta);
                const a = -0.5 * g;
                const b = v0 * sinT;
                const c = y0_phys;
                const disc = b * b - 4 * a * c;
                let flightTime = 0;
                if (disc >= 0) {
                    const sqrtD = Math.sqrt(disc);
                    const t1 = (-b + sqrtD) / (2 * a);
                    const t2 = (-b - sqrtD) / (2 * a);
                    if (t1 > 1e-9) flightTime = t1;
                    else if (t2 > 1e-9) flightTime = t2;
                }
                return {
                    theta,
                    flightTime,
                    vx: v0 * cosT,
                    vy: v0 * sinT,
                    trajectoryScreen: [],
                    isFlying: true,
                    currentPhys: { x: 0, y: y0_phys },
                    currentScreen: physToScreen(0, y0_phys),
                    landedScreen: null,
                    index,
                };
            });
        }

        let balls = createBalls();
        let maxFlightTime = Math.max(...balls.map(b => b.flightTime));
        const holdTime = 2.8;
        let cycleDuration = maxFlightTime + holdTime;

        // 自由落体小球（蓝色）
        const freeFallTime = Math.sqrt(2 * y0_phys / g);
        let freeFallBall = {
            trajectoryScreen: [],
            isFalling: true,
            currentPhys: { x: 0, y: y0_phys },
            currentScreen: physToScreen(0, y0_phys),
            landedScreen: null,
        };

        let showAll = true;
        let selectedDirIndex = 0;

        // 火花粒子（红色，保持不变）
        const sparkParticles = [];
        function spawnSpark(sx, sy, count = 2) {
            for (let i = 0; i < count; i++) {
                sparkParticles.push({
                    x: sx + (Math.random() - 0.5) * 4,
                    y: sy + (Math.random() - 0.5) * 4,
                    vx: (Math.random() - 0.5) * 30,
                    vy: (Math.random() - 0.5) * 30,
                    life: 0.3 + Math.random() * 0.5,
                    maxLife: 0.3 + Math.random() * 0.5,
                    size: 0.5 + Math.random() * 1.3,
                });
            }
            while (sparkParticles.length > 600) sparkParticles.shift();
        }
        function updateSparks(dt) {
            for (let i = sparkParticles.length - 1; i >= 0; i--) {
                const sp = sparkParticles[i];
                sp.x += sp.vx * dt;
                sp.y += sp.vy * dt;
                sp.life -= dt;
                if (sp.life <= 0) sparkParticles.splice(i, 1);
            }
        }
        function drawSparks(ctx) {
            if (sparkParticles.length === 0) return;
            for (const sp of sparkParticles) {
                const alpha = sp.life / sp.maxLife;
                const r = 255, g = Math.floor(50 + 40 * alpha), b = Math.floor(20 + 20 * alpha);
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.85})`;
                ctx.beginPath();
                ctx.arc(sp.x, sp.y, sp.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function resetFreeFallBall() {
            freeFallBall.trajectoryScreen = [];
            freeFallBall.isFalling = true;
            freeFallBall.currentPhys = { x: 0, y: y0_phys };
            freeFallBall.currentScreen = physToScreen(0, y0_phys);
            freeFallBall.landedScreen = null;
        }

        function resetAnimation() {
            for (const ball of balls) {
                ball.trajectoryScreen = [];
                ball.isFlying = true;
                ball.currentPhys = { x: 0, y: y0_phys };
                ball.currentScreen = physToScreen(0, y0_phys);
                ball.landedScreen = null;
            }
            resetFreeFallBall();
            sparkParticles.length = 0;
        }

        function recalcBallParams() {
            for (const ball of balls) {
                const theta = ball.theta;
                const sinT = Math.sin(theta);
                const cosT = Math.cos(theta);
                ball.vx = v0 * cosT;
                ball.vy = v0 * sinT;
                const a = -0.5 * g;
                const b = v0 * sinT;
                const c = y0_phys;
                const disc = b * b - 4 * a * c;
                let ft = 0;
                if (disc >= 0) {
                    const sqrtD = Math.sqrt(disc);
                    const t1 = (-b + sqrtD) / (2 * a);
                    const t2 = (-b - sqrtD) / (2 * a);
                    if (t1 > 1e-9) ft = t1;
                    else if (t2 > 1e-9) ft = t2;
                }
                ball.flightTime = ft;
            }
            maxFlightTime = Math.max(...balls.map(b => b.flightTime));
            cycleDuration = maxFlightTime + holdTime;
        }

        function updatePhysics(elapsedInCycle, dt) {
            let allLanded = true;

            // 斜上抛小球
            for (const ball of balls) {
                const t = Math.min(elapsedInCycle, ball.flightTime);
                if (elapsedInCycle < ball.flightTime) {
                    ball.isFlying = true;
                    allLanded = false;
                    const px = ball.vx * t;
                    const py = y0_phys + ball.vy * t - 0.5 * g * t * t;
                    ball.currentPhys = { x: px, y: py };
                    const scr = physToScreen(px, py);
                    ball.currentScreen = scr;
                    if (ball.trajectoryScreen.length === 0 ||
                        Math.abs(scr.sx - ball.trajectoryScreen[ball.trajectoryScreen.length - 1].sx) > 0.4 ||
                        Math.abs(scr.sy - ball.trajectoryScreen[ball.trajectoryScreen.length - 1].sy) > 0.4) {
                        ball.trajectoryScreen.push({ sx: scr.sx, sy: scr.sy });
                    }
                    if (ball.trajectoryScreen.length % 2 === 0) {
                        spawnSpark(scr.sx, scr.sy, 1);
                    }
                } else {
                    if (ball.isFlying) {
                        const landPx = ball.vx * ball.flightTime;
                        const landPy = 0;
                        const landScr = physToScreen(landPx, landPy);
                        ball.landedScreen = landScr;
                        ball.currentPhys = { x: landPx, y: 0 };
                        ball.currentScreen = landScr;
                        if (ball.trajectoryScreen.length > 0) {
                            const last = ball.trajectoryScreen[ball.trajectoryScreen.length - 1];
                            if (Math.abs(landScr.sx - last.sx) > 0.3 || Math.abs(landScr.sy - last.sy) > 0.3) {
                                ball.trajectoryScreen.push({ sx: landScr.sx, sy: landScr.sy });
                            }
                        }
                        spawnSpark(landScr.sx, landScr.sy, 7);
                    }
                    ball.isFlying = false;
                }
            }

            // 自由落体蓝色小球
            const tFree = Math.min(elapsedInCycle, freeFallTime);
            if (elapsedInCycle < freeFallTime) {
                freeFallBall.isFalling = true;
                const px = 0;
                const py = y0_phys - 0.5 * g * tFree * tFree;
                freeFallBall.currentPhys = { x: px, y: py };
                const scr = physToScreen(px, py);
                freeFallBall.currentScreen = scr;
                if (freeFallBall.trajectoryScreen.length === 0 ||
                    Math.abs(scr.sy - freeFallBall.trajectoryScreen[freeFallBall.trajectoryScreen.length - 1].sy) > 0.4) {
                    freeFallBall.trajectoryScreen.push({ sx: scr.sx, sy: scr.sy });
                }
            } else {
                if (freeFallBall.isFalling) {
                    const landPx = 0;
                    const landPy = 0;
                    const landScr = physToScreen(landPx, landPy);
                    freeFallBall.landedScreen = landScr;
                    freeFallBall.currentPhys = { x: landPx, y: 0 };
                    freeFallBall.currentScreen = landScr;
                    if (freeFallBall.trajectoryScreen.length > 0) {
                        const last = freeFallBall.trajectoryScreen[freeFallBall.trajectoryScreen.length - 1];
                        if (Math.abs(landScr.sy - last.sy) > 0.3) {
                            freeFallBall.trajectoryScreen.push({ sx: landScr.sx, sy: landScr.sy });
                        }
                    }
                }
                freeFallBall.isFalling = false;
            }

            return allLanded && !freeFallBall.isFalling;
        }

        function drawBackground(ctx) {
            const grad = ctx.createRadialGradient(W * 0.45, H * 0.4, 80, W * 0.5, H * 0.5, 580);
            grad.addColorStop(0, '#1c1c32');
            grad.addColorStop(0.6, '#111122');
            grad.addColorStop(1, '#080810');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.025)';
            ctx.lineWidth = 0.6;
            const gridStep = 50;
            for (let gx = gridStep; gx < W; gx += gridStep) {
                ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
            }
            for (let gy = gridStep; gy < H; gy += gridStep) {
                ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
            }
        }

        function drawAxes(ctx) {
            const ox = originScreenX;
            const oy = originScreenY;

            // 仅Y轴
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(ox, oy + 25);
            ctx.lineTo(ox, 30);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            const arrowY = 30;
            ctx.moveTo(ox, arrowY);
            ctx.lineTo(ox - 5, arrowY + 10);
            ctx.lineTo(ox + 5, arrowY + 10);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            for (let py = 100; py <= 400; py += 100) {
                const sy = oy - py;
                if (sy < 20) break;
                ctx.beginPath();
                ctx.moveTo(ox - 4, sy);
                ctx.lineTo(ox + 4, sy);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = 'italic 13px "PingFang SC","Microsoft YaHei",sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('y', ox + 16, 25);

            ctx.fillStyle = 'rgba(255,200,100,0.9)';
            ctx.beginPath();
            ctx.arc(launchScreenX, launchScreenY, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawLaunchGlow(ctx, timeInCycle) {
            const pulse = 1 + 0.28 * Math.sin(timeInCycle * 3.2) * Math.exp(-timeInCycle * 0.5);
            const alpha = 0.75 + 0.25 * Math.exp(-timeInCycle * 0.4);
            const sx = launchScreenX, sy = launchScreenY;
            const outer = ctx.createRadialGradient(sx, sy, 2 * pulse, sx, sy, 18 * pulse);
            outer.addColorStop(0, `rgba(255,180,100,${alpha})`);
            outer.addColorStop(0.5, `rgba(255,80,40,${alpha * 0.5})`);
            outer.addColorStop(1, 'rgba(255,30,30,0)');
            ctx.fillStyle = outer;
            ctx.beginPath(); ctx.arc(sx, sy, 18 * pulse, 0, Math.PI * 2); ctx.fill();
            const inner = ctx.createRadialGradient(sx, sy, 1, sx, sy, 5 * pulse);
            inner.addColorStop(0, 'rgba(255,255,240,0.9)');
            inner.addColorStop(0.6, 'rgba(255,160,80,0.7)');
            inner.addColorStop(1, 'rgba(255,60,20,0)');
            ctx.fillStyle = inner;
            ctx.beginPath(); ctx.arc(sx, sy, 5 * pulse, 0, Math.PI * 2); ctx.fill();
        }

        // 蓝色自由落体轨迹
        function drawFreeFallTrajectory(ctx) {
            const traj = freeFallBall.trajectoryScreen;
            if (traj.length < 2) return;
            ctx.strokeStyle = 'rgba(0, 160, 255, 0.85)';
            ctx.lineWidth = 2.2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(0, 160, 255, 0.7)';
            ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.moveTo(traj[0].sx, traj[0].sy);
            for (let i = 1; i < traj.length; i++) {
                ctx.lineTo(traj[i].sx, traj[i].sy);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 蓝色发光自由落体球
        function drawFreeFallBall(ctx) {
            const pos = freeFallBall.currentScreen;
            const grad = ctx.createRadialGradient(pos.sx, pos.sy, 1, pos.sx, pos.sy, 8);
            grad.addColorStop(0, 'rgba(180, 220, 255, 0.95)');
            grad.addColorStop(0.4, 'rgba(0, 140, 255, 0.85)');
            grad.addColorStop(1, 'rgba(0, 100, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(pos.sx, pos.sy, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(220, 240, 255, 0.95)';
            ctx.beginPath(); ctx.arc(pos.sx, pos.sy, 2.2, 0, Math.PI * 2); ctx.fill();
        }

        function drawTrajectories(ctx) {
            for (const ball of balls) {
                const traj = ball.trajectoryScreen;
                if (traj.length < 2) continue;
                ctx.strokeStyle = 'rgba(255,55,40,0.7)';
                ctx.lineWidth = 1.3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = 'rgba(255,40,30,0.5)';
                ctx.shadowBlur = 3;
                ctx.beginPath();
                ctx.moveTo(traj[0].sx, traj[0].sy);
                for (let i = 1; i < traj.length; i++) {
                    ctx.lineTo(traj[i].sx, traj[i].sy);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        function drawFlyingBalls(ctx) {
            const flying = showAll ? balls.filter(b => b.isFlying) : [balls[selectedDirIndex]].filter(b => b.isFlying);
            for (const ball of flying) {
                const pos = ball.currentScreen;
                const grad = ctx.createRadialGradient(pos.sx, pos.sy, 1, pos.sx, pos.sy, 7);
                grad.addColorStop(0, 'rgba(255,220,180,0.95)');
                grad.addColorStop(0.4, 'rgba(255,90,40,0.85)');
                grad.addColorStop(1, 'rgba(255,20,10,0)');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(pos.sx, pos.sy, 7, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.beginPath(); ctx.arc(pos.sx, pos.sy, 2.2, 0, Math.PI * 2); ctx.fill();
            }
        }

        function drawLandedDots(ctx) {
            const landed = showAll ? balls.filter(b => !b.isFlying && b.landedScreen) : [balls[selectedDirIndex]].filter(b => !b.isFlying && b.landedScreen);
            for (const ball of landed) {
                const pos = ball.landedScreen;
                ctx.fillStyle = 'rgba(255,70,50,0.75)';
                ctx.shadowColor = 'rgba(255,35,20,0.6)';
                ctx.shadowBlur = 4;
                ctx.beginPath(); ctx.arc(pos.sx, pos.sy, 2.8, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        let prevTime = performance.now() / 1000;
        let cyclePhase = 'flying';
        let globalStartTime = performance.now() / 1000;

        function render(timestamp) {
            const now = timestamp / 1000;
            const rawDt = Math.min(now - prevTime, 0.1);
            prevTime = now;

            const elapsedGlobal = now - globalStartTime;
            let elapsedInCycle = elapsedGlobal % cycleDuration;

            const cycleIdx = Math.floor(elapsedGlobal / cycleDuration);
            const prevCycleIdx = Math.floor((elapsedGlobal - rawDt) / cycleDuration);
            if (cycleIdx !== prevCycleIdx || elapsedInCycle < rawDt * 0.5) {
                resetAnimation();
                recalcBallParams();
                elapsedInCycle = elapsedGlobal % cycleDuration;
                cyclePhase = 'flying';
            }

            if (elapsedInCycle >= maxFlightTime && cyclePhase === 'flying') {
                cyclePhase = 'showing';
            }
            if (elapsedInCycle < 0.02 && cyclePhase === 'showing') {
                cyclePhase = 'flying';
            }

            updatePhysics(elapsedInCycle, rawDt);
            updateSparks(rawDt);

            ctx.clearRect(0, 0, W, H);
            drawBackground(ctx);
            drawAxes(ctx);
            drawFreeFallTrajectory(ctx);
            drawTrajectories(ctx);
            drawLandedDots(ctx);
            drawFreeFallBall(ctx);
            drawFlyingBalls(ctx);
            drawSparks(ctx);
            drawLaunchGlow(ctx, elapsedInCycle);

            const progress = Math.min(elapsedInCycle / cycleDuration, 1);
            const barW = 140, barH = 3, barX = W - barW - 20, barY = 18;
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.fillRect(barX, barY, barW, barH);
            const progGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            progGrad.addColorStop(0, 'rgba(255,100,60,0.8)');
            progGrad.addColorStop(1, 'rgba(255,50,30,0.8)');
            ctx.fillStyle = progGrad;
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.fillStyle = '#ffaaaa';
            ctx.beginPath(); ctx.arc(barX + barW * progress, barY + barH / 2, 3.5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
            ctx.textAlign = 'right';
            const modeText = showAll ? `全部方向 (${numDirections})` : `方向 ${selectedDirIndex+1} / ${numDirections}`;
            ctx.fillText(`${modeText} · 自由落体对比`, W - 20, H - 14);
            ctx.textAlign = 'left';
            const status = cyclePhase === 'flying' ?
                `飞行中 ${elapsedInCycle.toFixed(1)}s / ${maxFlightTime.toFixed(1)}s` :
                `展示轨迹 ${(elapsedInCycle - maxFlightTime).toFixed(1)}s`;
            ctx.fillText(status, 20, H - 14);

            requestAnimationFrame(render);
        }

        const v0Slider = document.getElementById('v0Slider');
        const v0Display = document.getElementById('v0Value');
        const showAllCheck = document.getElementById('showAllCheckbox');
        const dirSlider = document.getElementById('dirSlider');
        const dirValue = document.getElementById('dirValue');
        const directionGroup = document.getElementById('directionGroup');

        function updateDirectionUI() {
            if (showAll) {
                directionGroup.style.opacity = '0.4';
                directionGroup.style.pointerEvents = 'none';
                dirSlider.disabled = true;
            } else {
                directionGroup.style.opacity = '1';
                directionGroup.style.pointerEvents = 'auto';
                dirSlider.disabled = false;
            }
            dirValue.textContent = dirSlider.value;
        }

        showAllCheck.addEventListener('change', () => {
            showAll = showAllCheck.checked;
            updateDirectionUI();
        });

        dirSlider.addEventListener('input', () => {
            selectedDirIndex = parseInt(dirSlider.value, 10) - 1;
            dirValue.textContent = dirSlider.value;
        });

        function onV0Change() {
            v0 = parseInt(v0Slider.value, 10);
            v0Display.textContent = v0 + ' px/s';
            recalcBallParams();
            resetAnimation();
            globalStartTime = performance.now() / 1000;
            prevTime = globalStartTime;
            cyclePhase = 'flying';
        }

        v0Slider.addEventListener('input', onV0Change);
        v0Display.textContent = v0 + ' px/s';

        updateDirectionUI();
        recalcBallParams();
        resetAnimation();
        globalStartTime = performance.now() / 1000;
        prevTime = globalStartTime;
        requestAnimationFrame(render);
    })();
</script>

                window.location.href = '../index.html';
            }
        });
        
        // 禁用开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });
        
        // 检测开发者工具打开（简单检测）
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthThreshold = window.outerWidth - window.innerWidth > threshold;
            var heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // 可以选择跳转或其他操作
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    })();
